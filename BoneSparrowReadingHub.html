<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>The Bone Sparrow — Reading &amp; Evidence Hub</title>
<style>
/* ============================================================
   Palette matches Grammar Hub / Bone Sparrow Pre-reading Trainer
   so the suite reads as one. Accent doubles as the wrong-answer
   colour, so SELECTED state always uses --ink, never accent.
   ============================================================ */
:root{
  --bg:#f4efe6; --paper:#fbf7ee; --ink:#1f1f1f; --muted:#6b6256;
  --line:#d8cfbb; --line-soft:#e8e0cd; --accent:#a83232;
  --correct:#2f6a3e; --wrong:#a83232; --okbg:#eef5ee; --badbg:#f7ecec;
  --warnbg:#faeeda; --warntx:#854f0b;
  /* tile roles (sentence-builder colour key: colour is metalanguage) */
  --stem-bg:#d6eafc; --stem-tx:#0b447c;   /* blue   = sentence stem   */
  --quote-bg:#fff3b0; --quote-tx:#7a5a00; /* yellow = embedded quote  */
  --tail-bg:#fbeaf0;  --tail-tx:#993556;  /* pink   = ending / effect */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);
     display:flex;justify-content:center;padding:18px 10px 40px}
.container{width:100%;max-width:880px;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;padding:26px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:19px;margin:0 0 8px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.eyebrow{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.topbar .where{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.linkbtn:hover{text-decoration:underline}
a{color:var(--accent)}
.btn{padding:11px 18px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
     cursor:pointer;background:var(--paper);color:var(--ink);transition:all .15s ease;font-family:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:#8c2828}
.btn-ghost{background:var(--bg);color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
p.lead{color:var(--muted);font-size:13.5px;margin:0 0 10px}

/* ---- home step list ---- */
.step{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
      border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;
      font-family:inherit;font-size:15px;transition:border-color .15s}
.step:hover:not(:disabled){border-color:var(--accent)}
.step:disabled{opacity:.55;cursor:not-allowed}
.step .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step.done .num{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
.step .t{font-weight:700}
.step .d{color:var(--muted);font-size:12.5px}
.step .tag{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
           color:var(--muted);white-space:nowrap}
.step.done .tag{color:var(--correct)}

/* ---- quiz ---- */
.stim{font-family:Georgia,serif;font-size:17px;background:#fff;border:1px solid var(--line);
      border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;margin:0 0 12px}
.stim .pg{display:block;margin-top:6px;font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--muted)}
.q{font-size:16px;font-weight:700;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.opts.chips{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
     font-family:inherit;font-size:14.5px;cursor:pointer;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--correct)}
.opt.wrongpick{background:var(--badbg);border-color:var(--wrong)}
.feedback{display:none;border-radius:8px;padding:11px 13px;font-size:14px;margin:0 0 12px;line-height:1.5}
.feedback.show{display:block;animation:rise .2s ease}
.feedback.ok{display:block;background:var(--okbg);color:var(--correct);animation:rise .2s ease}
.feedback.bad{display:block;background:var(--badbg);color:#7c2626;animation:rise .2s ease}
.feedback.warn{display:block;background:var(--warnbg);color:var(--warntx);animation:rise .2s ease}
.feedback ul{margin:6px 0 0 18px;padding:0}
.feedback li{margin:0 0 4px}
.requote{font-family:Georgia,serif;background:#fff;border:1px solid var(--line);border-radius:6px;
         padding:8px 10px;margin-top:8px;color:var(--ink);font-size:14.5px}
.progress-track{height:8px;background:var(--line-soft);border-radius:99px;margin:0 0 16px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ---- evidence passage ---- */
.passage{font-family:Georgia,serif;font-size:16.5px;line-height:1.75;background:#fff;border:1px solid var(--line);
         border-radius:10px;padding:16px 18px;margin:0 0 12px}
.passage .pg{display:block;margin-top:8px;font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--muted)}
.seg{cursor:pointer;border-radius:4px;padding:1px 2px;border-bottom:2px solid transparent;transition:background .12s}
.seg:hover{background:var(--line-soft)}
.seg.picked{background:#efe6c8;border-bottom-color:var(--ink)}
.seg.hit{background:var(--okbg);border-bottom-color:var(--correct)}
.seg.miss{background:var(--badbg);border-bottom-color:var(--wrong)}
.idea-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fchoice{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-family:inherit;
         font-size:13.5px;font-weight:600;cursor:pointer}
.fchoice.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---- rubric ladder ---- */
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.lcard{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font-size:12px;
       line-height:1.35;cursor:pointer;font-family:inherit;text-align:left;transition:border-color .12s}
.lcard .lv{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block;margin-bottom:3px}
.lcard.now{border:2px solid var(--ink)}
.lcard.got{background:var(--okbg);border-color:var(--correct)}
.lcard.got .lv{color:var(--correct)}
.lcard.below{opacity:.55}
.ladder-hint{display:none;background:var(--bg);border:1px dashed var(--line);border-radius:8px;
             padding:10px 12px;font-size:13px;margin:0 0 12px}
.ladder-hint.show{display:block}
@media (max-width:640px){.ladder{grid-template-columns:repeat(2,1fr)}}

/* ---- sentence builder ---- */
.slotrow{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.slot{border:2px dashed var(--line);border-radius:10px;min-height:46px;padding:8px 10px;background:#fff;
      display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .slabel{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);flex:0 0 92px}
.slot .placed{border-radius:8px;padding:7px 10px;font-size:13.5px;cursor:pointer;border:1px solid transparent}
.slot .placed:after{content:" ✕";font-size:10px;color:var(--muted)}
.bins{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 0 12px}
@media (max-width:700px){.bins{grid-template-columns:1fr}}
.bin{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.bin h4{margin:0;padding:7px 10px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line-soft)}
.bin .binbody{padding:8px;display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;text-align:left;
      cursor:pointer;font-family:inherit;transition:transform .1s, border-color .12s}
.tile:hover{border-color:var(--ink)}
.tile.used{opacity:.4}
.bin.stems h4, .tile.k-stem{background:var(--stem-bg);color:var(--stem-tx)}
.bin.quotes h4, .tile.k-quote{background:var(--quote-bg);color:var(--quote-tx)}
.bin.tails h4, .tile.k-tail{background:var(--tail-bg);color:var(--tail-tx)}
.slot .placed.k-stem{background:var(--stem-bg);color:var(--stem-tx)}
.slot .placed.k-quote{background:var(--quote-bg);color:var(--quote-tx)}
.slot .placed.k-tail{background:var(--tail-bg);color:var(--tail-tx)}
.preview{font-family:Georgia,serif;font-size:16.5px;background:var(--bg);border:1px solid var(--line);
         border-radius:8px;padding:12px 14px;margin:0 0 12px;min-height:48px}
.preview .ph{color:var(--muted);font-size:13px;font-family:'Segoe UI',sans-serif}

/* ---- upgrader ---- */
.wag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
@media (max-width:640px){.wag{grid-template-columns:1fr}}
.grow{font-family:Georgia,serif;font-size:16.5px;line-height:1.6;background:#fff;border:1px solid var(--line);
      border-radius:10px;padding:14px 16px;margin:0 0 12px}
.grow .new{background:var(--okbg)}

/* ---- report ---- */
table.rpt{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 12px}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.rpt th{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.rowinp{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.rowinp label{font-size:12px;font-weight:700;display:block;margin-bottom:3px}
.rowinp input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.vcode{font-family:Georgia,serif;font-size:15px;letter-spacing:1px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;padding:0}
  .container{border:none;box-shadow:none;max-width:100%}
  .noprint{display:none!important}
}
</style>
</head>
<body>
<div class="container">
  <div class="topbar noprint">
    <span class="where" id="whereLbl">Year 7 English · The Bone Sparrow · Units 5–6</span>
    <button class="linkbtn" id="homeBtn" onclick="go('home')" style="display:none">← home</button>
  </div>
  <div id="body"></div>
</div>

<script>
/* ============================================================================
   THE BONE SPARROW — READING & EVIDENCE HUB
   ----------------------------------------------------------------------------
   This block is the data spine. The engine below knows nothing about the
   novel; it only runs whatever is in these consts. To add content, copy an
   entry and follow its shape — every item needs an `id` and an `explain`/`fb`
   that names the trap and points the reader back to the line.

   Scoring rules (same as the Pre-reading Trainer and Grammar Hub):
   • wrong answers are retried until correct (mastery loop),
   • but only the FIRST attempt is scored and reported.

   Passages are short page-referenced extracts already used in the unit's
   printed resources, reproduced for enrolled students under the school's
   statutory licence. Keep extracts short; do not paste whole chapters.
   ============================================================================ */

/* ==================== QUICKREADS (cold-excerpt inference checks) ============
   Each quickread: read the passage, then the passage HIDES and the questions
   run "cold". A misread item is retaught immediately: the feedback re-quotes
   the exact line (item.line) so the reteach happens at the point of error.
   =========================================================================== */
const QUICKREADS = [
{ id:"qr1", step:"Quickread 1", title:"The Night Sea", where:"Chapter 1, pages 1–2",
  intro:"Read the opening of the novel carefully — twice is better. When you start the questions, the passage disappears. That's the point: this checks what you understood, not what you can look up.",
  passage:`Sometimes, at night, the dirt outside turns into a beautiful ocean. As red as the sun and as deep as the sky.<br><br>
I lie on my bed, Queeny's feet pushing against my cheek, and listen to the waves lapping at the tent. Queeny says I'm stupid, saying that kind of stuff. But it's true. She just doesn't see it, is all. Our maá says there are some people in this world who can see all the hidden bits and pieces of the universe blown in on the north wind and scattered about in the shadows. Queeny, she never tries to look in the shadows. She doesn't even squint.<br><br>
Maá sees though. She can hear the ocean outside too. 'You hear it, né?' I whisper, my fingers feeling for her smile in the dark.<br><br>
In the morning, the ground still wet and foamy from where those waves washed up, I sit and trace the hundreds of animals that have swum all the way up to the tent, their faces pushing against the flaps, trying to get a look at us inside on our beds…`,
  items:[
  { id:"qr1a", q:"The dirt 'turns into a beautiful ocean'. The Night Sea is best understood as:",
    opts:["A real ocean that floods the camp after dark",
          "Subhi's imagination, which the story lets feel completely real",
          "A dream Subhi has while he is asleep",
          "A story that Queeny tells to help Subhi sleep"],
    a:1, explain:"Fraillon deliberately blurs the line — we see the world exactly as Subhi sees it, so his imagined sea gets described as fact. Queeny calling it 'stupid' is our clue that not everyone can see it.",
    line:"Sometimes, at night, the dirt outside turns into a beautiful ocean." },
  { id:"qr1b", q:"'Queeny says I'm stupid, saying that kind of stuff.' What does this suggest?",
    opts:["Queeny hates her brother",
          "Subhi really is stupid",
          "Queeny doesn't share — or won't let herself share — Subhi's way of seeing",
          "Queeny cannot hear anything at night"],
    a:2, explain:"'Hates' is too strong — the trap answer. Queeny dismisses the Night Sea, and the next lines tell us why: 'she never tries to look in the shadows. She doesn't even squint.' She refuses to look, which is different from hating him.",
    line:"Queeny, she never tries to look in the shadows. She doesn't even squint." },
  { id:"qr1c", q:"'She just doesn't see it, is all.' The little phrase 'is all' makes Subhi sound:",
    opts:["Furious with his sister",
          "Matter-of-fact and forgiving — he's not angry at Queeny",
          "Confused about what he saw",
          "Like he is boasting about his gift"],
    a:1, explain:"'Is all' shrugs the criticism off. Subhi explains Queeny rather than attacking her — one of the first signs of how gentle this narrator is.",
    line:"But it's true. She just doesn't see it, is all." },
  { id:"qr1d", q:"'…my fingers feeling for her smile in the dark.' This detail suggests:",
    opts:["Maá is invisible at night",
          "Subhi cannot see anything at all",
          "Maá is fast asleep and won't wake up",
          "It's too dark to see, and Subhi checks by touch whether Maá shares the moment — their closeness"],
    a:3, explain:"He isn't just touching her face — he's checking for the smile, hoping she hears the ocean too. It's a tiny action that shows warmth and closeness in one line.",
    line:"'You hear it, né?' I whisper, my fingers feeling for her smile in the dark." },
  { id:"qr1e", q:"In 'the waves lapping at the tent', the word 'lapping' means the waves are:",
    opts:["Crashing violently","Touching gently, again and again","Freezing cold","Disappearing quickly"],
    a:1, explain:"Lapping is the soft, repeated touch of small waves — think of a dog lapping water. It makes the Night Sea calm and comforting, not threatening.",
    line:"…and listen to the waves lapping at the tent." },
  { id:"qr1f", q:"Subhi whispers 'You hear it, né?' The word 'né' tells us:",
    opts:["It is a spelling mistake",
          "It is the name Subhi gives the ocean",
          "Subhi's family speak another language, and its rhythms shape his English",
          "Subhi is too tired to finish his words"],
    a:2, explain:"'Né' is a tag from the family's own language sitting naturally inside an English sentence. Fraillon builds Subhi's voice this way — his English carries his Rohingya family inside it.",
    line:"'You hear it, né?' I whisper…" }
]},
{ id:"qr2", step:"Quickread 2", title:"Caught by Beaver", where:"Chapter 5, page 33",
  intro:"This is the moment Beaver catches Subhi with the package. Read it carefully — when you start the questions, the passage disappears.",
  passage:`My throat is as dry as the dirt. Eli always tells me, 'Never let anyone see your scared,' and I try as hard as I can but trying isn't doing, and I've never been handcuffed before and I've never been taken into the offices, and thinking on all of that is fouling my stomach close to spewing.<br><br>
'What are you doing back there?' Beaver's voice sounds as dark as the Jackets' dogs when they don't like a person. I can't talk. I can't say a single thing. His hand is hard and scratchy, grabbing at my shirt and pulling me towards him so that my teeth clang on my tongue and I can taste blood, and my brain is buzzing louder and louder.<br><br>
'I asked you a question.'<br><br>
I still can't talk. He shoves me backwards so hard that my feet leave the ground and my head cracks into the bricks behind me, and for a moment all I can see are little lights flashing in and out. When I crash into the dirt, Beaver has the package. And he's opening it.`,
  items:[
  { id:"qr2a", q:"Subhi says his throat is dry. This most likely shows that he is:",
    opts:["Thirsty","Frightened","Bored","Angry"],
    a:1, explain:"The dry throat arrives with the fear, not the weather — it comes in the build-up to the confrontation, right beside 'never let anyone see your scared'.",
    line:"My throat is as dry as the dirt." },
  { id:"qr2b", q:"Subhi describes his brain as 'buzzing louder and louder'. This suggests:",
    opts:["Excitement","Tiredness","Building panic","Confusion"],
    a:2, explain:"'Louder and louder' escalates as the physical threat escalates — it tracks rising panic, not a neutral state.",
    line:"…and my brain is buzzing louder and louder." },
  { id:"qr2c", q:"Beaver's dialogue is short and clipped ('What are you doing back there?' / 'I asked you a question.'). What does this best suggest about him in this moment?",
    opts:["He is calm and polite","He doesn't know what to say","He is being friendly","He is trying to show that he is in control"],
    a:3, explain:"Short, blunt questions from Beaver read as authority and menace — he doesn't need many words because he holds all the power here.",
    line:"'I asked you a question.'" },
  { id:"qr2d", q:"What does the author compare Beaver's voice to?",
    opts:["The dry dirt of the camp","The darkness of the night","Guard dogs growling","Something hard and scratchy"],
    a:2, explain:"'As dark as the Jackets' dogs when they don't like a person.' 'Hard and scratchy' is his hand — the sneaky look-alike option.",
    line:"Beaver's voice sounds as dark as the Jackets' dogs when they don't like a person." },
  { id:"qr2e", q:"Why might the author show Subhi's fear through physical sensations (dry throat, buzzing brain, blood in his mouth) rather than simply writing 'Subhi was scared'?",
    opts:["It is shorter to write",
          "It puts the reader inside Subhi's body, making the fear easier to feel",
          "It is more difficult to understand",
          "It avoids naming the emotion because it isn't important"],
    a:1, explain:"Showing fear through the body instead of naming it is a deliberate craft choice — first-person sensation immerses the reader in Subhi's experience.",
    line:"…thinking on all of that is fouling my stomach close to spewing." },
  { id:"qr2f", q:"Based on how Beaver behaves here and what we already know of him, what is the most likely outcome the next time they cross paths?",
    opts:["Beaver will keep targeting Subhi whenever the chance comes up",
          "Beaver will avoid Subhi from now on",
          "Subhi will report Beaver and be believed",
          "Beaver and Subhi will become allies"],
    a:0, explain:"Beaver's established pattern — the extra kick, tipping Maá's dinner into the dirt, handcuffing Eli — shows targeting is habitual, not a one-off. That's the best-supported prediction from the characterisation so far.",
    line:"When I crash into the dirt, Beaver has the package. And he's opening it." },
  { id:"qr2g", q:"In the phrase 'fouling my stomach', 'fouling' most likely means:",
    opts:["Making him hungry","Making him excited","Making him feel sick","Filling him up"],
    a:2, explain:"'Fouling' here is nausea brought on by dread — it sits alongside 'close to spewing' and the rest of the fear imagery.",
    line:"…thinking on all of that is fouling my stomach close to spewing." }
]}];

/* ==================== FIGURATIVE → LITERAL ==================================
   Two steps per line: (1) what does it literally mean, (2) which feature is
   doing the work. Paraphrases are deliberately plain — EAL-friendly.
   =========================================================================== */
const FIG_TECHS = ["Simile — compares using 'like' or 'as'",
                   "Metaphor — says one thing IS another",
                   "Personification — gives a thing human behaviour",
                   "Word-class swap — an adjective used as a noun",
                   "Symbol — an object that carries a bigger idea",
                   "Hyperbole — exaggeration for effect"];
const FIG_ITEMS = [
{ id:"fig1", quote:"My throat is as dry as the dirt.", page:"p. 33",
  meaning:{ opts:["He is so frightened his mouth has gone dry","He needs a drink of water","The camp has run out of water","He has been eating dirt"],
    a:0, explain:"The comparison lands in the middle of the Beaver confrontation — this is fear in the body, not thirst." },
  tech:{ opts:[0,1,2,5], a:0, explain:"'As dry as the dirt' — and notice WHAT it's compared to: the camp's own dirt. Even his fear is described in camp language." } },
{ id:"fig2", quote:"Beaver's voice sounds as dark as the Jackets' dogs when they don't like a person.", page:"p. 33",
  meaning:{ opts:["Beaver speaks very quietly","His voice is low and threatening, like a dog's growl","Beaver owns several dogs","His voice is impossible to hear"],
    a:1, explain:"A voice 'as dark as' a guard dog that doesn't like you is a growl — pure threat. The dogs also remind us this place is guarded like a prison." },
  tech:{ opts:[0,1,2,3], a:0, explain:"It's a simile — 'as dark as'. 'Dark' describing a sound is also a sense-swap that makes the menace feel physical." } },
{ id:"fig3", quote:"…as if the house is holding its breath too.", page:"p. 19",
  meaning:{ opts:["The house has no air in it","The house is haunted","The house is completely silent and still, as if waiting for the sadness to end","The windows are all shut"],
    a:2, explain:"Since Jimmie's mum died the house has gone quiet. The word 'too' tells us Jimmie is also holding her breath — both are waiting." },
  tech:{ opts:[0,1,2,5], a:2, explain:"Houses don't breathe — giving the house a human action is personification, and it spreads Jimmie's grief into the building around her." } },
{ id:"fig4", quote:"…her whole face shines like someone's lit a candle in her cheeks.", page:"p. 94",
  meaning:{ opts:["Her face is on fire","She is embarrassed and blushing","Her face is reflecting torchlight","She suddenly looks glowing and happy"],
    a:3, explain:"This is joy at seeing a friend again — the candle image is warmth and light, not embarrassment or literal fire." },
  tech:{ opts:[0,1,2,3], a:0, explain:"'Shines like…' — a simile. The candle brings warmth, light and smallness together in one picture of quiet happiness." } },
{ id:"fig5", quote:"When I stick my head under the water, the whole world stops.", page:"p. 16",
  meaning:{ opts:["The pool water freezes",
          "Underwater, everything feels still and silent — a moment of escape","Time travel is possible in the camp","Subhi can't swim"],
    a:1, explain:"Underwater, the camp's noise disappears. It's the same job the Night Sea does — a private place detention can't reach." },

/* ==================== MODULE DIRECTORY / REPORT LABELS ====================== */
const MODULES = [
 { id:"qr1",  n:1, t:"Quickread: the Night Sea",  d:"Chapter 1 · read it, lose it, prove you understood it", kind:"qr" },
 { id:"qr2",  n:2, t:"Quickread: caught by Beaver", d:"Chapter 5 · inference under pressure — the silent-starter, self-marking", kind:"qr" },
 { id:"fig",  n:3, t:"Figurative → literal", d:"Match the line to its plain meaning, then name the technique", kind:"fig" },
 { id:"voice",n:4, t:"Voice fingerprint", d:"Whose line is it? Name the giveaway — do this before your voice memo", kind:"voice" },
 { id:"ev",   n:5, t:"Evidence builder", d:"Find it in the passage, explain it, embed it — the rubric unlocks as you climb", kind:"ev" },
 { id:"upg",  n:6, t:"Sentence upgrader", d:"Grow a C2 sentence into C4 analysis — WAGOLL ladder", kind:"upg", needs:"ev" },
 { id:"rpt",  n:7, t:"My report", d:"Name & student ID, print/save it, hand it in", kind:"rpt" }
];

/* ============================================================================
   ENGINE — knows nothing about the novel. State, router, runners, report.
   ============================================================================ */
const KEY="bonesparrow.readinghub.v1";
function blank(){ return {first:{}, done:{}, evLv:0, name:"", sid:"", startedAt:Date.now(), finishedAt:0}; }
let S=blank();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); if(p&&typeof p==="object") S=Object.assign(blank(),p);} }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function resetAll(){ if(confirm("Start again from scratch? This wipes all your saved answers.")){ S=blank(); save(); go("home"); } }
load();

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function recFirst(key, correct){ if(S.first[key]===undefined){ S.first[key]=!!correct; save(); } }

let screen="home";
function go(s, arg){
  screen=s;
  $("homeBtn").style.display = s==="home" ? "none" : "inline";
  window.scrollTo({top:0,behavior:"smooth"});
  if(s==="home") renderHome();
  else if(s==="qr") renderQrIntro(arg);
  else if(s==="fig") runFig();
  else if(s==="voice") runVoice();
  else if(s==="ev") renderEv(0);
  else if(s==="upg") runUpg();
  else if(s==="rpt") renderReport();
}

/* ---------- scoring helpers ---------- */
function keysFor(mod){
  return Object.keys(S.first).filter(k=>k.split(".")[0]===mod);
}
function scoreFor(mod){
  const ks=keysFor(mod); const got=ks.filter(k=>S.first[k]).length;
  return {got, total:ks.length};
}
function totalItemsOf(mod){
  if(mod==="qr1") return QUICKREADS[0].items.length;
  if(mod==="qr2") return QUICKREADS[1].items.length;
  if(mod==="fig") return FIG_ITEMS.length*2;
  if(mod==="voice") return VOICE_ITEMS.length*2;
  if(mod==="ev") return 6; /* 2 rounds × 3 levels */
  if(mod==="upg") return UPG_ITEMS.length*2;
  return 0;
}

/* ---------- HOME ---------- */
function renderHome(){
  const doneCount=MODULES.filter(m=>S.done[m.id]).length;
  let h=`<h1>The Bone Sparrow — Reading &amp; Evidence Hub</h1>
  <p class="sub">Zana Fraillon · reading, inference, voice &amp; evidence · follows on from the
  <a href="bonesparrowtrainer (4) (3).html">Pre-reading Trainer</a>. Wrong answers get retried until you master them,
  but <b>your first attempt at each question is what goes on your report</b>.</p>`;
  h+=`<div class="panel" style="background:var(--bg)"><p class="lead" style="margin:0">
  Work top to bottom unless your teacher says otherwise. The <b>Sentence upgrader</b> unlocks after the
  <b>Evidence builder</b> — you need the embedding skill first. Need a grammar refresher along the way?
  The <a href="GrammarHuboffline.html">Grammar Hub</a> is one click away.</p></div>`;
  MODULES.forEach(m=>{
    const done=!!S.done[m.id];
    const locked = m.needs ? !S.done[m.needs] : false;
    const sc=scoreFor(m.id);
    let tag = done ? (sc.total? `${sc.got}/${sc.total} first try` : "done")
            : locked ? "locked — finish the evidence builder"
            : (m.id==="rpt" ? (doneCount>=3 ? "" : "finish 3 activities first") : (sc.total? "in progress" : ""));
    const rptLocked = m.id==="rpt" && doneCount<3 && !S.done.rpt;
    h+=`<button class="step ${done?"done":""}" ${locked||rptLocked?"disabled":""} onclick="go('${m.kind}','${m.id}')">
      <span class="num">${done?"✓":m.n}</span>
      <span><span class="t">${esc(m.t)}</span><br><span class="d">${esc(m.d)}</span></span>
      <span class="tag">${esc(tag)}</span></button>`;
  });
  h+=`<div class="btnrow noprint"><button class="linkbtn" onclick="resetAll()">reset everything</button></div>`;
  $("body").innerHTML=h;
}
/* the step buttons call go(kind, id); map kinds that share a runner */
const _go=go;
go=function(s,arg){
  if(s==="qr"&&!arg) arg="qr1";
  if(s==="qr1"||s==="qr2"){ arg=s; s="qr"; }
  _go(s,arg);
};

/* ---------- GENERIC QUIZ RUNNER (mcq, multi-step items) ----------
   cfg: {mod, title, where, items:[{id, stim?, steps:[{key,q,opts,a,explain,requote?}]}], onDone}
   Mastery loop: any missed step re-queues the whole item; first attempts recorded once. */
function runQuizzer(cfg){
  let queue=cfg.items.slice(), idx=0, stepIdx=0, round=1;
  const missed=[];
  function draw(){
    const item=queue[idx], step=item.steps[stepIdx];
    const total=cfg.items.reduce((n,it)=>n+it.steps.length,0);
    const answered=Object.keys(S.first).filter(k=>k.startsWith(cfg.mod+".")).length;
    let h=`<div class="eyebrow">${esc(cfg.where)}</div><h2>${esc(cfg.title)}</h2>`;
    h+=`<div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,answered/total*100)}%"></div></div>`;
    if(round>1) h+=`<p class="lead">Mastery round ${round} — answer the ones you missed until they're all correct. (First attempts are already saved.)</p>`;
    if(item.stim) h+=`<div class="stim">${item.stim}${item.page?`<span class="pg">(${esc(item.page)})</span>`:""}</div>`;
    h+=`<p class="q">${esc(step.q)}</p><div class="opts ${step.chips?"chips":""}" id="opts"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <button class="btn btn-primary" id="nextBtn" style="display:none"></button>`;
    $("body").innerHTML=h;
    const order = step.noShuffle ? step.opts.map((_,i)=>i) : shuffle(step.opts.map((_,i)=>i));
    order.forEach(oi=>{
      const b=document.createElement("button");
      b.className="opt"; b.innerHTML=esc(step.opts[oi]);
      b.onclick=()=>grade(oi,b);
      $("opts").appendChild(b);
    });
  }
  function grade(oi,btn){
    const item=queue[idx], step=item.steps[stepIdx];
    const correct = oi===step.a;
    document.querySelectorAll("#opts .opt").forEach((b,k)=>{ b.disabled=true; });
    [...document.querySelectorAll("#opts .opt")].forEach(b=>{
      if(b.textContent===step.opts[step.a]) b.classList.add("right");
    });
    if(!correct) btn.classList.add("wrongpick");
    const key=cfg.mod+"."+item.id+"."+step.key;
    const firstTime = S.first[key]===undefined;
    recFirst(key, correct);
    if(!correct && firstTime) missed.push({item,label:cfg.missLabel(item,step)});
    const fb=$("fb");
    fb.className="feedback "+(correct?"ok":"bad");
    fb.innerHTML=(correct?"<b>Correct.</b> ":`<b>Not quite — the answer is “${esc(step.opts[step.a])}”.</b> `)+step.explain
      +(!correct&&step.requote?`<div class="requote">“${esc(step.requote)}”</div>`:"");
    if(!correct) item._requeue=true;
    const nb=$("nextBtn");
    nb.style.display="inline-block";
    nb.textContent = stepIdx<item.steps.length-1 ? "Next part →" : "Next →";
    nb.onclick=()=>{
      if(stepIdx<item.steps.length-1){ stepIdx++; draw(); return; }
      if(item._requeue){ delete item._requeue; queue.push(item); }
      stepIdx=0; idx++;
      if(idx>=queue.length){ finish(); } else {
        if(idx>=cfg.items.length && queue[idx]) round= Math.max(round, 2);
        draw();
      }
    };
  }
  function finish(){
    S.done[cfg.mod]=true; save();
    const sc=scoreFor(cfg.mod);
    const pct=sc.total? sc.got/sc.total : 0;
    const band = pct>=0.8 ? "Strong reading. Every miss got retaught and retried — check the report to see your first-try picture."
      : pct>=0.6 ? "A good start — here's how to lift it: reread the lines quoted in the feedback you got, then tell someone WHY the right answer was right."
      : "Worth a slower second pass. Reread the passage in your own copy of the novel, then come back — the reteach lines in the feedback are your map.";
    $("body").innerHTML=`<h2>${esc(cfg.title)} — done</h2>
    <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} on first attempt.</b> ${band}</p></div>
    ${cfg.doneNote?`<div class="panel" style="background:var(--bg)"><p class="lead" style="margin:0">${cfg.doneNote}</p></div>`:""}
    <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  }
  draw();
}

/* ---------- QUICKREADS ---------- */
function renderQrIntro(id){
  const qr=QUICKREADS.find(q=>q.id===id);
  $("body").innerHTML=`<div class="eyebrow">${esc(qr.where)} · cold-excerpt inference check</div>
  <h2>${esc(qr.title)}</h2>
  <p class="lead">${esc(qr.intro)}</p>
  <div class="passage">${qr.passage}<span class="pg">${esc(qr.where)} — The Bone Sparrow, Zana Fraillon</span></div>

/* ---------- EVIDENCE BUILDER ---------- */
let EV = null; /* transient per-round state */
function renderEv(roundIdx){
  const round=EV_ROUNDS[roundIdx];
  if(!round){ evFinish(); return; }
  EV={ roundIdx, round, level:1, idea:null, picked:new Set(), checked:false, slots:{stem:null,frag:null,tail:null}, builderChecked:false };
  if(round.mode==="idea") renderEvIdea();
  else renderEvSelect();
}
function evLadderHtml(active){
  const gotLv = S.evLv||0;
  let h=`<div class="ladder">`;
  EV_LADDER.forEach((L,i)=>{
    const st = (i+1)<=gotLv ? "got" : (i+1)===active ? "now" : (i+1)>active ? "below":"";
    h+=`<button class="lcard ${st}" onclick="evHint(${i},${active})"><span class="lv">${esc(L.lv)} ${(i+1)<=gotLv?"✓":""}</span>${esc(L.text)}</button>`;
  });
  h+=`</div><div class="ladder-hint" id="ladderHint"></div>`;
  return h;
}
function evHint(i,active){
  const box=$("ladderHint"); if(!box) return;
  if((i+1)>active && (i+1)>(S.evLv||0)){ box.className="ladder-hint show"; box.innerHTML="<b>Locked.</b> Finish the level you're on and this one opens — with its sentence stems."; return; }
  box.className="ladder-hint show";
  box.innerHTML="<b>"+esc(EV_LADDER[i].lv)+" scaffold:</b> "+esc(EV_LADDER[i].hint);
}
function renderEvIdea(){
  const r=EV.round;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(1);
  h+=`<p class="lead">${esc(r.question)}</p><div class="idea-chips">`;
  r.ideas.forEach(idea=>{ h+=`<button class="fchoice" onclick="evPickIdea('${idea.id}')">${esc(idea.label)}</button>`; });
  h+=`</div><p class="lead">Pick the idea you want to prove, then the passage opens for evidence-hunting.</p>`;
  $("body").innerHTML=h;
}
function evPickIdea(id){ EV.idea=id; EV.picked=new Set(); EV.locked=false; renderEvSelect(); }
function renderEvSelect(){
  const r=EV.round;
  const ideaLabel = EV.idea ? r.ideas.find(i=>i.id===EV.idea).label : null;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 1</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(1);
  h+=`<p class="q">${esc(r.mode==="idea" ? "Find the evidence for: "+ideaLabel : r.question)}</p>
  <p class="lead">${esc(r.qNote)}</p><div class="passage" id="pass">`;
  r.segs.forEach((seg,i)=>{ h+=`<span class="seg" id="seg${i}" onclick="evToggle(${i})">${esc(seg.t)}</span> `; });
  h+=`<span class="pg">${esc(r.where)} — The Bone Sparrow, Zana Fraillon</span></div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow"><button class="btn btn-primary" id="chk" onclick="evCheck()">Check my evidence</button>
  ${r.mode==="idea"?`<button class="btn btn-ghost" onclick="renderEvIdea()">← different idea</button>`:""}</div>`;
  $("body").innerHTML=h;
}
function evToggle(i){
  if(EV.locked) return;
  const el=$("seg"+i);
  el.classList.remove("hit","miss");
  if(EV.picked.has(i)){ EV.picked.delete(i); el.classList.remove("picked"); }
  else { EV.picked.add(i); el.classList.add("picked"); }
  $("fb").className="feedback";
}
function segRole(seg){ return EV.round.mode==="idea" ? (seg.roles[EV.idea]||"plain") : seg.role; }
function segFb(seg){ return EV.round.mode==="idea" ? (seg.fbs[EV.idea]||"") : seg.fb; }
function evCheck(){
  const r=EV.round, fb=$("fb");
  if(EV.picked.size===0){ fb.className="feedback bad"; fb.innerHTML="<b>Nothing selected.</b> Click the part of the passage that answers the question, then check."; return; }
  const picked=[...EV.picked].map(i=>({i,seg:r.segs[i],role:segRole(r.segs[i])}));
  const gold=picked.filter(p=>p.role==="gold"), okp=picked.filter(p=>p.role==="ok");
  const bad=picked.filter(p=>["other","plain","frame"].includes(p.role));
  picked.forEach(p=>{
    const el=$("seg"+p.i); el.classList.remove("picked");
    el.classList.add(p.role==="gold"||p.role==="ok" ? "hit" : "miss");
  });
  const findings=[];
  gold.forEach(p=>findings.push({sev:"ok", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  okp.forEach(p=>findings.push({sev:"warn", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  bad.forEach(p=>findings.push({sev:"warn", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  const pass = gold.length>=1 && bad.length===0;
  if(!EV.checked){ recFirst("ev."+r.id+".l1", pass); EV.checked=true; }
  let head, cls;
  if(pass){ head="Strong evidence selected."; cls="ok"; }
  else if(gold.length>=1){ head="A good start — here's how to lift it: your strongest pick is right, but deselect the ones that don't belong."; cls="warn"; }
  else if(okp.length>=1){ head="Close — that supports the answer, but there's a stronger line. Deselect and look again."; cls="warn"; }
  else { head="Something needs fixing — none of these picks answer the question yet."; cls="bad"; }
  fb.className="feedback "+cls;
  fb.innerHTML="<b>"+esc(head)+"</b><ul>"+findings.map(f=>"<li>"+esc(f.text)+"</li>").join("")+"</ul>";
  if(pass){
    EV.locked=true;
    S.evLv=Math.max(S.evLv||0,1); save();
    fb.innerHTML+=`<div style="margin-top:8px"><b>Level 1 achieved:</b> ${esc(EV_LADDER[0].text)}.</div>`;
    document.querySelector(".btnrow").innerHTML=`<button class="btn btn-primary" onclick="renderEvL2()">Level 2: explain the relevance →</button>`;
  } else {
    picked.filter(p=>p.role!=="gold"&&p.role!=="ok").forEach(p=>{ EV.picked.delete(p.i); });
  }
}
function renderEvL2(){
  const r=EV.round;
  const l2 = r.mode==="idea" ? r.l2s[EV.idea] : r.l2;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 2</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(2);
  h+=`<p class="q">${esc(l2.q)}</p><div class="opts" id="opts"></div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="brow"></div>`;
  $("body").innerHTML=h;
  let first=true;
  shuffle(l2.opts.map((_,i)=>i)).forEach(oi=>{
    const o=l2.opts[oi];
    const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    b.onclick=()=>{
      const good=o.q==="good";
      if(first){ recFirst("ev."+r.id+".l2", good); first=false; }
      const fb=$("fb");
      if(good){
        document.querySelectorAll("#opts .opt").forEach(x=>x.disabled=true);
        b.classList.add("right");
        fb.className="feedback ok"; fb.innerHTML="<b>Correct.</b> "+esc(o.fb);
        S.evLv=Math.max(S.evLv,2); save();
        fb.innerHTML+=`<div style="margin-top:8px"><b>Level 2 achieved:</b> ${esc(EV_LADDER[1].text)}.</div>`;
        $("brow").innerHTML=`<button class="btn btn-primary" onclick="renderEvBuilder()">Level 3: embed the quote →</button>`;
      } else {
        b.disabled=true; b.classList.add("wrongpick");
        fb.className="feedback bad"; fb.innerHTML="<b>Not this one.</b> "+esc(o.fb);
      }
    };
    $("opts").appendChild(b);
  });
}
function renderEvBuilder(){
  const r=EV.round;
  const B = r.mode==="idea" ? r.builders[EV.idea] : r.builder;
  EV.slots={stem:null,frag:null,tail:null};
  EV.builderChecked=false;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 3</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(3);
  h+=`<p class="lead">${esc(B.intro)} Tap a tile to place it; tap a placed tile to remove it. Colours are the parts: <b style="color:var(--stem-tx)">blue = stem</b>, <b style="color:var(--quote-tx)">yellow = quote</b>, <b style="color:var(--tail-tx)">pink = ending</b>.</p>
  <div class="slotrow">
    <div class="slot" id="slot-stem"><span class="slabel">Stem</span><span id="in-stem"></span></div>
    <div class="slot" id="slot-frag"><span class="slabel">Quote</span><span id="in-frag"></span></div>
    <div class="slot" id="slot-tail"><span class="slabel">Ending</span><span id="in-tail"></span></div>
  </div>
  <div class="preview" id="prev"></div>
  <div class="bins">
    <div class="bin stems"><h4>Sentence stems</h4><div class="binbody" id="bin-stem"></div></div>
    <div class="bin quotes"><h4>Trimmed quotes</h4><div class="binbody" id="bin-frag"></div></div>
    <div class="bin tails"><h4>Endings</h4><div class="binbody" id="bin-tail"></div></div>
  </div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="brow"><button class="btn btn-primary" onclick="evBuildCheck()">Check my sentence</button>
  <button class="btn btn-ghost" onclick="renderEvBuilder()">Reset</button></div>`;
  $("body").innerHTML=h;
  const fill=(kind,list)=>{
    const bin=$("bin-"+kind);
    shuffle(list).forEach(x=>{
      const b=document.createElement("button"); b.className="tile k-"+(kind==="stem"?"stem":kind==="frag"?"quote":"tail");
      b.textContent=x.t; b.onclick=()=>{ EV.slots[kind]=x; drawSlots(B); };
      bin.appendChild(b);
    });
  };
  fill("stem",B.stems); fill("frag",B.frags); fill("tail",B.tails);
  drawSlots(B);
}
function drawSlots(B){
  ["stem","frag","tail"].forEach(kind=>{
    const holder=$("in-"+kind); holder.innerHTML="";
    const x=EV.slots[kind];
    if(x){ const b=document.createElement("button");
      b.className="placed k-"+(kind==="stem"?"stem":kind==="frag"?"quote":"tail");
      b.textContent=x.t; b.onclick=()=>{ EV.slots[kind]=null; drawSlots(B); };
      holder.appendChild(b); }
  });
  const {stem,frag,tail}=EV.slots;
  const prev=$("prev");
  if(stem||frag||tail){
    let s=(stem?stem.t:"…")+" "+(frag?"“"+frag.t+"”":"“…”")+(tail?tail.t:" …");
    prev.textContent=s;
  } else prev.innerHTML=`<span class="ph">Your sentence appears here as you build it.</span>`;
  const fb=$("fb"); if(fb) fb.className="feedback";
}
function evBuildCheck(){
  const r=EV.round;
  const {stem,frag,tail}=EV.slots;
  const fb=$("fb");
  const findings=[];
  if(!stem||!frag||!tail){
    fb.className="feedback bad";
    fb.innerHTML="<b>Something needs fixing.</b> The sentence needs all three parts — a stem, a trimmed quote, and an ending.";
    return;
  }
  if(stem.q==="point") findings.push({sev:"warn", text:stem.fb});
  if(frag.q==="long"||frag.q==="short") findings.push({sev:"warn", text:frag.fb});
  if(frag.q==="nofit" || (stem.accepts && frag.q==="good" && !stem.accepts.includes(frag.id)))
    findings.push({sev:"err", text: frag.q==="nofit" ? frag.fb : "Read the preview aloud — the quote doesn't continue the stem's grammar. Swap one of them so it flows as a single sentence."});
  if(tail.q==="point"||tail.q==="retell") findings.push({sev:"warn", text:tail.fb});
  const level = findings.some(f=>f.sev==="err") ? "err" : findings.length ? "warn" : "ok";
  const pass = level==="ok";
  if(!EV.builderChecked){ recFirst("ev."+r.id+".l3", pass); EV.builderChecked=true; }
  if(pass){
    fb.className="feedback ok";
    let msg="<b>Strong analytical sentence.</b> Stem, embedded quote and an ending that explains — read it back once more, out loud if you can. This is the level to aim for in your essay.";
    if(tail.q==="bonus") msg+=" <b>And you've woven in a second quote — that's above the standard: “I can correctly embed multiple quotes into an explanation.”</b>";
    fb.innerHTML=msg+`<div style="margin-top:8px"><b>Level 3 achieved:</b> ${esc(EV_LADDER[2].text)}.</div>`;
    S.evLv=Math.max(S.evLv, EV.roundIdx===0?3:4); save();
    const nextIdx=EV.roundIdx+1;
    $("brow").innerHTML = EV_ROUNDS[nextIdx]
      ? `<button class="btn btn-primary" onclick="renderEv(${nextIdx})">Round 2: choose your own idea →</button>`
      : `<button class="btn btn-primary" onclick="evFinish()">Finish the evidence builder →</button>`;
  } else {
    fb.className="feedback "+(level==="err"?"bad":"warn");
    fb.innerHTML="<b>"+(level==="err"?"Something needs fixing.":"A good start — here's how to lift it:")+"</b><ul>"
      +findings.map(f=>"<li>"+esc(f.text)+"</li>").join("")+"</ul>";
  }
}
function evFinish(){
  S.done.ev=true; save();
  const sc=scoreFor("ev");
  $("body").innerHTML=`<h2>Evidence builder — done</h2>
  ${evLadderHtml(5)}
  <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} levels passed on the first check.</b>
  You've climbed the same ladder that's on your assessment rubric: find it → explain it → embed it → make it explain something.
  The wrong turns you met on the way — retelling, overreaching, pointing at the quote — are the exact traps to avoid in your essay.</p></div>
  <div class="panel" style="background:var(--bg)"><p class="lead" style="margin:0">The <b>Sentence upgrader</b> has just unlocked on the hub — it takes the embedding skill and grows it into full analysis.</p></div>
  <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
}

/* ---------- SENTENCE UPGRADER ---------- */
function runUpg(){
  let idx=0;
  function draw(stage, acc){
    const it=UPG_ITEMS[idx];
    if(!it){ finish(); return; }
    let h=`<div class="eyebrow">Lessons 16–17 · analytic writing · WAGOLL ladder</div>
    <h2>Sentence upgrader — ${esc(it.focus)} (${idx+1}/${UPG_ITEMS.length})</h2><div class="wag">`;
    WAG_LEVELS.forEach((L,i)=>{
      h+=`<div class="lcard ${i===0? "got" : i<=stage? "got" : i===stage+1? "now":"below"}" style="cursor:default">
        <span class="lv">${esc(L.lv)} ${i===0||i<=stage?"✓":""}</span>${esc(L.text)}</div>`;
    });
    h+=`</div><div class="grow" id="grow">${esc(it.base)}${acc.map(a=>`<span class="new"> ${esc(a)}</span>`).join("")}</div>`;
    const stepDef = stage===0 ? it.c3 : it.c4;
    if(stage<2){
      h+=`<p class="q">${esc(stepDef.q)}</p><div class="opts" id="opts"></div>
      <div class="feedback" id="fb" aria-live="polite"></div><div class="btnrow" id="brow"></div>`;
      $("body").innerHTML=h;
      let first = S.first["upg."+it.id+"."+(stage===0?"c3":"c4")]===undefined;
      shuffle(stepDef.opts.map((_,i)=>i)).forEach(oi=>{
        const o=stepDef.opts[oi];
        const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
        b.onclick=()=>{
          if(first){ recFirst("upg."+it.id+"."+(stage===0?"c3":"c4"), o.ok); first=false; }
          const fb=$("fb");
          if(o.ok){
            document.querySelectorAll("#opts .opt").forEach(x=>x.disabled=true);
            b.classList.add("right");
            fb.className="feedback ok"; fb.innerHTML="<b>Correct.</b> "+esc(o.fb);
            $("brow").innerHTML=`<button class="btn btn-primary" id="nx">${stage===0?"Climb to C4 →":"Read it back →"}</button>`;
            $("nx").onclick=()=>draw(stage+1, acc.concat([o.t]));
          } else {
            b.disabled=true; b.classList.add("wrongpick");
            fb.className="feedback bad"; fb.innerHTML="<b>Not that one.</b> "+esc(o.fb);
          }
        };
        $("opts").appendChild(b);
      });
    } else {
      h+=`<div class="feedback ok"><b>Read it back.</b> You started at describing and finished at analysing — feature, effect, idea, all in one flowing sentence. That's a C4 sentence: the level to aim for in the text response essay.</div>
      <div class="btnrow"><button class="btn btn-primary" id="nx">${idx<UPG_ITEMS.length-1?"Next sentence →":"Finish →"}</button></div>`;
      $("body").innerHTML=h;
      $("nx").onclick=()=>{ idx++; draw(0,[]); };
    }
  }
  function finish(){
    S.done.upg=true; save();
    const sc=scoreFor("upg");
    $("body").innerHTML=`<h2>Sentence upgrader — done</h2>
    <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} upgrades chosen first try.</b>
    The pattern you just practised — <i>feature → effect on the reader → bigger idea</i> — is the whole engine of a text response paragraph.
    Next stop: Lesson 16–17 on OneNote, where you write these yourself.</p></div>
    <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  }
  draw(0,[]);
}

/* ---------- REPORT ---------- */
function vcode(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return "V-"+Math.abs(h).toString(16).toUpperCase().slice(0,6); }
const MISS_LABELS={qr1:"Quickread: the Night Sea",qr2:"Quickread: caught by Beaver",fig:"Figurative → literal",voice:"Voice fingerprint",ev:"Evidence builder",upg:"Sentence upgrader"};
const RECOMMEND={
 qr1:"Reread with a pencil (Lesson 09 annotation strategies) and use the chapter audio recordings while following along.",
 qr2:"Reread with a pencil (Lesson 09 annotation strategies) and use the chapter audio recordings while following along.",
 fig:"Revisit Lesson 09 (figurative language) and the simile/metaphor rows of 12w — Key ideas in the novel.",
 voice:"Revisit Lesson 07 — Character Voice before recording your voice memo; practise the word-class swap on two of your own sentences.",
 ev:"Revisit Lessons 04 and 06 (finding and embedding evidence). If sentence flow was the problem, open the Grammar Hub → Sentence Structure.",
 upg:"Revisit Lessons 16–17 (writing about how the text is written) and the workshopped model paragraph."};
function renderReport(){
  const mods=["qr1","qr2","fig","voice","ev","upg"];
  let rows="", worst=null, worstErr=-1, anyDone=false;
  mods.forEach(m=>{
    const sc=scoreFor(m); if(!sc.total) return;
    anyDone=true;
    const err= 1 - sc.got/sc.total;
    if(err>worstErr && sc.total>=3){ worstErr=err; worst=m; }
    rows+=`<tr><td>${esc(MISS_LABELS[m])}</td><td>${sc.got} / ${sc.total}</td><td>${S.done[m]?"finished":"in progress"}</td></tr>`;
  });
  const missed=Object.keys(S.first).filter(k=>!S.first[k]);
  const scAll=mods.reduce((a,m)=>{const s=scoreFor(m);return{got:a.got+s.got,total:a.total+s.total}},{got:0,total:0});
  const code=vcode(JSON.stringify(S.first)+(S.name||"")+(S.sid||""));
  const teach = !anyDone ? "" :
    `This student worked through the Reading &amp; Evidence Hub. Every wrong answer was retried until correct (mastery loop), but the scores above are <b>first attempts only</b> — so they show genuine independent reading, not final-state guessing. `
    + (worst!==null && worstErr>0.34 ? `The clearest next step: <b>${esc(MISS_LABELS[worst])}</b> — ${esc(RECOMMEND[worst])}` :
       worst!==null && worstErr>0 ? `Errors were spread thin; the softest area was <b>${esc(MISS_LABELS[worst])}</b>. ${esc(RECOMMEND[worst])}` :
       `A clean first-attempt run across everything attempted — extension: the 'stretch' rows of 12w, or drafting the voice memo unassisted.`);
  $("body").innerHTML=`<div class="eyebrow">My report</div><h2>Reading &amp; Evidence Hub — report</h2>
  <div class="rowinp noprint">
    <span><label for="nm">Name</label><input id="nm" value="${esc(S.name||"")}" onchange="S.name=this.value;save();renderReport()"></span>
    <span><label for="sid">Student ID</label><input id="sid" value="${esc(S.sid||"")}" onchange="S.sid=this.value;save();renderReport()"></span>
  </div>
  <p class="lead">${esc(S.name||"(no name entered)")}${S.sid?" · "+esc(S.sid):""} · first-attempt scores · overall <b>${scAll.got}/${scAll.total}</b></p>
  <table class="rpt"><tr><th>Activity</th><th>First attempt</th><th>Status</th></tr>${rows||`<tr><td colspan="3">Nothing attempted yet — go do an activity first.</td></tr>`}</table>
  ${missed.length?`<div class="panel"><b>Missed on first try (${missed.length}):</b> <span style="color:var(--muted);font-size:13px">${missed.map(esc).join(", ")}</span></div>`:""}
  <div class="panel"><b>What this tells your teacher:</b> ${teach||"Attempt at least one activity to generate the summary."}</div>
  <p class="lead">Verification code: <span class="vcode">${code}</span></p>
  <div class="btnrow noprint">
    <button class="btn btn-primary" onclick="S.done.rpt=true;save();window.print()">Print / save as PDF</button>
    <button class="btn btn-ghost" onclick="go('home')">← back to the hub</button>
  </div>`;
}

go("home");
</script>
