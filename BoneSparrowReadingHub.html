{ id:"qr6", ch:14, step:"Quickread 6", title:"A story from just Outside", where:"Chapter 14", vocabSet:"11-14",
  intro:"Three sentences. Read them twice, because short passages hide more than long ones — then they go and the questions start.",
  passage:`But no one has a story from just Outside. None of us knows what it is like just on the other side of the fences. But Jimmie does.`,
  items:[
  { id:"qr6a", q:"What is the important word in 'a story from just Outside'?",
    opts:["'story', because stories are the thing Subhi wants more than anything",
          "'just', because it means the unreachable place is only metres away",
          "'Outside', because the capital letter makes it a place rather than a direction",
          "'from', because it shows movement"],
    a:1, explain:"The camp is full of stories from Myanmar, from boats, from countries away. 'Just' shrinks the distance to nothing and makes the not-knowing absurd: it is the other side of a fence.",
    line:"None of us knows what it is like just on the other side of the fences." },
  { id:"qr6b", q:"Two of the three sentences begin with 'But'. What does that do?",
    opts:["It makes the writing sound uncertain, as if Subhi were changing his mind halfway through",
          "It turns the passage twice, so the last three words arrive as the answer to a lack",
          "It joins the three sentences together into a single long idea",
          "It shows Subhi is arguing with Queeny about what counts as a story"],
    a:1, explain:"'But no one has…' sets up the gap; 'But Jimmie does.' fills it. The shortest sentence gets the weight, which is a pattern you can borrow.",
    line:"But Jimmie does." },
  { id:"qr6c", q:"Why does the camp have stories from everywhere except just Outside?",
    opts:["Nobody in the camp likes telling stories about the place they are being held in now",
          "Everyone came from somewhere else, so nobody has lived the ordinary world outside",
          "The Jackets have banned that kind of story inside the fences",
          "Subhi has not asked anyone"],
    a:1, explain:"It is a fact about who is in the camp. The one place they can all see is the one place nobody can describe, and Fraillon builds Subhi's hunger for Jimmie's stories out of that gap.",
    line:"But no one has a story from just Outside." },
  { id:"qr6d", q:"What does the passage tell you about why Jimmie matters to Subhi?",
    opts:["She brings food in from outside, which nobody else can do",
          "She carries the one story the camp cannot supply",
          "She can read to him from a book he has never seen before",
          "She is the same age as him, so she understands him better"],
    a:1, explain:"Jimmie's value here is not friendship in general. She is a supply of the exact thing the camp lacks, which is why the friendship starts as trade and becomes more.",
    line:"But Jimmie does." }
  ],
  links:[
  { id:"qr6L1", idea:"Trust between the two children is built out of small promises kept.",
    opts:["'her whole face shines like someone's lit a candle in her cheeks'",
          "'I know for sure that Jimmie is the kind of person that keeps a promise'",
          "'But Jimmie does.'",
          "'None of us knows what it is like just on the other side of the fences.'"],
    a:1, explain:"'For sure' is Subhi staking something. In a place where the adults' promises about release keep failing, a kept promise is the whole currency.",
    why:{ opts:["It says Jimmie is nice, which is the easiest thing to notice about her",
                "It shows Subhi choosing to trust, and 'for sure' is what makes it cost later",
                "It describes her face, and faces are where this novel puts its feelings",
                "It tells us she can read, which turns out not to be true of her at all"],
          a:1, explain:"Weigh the small words. 'For sure' is doing the work, and naming it is more analytical than saying the two are friends." } },
  { id:"qr6L2", idea:"Fraillon writes feeling as light and weather rather than naming emotions.",
    opts:["'her whole face shines like someone's lit a candle in her cheeks'",
          "'I know for sure that Jimmie is the kind of person that keeps a promise'",
          "'But no one has a story from just Outside.'",
          "'Do you know that there are seven different types of dirt?'"],
    a:0, explain:"A simile, and a warm one: a candle is small, indoor and easily blown out, which is about the size of the happiness available here.",
    why:{ opts:["It uses 'like', so it is a simile, and naming the simile is the whole answer",
                "The comparison is chosen, not decorative: a candle is small and easily put out",
                "It describes what Jimmie looks like when Subhi finally sees her properly",
                "It shows the camp is dark, so a lit candle is the brightest thing in it"],
          a:1, explain:"Naming the technique is Level 5 work. Explaining why THIS comparison and not a brighter one is where the marks are." } }
  ] },

{ id:"qr7", ch:17, step:"Quickread 7", title:"Aussie Boy", where:"Chapter 17", vocabSet:"15-17",
  intro:"Subhi is telling you about a nickname. It sounds like a compliment. Read it twice, then the passage goes.",
  passage:`Like sometimes, some of the oldies call me Aussie Boy. They say the way I talk sounds just like Harvey, and that even the way I walk is more Australian than Rohingya. They say it to make me feel good, but it doesn't.`,
  items:[
  { id:"qr7a", q:"Why doesn't the nickname make Subhi feel good?",
    opts:["He does not like Harvey, so he does not want to sound like him",
          "It praises him for how much of his own people he has lost",
          "He would rather be called by his ID number than by a nickname",
          "The oldies are being sarcastic, and he can hear it in their voices"],
    a:1, explain:"The compliment measures him by how Australian he seems. Every point it awards him is a point taken off being Rohingya, and he is the one who has to carry the difference.",
    line:"They say it to make me feel good, but it doesn't." },
  { id:"qr7b", q:"'more Australian than Rohingya' — what is the damage in that comparison?",
    opts:["It gets the two countries the wrong way round, since he was born here",
          "It treats identity as a scale, where one side rises only if the other falls",
          "It is factually incorrect about his accent, which is nothing like Harvey's",
          "It insults Harvey by comparing him to a child in the camp"],
    a:1, explain:"Nobody in the sentence imagines being both. That is the assumption Subhi is up against, and it is the same assumption behind Maá stopping Rohingya at home.",
    line:"…and that even the way I walk is more Australian than Rohingya." },
  { id:"qr7c", q:"The passage ends 'but it doesn't.' What does that short, flat ending do?",
    opts:["It shows he is angry and shouting, even though the words are quiet",
          "It refuses the compliment without arguing, which is harder to dismiss",
          "It shows he is unsure whether the oldies mean it kindly or not",
          "It changes the subject before anyone can ask him about it"],
    a:1, explain:"Three words, no explanation, no complaint. Fraillon lets Subhi state the fact and stop, and the reader is left to work out why.",
    line:"They say it to make me feel good, but it doesn't." },
  { id:"qr7d", q:"Subhi was born in the camp and has never been outside it. What does that add to the nickname?",
    opts:["Nothing much, because the nickname is only ever a joke between the old men",
          "He sounds most like the country that locked him up and never showed it to him",
          "It proves he is Australian, whatever the paperwork happens to say",
          "It shows the oldies have travelled and can hear the difference"],
    a:1, explain:"The only Australia Subhi has met is Harvey, the Jackets and a fence. Being called Aussie Boy names a belonging the country itself refuses him, which is where the irony bites.",
    line:"They say the way I talk sounds just like Harvey…" }
  ],
  links:[
  { id:"qr7L1", idea:"Survival in the camp is paid for by giving pieces of yourself away.",
    opts:["'I whisper the few words of Rohingya that I know, just so my brain doesn’t turn to thinking that they are right and that I am only Aussie Boy.'",
          "'They say the way I talk sounds just like Harvey, and that even the way I walk is more Australian than Rohingya.'",
          "'They say it to make me feel good, but it doesn’t.'",
          "'…more Australian than Rohingya.'"],
    a:0, explain:"He is down to a few words, and he says them to himself, in secret, as a defence. The language has already almost gone; the whisper is what holding on looks like near the end of it.",
    why:{ opts:["It tells us Subhi speaks two languages, which is common in the camp",
                "It shows the loss nearly finished, and the fight against it shrunk to a whisper",
                "It shows the oldies are wrong about him, because he still speaks Rohingya",
                "It explains why Maá stopped speaking Rohingya to him at home"],
          a:1, explain:"Count what is left: a few words, said to himself. The size of the remainder is the evidence — name it, rather than saying he is losing his culture in general." } },
  { id:"qr7L2", idea:"The camp closes over the people it loses, as if they were never there.",
    opts:["'Then Harvey went and led a new boy over to Nasir’s bed.'",
          "'They say it to make me feel good, but it doesn’t.'",
          "'…the way I walk is more Australian than Rohingya.'",
          "'Harvey reckons that when someone dies, they turn into a star.'"],
    a:0, explain:"Nasir died in the morning; by night there is a new boy in his bed. No ceremony, no gap, no sentence of comment. The routine itself is the horror, and Fraillon lets it pass as routine.",
    why:{ opts:["It shows Harvey is uncaring, which the rest of the novel keeps disproving",
                "The plainness is the point: a man died and the camp’s answer is a bed made available",
                "It tells us the camp is crowded, so empty beds cannot be left empty for long",
                "It shows the new boy will be sleeping badly, in a bed a man just died in"],
          a:1, explain:"Notice there is no emotion in the sentence at all. Write about what the flatness does — the missing feelings are the reader’s to supply, which is why it lands." } }
  ] },

{ id:"qr8", ch:20, step:"Quickread 8", title:"Jimmie wants to know", where:"Chapter 20", vocabSet:"18-20",
  intro:"Jimmie is looking at a newspaper she cannot read. Read the passage twice — it goes when the questions start.",
  passage:`Jimmie wants to ask more. Wants to find out how they can help, so that no one has to sew their lips together. Wants to know why they have been locked up in there for so long. Why no one is listening. Why it is illegal for people to try and save their families. Why it is illegal to want to live. Jimmie wants to know.`,
  items:[
  { id:"qr8a", q:"Several sentences begin 'Wants to…' with no subject in front. What does that do?",
    opts:["It shows the writer forgot to put Jimmie's name at the front of them",
          "The questions arrive faster than she can build whole sentences for them",
          "It makes the passage more formal, the way a report would be written",
          "It shows she is speaking aloud to her father across the breakfast table"],
    a:1, explain:"They are fragments, and they are meant to be. Dropping 'Jimmie' off the front makes the wanting pile up without pausing for grammar.",
    line:"Wants to find out how they can help, so that no one has to sew their lips together." },
  { id:"qr8b", q:"Four sentences in a row start with 'Why'. What is the effect of that repetition?",
    opts:["It builds pressure: each unanswered question makes the next one heavier",
          "It makes the passage easier to skim, so the reader moves through faster",
          "It shows Jimmie is confused about the facts she has heard at school",
          "It signals that the answers to all of them are coming on the next page"],
    a:0, explain:"Repeating the opening word is anaphora. Here it stacks the questions into something closer to an accusation than an enquiry.",
    line:"Why no one is listening. Why it is illegal for people to try and save their families." },
  { id:"qr8c", q:"'Why it is illegal to want to live.' ends with a full stop, not a question mark. Why does that matter?",
    opts:["It is a typing error that nobody caught before the book was printed",
          "It makes it a statement: she is not asking now, she is refusing it",
          "It shows she is whispering the questions rather than asking them aloud",
          "It shows the question matters less to her than the others do"],
    a:1, explain:"Punctuation is a choice you can write about. A question mark expects an answer; a full stop has stopped expecting one, which is far bleaker.",
    line:"Why it is illegal to want to live." },
  { id:"qr8d", q:"The passage opens on 'Jimmie wants to ask more' and closes on 'Jimmie wants to know.' What does that frame show?",
    opts:["She has found her answer somewhere in the newspaper photograph she is looking at",
          "She has moved on to something else by the end of the passage",
          "She ends where she started, still outside what she needs to understand",
          "She has decided to ask her father about it over breakfast"],
    a:2, explain:"The circle is the point. All that wanting has not moved her a step, which is the position the novel puts its readers in too.",
    line:"Jimmie wants to know." },
  { id:"qr8e", q:"Jimmie's chapters are third person, present tense. How does that position the reader here?",
    opts:["Inside her head, hearing every one of those thoughts in her own words",
          "Close enough to watch her wanting, but outside her, unable to answer her",
          "Far away, looking back on all of it years after the events",
          "As one of the men in the photograph she is looking at"],
    a:1, explain:"Subhi's chapters are 'I'. Jimmie's are 'she'. We stand next to her rather than inside her, which is exactly the distance the whole passage is about.",
    line:"Jimmie wants to ask more." }
  ],
  links:[
  { id:"qr8L1", idea:"When speech stops being heard, the body becomes the message.",
    opts:["'At the front are six men, their lips sewn closed with string, staring right out at the reader.'",
          "'Just trying to get us to say we hear them. Take notice.'",
          "'Jimmie wants to know.'",
          "'Why no one is listening.'"],
    a:0, explain:"Men who cannot get a hearing sew their own mouths shut and look straight down the camera. The silencing is made visible, and 'staring right out at the reader' aims it at us.",
    why:{ opts:["It is shocking, and the shock is what proves the point better than words",
                "It turns silence into something seen, so the body carries the argument to the reader",
                "It shows the men are strong enough to do something nobody else would do",
                "It describes exactly what the string is and where the men got hold of it"],
          a:1, explain:"'Shocking' is a reaction, not an analysis. Name the mechanism: the silence is not hidden, it is displayed, and the stare hands it to whoever is looking." } },
  { id:"qr8L2", idea:"Queeny turns suffering into evidence, because evidence is the only thing that travels out.",
    opts:["'…about Queeny and Eli sneaking in the camera to get their pictures out into the world.'",
          "'At the front are six men, their lips sewn closed with string, staring right out at the reader.'",
          "'Why it is illegal to want to live.'",
          "'Wants to find out how they can help.'"],
    a:0, explain:"The photo Jimmie is looking at exists because Queeny put it there. The camera is the camp’s only exit, and 'out into the world' is the whole plan in four words.",
    why:{ opts:["It shows Queeny likes photography, which is why she wanted the camera",
                "'Out into the world' names the purpose: the pictures are built to travel where the people cannot",
                "It tells us the camera had to be snuck in, so cameras must be banned",
                "It shows Eli is helping her, and that the two of them work together"],
          a:1, explain:"The evidence has already worked by the time we read it — Jimmie is holding the proof. Say that: the plan and its success are in the same page." } }
  ] },

{ id:"qr9", ch:2, step:"Quickread 9", title:"Names and numbers", where:"Chapter 2", vocabSet:"1-2",
  intro:"Back to chapter 2, and a longer read this time. Read it twice. The questions lead up to a sentence you build yourself at the end.",
  passage:`Harvey, he’s one of the Jackets. Most Jackets don’t bother with us Limbo kids, except to search us over with their beeper wands or shove us out of the way. But not Harvey. All the kids like Harvey. Some of the other Jackets can be nice enough too, but not like Harvey. Usually the nice ones don’t stay too long anyway. But Harvey’s been here longer than me even.<br><br>
The first thing Harvey does when new kids arrive is to learn their names so that he can talk with us for real, instead of talking to us by our numbers. Most people have their Boat ID as their number. Maá is NAP-24 and Queeny is NAP-23. But I was born in here, so I have a different ID. DAR-1, that’s me. The 1 is because I was the first baby ever born here. But Harvey, he won’t use those numbers, not even when he’s supposed to.<br><br>
Harvey doesn’t start until lunch, but he’s come in extra early today, and he tells me to wait and watch because he’s brought something that he’s sure I’ll appreciate. I know already what it is, because Harvey, he brings this same thing every time it gets this hot. It’s a plastic pool. It’s small but round and shaped like a giant clamshell, so he always has trouble getting it through the fences and gates. While he struggles with all the locks and holding on to that pool and his bag, the other Jackets smile and laugh and jingle their keys up and down on their chains, and not a single one helps with the locks so that Harvey can get in more quickly.<br><br>
‘You lot aren’t worth spit,’ I tell them. Just not loud enough for anyone to hear. Eli says that a lot. But Eli goes right up to the person he’s talking to and makes sure they hear every word.`,
  items:[
  { id:"qr9a", q:"Subhi's ID is DAR-1. What does that fact carry?",
    opts:["He was the first baby ever born in the camp — he has never once been Outside",
          "He arrived on the first boat, before Maá and Queeny did",
          "The Jackets gave him a special number because Harvey likes him",
          "It is the name his ba chose for him before he was born"],
    a:0, explain:"DAR is the camp's code and the 1 means the first baby born here. His whole ID comes from the camp: he has never been outside it.",
    line:"But I was born in here, so I have a different ID. DAR-1, that's me." },
  { id:"qr9b", stim:`Find the <em class="hl-ev">evidence</em> — the line doing the most work.`,
    q:"Which line shows most sharply what the camp does to people's names?",
    opts:["…learn their names so that he can talk with us for real, instead of talking to us by our numbers",
          "Maá is NAP-24 and Queeny is NAP-23.",
          "All the kids like Harvey.",
          "It's a plastic pool."],
    a:0, near:[1], explain:"NAP-24 shows you the numbers — a strong second choice. But this line does both jobs at once: the numbers, and what they cost ('for real').",
    line:"Most people have their Boat ID as their number." },
  { id:"qr9c", stim:`Find the line that carries the <em class="hl-eff">feeling</em>.`,
    q:"Which line lets us feel Subhi's anger?",
    opts:["'You lot aren't worth spit,' I tell them. Just not loud enough for anyone to hear.",
          "Harvey always has a joke.",
          "It's small but round and shaped like a giant clamshell.",
          "But not Harvey."],
    a:0, explain:"Subhi uses Eli's words, but only in a whisper. Fraillon never writes the word angry — the whisper tells us.",
    line:"Eli says that a lot. But Eli goes right up to the person he's talking to and makes sure they hear every word." },
  { id:"qr9d", stim:`Name the <em class="hl-idea">idea</em> underneath it all.`,
    q:"The numbers, the jingling keys, the locks no one helps with — which idea do they all feed?",
    opts:["power — who has it and who doesn't",
          "friendship — the Jackets and the kids getting along",
          "imagination — the pool Subhi dreams about all summer",
          "hope — things in the camp slowly getting better"],
    a:0, explain:"The numbers, the keys and the locks all show the same thing: the Jackets have the power and don't have to care. Naming that idea is what makes a sentence analytical instead of a retell.",
    line:"…the other Jackets smile and laugh and jingle their keys up and down on their chains…" },
  { id:"qr9e", stim:`Choose the <em class="hl-verb">verb</em> for what the writing does.`,
    q:"Fraillon never writes 'the Jackets are cruel'. The line about the keys ___ the cruelty instead.",
    opts:["reveals","lists","hides","solves"],
    a:0, explain:"Fraillon shows the cruelty in one small action instead of telling us about it. 'Reveals' says exactly that.",
    line:"…and not a single one helps with the locks so that Harvey can get in more quickly." },
  { id:"qr9f", q:"And what does 'not a single one helps' do to the reader?",
    opts:["makes the reader understand why one kind man matters so much here",
          "makes the reader laugh along with the Jackets' game",
          "tells the reader how the locks on the gates work",
          "makes the reader want a pool of their own"],
    a:0, explain:"Harvey only stands out because of the Jackets around him. The line shows what he is up against, so you understand why he matters.",
    line:"…not a single one helps with the locks so that Harvey can get in more quickly." }
  ],
  links:[
  { id:"qr9L1", idea:"In a place that calls people by numbers, using a name is a way of pushing back.",
    opts:["'…learn their names so that he can talk with us for real, instead of talking to us by our numbers.'",
          "'Harvey doesn't start until lunch, but he's come in extra early today.'",
          "'It's Harvey's horn, because no one else honks like that.'",
          "'Usually the nice ones don't stay too long anyway.'"],
    a:0, explain:"'For real' is the key phrase: talking to someone by a number is not really talking to them. The line shows the numbers and Harvey's answer to them, together.",
    why:{ opts:["It proves Harvey has a good memory for names, which the other Jackets do not",
                "It puts Harvey's way next to the camp's way, so we see what the numbers cost",
                "It shows that new kids keep arriving, so the camp must be growing",
                "It tells us Harvey has been in the camp longer than Subhi has"],
          a:1, explain:"'Instead of' matters. Without it, learning names is just being friendly. With it, we see Harvey choosing not to do what the camp does." } }
  ] }

];

/* ==================== FIGURATIVE → LITERAL ==================================
   Two steps per line: (1) what does it literally mean, (2) which feature is
   doing the work. Paraphrases are deliberately plain — EAL-friendly.
   =========================================================================== */
const FIG_TECHS = ["Simile — compares using 'like' or 'as'",
                   "Metaphor — says one thing IS another",
                   "Personification — gives a thing human behaviour",
                   "Word-class swap — an adjective used as a noun",
                   "Symbol — an object that carries a bigger idea",
                   "Hyperbole — exaggeration for effect"];
const FIG_ITEMS = [
{ id:"fig1", ch:5, quote:"My throat is as dry as the dirt.", page:"p. 33",
  meaning:{ opts:["He is so frightened his mouth has gone dry","He needs a drink of water after standing in the sun all day","The camp has run out of water again, as it often does","He has been eating dirt, which is what the ground tastes of"],
    a:0, explain:"The comparison lands in the middle of the Beaver confrontation — this is fear in the body, not thirst." },
  tech:{ opts:[0,1,2,5], a:0, explain:"'As dry as the dirt' — and notice WHAT it's compared to: the camp's own dirt. Even his fear is described in camp language." } },
{ id:"fig2", ch:5, quote:"Beaver's voice sounds as dark as the Jackets' dogs when they don't like a person.", page:"p. 33",
  meaning:{ opts:["Beaver speaks very quietly so that nobody else can hear him","His voice is low and threatening, like a dog's growl","Beaver owns several of the dogs the Jackets keep at the fence","His voice is impossible to hear over the noise of the dogs"],
    a:1, explain:"A voice 'as dark as' a guard dog that doesn't like you is a growl — pure threat. The dogs also remind us this place is guarded like a prison." },
  tech:{ opts:[0,1,2,3], a:0, explain:"It's a simile — 'as dark as'. 'Dark' describing a sound is also a sense-swap that makes the menace feel physical." } },
{ id:"fig3", ch:3, quote:"…as if the house is holding its breath too.", page:"p. 19",
  meaning:{ opts:["The house has had no air in it since the windows were all closed up after the funeral","The house is haunted, and everyone in it can feel that","The house is silent and still, as if waiting for the sadness to end","The windows are all shut, so no sound gets in or out of it"],
    a:2, explain:"Since Jimmie's mum died the house has gone quiet. The word 'too' tells us Jimmie is also holding her breath — both are waiting." },
  tech:{ opts:[0,1,2,5], a:2, explain:"Houses don't breathe — giving the house a human action is personification, and it spreads Jimmie's grief into the building around her." } },
{ id:"fig4", ch:14, quote:"…her whole face shines like someone's lit a candle in her cheeks.", page:"p. 94",
  meaning:{ opts:["Her face is on fire","She is embarrassed and blushing","Her face is reflecting the torchlight from the fence","She suddenly looks glowing and happy"],
    a:3, explain:"This is joy at seeing a friend again — the candle image is warmth and light, not embarrassment or literal fire." },
  tech:{ opts:[0,1,2,3], a:0, explain:"'Shines like…' — a simile. The candle brings warmth, light and smallness together in one picture of quiet happiness." } },
{ id:"fig5", ch:2, quote:"When I stick my head under the water, the whole world stops.", page:"p. 16",
  meaning:{ opts:["The pool water freezes around him while he is under it",
          "Underwater everything feels still and silent — a moment of escape","Time travel is possible in the camp, at least in Subhi's head","Subhi cannot swim, and is holding his breath under the water"],
    a:1, explain:"Underwater, the camp's noise disappears. It's the same job the Night Sea does — a private place detention can't reach." },
  tech:{ opts:[0,1,2,5], a:3, explain:"The world doesn't literally stop — it's hyperbole (exaggeration), and the exaggeration is the point: this is how total the escape feels to Subhi." } },
{ id:"fig6", ch:1, quote:"'What am I listening to?' she says, the bored all over her face…", page:"p. 7",
  meaning:{ opts:["She has paint on her face","Her face shows she is completely bored","She is wearing a mask that makes her look bored","She is listening carefully"],
    a:1, explain:"'The bored' spread 'all over her face' — Queeny's boredom is total and visible." },
  tech:{ opts:[0,1,3,5], a:2, explain:"'Bored' is an adjective used where a noun should be ('boredom'). Fraillon swaps word classes on purpose — it makes Subhi's voice young, and reminds us English is not his first language." } },
{ id:"fig7", ch:1, quote:"I was only nineteen fence diamonds high.", page:"p. 3",
  meaning:{ opts:["Subhi was standing on the fence to see over it more easily","Subhi measures his height against the fence — he has grown up inside it","The fence is covered in diamonds of light wherever the afternoon sun hits it","Subhi is nineteen years old, going by the marks on the fence"],
    a:1, explain:"He measures himself in fence wire because the fence is always there — it's his ruler. His whole childhood has happened inside it." },
  tech:{ opts:[0,1,3,4], a:3, explain:"The fence works as a symbol: an everyday object carrying the novel's biggest idea, imprisonment. When the fence is how you measure growing up, detention has become your whole world." } },
{ id:"fig8", ch:11, quote:"Watching her go, something in my chest explodes.", page:"p. 81",
  meaning:{ opts:["Subhi is having a heart attack, or something that feels like one","Subhi feels a sudden, overwhelming burst of emotion","Something in his pocket has burst while he was watching her go","Subhi is angry at Jimmie for leaving without saying goodbye"],
    a:1, explain:"After the first visit and the first chapter of the story, this is joy and hope arriving all at once — too big for his chest to hold." },
  tech:{ opts:[0,1,2,5], a:1, explain:"Nothing literally explodes — the feeling IS an explosion. That's metaphor: it states the impossible thing as fact to show the size of the feeling." } }
];

/* ==================== VOICE FINGERPRINT =====================================
   Unattributed lines → who is speaking / narrating → what gave it away.
   This is the lesson BEFORE the in-character voice memo: to speak AS a
   character you first have to hear how Fraillon builds each voice.
   =========================================================================== */
const VOICE_WHO = ["Subhi (narrating)","Maá","Queeny","Eli","Beaver","The Shakespeare duck","A Jimmie chapter (the narrator)"];
const VOICE_ITEMS = [
{ id:"vo1", ch:1, line:"I not hungry much, Subhi love.", page:"p. 3", a:1,
  whoExplain:"Maá. She's turning food down so there's more for her children, and softening it so Subhi won't argue — that's a mother's line, not a child's or a guard's.",
  feat:{ opts:["Missing small grammar words, plus a term of endearment",
               "Short clipped commands, with no room left for an answer","Formal, old-fashioned phrasing that belongs in a story book","Third-person narration, watching the character from somewhere outside them"],
    a:0, explain:"Fraillon drops the 'am' and adds 'Subhi love' — two moves that carry exhaustion and tenderness at once. Voice is built from grammar, not just word choice." } },
{ id:"vo2", ch:10, line:"My, my. She's quite the talker, isn't she?", page:"p. 73", a:5,
  whoExplain:"The Shakespeare duck. It's an amused comment ABOUT someone else in the room, made by a character with no stake in the conversation — nobody detained here has that luxury.",
  feat:{ opts:["Missing grammar words, the way a very young child leaves them out of a sentence","Formal, old-fashioned, amused phrasing — an invented 'posh' voice",
               "Angry shouting, with the volume doing most of the work","Simple young-child words in short, unconnected sentences"],

   distractor rather than to trim the answer, because a four-word distractor

    q:"'As red as the sun and as deep as the sky.' What does this sentence do that a plain description would not?",
    opts:["It measures the imagined sea against the two biggest things Subhi can see",
          "It tells us the exact colour of the dirt outside the family tents at night",
          "It proves the ocean is real, because he describes it so precisely",
          "It explains why Subhi cannot sleep with Queeny beside him"],
    a:0, explain:"He has no ocean to compare it to, so he reaches for the sun and the sky — the only enormous things inside the fences. Even his imagination is furnished from what the camp allows him.",
    line:"As red as the sun and as deep as the sky." },
  { id:"rx_inf2", ch:1, stim:"Our maá says there are some people in this world who can see all the hidden bits and pieces of the universe blown in on the north wind and scattered about in the shadows.", page:"p. 1",
    q:"Maá says 'some people' can see the hidden bits of the universe. What is she really telling Subhi?",
    opts:["That he should stop imagining things and look at what is there","That his way of seeing is a gift rather than a fault",
          "That the wind is dangerous","That Queeny is right about him"],
    a:1, explain:"It arrives immediately after Queeny calls him stupid. Maá's line is a quiet defence of her son — she gives his imagination a place in the family's understanding of the world.",
    line:"…there are some people in this world who can see all the hidden bits and pieces of the universe…" },
  { id:"rx_inf3", ch:1, stim:"In the morning, the ground still wet and foamy from where those waves washed up, I sit and trace the hundreds of animals that have swum all the way up to the tent…", page:"p. 2",
    q:"The Night Sea leaves the ground 'wet and foamy' in the morning. What does this tell us about how Subhi experiences it?",
    opts:["It is only a dream, and he has forgotten most of it by morning","It rained overnight, and he is confusing the puddles with a sea",
          "It carries into daylight and leaves traces — it is how he lives","The other tents flood in the same way when it rains hard"],
    a:2, explain:"Fraillon never breaks the spell by telling us it isn't real. The traces in the morning dirt keep the imagined world going, so the reader lives inside Subhi's seeing rather than watching it from outside.",
    line:"In the morning, the ground still wet and foamy from where those waves washed up…" },
  { id:"rx_inf4", ch:5, stim:"Eli always tells me, 'Never let anyone see your scared,' and I try as hard as I can but trying isn't doing…", page:"p. 33",
    q:"'Trying isn't doing.' What is Subhi admitting in these three words?",
    opts:["That he has given up on Eli's advice now that it has failed him","That he is trying his hardest and it still isn't enough to hide the fear",
          "That he does not understand what Eli meant by the rule at all","That Eli was wrong to give him advice that he could not possibly follow"],
    a:1, explain:"The rule is good; the boy is nine and terrified. The gap between the advice and what a child's body actually does is where the whole scene lives.",
    line:"…and I try as hard as I can but trying isn't doing…" },
  { id:"rx_inf5", ch:5, stim:"His hand is hard and scratchy, grabbing at my shirt and pulling me towards him so that my teeth clang on my tongue and I can taste blood…", page:"p. 33",
    q:"Subhi reports the taste of blood but never says 'it hurt'. Why does that make the moment stronger?",
    opts:["Because the reader works out the pain from the evidence of his senses",
          "Because it did not actually hurt him as much as it sounds","Because he is being brave for Eli, who told him never to let it show","Because the narrator is unreliable when it comes to his own injuries"],
    a:0, explain:"The body reports; the reader concludes. That is the difference between being told a boy is hurt and standing inside him while it happens.",
    line:"…my teeth clang on my tongue and I can taste blood…" },
  { id:"rx_inf6", ch:5, stim:"When I crash into the dirt, Beaver has the package. And he's opening it.", page:"p. 33",
    q:"The chapter breaks off here, on 'And he's opening it.' What is that short final sentence doing?",
    opts:["Ending the story of the package right there, before we learn anything more","Holding the reader in the worst moment, before we learn what is inside",
          "Telling us Beaver is curious about what the package holds","Showing that Subhi has escaped while Beaver was distracted"],
    a:1, explain:"A short sentence after a long one slams the door. Fraillon leaves us in the not-knowing — the same place she has left Subhi.",
    line:"When I crash into the dirt, Beaver has the package. And he's opening it." }
 ],

 figtech:[
  { id:"rx_ft1", ch:1, stim:"“Sometimes, at night, the dirt outside turns into a beautiful ocean.”", page:"p. 1",
    q:"Which feature is doing the work in this line?",
    opts:["Metaphor — the dirt BECOMES an ocean, it is not merely like one",
          "Simile — a comparison signalled by 'like' or 'as'",
          "Personification — the dirt is given human behaviour and intention",
          "Hyperbole — deliberate exaggeration for effect"],
    a:0, explain:"No 'like' or 'as' — it states the transformation as fact. That is what makes Subhi's imagination feel real rather than decorative.",
    line:"Sometimes, at night, the dirt outside turns into a beautiful ocean." },
  { id:"rx_ft2", ch:5, stim:"“My throat is as dry as the dirt.”", page:"p. 33",
    q:"Beyond being a simile, why is the comparison to DIRT the important choice?",
    opts:["Dirt is the cheapest thing to describe, so the writer reached for it","It shows the camp has supplied even the words for his fear",
          "It proves he is thirsty, which is what a dry throat usually means","It rhymes with the line that comes after it in the paragraph"],
    a:1, explain:"He could have compared it to anything. He reaches for the ground of the camp — the only world he has ever had to think with.",
    line:"My throat is as dry as the dirt." },
  { id:"rx_ft3", ch:3, stim:"“…as if the house is holding its breath too.”", page:"p. 19",
    q:"Which feature is doing the work here?",
    opts:["Simile — it compares using 'as if'","Personification — the house is given a human action",
          "Both, personification inside an 'as if' comparison","Neither of them — it is plain literal description"],
    a:2, explain:"Good noticing if you saw both. The comparison frame is 'as if', but the power comes from giving the house a held breath — and the word 'too' hands that breath back to Jimmie.",
    line:"…as if the house is holding its breath too." },
  { id:"rx_ft4", ch:5, stim:"“…my brain is buzzing louder and louder.”", page:"p. 33",
    q:"Which feature is doing the work?",
    opts:["Onomatopoeia — 'buzzing' imitates the sound it is naming","Simile — a comparison signalled by the word 'like'",
          "Symbol — the brain stands for a bigger idea","Rhyme — the words are chosen to echo each other in sound"],
    a:0, explain:"'Buzz' performs its own sound, and 'louder and louder' makes the panic climb. Sound-words put you inside his skull.",
    line:"…and my brain is buzzing louder and louder." }
 ],

 /* Parallel items for the evidence-to-idea phase of quickreads 3-8. A missed
    link question hands back a DIFFERENT idea to prove, not the same one with
    the options shuffled, which is the whole point of this bank. Quotes are the
    same page-referenced extracts the quickreads draw on. */
 evpick:[
  { id:"rx_ep1", ch:6, stim:"<b>The idea:</b> The town's anger about the Centre grows out of what the town itself does not have.",
    q:"Which line is the best evidence for that idea?",
    opts:["'…so you didn't have to drive for two days if you were sick.'",
          "'Saying how lucky those people were in the Centre.'",
          "'A fence just means there's something interesting inside.'",
          "'Jimmie wonders if her dad even remembers that she can't read.'"],
    a:0, explain:"The two-day drive is a fact about Jimmie's town, not about the Centre. It is the lack underneath the resentment, which is why that line proves the idea and the others only report the resentment.",
    line:"…so you didn't have to drive for two days if you were sick." },
  { id:"rx_ep2", ch:8, stim:"<b>The idea:</b> The camp damages people by taking away everything a person does with a day.",
    q:"Which line is the best evidence for that idea?",
    opts:["'Some of those men can be real mean to a kid when they want to be.'",
          "'…without their families, without being able to work or learn or do anything…'",
          "'It changes a person, Eli says.'",
          "'The first thing Harvey does when new kids arrive is to learn their names…'"],
    a:1, explain:"'Changes a person' states the effect; the list of what has been removed is the cause. Evidence that shows the mechanism beats evidence that only names the result.",
    line:"…without their families, without being able to work or learn or do anything…" },
  { id:"rx_ep3", ch:10, stim:"<b>The idea:</b> Subhi reads Jimmie through what he already believes, and keeps changing his mind.",
    q:"Which line is the best evidence for that idea?",
    opts:["'Mum said it gives us luck and protection.'",
          "'Jimmie isn't anything like Queeny' … 'Maybe she is like Queeny, just a bit.'",
          "'Knowing Jimmie has a whole real book in her hands gives me a sort of brave…'",
          "'And then she leaves, disappearing into the dark and the dirt…'"],
    a:1, explain:"Two lines a page apart, saying opposite things. The self-correction is the evidence: he is working her out in real time, against the only girl he knows.",
    line:"Jimmie isn't anything like Queeny. … Maybe she is like Queeny, just a bit." },
  { id:"rx_ep4", ch:14, stim:"<b>The idea:</b> What the camp lacks is not only food and shoes, but ordinary knowledge of the world outside it.",
    q:"Which line is the best evidence for that idea?",
    opts:["'None of us knows what it is like just on the other side of the fences.'",
          "'her whole face shines like someone's lit a candle in her cheeks'",
          "'I know for sure that Jimmie is the kind of person that keeps a promise'",
          "'But Jimmie does.'"],
    a:0, explain:"'None of us' makes it collective, and 'just the other side' makes the distance absurd. That is a shortage of knowledge, stated as plainly as the shortage of shoes.",
    line:"None of us knows what it is like just on the other side of the fences." },
  { id:"rx_ep5", ch:17, stim:"<b>The idea:</b> Belonging is offered to Subhi only on the condition that he seems less Rohingya.",
    q:"Which line is the best evidence for that idea?",
    opts:["'Some of the oldies call me Aussie Boy. They say it to make me feel good.'",
          "'…even the way I walk is more Australian than Rohingya.'",
          "'They say it to make me feel good, but it doesn't.'",
          "'Why no one is listening.'"],
    a:1, explain:"The nickname alone is just a name. The line that measures him as 'more Australian than Rohingya' is where the condition is stated, so it is the line that proves the idea.",
    line:"…and that even the way I walk is more Australian than Rohingya." },
  { id:"rx_ep6", ch:20, stim:"<b>The idea:</b> The novel gives its hardest questions to the character least able to answer them.",
    q:"Which line is the best evidence for that idea?",
    opts:["'Why it is illegal to want to live.'",
          "'Jimmie wants to know.'",
          "'The man has only strong in his eyes…'",
          "'Eli and another man hold the sheet next to them and Queeny takes a picture…'"],
    a:0, explain:"A ten-year-old who cannot read is holding the newspaper and asking the question the adults in the novel will not. Quote the question itself, not her wanting.",
    line:"Why it is illegal to want to live." }
 ],
 evwhy:[
  { id:"rx_ew1", ch:6, stim:"<b>The idea:</b> The town's anger grows out of its own lack.<br><b>The evidence:</b> '…so you didn't have to drive for two days if you were sick.'",
    q:"What makes that line the proof?",

          "It shows the kids are lying about what they have been told",
          "It tells us Jimmie is sick and cannot get to a doctor herself"],
    a:1, explain:"Point at what the evidence is actually about. The sentence is describing the Centre, but the two-day drive belongs to the town — that is the half worth quoting.",
    line:"…so you didn't have to drive for two days if you were sick." },
  { id:"rx_ew2", ch:8, stim:"<b>The idea:</b> The camp damages people by emptying their days.<br><b>The evidence:</b> '…without their families, without being able to work or learn or do anything…'",
    q:"What makes that line the proof?",
    opts:["Repeating 'without' defines the men by what has been taken away",
          "It uses long words to make the sentence sound more serious",
          "It tells us how many men are being held in Alpha at the time",
          "It shows Eli is angry about what the place has done to them"],
    a:0, explain:"Name the pattern, then say what the pattern does. Repetition on its own is a Level 5 observation; repetition of an absence is the analysis.",
    line:"…without their families, without being able to work or learn or do anything…" },
  { id:"rx_ew3", ch:10, stim:"<b>The idea:</b> Subhi keeps revising what he thinks of Jimmie.<br><b>The evidence:</b> 'Jimmie isn't anything like Queeny' … 'Maybe she is like Queeny, just a bit.'",
    q:"What makes those lines the proof?",
    opts:["They show Subhi does not like Queeny much at the best of times, let alone now",
          "The second line takes the first back, so we watch him change his mind",
          "They both mention Queeny, who is his measure for every girl",
          "They show Jimmie and Queeny are the same age"],
    a:1, explain:"Two quotes can be stronger than one when the second contradicts the first. Say what happens between them.",
    line:"Maybe she is like Queeny, just a bit." },
  { id:"rx_ew4", ch:14, stim:"<b>The idea:</b> The camp lacks ordinary knowledge of the world outside.<br><b>The evidence:</b> 'None of us knows what it is like just on the other side of the fences.'",
    q:"What makes that line the proof?",
    opts:["It says the fences are tall, which is why nobody can see over them",
          "'None of us' makes it collective, 'just' makes it absurd: the shortage is knowledge",
          "It shows Subhi has never once been outside the camp in his whole life, not once",
          "It mentions Jimmie, who is the exception to everything here"],
    a:1, explain:"Two small words carry the line. Quote them inside your sentence rather than the whole clause.",
    line:"None of us knows what it is like just on the other side of the fences." },
  { id:"rx_ew5", ch:17, stim:"<b>The idea:</b> Belonging is offered on the condition of seeming less Rohingya.<br><b>The evidence:</b> '…even the way I walk is more Australian than Rohingya.'",
    q:"What makes that line the proof?",
    opts:["It shows Subhi walks strangely, and the oldies have noticed",
          "It treats identity as a scale: praise one side, lose the other",
          "It shows the oldies like Harvey more than the other Jackets",
          "It proves Subhi is Australian, whatever his paperwork says"],
    a:1, explain:"The word to seize is 'more … than'. A comparison that only allows one winner is doing the damage, and naming that is the analysis.",
    line:"…more Australian than Rohingya." },
  { id:"rx_ew6", ch:20, stim:"<b>The idea:</b> The hardest questions go to the character least able to answer them.<br><b>The evidence:</b> 'Why it is illegal to want to live.'",
    q:"What makes that line the proof?",
    opts:["It is the shortest sentence there, and short sentences carry the most weight",
          "It is punctuated as a statement: she has stopped expecting an answer",
          "It shows Jimmie is upset by what she cannot read for herself",
          "It repeats the word 'illegal' until it stops sounding lawful"],
    a:1, explain:"Punctuation is evidence. A full stop where a question mark belongs is a choice, and you can quote it.",
    line:"Why it is illegal to want to live." }
 ]
};

he camp's perimeter is its fence line.","parts":[["peri-","around"],["meter","measure"]],"tr":{"zh":"周界","yue":"周界","vi":"chu vi; vành đai","ar":"المحيط الخارجي","fa":"محیط بیرونی"}},{"w":"Provisions","pos":"noun","m":"Supplies of food and equipment given out for daily living — in the camp, provisions come from the Jackets.","parts":[["pro-","ahead, forward"],["vis","to see"],["-ions","things that are (plural)"]],"tr":{"zh":"供给品","yue":"供給品","vi":"đồ tiếp tế","ar":"مؤن","fa":"آذوقه"}},{"w":"Barbed","pos":"adjective","m":"Covered in sharp hooks or spikes — like the barbed wire on the camp's fences.","parts":[["barb","a hook, a spike"],["-ed","having, covered with"]],"tr":{"zh":"有倒刺的","yue":"有倒刺嘅","vi":"có gai (dây thép gai)","ar":"شائك","fa":"خاردار"}},{"w":"Necklace","pos":"noun","m":"Jewellery worn around the neck — Jimmie's mother left her the bone sparrow necklace.","parts":[["neck","neck"],["lace","cord, tie"]],"tr":{"zh":"项链","yue":"頸鏈","vi":"vòng cổ","ar":"قلادة","fa":"گردنبند"}},{"w":"Funeral","pos":"noun","m":"The ceremony held after someone dies. After her mum's funeral, Jimmie's house went quiet.","tr":{"zh":"葬礼","yue":"葬禮","vi":"đám tang","ar":"جنازة","fa":"مراسم خاکسپاری"}},{"w":"Doona","pos":"noun","m":"An Australian word for a quilt or duvet — Jimmie hides under the yellow doona her mum gave her.","tr":{"zh":"羽绒被","yue":"羽絨被","vi":"chăn bông","ar":"لحاف","fa":"لحاف"}}]},{"set":"5","t":"Chapter 5 · Caught by Beaver","pre":5,"words":[{"w":"Nightmare","pos":"noun","m":"A frightening dream. When Subhi was little he had nightmares — and one kept coming back: Beaver.","parts":[["night","night"],["mare","an evil spirit"]],"tr":{"zh":"噩梦","yue":"惡夢","vi":"ác mộng","ar":"كابوس","fa":"کابوس"}},{"w":"Package","pos":"noun","m":"A wrapped bundle to be delivered. Subhi runs packages between people in the camp — until Beaver catches him with one.","parts":[["pack","to bundle, wrap"],["-age","a thing made or a collection"]],"tr":{"zh":"包裹","yue":"包裹","vi":"gói hàng","ar":"طرد","fa":"بسته"}},{"w":"Handcuffed","pos":"verb","m":"Locked at the wrists with metal rings. Beaver handcuffed Eli with his arms twisted behind his back.","parts":[["hand","hand"],["cuff","the band around a wrist"],["-ed","past tense"]],"tr":{"zh":"被戴上手铐","yue":"被扣上手銬","vi":"bị còng tay","ar":"مقيّد اليدين","fa":"دستبند زده شده"}},{"w":"Fouling","pos":"verb","m":"Making something dirty or sick. Fear is 'fouling' Subhi's stomach 'close to spewing'.","tr":{"zh":"使恶心；弄脏","yue":"使作嘔；整污糟","vi":"làm buồn nôn","ar":"يُفسد؛ يُقرف","fa":"به‌هم زدن (دل)"}},{"w":"Buzzing","pos":"verb","m":"Making a low continuous sound like bees — Subhi's brain is 'buzzing louder and louder' as panic rises.","tr":{"zh":"嗡嗡作响","yue":"嗡嗡響","vi":"kêu vo vo","ar":"طنين","fa":"وزوز کردن"}},{"w":"Storyteller","pos":"noun","m":"A person who tells stories. Maá's 'Listen Now' stories once filled the tent — and telling stories keeps people whole in this novel.","parts":[["story","a tale"],["tell","to speak, to count out"],["-er","a person who does"]],"tr":{"zh":"讲故事的人","yue":"講故事嘅人","vi":"người kể chuyện","ar":"راوي القصص","fa":"قصه‌گو"}}]},{"set":"6-7","t":"Chapters 6–7 · Outside looking in","pre":6,"words":[{"w":"Prejudice","pos":"noun","m":"Judging people before knowing them — an opinion formed in advance, usually unfair.","parts":[["pre-","before"],["jud","to judge"],["-ice","the state or quality of"]],"tr":{"zh":"偏见","yue":"偏見","vi":"định kiến","ar":"تحيّز","fa":"پیش‌داوری"}},{"w":"Resentment","pos":"noun","m":"Bitter feeling at being treated unfairly — or at others seeming to get more than you.","parts":[["re-","again, back"],["sent","to feel"],["-ment","the state or result of"]],"tr":{"zh":"怨恨","yue":"怨恨","vi":"sự oán giận","ar":"استياء","fa":"رنجش"}},{"w":"Isolated","pos":"adjective","m":"Cut off and far from everything else — like Jimmie's remote town, and like the camp placed beside it.","parts":[["isol","island"],["-ate","to make"],["-ed","having been"]],"tr":{"zh":"与世隔绝的","yue":"與世隔絕嘅","vi":"bị cô lập","ar":"معزول","fa":"دورافتاده"}},{"w":"Centre","pos":"noun","m":"The official name everyone uses for the detention camp — 'the Centre'.","tr":{"zh":"中心（拘留中心）","yue":"中心（拘留中心）","vi":"trung tâm (giam giữ)","ar":"المركز","fa":"مرکز (بازداشت)"}},{"w":"Illiterate","pos":"adjective","m":"Unable to read or write. Jimmie, ten years old and rarely at school, cannot read her mother's book.","parts":[["il-","not"],["liter","letters"],["-ate","having the quality of"]],"tr":{"zh":"不识字的","yue":"唔識字嘅","vi":"mù chữ","ar":"أميّ","fa":"بی‌سواد"}},{"w":"Annotation","pos":"noun","m":"A note added to a text to explain or respond to it — the exact skill you're practising as you read this novel.","parts":[["an-","to, towards"],["not","to mark"],["-ation","the process of"]],"tr":{"zh":"批注","yue":"批註","vi":"chú thích","ar":"تعليق توضيحي","fa":"حاشیه‌نویسی"}}]},{"set":"8-10","t":"Chapters 8–10 · Rats and promises","pre":8,"words":[{"w":"Alpha","pos":"noun","m":"The compound where the men live — where Eli is sent, away from Family.","tr":{"zh":"阿尔法（希腊首字母）","yue":"阿爾法（希臘首字母）","vi":"Alpha (chữ cái Hy Lạp đầu tiên)","ar":"ألفا","fa":"آلفا"}},{"w":"Delivery","pos":"noun","m":"The act of bringing something to someone — the boys' package-running 'delivery business', which the older boys take over.","parts":[["de-","away, from"],["liver","to set free, hand over"],["-y","the act of"]],"tr":{"zh":"递送","yue":"遞送","vi":"việc giao hàng","ar":"توصيل","fa":"تحویل"}},{"w":"Promise","pos":"noun","m":"Words that bind you to a future action. Subhi knows 'for sure' that Jimmie 'is the kind of person that keeps a promise'.","parts":[["pro-","forward"],["mise","sent"]],"tr":{"zh":"承诺","yue":"承諾","vi":"lời hứa","ar":"وعد","fa":"قول"}},{"w":"Symbol","pos":"noun","m":"An object that carries a bigger idea — Subhi notices Jimmie 'wearing a symbol of death around her neck'.","parts":[["sym-","together"],["bol","thrown"]],"tr":{"zh":"象征","yue":"象徵","vi":"biểu tượng","ar":"رمز","fa":"نماد"}},{"w":"Cyclone","pos":"noun","m":"A violent spinning storm — Jimmie's mum called her 'cyclone Jimmie' for the mess she leaves behind.","tr":{"zh":"旋风；气旋","yue":"旋風；氣旋","vi":"lốc xoáy","ar":"إعصار","fa":"گردباد"}},{"w":"Trapped","pos":"adjective","m":"Caught with no way out. The boys trap rats in cages — and Subhi sees the rats 'mostly don't do any harm'.","parts":[["trap","a device that catches"],["-ed","having been"]],"tr":{"zh":"被困的","yue":"被困嘅","vi":"bị mắc kẹt","ar":"محاصر","fa":"به‌دام‌افتاده"}}]},{"set":"11-14","t":"Chapters 11–14 · Anka's story","pre":11,"words":[{"w":"Ancestor","pos":"noun","m":"A family member from long ago. Anka, the girl in the book, is Jimmie's great-great-great-grandmother.","parts":[["an(te)-","before"],["cess","to go"],["-or","one who"]],"tr":{"zh":"祖先","yue":"祖先","vi":"tổ tiên","ar":"سلف؛ جدّ","fa":"نیا؛ جد"}},{"w":"Navigate","pos":"verb","m":"To find your way. Blind Anka learns to navigate by clicking her tongue and listening for the echo.","parts":[["nav","ship"],["ig","to drive"],["-ate","to make, to do"]],"tr":{"zh":"导航；找路","yue":"導航；搵路","vi":"tìm đường","ar":"يهتدي إلى الطريق","fa":"مسیریابی کردن"}},{"w":"Echo","pos":"noun","m":"A sound that bounces back. Anka listens for echoes; readers listen for them too — moments that repeat with new meaning.","tr":{"zh":"回声","yue":"回聲","vi":"tiếng vọng","ar":"صدى","fa":"پژواک"}},{"w":"Thermos","pos":"noun","m":"A flask that keeps drinks hot — Jimmie brings one full of hot chocolate, and Subhi tastes it like 'nothing he has ever tasted'.","tr":{"zh":"保温瓶","yue":"保溫壺","vi":"bình giữ nhiệt","ar":"ترمس","fa":"فلاسک"}},{"w":"Inspection","pos":"noun","m":"An official visit to examine a place. When government inspectors come, the camp suddenly serves proper food.","parts":[["in-","into"],["spect","to look"],["-ion","the process of"]],"tr":{"zh":"视察","yue":"視察","vi":"cuộc thanh tra","ar":"تفتيش","fa":"بازرسی"}},{"w":"Generation","pos":"noun","m":"All the family members born around the same time — Anka's story t ke is a protest against the men's transfer and treatment.","parts":[["pro-","forth, in public"],["test","to witness, declare"]],"tr":{"zh":"抗议","yue":"抗議","vi":"cuộc biểu tình phản đối","ar":"احتجاج","fa":"اعتراض"}},{"w":"Transferred","pos":"verb","m":"Moved from one place to another by someone else's decision — the men of Alpha are to be transferred to another country.","parts":[["trans-","across"],["fer","to carry"],["-red","past tense"]],"tr":{"zh":"被转移","yue":"被轉移","vi":"bị chuyển đi","ar":"مُرحَّل؛ منقول","fa":"منتقل‌شده"}},{"w":"Banner","pos":"noun","m":"A large cloth with a message. The men make a banner from a bedsheet for Queeny to photograph.","tr":{"zh":"横幅","yue":"橫額","vi":"biểu ngữ","ar":"لافتة","fa":"پرچم/پارچه‌نوشته"}},{"w":"Newspaper","pos":"noun","m":"A printed publication of news. Jimmie sees the photo of the sewn lips in the paper — over her dad's breakfast.","parts":[["news","new things told"],["paper","paper (from papyrus)"]],"tr":{"zh":"报纸","yue":"報紙","vi":"tờ báo","ar":"صحيفة","fa":"روزنامه"}},{"w":"Contagious","pos":"adjective","m":"Spreading from person to person by contact — like the food poisoning that sweeps the camp, and like despair itself.","parts":[["con-","together, with"],["tag","to touch"],["-ious","full of, characterised by"]],"tr":{"zh":"传染性的","yue":"傳染性嘅","vi":"dễ lây lan","ar":"مُعدٍ","fa":"واگیردار"}},{"w":"Bystander","pos":"noun","m":"A person who watches something happen without acting — from your unit vocabulary, now standing at a breakfast table.","parts":[["by","near, beside"],["stand","to be in place"],["-er","a person who"]],"tr":{"zh":"旁观者","yue":"旁觀者","vi":"người ngoài cuộc","ar":"متفرج","fa":"تماشاگر بی‌عمل"}}]},{"set":"21-end","t":"Chapters 21–end · The whole sky","pre":21,"words":[{"w":"Courage","pos":"noun","m":"The strength to act despite fear — what Subhi calls 'a sort of brave'.","parts":[["cour","heart"],["-age","the state or quality of"]],"tr":{"zh":"勇气","yue":"勇氣","vi":"lòng can đảm","ar":"شجاعة","fa":"شجاعت"}},{"w":"Witness","pos":"noun","m":"A person who sees something and can tell others the truth of it. By the end, Subhi understands his job is to witness.","parts":[["wit","knowledge, knowing"],["-ness","the state of being"]],"tr":{"zh":"见证人","yue":"見證人","vi":"nhân chứng","ar":"شاهد","fa":"شاهد"}},{"w":"Survivor","pos":"noun","m":"A person who lives on through and beyond something terrible.","parts":[["sur-","over, beyond"],["viv","to live"],["-or","one who"]],"tr":{"zh":"幸存者","yue":"倖存者","vi":"người sống sót","ar":"ناجٍ","fa":"بازمانده"}},{"w":"Freedom","pos":"noun","m":"The state of not being controlled or held — what the birds have, on the far side of the fence diamonds.","parts":[["free","not held, beloved"],["-dom","the state or realm of"]],"tr":{"zh":"自由","yue":"自由","vi":"tự do","ar":"حرية","fa":"آزادی"}},{"w":"Memorial","pos":"noun","m":"Something made to keep a person or event remembered — a place, an object, or a story that refuses to forget.","parts":[["memor","mindful, remembering"],["-ial","relating to, serving for"]],"tr":{"zh":"纪念物","yue":"紀念物","vi":"đài/vật tưởng niệm","ar":"نصب تذكاري","fa":"یادبود"}},{"w":"Hope","pos":"noun","m":"The feeling that something better is possible — the hardest and most necessary thing in the whole novel.","tr":{"zh":"希望","yue":"希望","vi":"hy vọng","ar":"أمل","fa":"امید"}}]}];

const KEY="bonesparrow.readinghub.v2";
/* Shared profile written by the front door (index.html) so a student signs in
   once for the whole suite. Identity, chapter and EAL live there; the scores
   stay in this hub's own key. Adopted on boot, written back on change. */
const PKEY="bonesparrow.profile.v1";
function readProfile(){ try{ const p=JSON.parse(localStorage.getItem(PKEY)); return (p&&p.sid)?p:null; }catch(e){ return null; } }
function writeProfile(){ try{
  const p=readProfile()||{};
  localStorage.setItem(PKEY, JSON.stringify(Object.assign(p,{v:1,fname:S.fname,lname:S.lname,sid:S.sid,chapter:S.chapter,eal:S.eal})));
}catch(e){} }
function blank(){ return {first:{}, done:{}, evLv:0, fname:"", lname:"", sid:"", chapter:5, eal:false, kept:[], startedAt:Date.now(), finishedAt:0}; }
let S=blank();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); if(p&&typeof p==="object") S=Object.assign(blank(),p);} }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function resetAll(){ if(confirm("Start again from scratch? This wipes all your saved answers.")){ S=blank(); save(); go("home"); } }
load();

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function recFirst(key, correct){ if(S.first[key]===undefined){ S.first[key]=!!correct; save(); } }

let screen="home";
function idOk(){ const sid=(S.sid||"").trim(); return (S.fname||"").trim() && (S.lname||"").trim() && sid.length>=4 && sid.length<=8; }
(function adoptProfile(){
  const p=readProfile(); if(!p) return;
  S.fname=p.fname||S.fname; S.lname=p.lname||S.lname; S.sid=p.sid||S.sid;
  if(typeof p.chapter==="number") S.chapter=p.chapter;
  if(typeof p.eal==="boolean") S.eal=p.eal;
  save();
})();
function go(s, arg){
  if(!idOk() && s!=="id") s="id";
  screen=s;
  /* The workshop is a workbench, not a reading page: rubric table, passage,
     canvas and six banks all want width. Every other screen keeps the narrow
     reading column. */
  document.body.classList.toggle("wide", s==="wk" || s==="teach");
  $("homeBtn").style.display = (s==="home"||s==="id"||s==="teach") ? "none" : "inline";
  const tb=$("teachBtn"); if(tb) tb.style.display = (s==="teach"||s==="id") ? "none" : "inline";
  window.scrollTo({top:0,behavior:"smooth"});
  if(s==="id") renderIdentity();
  else if(s==="home") renderHome();
  else if(s==="qr") renderQrIntro(arg);
  else if(s==="fig") runFig();
  else if(s==="voice") runVoice();
  else if(s==="ev") renderEv(0);
  else if(s==="wk") runWk();
  else if(s==="teach") runTeach();
  else if(s==="rpt"){ location.href="index.html#report"; return; }
  else if(s==="wagoll"){ location.href="BoneSparrowWagollWall.html"; return; }
  document.body.classList.toggle("wide", s==="wk");
  lastArg=arg;
  if(idOk()) glossMount();
}
/* Strategic hub pointers. The suite deploys side by side (class folder or
   GitHub Pages), so a relative link works everywhere. */
function hubRef(file, label, instr){
  return `<a href="${file}">${esc(label)}</a> — ${esc(instr)}`;
}
function availItems(list){ return list.filter(it=>(it.ch||1)<=(S.chapter||1)); }

/* ---------- scoring helpers ---------- */
function keysFor(mod){
  return Object.keys(S.first).filter(k=>k.split(".")[0]===mod);
}
function scoreFor(mod){
  const ks=keysFor(mod); const got=ks.filter(k=>S.first[k]).length;
  return {got, total:ks.length};
}
/* Which band a first-attempt score falls in. Nothing is a pass or a fail here:
   the bands say "that held up", "worth a look", "go again", and the report's
   wording does the rest. */
function scoreBand(got,total){
  if(!total) return "";
  const pct=got/total;
  return pct>=0.85 ? "band4" : pct>=0.7 ? "band3" : pct>=0.5 ? "band2" : "band1";
}

let PENDING_HASH=null;
function idSubmit(){
  const f=$("idf").value.trim(), l=$("idl").value.trim(), sid=$("ids").value.trim();
  $("ef").textContent = f? "" : "First name needed.";
  $("el").textContent = l? "" : "Last name needed.";

/* ---------- HOME ---------- */
function moduleAvail(m){
  if(m.id==="fig") return availItems(FIG_ITEMS).length;
  if(m.id==="voice") return availItems(VOICE_ITEMS).length;
  return null;
}
function renderHome(){
  const doneCount=MODULES.filter(m=>S.done[m.id]).length;
  let h=`<h1>The Bone Sparrow — Reading &amp; Evidence Hub</h1>
  <p class="sub">${esc(S.fname)} ${esc(S.lname)}
  Wrong answers get retried until you master them, but <b>your first attempt at each question is what goes on your report</b>.</p>`;
  h+=`<div class="homectl noprint">
    <span><label for="chSel">Where are you up to?&nbsp;</label>
    <select id="chSel" onchange="S.chapter=+this.value;save();writeProfile();renderHome()">`;
  for(let c=1;c<=20;c++) h+=`<option value="${c}" ${S.chapter===c?"selected":""}>I've read to the end of chapter ${c}</option>`;
  h+=`<option value="99" ${S.chapter>20?"selected":""}>I've finished the novel</option></select></span>
    <button class="switch ${S.eal?"on":""}" onclick="S.eal=!S.eal;save();writeProfile();renderHome()" aria-pressed="${S.eal}">
      <span class="track"></span>EAL support ${S.eal?"on":"off"}</button>
    <span class="gatednote"></span>
  </div>`;
  MODULES.forEach(m=>{
    const done=!!S.done[m.id];
    const readLocked = m.ch && m.ch>S.chapter;
    const needLocked = m.needs ? !S.done[m.needs] : false;
    const locked = readLocked||needLocked;
    const sc=scoreFor(m.id);
    const avail=moduleAvail(m);
    const fullN = m.id==="fig"?FIG_ITEMS.length : m.id==="voice"?VOICE_ITEMS.length : null;
    const band = done && sc.total ? scoreBand(sc.got, sc.total) : "";
    let tag = readLocked ? `read to chapter ${m.ch} first`
            : needLocked ? "finish "+((MODULES.find(x=>x.id===m.needs)||{}).t||"the earlier activity").toLowerCase()+" first"
            : done ? (sc.total? `${sc.got}/${sc.total} first try` : "done")
            : (m.id==="rpt" ? "always available" : (sc.total? "in progress" : (avail!==null&&avail<fullN ? `${avail} of ${fullN} lines at your chapter` : "")));
    h+=`<button class="step ${done?"done":""}" ${locked?"disabled":""} onclick="go('${m.kind}','${m.id}')">
      <span class="num">${done?"✓":m.n}</span>
      <span><span class="t">${esc(m.t)}</span><br><span class="d">${esc(m.d)}</span></span>
      <span class="tag ${band}">${esc(tag)}</span></button>`;
  });
  h+=`<div class="btnrow noprint"><button class="linkbtn" onclick="go('id')">edit my details</button>
  <button class="linkbtn" onclick="resetAll()">reset everything</button></div>`;
  $("body").innerHTML=h;
}

/* the step buttons call go(kind, id); map kinds that share a runner */
const _go=go;

/* ---------- GENERIC QUIZ RUNNER (mcq, multi-step items) ----------
   cfg: {mod, title, where, items:[{id, stim?, steps:[{key,q,opts,a,explain,requote?}]}], onDone}
   Mastery loop: any missed step re-queues the whole item; first attempts recorded once. */
function runQuizzer(cfg){
  let queue=cfg.items.slice(), idx=0, stepIdx=0, round=1;
  const missed=[];
  /* Redundancy: a miss never hands back the same question. We draw a parallel
     item — same skill, same chapter, different material — and keep drawing a
     new one each time it is missed again. Parallel items are never scored;
     the report still shows first attempts on the real set. */
  const usedRx=new Set();
  function drawParallel(skill){
    const pool=(REDUNDANCY[skill]||[]).filter(x=>(x.ch||1)<=(S.chapter||1) && !usedRx.has(x.id));
    if(!pool.length) return null;
    /* stay on the passage they are working on where we can */
    const near = cfg.preferCh ? pool.filter(x=>x.ch===cfg.preferCh) : [];
    const from = near.length ? near : pool;
    const x=from[Math.floor(Math.random()*from.length)];
    usedRx.add(x.id);
    const opts = x.opts || (skill==="voicewho" ? VOICE_WHO : null);
    if(!opts) return null;
    return { id:x.id, stim:x.stim, page:x.page, redundant:true,
      steps:[{ key:"a", q:x.q, opts:opts, a:x.a, explain:x.explain, requote:x.line,
               chips:skill==="voicewho", noShuffle:skill==="voicewho", skill:skill }] };
  }
  function draw(){
    const item=queue[idx], step=item.steps[stepIdx];
    const total=cfg.items.reduce((n,it)=>n+it.steps.length,0);
    const answered=Object.keys(S.first).filter(k=>k.startsWith(cfg.mod+".")).length;
    let h=`<div class="eyebrow">${esc(cfg.where)}</div><h2>${esc(cfg.title)}</h2>`;
    if(cfg.subnote) h+=`<p class="lead">${esc(cfg.subnote)}</p>`;
    h+=`<div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,answered/total*100)}%"></div></div>`;
    if(item.redundant) h+=`<p class="lead"><b>New question, same skill.</b> Not scored.</p>`;
    else if(round>1) h+=`<p class="lead">Mastery round ${round} — the questions you missed, replaced with new ones on the same skill. (Your first attempts are already saved.)</p>`;
    if(item.stim) h+=`<div class="stim">${item.stim}${item.page?`<span class="pg">(${esc(item.page)})</span>`:""}</div>`;
    h+=`<p class="q">${esc(step.q)}</p><div class="opts ${step.chips?"chips":""}" id="opts"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <button class="btn btn-primary" id="nextBtn" style="display:none"></button>`;
    $("body").innerHTML=h;
    const order = step.noShuffle ? step.opts.map((_,i)=>i) : shuffle(step.opts.map((_,i)=>i));
    order.forEach(oi=>{
      const b=document.createElement("button");
      b.className="opt"; b.innerHTML=esc(step.opts[oi]);
      b.onclick=()=>grade(oi,b);
      $("opts").appendChild(b);
    });
  }
  function grade(oi,btn){
    const item=queue[idx], step=item.steps[stepIdx];
    const correct = oi===step.a;
    document.querySelectorAll("#opts .opt").forEach((b,k)=>{ b.disabled=true; });
    [...document.querySelectorAll("#opts .opt")].forEach(b=>{
      if(b.textContent===step.opts[step.a]) b.classList.add("right");
    });
    const near = !correct && step.near && step.near.includes(oi);
    if(!correct) btn.classList.add(near?"nearpick":"wrongpick");
    const key=cfg.mod+"."+item.id+"."+step.key;
    const firstTime = !item.redundant && S.first[key]===undefined;
    if(!item.redundant) recFirst(key, correct);
    if(!correct && firstTime) missed.push({item,label:cfg.missLabel(item,step)});
    const fb=$("fb");
    fb.className="feedback "+(correct?"ok":near?"warn":"bad");
    fb.innerHTML=(correct?"<b>Correct.</b> ":
      near?`<b>A fair pick — the stronger answer is “${esc(step.opts[step.a])}”.</b> `:
      `<b>Not quite — the answer is “${esc(step.opts[step.a])}”.</b> `)+step.explain
      +(!correct&&step.requote?`<div class="requote">“${esc(step.requote)}”</div>`:"");
    if(!correct){ (item._missed=item._missed||[]).push(step); }
    const nb=$("nextBtn");
    nb.style.display="inline-block";
    nb.textContent = stepIdx<item.steps.length-1 ? "Next part →" : "Next →";
    nb.onclick=()=>{
      if(stepIdx<item.steps.length-1){ stepIdx++; draw(); return; }
      if(item._missed && item._missed.length){
        const again=item._missed.slice(); delete item._missed;
        again.forEach(st=>{
          const alt = drawParallel(st.skill);
          queue.push(alt || { id:item.id, stim:item.stim, page:item.page, redundant:true, steps:[st] });
        });
      }
      stepIdx=0; idx++;
      if(idx>=queue.length){ finish(); } else {
        if(idx>=cfg.items.length && queue[idx]) round= Math.max(round, 2);
        draw();
      }
    };
  }
  function finish(){
    S.done[cfg.mod]=true; save();
    const sc=scoreFor(cfg.mod);
    const pct=sc.total? sc.got/sc.total : 0;
    const band = pct>=0.8 ? "Strong reading. Every miss got retaught and retried — check the report to see your first-try picture."
      : pct>=0.6 ? "A good start — here's how to lift it: reread the lines quoted in the feedback you got, then tell someone WHY the right answer was right."
      : "Worth a slower second pass. Reread the passage in your own copy of the novel, then come back — the reteach lines in the feedback are your map."
        + (cfg.lowNote? " "+cfg.lowNote : "");
    $("body").innerHTML=`<h2>${esc(cfg.title)} — done</h2>
    <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} on first attempt.</b> ${band}</p></div>
    ${cfg.doneNote?`<div class="panel" style="background:var(--bg)"><p class="lead" style="margin:0">${cfg.doneNote}</p></div>`:""}
    <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  }
  draw();
}

/* ---------- QUICKREADS ---------- */
function renderQrIntro(id){
  const qr=QUICKREADS.find(q=>q.id===id);
  $("body").innerHTML=`<div class="eyebrow">${esc(qr.where)} · cold-excerpt inference check</div>
  <h2>${esc(qr.title)}</h2>
  <p class="lead">${esc(qr.intro)}</p>
  <div class="passage">${glossify(qr.passage)}<span class="pg">${esc(qr.where)} — The Bone Sparrow, Zana Fraillon</span></div>
  <div class="btnrow"><button class="btn btn-primary" onclick="startQr('${qr.id}')">I've finished reading — start the questions</button></div>`;

/* The vocab set to send a struggling reader to. Quickreads 3-8 carry their own
   in the data; the first two predate the field. */
const QR_VOCAB={qr1:"1-2",qr2:"5"};
function qrVocabSet(qr){ return qr.vocabSet || QR_VOCAB[qr.id] || "1-2"; }

/* Phase 2 of a quickread: connect evidence to an idea. Two steps, both scored.
   Step 1 asks which line proves the idea, step 2 asks what makes it the proof,
   because picking the right quote and knowing why it works are separate skills
   and students routinely have the first without the second. */
function linkItems(qr){
  return (qr.links||[]).map(l=>({
    id:l.id,
    stim:`<b>The idea:</b> ${esc(l.idea)}`,
    steps:[
      { key:"pick", skill:"evpick", q:"Which line is the best evidence for that idea?",
        opts:l.opts, a:l.a, near:l.near, explain:l.explain },
      { key:"why", skill:"evwhy", q:"Now the harder half: what makes that line the proof?",
        opts:l.why.opts, a:l.why.a, explain:l.why.explain }
    ]
  }));
}
function startQr(id){
  const qr=QUICKREADS.find(q=>q.id===id);
  const later=MODULES.filter(m=>m.kind==="qr"&&m.id>id)[0];
  runQuizzer({
    mod:qr.id, title:qr.title+" — questions (no looking back)", where:qr.where, preferCh:qr.ch,
    lowNote: "If word meanings tripped you, do exactly this: open "+hubRef("BoneSparrowVocabHub.html","Vocab Hub → CH "+qrVocabSet(qr),"run 'Meet the words' and 'Build the words' for this chapter set, then come back and retry."),
    items:qr.items.map(it=>({ id:it.id, stim:it.stim, steps:[{key:"a", skill:"infer", q:it.q, opts:it.opts, a:it.a, near:it.near, explain:it.explain, requote:it.line}] }))
      .concat(linkItems(qr)),
    missLabel:(item,step)=>item.id,
    doneNote: id==="qr9" ? `<button class="btn btn-primary" onclick="renderQr9Build()">Now build the sentence →</button>` :
      id==="qr1" ? "Next quickread: Chapter 5, the moment Beaver catches Subhi." :
      id==="qr2" ? "If the figurative lines here interested you, the next activity digs into exactly how they work." :
      (qr.links&&qr.links.length ? ""+(later?"Next: "+later.t.replace(/^Quickread: /,"the ")+", at chapter "+later.ch+".":"You have finished every quickread in the hub.")
        : "")
  });
}

/* Quickread 9 ends in assembly: the parts the questions just established,
   as tiles, put in order. Two tiles per part, so more than one sentence is
   right. */
const QB_TILES=[
  {k:"ev",  t:"'not a single one helps'"},
  {k:"ev",  t:"'instead of talking to us by our numbers'"},
  {k:"verb",t:"reveals"},
  {k:"verb",t:"shows"},
  {k:"idea",t:"how much power the Jackets have"},
  {k:"idea",t:"how the camp turns people into numbers"},
  {k:"join",t:", which"},
  {k:"eff", t:"makes the reader understand why Harvey matters here"},
  {k:"eff", t:"makes the reader see how unusual Harvey's kindness is"},
  {k:"end", t:"."}
];
const QB_ORDER=["ev","verb","idea","join","eff","end"];
const QB_RULE={ev:"A sentence built from evidence opens on the quote.",
  verb:"The quote needs its verb next: what does the line do?",
  idea:"After the verb comes the idea the line proves.",
  join:"Tie the effect to the line — one sentence, not two.",
  eff:"End on the reader: what does it do to them?",
  end:"One full stop finishes it."};
let QB=null;
function renderQr9Build(){
  QB={strip:[], used:new Set()};
  drawQb();
}
function drawQb(){
  const kindCls={ev:"hl-ev",verb:"hl-verb",idea:"hl-idea",eff:"hl-eff",join:"",end:""};
  let h=`<div class="eyebrow">Chapter 2 · quickread 9</div><h2>Build the sentence</h2>
  <p class="lead">Tap the tiles into order. Tap a placed tile to take it back.</p>
  <div class="passage" style="min-height:64px" id="qbStrip">`;
  QB.strip.forEach((ti,i)=>{
    const T=QB_TILES[ti];
    h+=`<button class="opt qbT ${kindCls[T.k]}" style="display:inline-block;width:auto;margin:3px 4px;padding:6px 10px" onclick="qbTake(${i})">${esc(T.t)}</button>`;
  });
  h+=`</div><div class="opts" style="margin-top:14px" id="qbBank">`;
  QB_TILES.forEach((T,i)=>{
    if(QB.used.has(i)) return;
    h+=`<button class="opt qbT ${kindCls[T.k]}" style="display:inline-block;width:auto;margin:3px 4px" onclick="qbPut(${i})">${esc(T.t)}</button>`;
  });
  h+=`</div><div class="feedback" id="qbFb" aria-live="polite"></div>
  <div class="btnrow"><button class="btn btn-primary" onclick="qbCheck()">Check</button>
  <button class="btn btn-ghost" onclick="renderQr9Build()">Clear</button></div>`;
  $("body").innerHTML=h;
}
function qbPut(i){ QB.strip.push(i); QB.used.add(i); drawQb(); }
function qbTake(pos){ QB.used.delete(QB.strip[pos]); QB.strip.splice(pos,1); drawQb(); }
function qbCheck(){
  const fb=$("qbFb");
  const kinds=QB.strip.map(i=>QB_TILES[i].k);
  for(let p=0;p<QB_ORDER.length;p++){
    if(kinds[p]!==QB_ORDER[p]){
      fb.className="feedback bad";
      fb.innerHTML="<b>Not yet.</b> "+esc(QB_RULE[QB_ORDER[p]]);
      return;
    }
  }
  if(kinds.length>QB_ORDER.length){
    fb.className="feedback bad";
    fb.innerHTML="<b>Almost — too many pieces.</b> Six tiles make the sentence; the spares stay in the bank.";
    return;
  }
  const T=QB.strip.map(i=>QB_TILES[i]);
  const kindCls={ev:"hl-ev",verb:"hl-verb",idea:"hl-idea",eff:"hl-eff"};
  const sent=T.map(x=>kindCls[x.k]?`<em class="${kindCls[x.k]}">${esc(x.t)}</em>`:esc(x.t))
    .join(" ").replace(/ ,/g,",").replace(/ \./g,".");
  $("body").innerHTML=`<div class="eyebrow">Chapter 2 · quickread 9</div><h2>Your sentence</h2>
  <div class="passage" style="font-size:19px;line-height:2">${sent}</div>
  <p class="lead">Write it in your book, then lift it: swap one tile for the spare of the same colour and decide which sentence is stronger.</p>
  <div class="btnrow"><button class="btn btn-primary" onclick="renderQr9Build()">Build the other one</button>
  <button class="btn btn-ghost" onclick="go('home')">Back to the hub →</button></div>`;
}

/* ---------- FIGURATIVE ---------- */

  const pool=availItems(FIG_ITEMS), hidden=FIG_ITEMS.length-pool.length;
  runQuizzer({
    mod:"fig", title:"Figurative → literal", where:"Lesson 09 · figurative language",
    subnote: hidden? `${hidden} more line${hidden>1?"s are":" is"} waiting further into the novel — update your chapter on the home screen as you read.`:"",
    items:pool.map(it=>({ id:it.id, stim:"“"+glossify(esc(it.quote))+"”", page:it.page, steps:[
      { key:"meaning", skill:"figmeaning", q:"What does this literally mean?", opts:it.meaning.opts, a:it.meaning.a, explain:it.meaning.explain },
      { key:"tech", skill:"figtech", q:"Which feature is doing the work?", opts:it.tech.opts.map(i=>FIG_TECHS[i]), a:it.tech.a, explain:it.tech.explain }
    ]})),
    missLabel:(item,step)=>item.id,
    doneNote:"Next: the Evidence builder."
  });
}

/* ---------- EVIDENCE BUILDER ---------- */
let EV = null; /* transient per-round state */
function evRounds(){ return EV_ROUNDS.filter(r=>(r.ch||1)<=(S.chapter||1)); }
function renderEv(roundIdx){
  const round=evRounds()[roundIdx];
  if(!round){ evFinish(); return; }
  EV={ roundIdx, round, level:1, idea:null, picked:new Set(), checked:false, slots:{stem:null,frag:null,tail:null}, builderChecked:false };
  if(round.mode==="idea") renderEvIdea();
  else renderEvSelect();
}
function evLadderHtml(active){
  const gotLv = S.evLv||0;
  let h=`<div class="ladder">`;
  EV_LADDER.forEach((L,i)=>{
    const st = (i+1)<=gotLv ? "got" : (i+1)===active ? "now" : (i+1)>active ? "below":"";
