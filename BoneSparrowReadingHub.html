    h+=`<button class="lcard ${st}" onclick="evHint(${i},${active})"><span class="lv">${esc(L.lv)} ${(i+1)<=gotLv?"✓":""}</span>${esc(L.text)}</button>`;
  });
  h+=`</div><div class="ladder-hint" id="ladderHint"></div>`;
  return h;
}
function evHint(i,active){
  const box=$("ladderHint"); if(!box) return;
  if((i+1)>active && (i+1)>(S.evLv||0)){ box.className="ladder-hint show"; box.innerHTML="<b>Locked.</b> Finish the level you're on and this one opens — with its sentence stems."; return; }
  box.className="ladder-hint show";
  box.innerHTML="<b>"+esc(EV_LADDER[i].lv)+" scaffold:</b> "+esc(EV_LADDER[i].hint);
}
function renderEvIdea(){
  const r=EV.round;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(1);
  h+=`<p class="lead">${esc(r.question)}</p><div class="idea-chips">`;
  r.ideas.forEach(idea=>{ h+=`<button class="fchoice" onclick="evPickIdea('${idea.id}')">${esc(idea.label)}</button>`; });
  h+=`</div><p class="lead">Pick the idea you want to prove.</p>`;
  $("body").innerHTML=h;
}
function evPickIdea(id){ EV.idea=id; EV.picked=new Set(); EV.locked=false; renderEvSelect(); }
function renderEvSelect(){
  const r=EV.round;
  const ideaLabel = EV.idea ? r.ideas.find(i=>i.id===EV.idea).label : null;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 1</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(1);
  h+=`<p class="q">${esc(r.mode==="idea" ? "Find the evidence for: "+ideaLabel : r.question)}</p>
  <p class="lead">${esc(r.qNote)}</p><div class="passage" id="pass">`;
  r.segs.forEach((seg,i)=>{ h+=`<span class="seg" id="seg${i}" onclick="evToggle(${i})">${esc(seg.t)}</span> `; });
  h+=`<span class="pg">${esc(r.where)} — The Bone Sparrow, Zana Fraillon</span></div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow"><button class="btn btn-primary" id="chk" onclick="evCheck()">Check my evidence</button>
  ${r.mode==="idea"?`<button class="btn btn-ghost" onclick="renderEvIdea()">← different idea</button>`:""}</div>`;
  $("body").innerHTML=h;
}
function evToggle(i){
  if(EV.locked) return;
  const el=$("seg"+i);
  el.classList.remove("hit","miss");
  if(EV.picked.has(i)){ EV.picked.delete(i); el.classList.remove("picked"); }
  else { EV.picked.add(i); el.classList.add("picked"); }
  $("fb").className="feedback";
}
function segRole(seg){ return EV.round.mode==="idea" ? (seg.roles[EV.idea]||"plain") : seg.role; }
function segFb(seg){ return EV.round.mode==="idea" ? (seg.fbs[EV.idea]||"") : seg.fb; }
function evCheck(){
  const r=EV.round, fb=$("fb");
  if(EV.picked.size===0){ fb.className="feedback bad"; fb.innerHTML="<b>Nothing selected.</b> Click the part of the passage that answers the question, then check."; return; }
  const picked=[...EV.picked].map(i=>({i,seg:r.segs[i],role:segRole(r.segs[i])}));
  const gold=picked.filter(p=>p.role==="gold"), okp=picked.filter(p=>p.role==="ok");
  const bad=picked.filter(p=>["other","plain","frame"].includes(p.role));
  picked.forEach(p=>{
    const el=$("seg"+p.i); el.classList.remove("picked");
    el.classList.add(p.role==="gold"||p.role==="ok" ? "hit" : "miss");
  });
  const findings=[];
  gold.forEach(p=>findings.push({sev:"ok", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  okp.forEach(p=>findings.push({sev:"warn", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  bad.forEach(p=>findings.push({sev:"warn", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  const pass = gold.length>=1 && bad.length===0;
  if(!EV.checked){ recFirst("ev."+r.id+".l1", pass); EV.checked=true; }
  let head, cls;
  if(pass){ head="Strong evidence selected."; cls="ok"; }
  else if(gold.length>=1){ head="A good start — here's how to lift it: your strongest pick is right, but deselect the ones that don't belong."; cls="warn"; }
  else if(okp.length>=1){ head="Close — that supports the answer, but there's a stronger line. Deselect and look again."; cls="warn"; }
  else { head="Something needs fixing — none of these picks answer the question yet."; cls="bad"; }
  fb.className="feedback "+cls;
  fb.innerHTML="<b>"+esc(head)+"</b><ul>"+findings.map(f=>"<li>"+esc(f.text)+"</li>").join("")+"</ul>";
  if(pass){
    EV.locked=true;
    S.evLv=Math.max(S.evLv||0,1); save();
    fb.innerHTML+=`<div style="margin-top:8px"><b>Level 1 achieved:</b> ${esc(EV_LADDER[0].text)}.</div>`;
    document.querySelector(".btnrow").innerHTML=`<button class="btn btn-primary" onclick="renderEvL2()">Level 2: explain the relevance →</button>`;
  } else {
    picked.filter(p=>p.role!=="gold"&&p.role!=="ok").forEach(p=>{ EV.picked.delete(p.i); });
  }
}
function renderEvL2(){
  const r=EV.round;
  const l2 = r.mode==="idea" ? r.l2s[EV.idea] : r.l2;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 2</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(2);
  h+=`<p class="q">${esc(l2.q)}</p><div class="opts" id="opts"></div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="brow"></div>`;
  $("body").innerHTML=h;
  let first=true;
  shuffle(l2.opts.map((_,i)=>i)).forEach(oi=>{
    const o=l2.opts[oi];
    const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    b.onclick=()=>{
      const good=o.q==="good";
      if(first){ recFirst("ev."+r.id+".l2", good); first=false; }
      const fb=$("fb");
      if(good){
        document.querySelectorAll("#opts .opt").forEach(x=>x.disabled=true);
        b.classList.add("right");
        fb.className="feedback ok"; fb.innerHTML="<b>Correct.</b> "+esc(o.fb);
        S.evLv=Math.max(S.evLv,2); save();
        fb.innerHTML+=`<div style="margin-top:8px"><b>Level 2 achieved:</b> ${esc(EV_LADDER[1].text)}.</div>`;
        $("brow").innerHTML=`<button class="btn btn-primary" onclick="renderEvBuilder()">Level 3: embed the quote →</button>`;
      } else {
        b.disabled=true; b.classList.add("wrongpick");
        fb.className="feedback bad"; fb.innerHTML="<b>Not this one.</b> "+esc(o.fb);
      }
    };
    $("opts").appendChild(b);
  });
}
function renderEvBuilder(){
  const r=EV.round;
  const B = r.mode==="idea" ? r.builders[EV.idea] : r.builder;
  EV.slots={stem:null,frag:null,tail:null};
  EV.builderChecked=false;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 3</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(3);
  h+=`<p class="lead">${esc(B.intro)}  Colours are the parts: <b style="color:var(--stem-tx)">blue = stem</b>, <b style="color:var(--quote-tx)">yellow = quote</b>, <b style="color:var(--tail-tx)">pink = ending</b>.</p>
  <div class="slotrow">
    <div class="slot" id="slot-stem"><span class="slabel">Stem</span><span id="in-stem"></span></div>
    <div class="slot" id="slot-frag"><span class="slabel">Quote</span><span id="in-frag"></span></div>
    <div class="slot" id="slot-tail"><span class="slabel">Ending</span><span id="in-tail"></span></div>
  </div>
  <div class="preview" id="prev"></div>
  <div class="bins">
    <div class="bin stems"><h4>Sentence stems</h4><div class="binbody" id="bin-stem"></div></div>
    <div class="bin quotes"><h4>Trimmed quotes</h4><div class="binbody" id="bin-frag"></div></div>
    <div class="bin tails"><h4>Endings</h4><div class="binbody" id="bin-tail"></div></div>
  </div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="brow"><button class="btn btn-primary" onclick="evBuildCheck()">Check my sentence</button>
  <button class="btn btn-ghost" onclick="renderEvBuilder()">Reset</button></div>`;
  $("body").innerHTML=h;
  const fill=(kind,list)=>{
    const bin=$("bin-"+kind);
    shuffle(list).forEach(x=>{
      const b=document.createElement("button"); b.className="tile k-"+(kind==="stem"?"stem":kind==="frag"?"quote":"tail");
      b.textContent=x.t; b.onclick=()=>{ EV.slots[kind]=x; drawSlots(B); };
      bin.appendChild(b);
    });
  };
  fill("stem",B.stems); fill("frag",B.frags); fill("tail",B.tails);
  drawSlots(B);
}
function drawSlots(B){
  ["stem","frag","tail"].forEach(kind=>{
    const holder=$("in-"+kind); holder.innerHTML="";
    const x=EV.slots[kind];
    if(x){ const b=document.createElement("button");
      b.className="placed k-"+(kind==="stem"?"stem":kind==="frag"?"quote":"tail");
      b.textContent=x.t; b.onclick=()=>{ EV.slots[kind]=null; drawSlots(B); };
      holder.appendChild(b); }
  });
  const {stem,frag,tail}=EV.slots;
  const prev=$("prev");
  if(stem||frag||tail){
    let s=(stem?stem.t:"…")+" "+(frag?"“"+frag.t+"”":"“…”")+(tail?tail.t:" …");
    prev.textContent=s;
  } else prev.innerHTML=`<span class="ph"></span>`;
  const fb=$("fb"); if(fb) fb.className="feedback";
}
function evBuildCheck(){
  const r=EV.round;
  const {stem,frag,tail}=EV.slots;
  const fb=$("fb");
  const findings=[];
  if(!stem||!frag||!tail){
    fb.className="feedback bad";
    fb.innerHTML="<b>Something needs fixing.</b> The sentence needs all three parts — a stem, a trimmed quote, and an ending.";
    return;
  }
  if(stem.q==="point") findings.push({sev:"warn", text:stem.fb});
  if(frag.q==="long"||frag.q==="short") findings.push({sev:"warn", text:frag.fb});
  if(frag.q==="view") findings.push({sev:"err", text:frag.fb});
  if(frag.q==="off") findings.push({sev:"warn", text:frag.fb});
  if(frag.q==="nofit" || (stem.accepts && ["good","view","off"].includes(frag.q) && !stem.accepts.includes(frag.id))){
    EV.flowFails=(EV.flowFails||0)+1;
    let msg = frag.q==="nofit" ? frag.fb : "Read the preview aloud — the quote doesn't continue the stem's grammar. Swap one of them so it flows as a single sentence.";
    if(EV.flowFails>=2) msg += " Still stuck on how clauses join? Do exactly this: open " + hubRef("GrammarHuboffline.html","Grammar Hub → Sentence Structure","run one round at your level, then come back and rebuild this sentence.");
    findings.push({sev:"err", text:msg, html:true});
  }
  if(tail.q==="point"||tail.q==="retell") findings.push({sev:"warn", text:tail.fb});
  const level = findings.some(f=>f.sev==="err") ? "err" : findings.length ? "warn" : "ok";
  const pass = level==="ok";
  if(!EV.builderChecked){ recFirst("ev."+r.id+".l3", pass); EV.builderChecked=true; }
  if(pass){
    fb.className="feedback ok";
    let msg="<b>Strong analytical sentence.</b> Stem, embedded quote and an ending that explains.";
    if(tail.q==="bonus") msg+=" <b>And you've woven in a second quote — that's above the standard: “I can correctly embed multiple quotes into an explanation.”</b>";
    fb.innerHTML=msg+`<div style="margin-top:8px"><b>Level 3 achieved:</b> ${esc(EV_LADDER[2].text)}.</div>`;
    S.evLv=Math.max(S.evLv, r.id==="r2"?4:3); save();
    const nextIdx=EV.roundIdx+1, nextR=evRounds()[nextIdx];
    $("brow").innerHTML = nextR
      ? `<button class="btn btn-primary" onclick="renderEv(${nextIdx})">${esc(nextR.title)} →</button>`
      : `<button class="btn btn-primary" onclick="evFinish()">Finish the evidence builder →</button>`;
  } else {
    fb.className="feedback "+(level==="err"?"bad":"warn");
    fb.innerHTML="<b>"+(level==="err"?"Something needs fixing.":"A good start — here's how to lift it:")+"</b><ul>"
      +findings.map(f=>"<li>"+(f.html?f.text:esc(f.text))+"</li>").join("")+"</ul>";
  }
}
function evFinish(){
  S.done.ev=true; save();
  const sc=scoreFor("ev");
  $("body").innerHTML=`<h2>Evidence builder — done</h2>
  ${evLadderHtml(5)}
  <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} levels passed on the first check.</b>
</p></div>
  <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
}

/* ---------- ANALYSIS WORKSHOP ---------- */
let WK=null;
function runWk(){
  WK={armed:null, placed:{}, firstTried:{}, focus:null, canvas:[], harvested:[],
      level:6, versions:{}, tried:{}, wallStart:0, climbStart:0, culled:{}};
  /* Shuffle the response bank. Listed in rubric order it can be placed top
     to bottom without reading a word of it. */
  WK.bank=WK_WALL.resps.map(r=>r.id);
  for(let i=WK.bank.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
    [WK.bank[i],WK.bank[j]]=[WK.bank[j],WK.bank[i]]; }
  renderWall();
}
function wallDone(){ return WK_WALL.resps.every(r=>WK.placed[r.id]!==undefined); }
/* Light the coloured parts up one after another on the cell that just
   landed, then let its explanation fade in underneath. */
function wkAnimateFresh(){
  const cell=document.querySelector(".wcell.ex.justplaced");
  if(cell){
    const marks=cell.querySelectorAll(".hl-feat,.hl-verb,.hl-ev,.hl-eff");
    marks.forEach((m,i)=>{ m.style.animationDelay=(i*110)+"ms"; m.classList.add("lightup"); });
    const exp=document.querySelector(".wcell.exp.reveal");
    if(exp) exp.style.animationDelay=(marks.length*110+180)+"ms";
  }
  WK.justIdx=undefined;
}
function wkColourKey(){
  return `<div class="ckey">
    <span><i class="sw feat"></i>subject</span>
    <span><i class="sw verb"></i>verb</span>
    <span><i class="sw idea"></i>idea</span>
    <span><i class="sw ev"></i>evidence</span>
    <span><i class="sw eff"></i>purpose</span>
  </div>`;
}
/* How many rubric columns fit. Three was a fixed number written for a laptop,
   and on a 1920px screen it left the table paging through five levels in a
   third of the room it had. The table is the lesson: show the whole rubric
   when the glass allows it, and page only when it does not. */
function wagollCols(){
  const w = window.innerWidth || 1200;
  return w>=1500 ? 5 : w>=1180 ? 4 : 3;
}
/* One table shape for both parts, mirroring the EAL WAGOLL sheet:
   rows are Level / Skill focus / Example / What makes it, columns are
   rubric levels, three at a time. In Part A the Example row is filled by
   placing the model responses; in Part B it fills with the student's own
   sentence at each level. */
function wagollTable(o){
  const levels=o.levels, total=levels.length;
  const COLS=Math.min(wagollCols(), total);
  const maxStart=Math.max(0,total-COLS);
  const start=Math.max(0,Math.min(o.start,maxStart));
  const vis=[];
  for(let i=start;i<Math.min(start+COLS,total);i++) vis.push(i);
  /* the levels immediately off each edge — rendered half-visible so it's
     obvious the rubric continues, and clickable to scroll there */
  const pL = start>0 ? start-1 : -1;
  const pR = (start+COLS)<total ? start+COLS : -1;
  const peek=(idx, side, inner)=>
    idx<0 ? `<div class="wcell peek empty"></div>`
          : `<div class="wcell peek ${side}" onclick="${o.pageFn}(${side==="l"?start-1:start+1})"
               role="button" tabindex="0" title="Level ${levels[idx].n} — click to scroll">${inner}</div>`;

  const whole = vis.length===total;
  /* With one row on the wall there is nothing for a row-label column to label,
     and at demo scale the word "Example" runs out of its 74px anyway. */
  const nolab = o.labels===false;
  const labW = nolab ? "0" : "74px";
  let h=`<div class="wag2${pL<0?" nol":""}${pR<0?" nor":""}${whole?" whole":""}${nolab?" nolab":""}"
    style="grid-template-columns:${labW} ${whole?"":"52px "}repeat(${COLS},1fr)${whole?"":" 52px 34px"}">`;
  /* header row */
  h+=`<div class="wcell rowlab">${whole||nolab?"":`<button class="pager" ${start<=0?"disabled":""} onclick="${o.pageFn}(${start-1})" aria-label="earlier levels">‹</button>`}</div>`;
  /* the trailing pager column only exists while the table pages */
  if(!whole) h+=peek(pL,"l", pL<0?"":`<div class="lvname">${esc(levels[pL].lv||("Level "+levels[pL].n))}</div>`);
  vis.forEach(i=>{ const L=levels[i];
    h+=`<div class="wcell head ${o.activeIdx===i?"active":""} ${o.doneIdx&&o.doneIdx(i)?"done":""}">
      <div class="lvname">${esc(L.lv||("Level "+L.n))} ${o.doneIdx&&o.doneIdx(i)?"✓":""}</div>
      ${S.eal&&L.eal?`<div class="lveal">${esc(L.eal)}</div>`:""}</div>`; });
  if(!whole) h+=peek(pR,"r", pR<0?"":`<div class="lvname">${esc(levels[pR].lv||("Level "+levels[pR].n))}</div>`);
  if(!whole) h+=`<div class="wcell rowlab endpage"><button class="pager" ${start>=maxStart?"disabled":""} onclick="${o.pageFn}(${start+1})" aria-label="later levels">›</button></div>`;

  const row=(label, cellFn, peekFn)=>{
    h+=`<div class="wcell rowlab">${nolab?"":label}</div>`;
    if(!whole) h+=peek(pL,"l", pL<0?"":peekFn(pL));
    vis.forEach(i=>{ h+=cellFn(i); });
    if(!whole) h+=peek(pR,"r", pR<0?"":peekFn(pR));
    if(!whole) h+=`<div class="wcell rowlab"></div>`;
  };
  /* Which rows to draw. The demo asks for the wall and nothing else: on the
     projector the rubric wording, the skill focus and the what-makes-it row
     are three rows of small print nobody reads from the back, and the teacher
     is saying all of it out loud anyway. */
  const rows = o.rows || ["focus","vic","example","exp"];
  if(rows.includes("focus")) row("Skill focus",
      i=>`<div class="wcell focus ${o.activeIdx===i?"active":""}">${esc(levels[i].focus||"")}</div>`,
      i=>esc(levels[i].focus||""));
  if(rows.includes("vic")) row("The rubric",
      i=>`<div class="wcell vic ${o.activeIdx===i?"active":""}">${levels[i].vicH||esc(levels[i].vic||"")}</div>`,
      i=>esc(levels[i].vic||""));
  if(rows.includes("example")) row("Example", i=>o.exampleCell(i), i=>"");
  if(rows.includes("exp")) row("What makes it",
      i=>{ const got=o.doneIdx&&o.doneIdx(i); const fresh=(o.justIdx===i)?" reveal":"";
        return `<div class="wcell exp ${o.activeIdx===i?"active":""}${fresh}">`+
          (got?(levels[i].exp||""):`<span class="explock">fills in once you get this one</span>`)+`</div>`; },
      i=>"");
  h+=`</div>` + (whole ? "" :
    `<div class="wagnote">Levels ${levels[vis[0]].n}–${levels[vis[vis.length-1]].n} of ${levels[0].n}–${levels[total-1].n} — the faded columns are the rest of the rubric. Click one, or use ‹ ›, to scroll along it.</div>`);
  return h;
}
function wallPage(n){ WK.wallStart=n; renderWall(); }
function renderWall(){
  if(WK.wallStart===undefined) WK.wallStart=0;
  let h=`<div class="eyebrow"><button class="linkbtn noprint" onclick="go('teach')">teacher mode</button></div>
  <h2>${esc(WK_WALL.q)}</h2>
  <p class="lead">${esc(WK_WALL.note)}</p>
  ${wkColourKey()}`;
  h+=wagollTable({
    levels:WK_WALL.levels, start:WK.wallStart, pageFn:"wallPage", activeIdx:-1, justIdx:WK.justIdx,
    doneIdx:(i)=>WK_WALL.resps.some(r=>WK.placed[r.id]===i),
    exampleCell:(i)=>{
      const r=WK_WALL.resps.find(x=>WK.placed[x.id]===i);
      const fresh=(WK.justIdx===i)?" justplaced":"";
      return `<div class="wcell ex ${r?"filled":"droppable"}${fresh}" onclick="wallDrop(${i})" role="button" tabindex="0">`+
        (r?`<div class="wresp">${r.h||esc(r.t)}</div>`:`<span class="wempty">tap a response below, then tap here</span>`)+`</div>`;
    }
  });
  const order=WK.bank||WK_WALL.resps.map(r=>r.id);
  const remaining=order.map(id=>WK_WALL.resps.find(r=>r.id===id))
    .filter(r=>r && WK.placed[r.id]===undefined);
  if(remaining.length){
    h+=`<p class="q">Responses to place (${remaining.length} left) — tap one, then tap the Example box of the level it belongs to:</p><div class="respbank">`;
    remaining.forEach(r=>{ h+=`<button class="resp ${WK.armed===r.id?"armed":""}" onclick="wallArm('${r.id}')">${r.h||esc(r.t)}</button>`; });
    h+=`</div>`;
  }
  h+=`<div class="feedback" id="fb" aria-live="polite"></div>`;
  if(wallDone()){
    h+=`<div class="feedback ok"><b>Wall complete.</b></div>
    <div class="btnrow"><button class="btn btn-primary" onclick="renderWkBuild()">Part B: write it yourself, then climb the rubric →</button></div>`;
  }
  $("body").innerHTML=h;
  wkAnimateFresh();
}
function wallArm(id){ WK.armed = WK.armed===id? null : id; renderWall(); }
function wallDrop(i){
  if(!WK.armed) return;
  const r=WK_WALL.resps.find(x=>x.id===WK.armed);
  if(WK.placed[r.id]!==undefined) return;
  const correct = r.lvl===i;
  if(!WK.firstTried[r.id]){ WK.firstTried[r.id]=true; recFirst("wk.wall."+r.id, correct); }
  if(correct){
    WK.placed[r.id]=i; WK.armed=null;
    if(i<WK.wallStart) WK.wallStart=i;
    else if(i>WK.wallStart+wagollCols()-1) WK.wallStart=i-wagollCols()+1;
    renderWall();
    const fb=$("fb"); fb.className="feedback ok";
    fb.innerHTML="<b>Placed.</b> "+esc(r.why);
  } else {
    const fb=$("fb"); fb.className="feedback bad";
    fb.innerHTML="<b>Look again.</b> "+esc(r.why)+" Which level descriptor says that?";
  }
}
function wkFocusLabel(){ const f=WK_BUILD.focuses.find(x=>x.id===WK.focus); return f?f.label:""; }
/* ---------- ANALYSIS WORKSHOP · PART B — THE CLIMB ----------
   One sentence, rejigged up the rubric. Each level snapshots the student's
   own wording, and the snapshots stack under the rubric so the climb reads
   like the EAL WAGOLL table: the same idea, said better each time. */
function wkLevel(){ return WK_LEVELS.find(L=>L.n===WK.level); }
function wkPage(n){ WK.climbStart=n; renderWkBuild(); }
function wkLevelIdx(){ return WK_LEVELS.findIndex(L=>L.n===WK.level); }
function wkAvail(list){
  const out=list.map((x,i)=>({x,i})).filter(o=>{
    const lv=o.x.lv||[5,9]; return WK.level>=lv[0] && WK.level<=lv[1]; });
  /* Newest unlocks first. The banks scroll inside a fixed height, and the data
     is written lowest-level-first, so without this a Level 9 student opens
     every bank onto Level 5 tiles and the ones this level asks for sit below
     the fold. Stable sort: ties keep their authored order. */
  return out.map((o,k)=>({o,k})).sort((a,b)=>
    ((b.o.x.lv||[5,9])[0]-(a.o.x.lv||[5,9])[0]) || (a.k-b.k)).map(e=>e.o);
}
function wkRetired(x){ const lv=x.lv||[5,9]; return WK.level>lv[1]; }
/* Tiles the checker has already blamed by name are taken out of the banks, so
   a wrong attempt narrows what is left rather than leaving the same trap in
   front of the student. Keyed by level AND focus: a tile culled for being the
   wrong theme comes back if the focus changes, because switching focus is one
   of the two fixes the message offers. Only tiles the checker named go: never
   a tile that was merely present in a failed sentence, and never a word-order
   or pairing problem, which would delete a right answer for a wrong reason. */
function wkCullKey(kind, i){ return WK.level+"|"+(WK.focus||"")+"|"+kind+"|"+i; }
function wkIsCulled(kind, i){ return !!WK.culled[wkCullKey(kind,i)]; }
function wkCull(findings){
  if(WK.rails) return 0;            /* the demo never mutates anything */
  let n=0;
  findings.forEach(f=>(f.cull||[]).forEach(c=>{
    const k=wkCullKey(c.k, c.i);
    if(!WK.culled[k]){ WK.culled[k]=true; n++; }
  }));
  /* A culled quote leaves the harvest too, so the passage does not show it
     collected while its tile is gone from the bank. */
  WK.harvested = WK.harvested.filter(i=>!wkIsCulled("q", i));
  return n;
}
function wkFocusLabel(){ const f=WK_BUILD.focuses.find(x=>x.id===WK.focus); return f?f.label:""; }
/* Resolve a starter recipe (kind + tile text) into canvas refs. */
function wkStarter(fid){
  const lists={open:WK_BUILD.opens, subj:WK_BUILD.subjects, verb:WK_BUILD.verbs,
               idea:WK_BUILD.ideas, eff:WK_BUILD.effects, con:WK_BUILD.cons};
  const canvas=[], harvested=[];
  (WK_BUILD.starters[fid]||[]).forEach(pair=>{
    const k=pair[0], t=pair[1];
    if(k==="q"){
      const i=WK_BUILD.segs.findIndex(sg=>sg.t.includes(t));
      if(i>=0){ if(!harvested.includes(i)) harvested.push(i); canvas.push({k:"q",i}); }
    } else {
      const i=lists[k].findIndex(x=>x.t===t);
      if(i>=0) canvas.push({k,i});
    }
  });
  return {canvas, harvested};
}
function wkSetFocus(fid){
  const prev=WK.focus;
  WK.focus=fid;
  /* At the start of the climb, picking a focus lays the finished Level 5
     sentence on the canvas. Switching focus before you've changed anything
     swaps the freebie — but it never clobbers a sentence you've worked on. */
  const startOfClimb = WK.level===6 && !WK.versions[6];
  const untouched = !WK.canvas.length ||
    (prev && JSON.stringify(WK.canvas)===JSON.stringify(wkStarter(prev).canvas));
  if(startOfClimb && untouched){
    const st=wkStarter(fid);
    WK.canvas=st.canvas; WK.harvested=st.harvested.slice();
    WK.versions[5]={t:wkText(st.canvas), h:wkTextHtml(st.canvas)};
  }
  renderWkBuild();
  if(startOfClimb && untouched){
    const fb=$("fb"); if(fb){ fb.className="feedback warn";
    fb.innerHTML="At <b>Level 6</b>, weave the quote inside the sentence with a joiner."; }
  }
}

function wkTileData(c){
  if(c.k==="open") return WK_BUILD.opens[c.i];
  if(c.k==="subj") return WK_BUILD.subjects[c.i];
  if(c.k==="verb") return WK_BUILD.verbs[c.i];
  if(c.k==="idea") return WK_BUILD.ideas[c.i];
  if(c.k==="eff")  return WK_BUILD.effects[c.i];
  if(c.k==="con")  return WK_BUILD.cons[c.i];
  /* Quotes belong to every level from 6 up — evidence never retires, only
     the way you weave it in changes. Without an explicit range they fell
     back to the default and read as "retired" at Level 9. */
  if(c.k==="q"){ const sg=WK_BUILD.segs[c.i]; return {t:"“"+sg.t.replace(/^[‘’'"]+/,"").replace(/[‘’'".,]+$/,"")+"”", seg:sg, lv:[5,9]}; }
  return {t:""};
}
function wkHlClass(k){
  return k==="subj"?"hl-feat":k==="verb"?"hl-verb":k==="q"?"hl-ev":
         k==="idea"?"hl-idea":k==="eff"?"hl-eff":"";
}
/* The student's own sentence, marked up in the same colours as the models —
   so their writing gets read with the same eyes as the WAGOLL examples. */
function wkTextHtml(canvas){
  const arr=canvas||WK.canvas;
  let out="", first=true;
  arr.forEach(c=>{
    let t=esc(wkTileData(c).t);
    const cls=wkHlClass(c.k);
    if(first){ t=t.charAt(0).toUpperCase()+t.slice(1); first=false; }
    else if(!(t===","||t===".")) out+=" ";
    out += cls?`<em class="${cls}">${t}</em>`:t;
  });
  if(out && !/[.!?]$/.test(out.replace(/<[^>]+>/g,""))) out+=".";
  return out;
}
function wkKindClass(k){
  return k==="subj"?"k-subj":k==="verb"?"k-verb":k==="q"?"k-q":
         k==="eff"?"k-eff":k==="idea"?"k-idea":k==="open"?"k-open":"k-con";
}
function wkText(canvas){
  let out="";
  (canvas||WK.canvas).forEach(c=>{
    const t=wkTileData(c).t;
    if(!out) out=t;
    else if(t===","||t===".") out+=t;
    else out+=" "+t;
  });
  if(out){
    out=out.charAt(0).toUpperCase()+out.slice(1);
    if(!/[.!?]$/.test(out)) out+=".";
  }
  return out;
}

function renderWkBuild(){
  const L=wkLevel();
  let h = WK.rails ? "" : `<div class="eyebrow">${esc(WK_BUILD.where)}<button class="linkbtn noprint" onclick="go('teach')" style="margin-left:10px">teacher mode</button></div>`;
  h+=`<h2>${esc(WK_BUILD.prompt)}</h2>`;
  if(WK.rails){
    h+=`<div class="railbar noprint"><button class="linkbtn" onclick="runTeach(0)">back to the slides</button>
      <button class="linkbtn" onclick="teachColours()">the four colours</button>
      <button class="linkbtn" onclick="go('home')">leave the demo</button></div>`;
  }

  /* ---- the same WAGOLL table, sliding as you climb ---- */
  const idx=wkLevelIdx();
  if(WK.climbStart===undefined) WK.climbStart=0;
  if(idx<WK.climbStart) WK.climbStart=idx;
  else if(idx>WK.climbStart+wagollCols()-1) WK.climbStart=idx-wagollCols()+1;
  h+=wkColourKey();
  /* The demo lifts a Year 4 sentence to Year 7 in one pass, so its wall is
     those two columns: where the sentence started and where it is going. The
     levels in between are a rung nobody stands on during the demonstration. */
  const tLevels = WK.rails ? WK_LEVELS.filter(l=>l.n===5||l.n===TEACH_RAILS_LEVEL) : WK_LEVELS;
  const tIdx = WK.rails ? tLevels.findIndex(l=>l.n===WK_LEVELS[idx].n) : idx;
  h+=wagollTable({
    levels: tLevels,
    start:WK.rails?0:WK.climbStart, pageFn:"wkPage", activeIdx:tIdx, justIdx:WK.justIdx,
    rows: WK.rails ? ["example"] : null, labels: WK.rails ? false : null,
    doneIdx:(k)=>!!WK.versions[tLevels[k].n],
    exampleCell:(k)=>{
      const lv=tLevels[k], mine=WK.versions[lv.n];
      const fresh=(WK.justIdx===k)?" justplaced":"";
      if(mine) return `<div class="wcell ex filled${fresh}"><div class="wresp">${mine.h||esc(mine.t)}</div></div>`;
      if(k===tIdx) return `<div class="wcell ex now"><span class="wempty">${WK.rails?"":"you're writing this one now — build it below"}</span></div>`;
      if(lv.n===5 && !WK.rails) return `<div class="wcell ex"><span class="wempty">pick a focus below</span></div>`;
      return `<div class="wcell ex"><span class="wempty">${k<tIdx?"—":"not yet"}</span></div>`;
    }
  });

  /* ---- what changed at this level (the demo says it out loud instead) ---- */
  if(!WK.rails && (L.unlocks||L.retires)){
    h+=`<div class="changed">`;
    if(L.unlocks) h+=`<div><span class="cup">unlocked</span> ${esc(L.unlocks)}</div>`;
    if(L.retires) h+=`<div><span class="cdown">retired</span> ${esc(L.retires)}</div>`;
    h+=`</div>`;
  }

  /* ---- focus (locked on rails: the demo is one sentence, not a menu) ---- */
  if(WK.rails){
    /* nothing: the focus is locked and the banks already show only its tiles */
  } else {
    h+=`<p class="q">Your focus:</p><div class="idea-chips">`+
      WK_BUILD.focuses.map(f=>`<button class="fchoice ${WK.focus===f.id?"on":""}" onclick="wkSetFocus('${f.id}')">${esc(f.label)}</button>`).join("")+`</div>`;
  }

  /* ---- passage harvest: skipped on rails, where the quote is already in the
         sentence, and at Level 9, whose second sentence carries no quote ---- */
  if(!WK.rails && WK.level!==9){
    h+=`<p class="q">Collect evidence — tap lines to add them to your quote tiles:</p>
    <div class="passage">`+WK_BUILD.segs.map((sg,i)=>wkIsCulled("q",i)
        ? `<span class="seg spent">${esc(sg.t)}</span> `
        : `<span class="seg ${WK.harvested.includes(i)?"harv":""}" onclick="wkHarvest(${i})">${esc(sg.t)}</span> `).join("")+
    `<span class="pg">${esc(WK_BUILD.where)} — The Bone Sparrow, Zana Fraillon</span></div>`;
  }

  /* ---- canvas ---- */
  /* The canvas and the preview ride in a sticky dock. Building a sentence means
     looking at the banks and the sentence at the same time, and on a laptop the
     banks push the sentence off the top of the screen exactly when a student
     needs to see what they are adding to. */
  /* The feedback and the Check button ride in the sticky dock with the
     sentence rather than under the banks, where a check's verdict would land
     off-screen. */
  const actions = `<div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="wkrow">
    <button class="btn btn-primary" onclick="wkCheck()">Check my sentence</button>
    <button class="btn btn-ghost" onclick="WK.canvas=[];wkDraw()">Clear</button>
  </div>`;
  h+=`<div class="dock">
    ${WK.level===9 && WK.versions[8] ? `<div class="preview locked8">${WK.versions[8].h}</div>` : ""}
    ${WK.rails?"":`<p class="q">${WK.level===9?"Add your second sentence.":"Drag tiles into your sentence. Tap one to take it out."}</p>`}
    <div class="canvas" id="wkCanvas"></div><div class="preview" id="wkPrev"></div>
    ${actions}
  </div>`;
  /* The feedback and the Check button live in the dock with the sentence:
     the three things a writer needs in view at once, pinned as one block. */

  /* ---- banks, filtered to this level ---- */
  h+=`<div class="bins5">`;
  if(WK.level>=8) h+=`<div class="bin opens"><h4>Lead-in</h4><div class="binbody" id="wb-open"></div></div>`;
  h+=`<div class="bin subjects"><h4>Subjects</h4><div class="binbody" id="wb-subj"></div></div>
      <div class="bin verbs"><h4>Verbs</h4><div class="binbody" id="wb-verb"></div></div>`;
  if(WK.level!==9){
    h+=`<div class="bin ideas"><h4>Idea</h4><div class="binbody" id="wb-idea"></div></div>`;
    h+=`<div class="bin quotes"><h4>Evidence</h4><div class="binbody" id="wb-q"></div></div>`;
  }
  h+=`<div class="bin effects"><h4>Purpose</h4><div class="binbody" id="wb-eff"></div></div>`;
  if(WK.level!==9) h+=`<div class="bin connects"><h4>Joiners</h4><div class="binbody" id="wb-con"></div></div>`;
  h+=`</div>`;


  $("body").innerHTML=h;
  wkFillBins(); wkDraw(); wkAnimateFresh();
}

function wkHarvest(i){
  const at=WK.harvested.indexOf(i);
  if(at>=0){ WK.harvested.splice(at,1); WK.canvas=WK.canvas.filter(c=>!(c.k==="q"&&c.i===i)); }
  else WK.harvested.push(i);
  renderWkBuild();
}

function wkFillBins(){
  const fill=(elId, list, kind, cls, only)=>{
    const bin=$(elId); if(!bin) return;
    bin.innerHTML="";
    let av=wkAvail(list).filter(o=>!wkIsCulled(kind, o.i));
    if(only) av=av.filter(only);
    av.forEach(o=>{
      const b=document.createElement("button");
      b.className="tile "+cls;
      b.textContent=o.x.t;
      b.title="Drag into your sentence, or tap to add it to the end";
      wkBindDrag(b, {make:()=>({k:kind,i:o.i})});
      bin.appendChild(b);
    });
  };
  /* At Level 9 the banks hold only the second sentence's parts: the three
     representation subjects, the positioning verbs, the interpretive endings,
     and the two Level 9 lead-ins. */
  const p9 = WK.level===9;
  fill("wb-open", WK_BUILD.opens, "open", "k-open", p9 ? o=>(o.x.lv||[5,9])[0]===9 : null);
  fill("wb-subj", WK_BUILD.subjects, "subj", "k-subj", p9 ? o=>(o.x.lv||[5,9])[0]===9 : null);
  fill("wb-verb", WK_BUILD.verbs, "verb", "k-verb", p9 ? o=>o.x.q==="pos" : null);
  fill("wb-idea", WK_BUILD.ideas, "idea", "k-idea");
  fill("wb-eff",  WK_BUILD.effects, "eff", "k-eff", p9 ? o=>o.x.q==="interp" : null);
  fill("wb-con",  WK_BUILD.cons, "con", "k-con");
  const qbin=$("wb-q");
  if(qbin){
    const live = WK.harvested.filter(i=>!wkIsCulled("q", i));
    qbin.innerHTML = live.length ? "" : `<span class="gatednote">Tap lines in the passage above to collect quotes.</span>`;
    WK.harvested.filter(i=>!wkIsCulled("q", i)).forEach(i=>{
      const sg=WK_BUILD.segs[i];
      const b=document.createElement("button"); b.className="tile k-q";
      b.textContent="“"+sg.t.replace(/^[‘’'"]+/,"").replace(/[‘’'".,]+$/,"")+"”";
      b.title="Drag into your sentence, or tap to add it to the end";
      wkBindDrag(b, {make:()=>({k:"q",i})});
      qbin.appendChild(b);
    });
  }
}

/* ---- canvas render ---- */
function wkDraw(){
  const cv=$("wkCanvas"); if(!cv) return;
  cv.innerHTML="";
  if(!WK.canvas.length) cv.innerHTML=`<span class="ph"></span>`;
  WK.canvas.forEach((c,idx)=>{
    const d=wkTileData(c);
    const b=document.createElement("button");
    b.className="ctile "+wkKindClass(c.k)+(wkRetired(d)?" retired":"");
    b.textContent=d.t;
    b.dataset.idx=idx;
    b.title=wkRetired(d)?"Retired at this level — swap it out":"Drag to move, tap to remove";
    wkBindDrag(b, {});
    cv.appendChild(b);
  });
  const prev=$("wkPrev");
  if(prev){
    if(WK.canvas.length) prev.textContent=wkText();
    else prev.innerHTML=`<span class="ph"></span>`;
  }
  const fb=$("fb"); if(fb) fb.className="feedback";
  const kb=$("wkrow"); const old=kb&&kb.querySelector("#liftBtn"); if(old) old.remove();
}

/* ---- one drag gesture, both directions ----
   A bank tile and a canvas tile start the SAME gesture. Past an 8px threshold
   the tile you picked up is cloned into a floating copy that follows the
   pointer anywhere on the page, and the sentence answers with a GAP showing
   where it would land. Nothing enters the sentence until you let go over the
   canvas, so the tile never jumps out of your hand into the box.

   Under the threshold it is a tap: on a bank tile it appends, on a canvas tile
   it removes. That is handled once, in pointerup. Enter and Space are handled
   separately, because the pointer path never fires for a keyboard.

   Drop away from the canvas and nothing is added; a canvas tile dragged out
   that way goes back to the bank. */
function wkBindDrag(el, o){
  const fromBank = !!o.make;

  /* A tap is handled once, in the pointer-up below. There used to be a click
     listener here as well, guarded by a flag the drag rewrite stopped setting,
     so every tap on a bank tile added the tile twice. Keyboard users need a
     route in that the pointer path never fires for, and that is this: */
  el.addEventListener("keydown", e=>{
    if(e.key!=="Enter" && e.key!==" ") return;
    e.preventDefault();
    if(fromBank) WK.canvas.push(o.make());
    else WK.canvas.splice(+el.dataset.idx, 1);
    wkDraw();
  });

  el.addEventListener("pointerdown", e=>{
    if(e.button) return;
    const sx=e.clientX, sy=e.clientY;
    const r0=el.getBoundingClientRect();
    const grabX=sx-r0.left, grabY=sy-r0.top;
    let dragging=false, ghost=null, gap=null;
    try{ el.setPointerCapture(e.pointerId); }catch(_){}

    /* The tile you are holding is a real floating object: a clone fixed to the
       pointer, free to travel anywhere on the page. The canvas answers it with
       a GAP that opens where the tile would land. Nothing is added to the
       sentence until you let go over the canvas.

       The previous version materialised the tile into the canvas on the first
       millimetre of movement, so the tile appeared to jump out of your hand
       into the box and then shuffle about inside it. */
    const makeGhost=()=>{
      const g=el.cloneNode(true);
      g.className=(fromBank ? "ctile "+el.className.replace(/^tile\s*/,"") : el.className)+" dragghost";
      g.style.width=r0.width+"px";
      document.body.appendChild(g);
      return g;
    };
    const makeGap=()=>{
      const d=document.createElement("span");
      d.className="dropgap";
      return d;
    };
    const overCanvas=(x,y)=>{
      const cv=$("wkCanvas"); if(!cv) return false;
      const r=cv.getBoundingClientRect();
      return x>=r.left-24 && x<=r.right+24 && y>=r.top-24 && y<=r.bottom+24;
    };
    /* Where the gap belongs: how many tiles sit before the pointer. Rows wrap,
       so a tile on a line above the pointer is always before it. */
    const slotAt=(x,y)=>{
      const cv=$("wkCanvas"); if(!cv) return 0;
      const ts=[...cv.querySelectorAll(".ctile")].filter(t=>t!==el);
      let ins=0;
      for(const t of ts){
        const r=t.getBoundingClientRect();
        if(y>r.bottom || (y>=r.top && x>r.left+r.width/2)) ins++; else break;
      }
      return ins;
    };
    const placeGap=(x,y)=>{
      const cv=$("wkCanvas"); if(!cv) return;
      if(!gap) gap=makeGap();
      const ph=cv.querySelector(".ph"); if(ph) ph.style.display="none";
      const ts=[...cv.querySelectorAll(".ctile")].filter(t=>t!==el);
      const ref=ts[slotAt(x,y)] || null;
      if(gap.parentNode!==cv || gap.nextSibling!==ref) cv.insertBefore(gap, ref);
    };
    const clearGap=()=>{
      if(gap && gap.parentNode) gap.parentNode.removeChild(gap);
      const cv=$("wkCanvas"); const ph=cv&&cv.querySelector(".ph");
      if(ph) ph.style.display="";
    };

    const move=ev=>{
      if(!dragging){
        if(Math.hypot(ev.clientX-sx, ev.clientY-sy) < 8) return;
        dragging=true;
        ghost=makeGhost();
        el.classList.add(fromBank ? "used" : "lifted");
        document.body.classList.add("dragging");
      }
      ev.preventDefault();
      ghost.style.transform=`translate(${ev.clientX-grabX}px, ${ev.clientY-grabY}px)`;
      if(overCanvas(ev.clientX, ev.clientY)) placeGap(ev.clientX, ev.clientY);
      else clearGap();
    };

    const up=ev=>{
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      el.classList.remove("used","lifted");
      document.body.classList.remove("dragging");
      if(ghost) ghost.remove();

      if(!dragging){
        /* a tap: bank adds to the end, a tile in the sentence comes out */
        if(!fromBank) WK.canvas.splice(+el.dataset.idx, 1);
        else { WK.canvas.push(o.make()); }
        clearGap(); wkDraw(); return;
      }

      const landed = gap && gap.parentNode && ev && overCanvas(ev.clientX, ev.clientY);
      if(landed){
        /* read the slot off the gap itself, so what lands is what was shown */
        const cv=$("wkCanvas");
        const slot=[...cv.children].filter(n=>n===gap||n.classList.contains("ctile")).indexOf(gap);
        if(fromBank){
          WK.canvas.splice(slot, 0, o.make());
        } else {
          const from=+el.dataset.idx;
          const [moved]=WK.canvas.splice(from,1);
          WK.canvas.splice(slot > from ? slot-1 : slot, 0, moved);
        }
      }
      clearGap();
      wkDraw();
    };

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });
}
/* ---- grammar: order, and whether each piece FITS what's next to it ----
   Every tile knows the shape of phrase it is; every slot knows what shapes
   it licenses. That's enough to catch what students really build — "which
   that the boys have learned…", a clause dumped straight after a quotation,
   a verb that can't take the ending hung off it — without pretending to
   parse English. Each message names the fix, not just the fault. */
function wkShape(t){
  if(!t) return null;
  if(t.c.k==="eff")  return t.d.shape||"vp";
  if(t.c.k==="idea") return "np";
  if(t.c.k==="subj") return "np";
  if(t.c.k==="q")    return "quote";
  return null;
}
function wkRole(t){ return (t && t.c.k==="con") ? (t.d.role||"coord") : null; }
function wkTakes(t){ return ((t && t.d.takes) || "np").split("|"); }
function wkSnip(x,n){ x=String(x); return x.length>n ? x.slice(0,n)+"…" : x; }
function wkGrammar(kinds, tiles){
  const f=[];
  if(!kinds.length) return f;
  tiles = tiles || [];
  const first=kinds[0], last=kinds[kinds.length-1];
  const iOpen=kinds.indexOf("open"), iS=kinds.indexOf("subj"), iV=kinds.indexOf("verb");
  const iE=kinds.indexOf("eff"), iI=kinds.indexOf("idea"), iQ=kinds.indexOf("q");
  if(iOpen>0)
    f.push({sev:"err", text:"Your lead-in phrase has to come first — drag it to the front of the sentence."});
  if(first==="con")
    f.push({sev:"err", text:"Your sentence starts on a joiner. Start with your subject (or a lead-in phrase), not with a connecting word."});
  if(first==="verb")
    f.push({sev:"err", text:"Your sentence starts on a verb. Something has to be doing it — put your subject first."});
  if(iS>=0 && iV>=0 && iV<iS)
    f.push({sev:"err", text:"Your verb comes before your subject. Drag the subject in front of the verb — read it aloud and you'll hear it."});
  if(iV>=0 && iE>=0 && iE<iV)
    f.push({sev:"err", text:"Your effect clause lands before the verb. The order is subject → verb → what it reveals."});
  if(iV>=0 && iI>=0 && iI<iV)
    f.push({sev:"err", text:"Your key idea lands before the verb. The order is subject → verb → idea."});
  if(kinds.filter(k=>k==="verb").length>1)
    f.push({sev:"err", text:"There are two verbs doing the same job. Take one out — a sentence like this needs a single main verb."});
  if(last==="verb")
    f.push({sev:"err", text:"Your sentence ends on a verb, so it never says what the verb does. Put the idea or effect after it."});
  if(last==="con")
    f.push({sev:"err", text:"Your sentence ends on a joiner — it stops mid-thought. Finish it, or take the joiner off."});
  for(let i=0;i<kinds.length-1;i++){
    if(kinds[i]===kinds[i+1] && (kinds[i]==="subj"||kinds[i]==="verb"))
      f.push({sev:"err", text:"Two "+(kinds[i]==="subj"?"subjects":"verbs")+" are sitting side by side. Put a joiner between them or remove one."});
  }
  if(iQ>0){
    const before=kinds[iQ-1];
    if(!["con","verb","open"].includes(before))
      f.push({sev:"warn", text:"Your quotation is dropped straight in. Put a joiner in front of it — 'when he says', 'in the line' — so it reads as one sentence."});
  }

  /* ---- fit: does each piece have something it can legally hang off? ---- */
  for(let i=0;i<tiles.length;i++){
    const t=tiles[i], prev=tiles[i-1]||null, next=tiles[i+1]||null;
    const role=wkRole(t), shape=wkShape(t);

    /* "which" is a relative pronoun: a verb has to come straight after it */
    if(role==="rel" && next){
      const ns=wkShape(next);
      if(next.c.k==="eff" && ns!=="vp")
        f.push({sev:"err", text:"“which” followed by “"+wkSnip(next.d.t,26)+"” collides — “which” needs a verb straight after it. Either pick an ending that starts with a verb (“makes the reader…”), or swap the joiner for “which shows”, which brings its own verb along."});
      else if(next.c.k!=="eff" && next.c.k!=="verb")
        f.push({sev:"err", text:"“which” is pointing at nothing. It should lead into your purpose — what the writing does to the reader."});
    }

    /* a bridge joiner already carries its verb, so it wants a clause next */
    if(role==="bridge" && next && next.c.k==="eff" && wkShape(next)==="vp")
      f.push({sev:"err", text:"“"+t.d.t+"” already has its verb, so the ending after it shouldn't start with one — that gives you two verbs in a row. Use a “that…” or “how…” ending here, or go back to plain “which”."});

    /* clause endings need a verb or a bridge to hang off */
    if(t.c.k==="eff" && (shape==="cl"||shape==="wh")){
      const licensed = prev && (
        (prev.c.k==="verb" && wkTakes(prev).includes(shape==="cl"?"cl":"wh")) ||
        (prev.c.k==="con" && ["bridge","sub"].includes(wkRole(prev))) );
      if(!licensed){
        const why = prev && prev.c.k==="q"
          ? "It's sitting straight after your quotation, with nothing to join them."
          : prev && prev.c.k==="verb"
            ? "“"+prev.d.t+"” can't take a clause after it — it wants a noun phrase."
            : "There's nothing in front of it for it to hang off.";
        f.push({sev:"err", text:"“"+wkSnip(t.d.t,30)+"” is a clause. "+why+" Put it straight after an analytical verb (“reveals that…”), or lead into it with “which shows”, “which asks us to consider” or “because”."});
      }
    }

    /* meaning, not just shape: an ending that is what the writing DENIES us
       has to hang off something that denies; a "whether…" ending off
       something that questions */
    if(t.c.k==="eff" && t.d.needs){
      const gives = prev && (prev.d.gives || null);
      if(gives!==t.d.needs){
        const want = t.d.needs==="deny"
          ? "This ending is what the writing REFUSES the reader, so it has to follow something that withholds — “denies the reader”, “leaves the reader with no way to see”, or the joiner “which never gives us”."
          : "This ending is a question the writing raises, so it has to follow something that questions — “invites the reader to question”, or the joiner “which asks us to consider”.";
        f.push({sev:"err", text:"“"+wkSnip(t.d.t,30)+"” doesn't mean what you want it to here. "+want});
      }
    }

    /* verb-shaped endings need "which" (or "and") in front */
    if(t.c.k==="eff" && shape==="vp"){
      const licensed = prev && prev.c.k==="con" && ["rel","coord"].includes(wkRole(prev));
      if(!licensed)
        f.push({sev:"err", text:"“"+wkSnip(t.d.t,28)+"” starts with a verb, so it needs “which” in front of it — otherwise two verbs run into each other."});
    }

    /* a verb that only takes a noun phrase, handed a clause */
    if(t.c.k==="verb" && next && next.c.k==="eff"){
      const ns=wkShape(next);
      if((ns==="cl"&&!wkTakes(t).includes("cl")) || (ns==="wh"&&!wkTakes(t).includes("wh")))
        f.push({sev:"err", text:"“"+t.d.t+" "+wkSnip(next.d.t,24)+"” doesn't fit. “"+t.d.t+"” takes a thing (a noun phrase), not a clause — swap the verb for one that can carry a clause (reveals, suggests, conveys, shows), or pick a different ending."});
    }
  }

  /* the idea belongs before the purpose, whatever else is between them */
  const idxI=tiles.findIndex(t=>t.c.k==="idea"), idxE=tiles.findIndex(t=>t.c.k==="eff");
  if(idxI>=0 && idxE>=0 && idxI>idxE)
    f.push({sev:"err", text:"Your purpose lands before your idea. Read the order out loud: subject → verb → idea → evidence → purpose."});

  /* de-duplicate: one message per problem, however many tiles trip it */
  const seen={};
  return f.filter(x=>seen[x.text]?false:(seen[x.text]=true));
}

function wkCheck(){
  const fb=$("fb"), L=wkLevel();
  if(!WK.focus){ fb.className="feedback bad"; fb.innerHTML="<b>Choose your focus first</b> — the check needs to know which idea your sentence is aiming at."; return; }
  if(!WK.canvas.length){ fb.className="feedback bad"; fb.innerHTML="<b>The canvas is empty.</b> Tap tiles to build a sentence first."; return; }
  wkCheckTail(wkFindings(WK.canvas, WK.level, WK.focus));
}

/* Everything the check knows, with nothing on the screen involved: give it a
   canvas, a level and a focus and it hands back what's wrong. */
function wkFindings(canvas, level, focus){
  const L=WK_LEVELS.find(x=>x.n===level);
  const tiles=canvas.map(c=>({c, d:wkTileData(c)}));
  const kinds=canvas.map(c=>c.k);
  const findings=[];
  const wasLevel=WK.level; WK.level=level;   /* wkRetired reads the live level */

  /* Retired tiles must be traded out, and the advice has to be about the tile
     in front of them. It used to append the level's blanket `retires` note to
     every kind, so a retired IDEA was answered with a paragraph about verbs
     and feeling-endings, which is the wrong category and reads as a bug. */
  tiles.forEach(t=>{ if(wkRetired(t.d))
    findings.push({sev:"err", text:"“"+t.d.t+"” belongs to a level you've passed. "+wkRetiredHint(t.c.k, level),
                   cull:[t.c]}); });

  /* what this level requires */
  L.need.forEach(k=>{
    if(kinds.includes(k)) return;
    const msg={
      open:"This level opens with a lead-in phrase — pick one from the Lead-in bank and put it first.",
      subj:"There's no subject. Who or what is this sentence about?",
      verb:"There's no verb. What does your subject DO?",
      idea:"Every level needs an IDEA — pick one from the blue Ideas bank.",
      q:"Every level needs EVIDENCE. Harvest a line from the passage and put it in.",
      eff:"Every level needs a PURPOSE — what does the writing make the reader feel or understand?"
    }[k];
    findings.push({sev:"err", text:msg});
  });

  /* grammar / word order */
  wkGrammar(kinds, tiles).forEach(f=>findings.push(f));

  /* Level 6 and up: the quote has to live INSIDE the sentence, not beside it.
     This is the actual gate between 5 and 6 — the Level 5 freebie leaves the
     quote sitting after a full stop, and the student's first job is to weave
     it in with a joiner. */
  if(level>=6){
    canvas.forEach((c,i)=>{
      if(c.k!=="q") return;
      const before=i>0?tiles[i-1]:null;
      if(!before || (before.c.k==="con" && (before.d.t==="."||before.d.t==="and")))
        findings.push({sev:"err", text:"Your quote is still sitting beside the sentence — from Level 6 it has to be woven in. Put 'when he says' or 'in the line' in front of it (and take out the full stop that cuts it off)."});
    });
  }

  /* quality */
  const subj=tiles.filter(t=>t.c.k==="subj"), verbs=tiles.filter(t=>t.c.k==="verb");
  if(subj.some(t=>t.d.q==="vague"))
    findings.push({sev:"err", text:"You've used a vague subject ('this', 'it', 'the quote', 'the book'). Name the actual thing — a body, a voice, a technique, or the author.",
                   cull:subj.filter(t=>t.d.q==="vague").map(t=>t.c)});
  if(level>=8 && !subj.some(t=>t.d.q==="craft"))
    findings.push({sev:"warn", text:"At this level the subject of your sentence should be a writing choice — the simile, the clipped dialogue, the narration, or Fraillon herself."});
  if(level>=9 && !verbs.some(t=>t.d.q==="pos"))
    findings.push({sev:"warn", text:"At the top of the ladder the verb should say what the writing does to US — positions the reader to, invites the reader to question, denies the reader."});
  if(level>=9 && !tiles.some(t=>(t.c.k==="eff") && t.d.q==="interp"))
    findings.push({sev:"warn", text:"Level 9 asks what the writing withholds or makes us accept. Pick one of the interpretive endings — the ones about what the reader is given or denied."});
  if(level>=7 && verbs.some(t=>t.d.q==="weak"))
    findings.push({sev:"warn", text:"That verb is flat. Trade up to an analytical verb — reveals, suggests, exposes, betrays, emphasises.",
                   cull:verbs.filter(t=>t.d.q==="weak").map(t=>t.c)});
  tiles.filter(t=>t.c.k==="q").forEach(t=>{
    const th=t.d.seg.themes||{};
    if(!Object.keys(th).length) findings.push({sev:"warn", text:"Your quote is "+t.d.seg.note+". Swap it for a line that shows the idea.", cull:[t.c]});
    else if(!th[focus]) findings.push({sev:"warn", text:"That quote is "+t.d.seg.note+" — but your focus is "+wkFocusLabel()+". Match the quote to the focus, or switch focus.", cull:[t.c]});
  });
  tiles.filter(t=>t.c.k==="idea"||t.c.k==="eff").forEach(t=>{
    if(t.d.q==="weak") findings.push({sev:"warn", text:t.d.fb, cull:[t.c]});
    else if(t.d.themes && !t.d.themes.includes(focus))
      findings.push({sev:"warn", text:"Your ending is about a different idea than your focus ("+wkFocusLabel()+"). Match them — or switch your focus chip.", cull:[t.c]});
  });

  WK.level=wasLevel;
  return findings;
}

/* What to trade a retired tile FOR, by the kind of tile it is. */
function wkRetiredHint(kind, level){
  if(kind==="idea") return level>=9
    ? "Up here the idea is the representation itself: how a person or a place is put in front of the reader."
    : "Grow it into an issue: the Idea bank now offers “the issue of…” tiles that name what the moment is about.";
  if(kind==="verb") return "Reporting verbs (shows, is about, describes) retire here. Trade it for an analytical one: reveals, conveys, exposes, emphasises.";
  if(kind==="eff")  return level>=9
    ? "The interpretive endings are the ones up here: what the writing withholds, or makes the reader accept."
    : "Plain feeling-endings retire. Say what the writing makes the reader understand, not what it makes them feel.";
  if(kind==="subj") return "Plot-only subjects retire. Up here the subject of your sentence is a writing choice: the simile, the narration, the clipped dialogue, or Fraillon herself.";
  return "Swap it for one of the tiles that unlocked at this level.";
}

function wkVerdict(findings){
  return findings.some(f=>f.sev==="err") ? "err" : findings.length ? "warn" : "ok";
}
function wkCheckTail(findings){
  const fb=$("fb"), L=wkLevel();
  const level=wkVerdict(findings);
  /* Rails is the teacher demonstrating: nothing it does may reach the record. */
  if(!WK.rails && !WK.tried["L"+WK.level]){ WK.tried["L"+WK.level]=true; recFirst("wk.build.L"+WK.level, level==="ok"); }

  if(level==="ok"){
    /* Level 9 goes on the wall as the pair: the kept Level 8 sentence and the
       new one about the reader, together. */
    WK.versions[WK.level] = (WK.level===9 && WK.versions[8])
      ? {t:WK.versions[8].t+" "+wkText(), h:WK.versions[8].h+" "+wkTextHtml()}
      : {t:wkText(), h:wkTextHtml()};
    WK.justIdx=wkLevelIdx();
    /* On rails the demo stops here, so nothing re-renders the wall afterwards
       and the payoff — the two sentences side by side, where it started and
       where it landed — would never appear. Fill the cell in place. */
    if(WK.rails){
      const cells=document.querySelectorAll(".wag2 .ex");
      const cell=cells[cells.length-1];
      if(cell){
        cell.className="wcell ex filled justplaced";
        cell.innerHTML=`<div class="wresp">${wkTextHtml()}</div>`;
        const head=document.querySelectorAll(".wag2 .head");
        const h=head[head.length-1]; if(h) h.classList.add("done");
      }
    }
    /* the highest rung they've written at — what the report quotes */
    if(!WK.rails){ S.wkLevel=Math.max(S.wkLevel||0, WK.level); save(); }
    const next=WK_LEVELS[wkLevelIdx()+1];
    fb.className="feedback ok";
    fb.innerHTML="<b>Level "+WK.level+" reached.</b> "+esc(L.why)+
      (WK.rails ? "" : next?"":" Top of the ladder.");
    const btn=document.createElement("button");
    btn.id="liftBtn"; btn.className="btn btn-primary";
    /* the demo stops where it was aimed: Year 7, then the four colours */
    btn.textContent = WK.rails ? "The four colours →" : next ? "Lift it to Level "+next.n+" →" : "Finish the climb →";
    btn.onclick = WK.rails ? teachColours : next ? wkLift : wkFinishClimb;
    $("wkrow").insertBefore(btn, $("wkrow").firstChild);
  } else {
    fb.className="feedback "+(level==="err"?"bad":"warn");
    fb.innerHTML="<b>"+(level==="err"?"Not there yet.":"Close — here's how to lift it:")+"</b><ul>"+
      findings.map(f=>"<li>"+esc(f.text)+"</li>").join("")+"</ul>";
    if(wkCull(findings)) wkFillBins();
  }
}
function wkLift(){
  const next=WK_LEVELS[wkLevelIdx()+1];
  if(!next) return wkFinishClimb();
  WK.level=next.n;
  /* Level 9 is a second sentence, not a fourth rewrite of the first: the
     Level 8 sentence is kept and shown locked, the canvas clears, and the
     banks come down to the three parts the new sentence needs. */
  if(next.n===9) WK.canvas=[];
  renderWkBuild();
  const fb=$("fb");
  fb.className="feedback warn";
  fb.innerHTML="<b>Level "+next.n+" — "+esc(next.name)+".</b> "+esc(next.goal)+
    (next.retires?" <br><b>Watch out:</b> "+esc(next.retires):"");
}
function wkFinishClimb(){
  if(WK.rails){ teachColours(); return; }
  const finalT=(WK.versions[WK.level]&&WK.versions[WK.level].t)||wkText();
  if(!S.kept.includes(finalT)) S.kept.push(finalT);
  S.done.wk=true; save();
  const sc=scoreFor("wk");
  let h=`<h2>Analysis workshop — the climb</h2>
  <div class="panel"><p style="margin:0 0 10px"><b>${sc.got}/${sc.total} first-attempt.</b> Your sentences:</p>`;
  WK_LEVELS.forEach(lv=>{ const vv=WK.versions[lv.n]; if(!vv) return; const v=vv.t;
    h+=`<div class="climbrow done" style="margin-bottom:8px">
      <div class="climbhead"><span class="cl">Level ${lv.n} · ${esc(lv.name)}</span>
      <span class="cvic">${esc(lv.focus||lv.vic)}</span></div>
      <div class="cmine">${vv.h||esc(v)}</div>
      <div class="cwhy">${lv.exp||""}</div></div>`; });
  h+=`<p class="lead" style="margin:10px 0 0"></p></div>
  <div class="btnrow"><button class="btn" onclick="runWk()">Climb again with a new focus</button>
  <button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  $("body").innerHTML=h;
}

/* ---------- WORD NOTEPAD ----------
   A little notepad in the corner, on every screen. It reads the vocab hub's
   own storage live: sets you haven't met stay locked (word visible, parts
   hidden) with a jump straight to that set — and the vocab hub offers the
   trip back to exactly where you were. Mastered words also light up inside
   the reading passages; tapping one decomposes it into its morphemes. */
let lastArg=null;
let GP={open:false,set:"all",az:false,exp:null,view:"page"};
let GPAGE=[];  /* glossary words found on the screen right now */
const GRTL={ar:1,fa:1};
function vocabSt(){ try{ return JSON.parse(localStorage.getItem("bonesparrow.vocabhub.v1"))||{}; }catch(e){ return {}; } }
function glossLang(){ const pr=readProfile(); return (pr&&pr.lang)||""; }
function glossStudied(setId){ const V=vocabSt(); return !!(V.lessons&&V.lessons[setId]&&V.lessons[setId].studied); }
function glossState(w){ const V=vocabSt(); const ws=(V.wstat||{})[w]; return (ws&&ws.mastered)?"mastered":"met"; }
function escJs(t){ return String(t).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

function glossMount(){
  if(!$("gnoteBtn")){
    const b=document.createElement("button");
    b.id="gnoteBtn"; b.title="My word notepad"; b.setAttribute("aria-label","My word notepad");
    b.innerHTML=`\ud83d\udcd3<span class="gbadge" id="gbadge"></span>`;
    b.onclick=()=>{ GP.open=!GP.open; if(GP.open) GP.view=GPAGE.length?"page":"all"; renderGloss(); };
    document.body.appendChild(b);
    const pn=document.createElement("div"); pn.id="gpanel"; document.body.appendChild(pn);
    /* Screens redraw inside a module too (every quiz question), so watch the
       body rather than re-scanning from each render site. */
    const bd=$("body");
    if(bd && window.MutationObserver){
      let t=null;
      new MutationObserver(()=>{ clearTimeout(t); t=setTimeout(()=>{
        const before=GPAGE.join("|"); glossScan();
        if(GP.open && GP.view==="page" && GPAGE.join("|")!==before) renderGloss();
      }, 60); }).observe(bd, {childList:true, subtree:true});
    }
  }
  glossScan();
  renderGloss();
}
/* What book words are actually on screen right now? Drives the badge and the
   notepad's default view. */
function glossScan(){
  GPAGE=[];
  document.querySelectorAll("#body .gw").forEach(el=>{
    const w=el.dataset.w; if(w && !GPAGE.includes(w)) GPAGE.push(w);
  });
  const bd=$("gbadge");
  if(bd){
    const locked=GPAGE.filter(w=>{ const h=glossFindBase(w); return h && !glossStudied(h.g.set); }).length;
    bd.textContent = GPAGE.length ? String(GPAGE.length) : "";
    bd.className = "gbadge" + (GPAGE.length? (locked? " todo":" ok") : "");
  }
}
function renderGloss(){
  const pn=$("gpanel"); if(!pn) return;
  if(!GP.open){ pn.style.display="none"; return; }
  pn.style.display="flex"; pn.className="gpanel";
  const lang=glossLang();
  let body="", tools="";

  if(GP.view==="page"){
    /* the words that are actually on the page in front of them */
    const hits=GPAGE.map(w=>glossFindBase(w)).filter(Boolean);
    body = hits.length
      ? `<div class="gsec">On this page (${hits.length})</div>`+
        hits.map(o=>glossRow(o.g,o.w,lang)).join("")
      : `<div class="glock">No book words from your list on this page. Try the whole list below.</div>`;
    tools = `<button class="gaz on">On this page</button>
             <button class="gaz" onclick="GP.view='all';GP.exp=null;renderGloss()">All my words →</button>`;
  } else {
    let sets=GLOSSARY.slice();
    if(GP.set!=="all") sets=sets.filter(g=>g.set===GP.set);
    if(GP.az){
      const all=[];
      sets.forEach(g=>g.words.forEach(w=>all.push({g,w})));
      all.sort((a,b)=>a.w.w.localeCompare(b.w.w));
      body=all.map(o=>glossRow(o.g,o.w,lang)).join("");
    } else {
      sets.forEach(g=>{
        const open=glossStudied(g.set);
        body+=`<div class="gsec">${esc(g.t)}${open?"":" \ud83d\udd12"}</div>`;
        if(!open) body+=`<div class="glock">Not met yet — <button class="glink" onclick="glossGo('${escJs(g.set)}')">meet these words in the Vocab Hub →</button></div>`;
        body+=g.words.map(w=>glossRow(g,w,lang)).join("");
      });
    }
    const opts=[`<option value="all"${GP.set==="all"?" selected":""}>All chapters</option>`]
      .concat(GLOSSARY.map(g=>`<option value="${esc(g.set)}"${GP.set===g.set?" selected":""}>${esc(g.t)}</option>`)).join("");
    tools = `${GPAGE.length?`<button class="gaz" onclick="GP.view='page';GP.exp=null;renderGloss()">← On this page</button>`:""}
      <select onchange="GP.set=this.value;GP.exp=null;renderGloss()" aria-label="filter by chapter">${opts}</select>
      <button class="gaz${GP.az?" on":""}" onclick="GP.az=!GP.az;renderGloss()">A–Z</button>`;
  }

  pn.innerHTML=`
   <div class="ghead"><span>\ud83d\udcd3 My word notepad</span>
     <button class="gx" onclick="GP.open=false;renderGloss()" aria-label="close">×</button></div>
   <div class="gtools">${tools}</div>
   <div class="gbody">${body||`<div class="glock">Nothing here yet.</div>`}</div>
   <div class="gfoot"><i class="hint ok"></i> unlocked · <i class="hint todo"></i> still in the Vocab Hub</div>`;
  const on=pn.querySelector(".gword.on");
  if(on) on.scrollIntoView({block:"nearest"});
}
/* open the notepad focused on one word — what a click in the passage does */
function glossOpenAt(word){
  GP.open=true; GP.view="page"; GP.exp=word;
  if(!GPAGE.includes(word)) GP.view="all";
  renderGloss();
}
function glossRow(g,w,lang){
  if(!glossStudied(g.set)){
    const on=GP.exp===w.w;
    return `<div class="gword locked${on?" on":""}" onclick="GP.exp=(GP.exp==='${escJs(w.w)}')?null:'${escJs(w.w)}';renderGloss()">
      <span class="st"></span><span class="gt">${esc(w.w)}</span><span class="glk">\ud83d\udd12</span></div>`+
      (on?`<div class="gdetail"><div class="gm">You haven't met this one yet — its word-parts are still locked.</div>
        <button class="glink" onclick="glossGo('${escJs(g.set)}')">meet it in the Vocab Hub →</button></div>`:"");
  }
  const st=glossState(w.w), on=GP.exp===w.w;
  let d="";
  if(on){
    const parts=w.parts?w.parts.map(t=>`<span class="mchip"><b>${esc(t[0])}</b><small>${esc(t[1])}</small></span>`).join(`<span class="mplus">+</span>`):"";
    const tr=(lang&&w.tr&&w.tr[lang])?`<div class="gtr"${GRTL[lang]?' dir="rtl"':""} lang="${esc(lang)}">${esc(w.tr[lang])}</div>`:"";
    d=`<div class="gdetail">${parts?`<div class="gparts">${parts}</div>`:""}<div class="gm">${esc(w.m)}</div>${tr}
       <button class="glink" onclick="glossGo('${escJs(g.set)}')">practise it in the Vocab Hub →</button></div>`;
  }
  return `<div class="gword ${st}${on?" on":""}" onclick="GP.exp=(GP.exp==='${escJs(w.w)}')?null:'${escJs(w.w)}';renderGloss()">
    <span class="st"></span><span class="gt">${esc(w.w)}</span><span class="gpos">${esc(w.pos)}</span>${st==="mastered"?`<span class="gtick">✓</span>`:""}</div>`+d;
}
function glossGo(setId){
  localStorage.setItem("bonesparrow.return.v1",
    JSON.stringify({href:"BoneSparrowReadingHub.html", screen:screen, arg:lastArg||null}));
  location.href="BoneSparrowVocabHub.html#set-"+encodeURIComponent(setId);
}

/* ---- book words light up inside passages ----
   Every word from the unit's vocabulary is marked, not just the mastered
   ones: green says "you own this", amber says "this one's still waiting for
   you in the Vocab Hub". Either way it's a door into the notepad. */
function glossAllWords(){
  const out=[];
  GLOSSARY.forEach(g=>g.words.forEach(w=>out.push(w)));
  return out;
}
function glossWordClass(word){
  const hit=glossFindBase(word); if(!hit) return "";
  if(!glossStudied(hit.g.set)) return "gw-todo";
  const V=vocabSt(), ws=(V.wstat||{})[word];
  return (ws&&ws.mastered) ? "gw-ok" : "gw-part";
}
function glossFindBase(m){
  const k=String(m).toLowerCase();
  for(const g of GLOSSARY){ for(const w of g.words){
    const b=w.w.toLowerCase();
    if(k===b||k===b+"s"||k===b+"es"||k===b+"d"||k===b+"ed") return {g,w};
  } }
  return null;
}
function glossify(html){
  const words=glossAllWords().map(w=>w.w);
  if(!words.length) return html;
  words.sort((a,b)=>b.length-a.length);
  const re=new RegExp("\\b("+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:s|es|d|ed)?").join("|")+")\\b","gi");
  const seen={};
  return String(html).split(/(<[^>]*>)/).map(part=>{
    if(part.charAt(0)==="<") return part;
    return part.replace(re, m=>{
      const hit=glossFindBase(m); if(!hit) return m;
      if(seen[hit.w.w]) return m;
      seen[hit.w.w]=1;
      const cls=glossWordClass(hit.w.w);
      const tip=cls==="gw-todo" ? "A word from your list — not met yet. Click to see it."
              : cls==="gw-ok" ? "You've mastered this one. Click to take it apart."
              : "A word from your list. Click to see it.";
      return `<button class="gw ${cls}" data-w="${esc(hit.w.w)}" title="${esc(tip)}" onclick="morphPop(event)">${m}</button>`;
    });
  }).join("");
}
function morphPop(ev){
  ev.stopPropagation();
  const word=ev.currentTarget.dataset.w;
  const hit=glossFindBase(word); if(!hit) return;
  morphPopClose();
  /* not met yet: no morphemes to show, so open the notepad at the word
     instead — that's where the way into the Vocab Hub lives */
  if(!glossStudied(hit.g.set)){ glossOpenAt(word); return; }
  const lang=glossLang();
  const parts=hit.w.parts?hit.w.parts.map((t,i)=>`<span class="mchip pop" style="animation-delay:${140+i*170}ms"><b>${esc(t[0])}</b><small>${esc(t[1])}</small></span>`).join(`<span class="mplus">+</span>`):"";
  const tr=(lang&&hit.w.tr&&hit.w.tr[lang])?`<div class="gtr"${GRTL[lang]?' dir="rtl"':""} lang="${esc(lang)}">${esc(hit.w.tr[lang])}</div>`:"";
  const d=document.createElement("div"); d.className="morphpop"; d.id="morphpop";
  d.innerHTML=`<button class="gx" onclick="morphPopClose()" aria-label="close">×</button>
    <div class="mpw">${esc(hit.w.w)}</div>
    ${parts?`<div class="gparts">${parts}</div>`:""}
    <div class="gm">${esc(hit.w.m)}</div>${tr}
    <div class="mpnote">${glossWordClass(hit.w.w)==="gw-ok"?"from your word notepad — mastered ✓":"from your word notepad — keep drilling it"}</div>
    <button class="glink" onclick="morphPopClose();glossOpenAt('${escJs(hit.w.w)}')">open my notepad here →</button>`;
  document.body.appendChild(d);
  const r=d.getBoundingClientRect();
  let x=Math.min(Math.max(8,ev.clientX-r.width/2), window.innerWidth-r.width-8);
  let y=ev.clientY+16;
  if(y+r.height>window.innerHeight-8) y=Math.max(8, ev.clientY-r.height-16);
  d.style.left=x+"px"; d.style.top=y+"px";
  setTimeout(()=>document.addEventListener("pointerdown", morphPopAway),0);
}
function morphPopAway(e){
  const pp=$("morphpop");
  if(!pp){ document.removeEventListener("pointerdown", morphPopAway); return; }
  if(!pp.contains(e.target)){ pp.remove(); document.removeEventListener("pointerdown", morphPopAway); }
}
function morphPopClose(){ const pp=$("morphpop"); if(pp) pp.remove(); }


/* ---------- TEACHER MODE · the deck ----------
   State lives here and nowhere else: TM is thrown away on exit, so nothing a
   teacher does at the front of the room can touch a student's saved work. */
let TM=null;

function runTeach(at){
  TM={i: at||0};
  document.addEventListener("keydown", teachKeys);
  renderTeach();
}
function teachNext(){ if(TM.i < TEACH.slides.length-1){ TM.i++; renderTeach(); } }
function teachPrev(){ if(TM.i > 0){ TM.i--; renderTeach(); } }

/* The Year 7 wall sentence with every colour on, or with all but one class
   unwrapped to plain ink, so each slide lights a single part. */
function teachSentence(only){
  const r=WK_WALL.resps.find(x=>x.id==="w7");
  let h=r.h||esc(r.t);
  if(only) h=h.replace(/<em class="hl-(\w+)">([^]*?)<\/em>/g,
    (m,cls,text)=> cls===only ? m : text);
  return h;
}

function renderTeach(){
  const sl=TEACH.slides[TM.i], n=TEACH.slides.length;
  if(sl.k==="title") sl.h=WK_WALL.q;
  let inner="";
  if(sl.k==="title"){
    inner=`<div class="tmsent"><span>${teachSentence(null)}</span></div>${wkColourKey()}`;
  } else if(sl.k==="part"){
    inner=`<div class="tmsent"><span>${teachSentence(sl.c)}</span></div>
      <p class="tmbrief">${sl.brief}</p>`;
  } else if(sl.k==="rails"){
    /* the sentence the builder is holding, in the same colours, so the room
       reads it before anyone touches a tile */
    inner=`<div class="tmsent"><span>Subhi <em class="hl-verb">shows</em> <em class="hl-idea">fear in the camp</em>.
      <em class="hl-ev">\u201CMy throat is as dry as the dirt\u201D</em> which
      <em class="hl-eff">makes you feel sorry for him</em>.</span></div>`;
  }
  const last = TM.i===n-1;
  $("body").innerHTML=`<div class="teach">
    <div class="tmbar noprint">
      <span class="tmtag">Teacher mode</span>
      <span class="tmcount">${TM.i+1} / ${n}</span>
      <button class="linkbtn" onclick="teachExit()">Leave the deck (Esc)</button>
    </div>
    ${sl.h?`<h1 class="tmh ${sl.k==="part"?"tmh-"+sl.c:""}">${esc(sl.h)}</h1>`:""}
    ${sl.lead?`<p class="tmlead">${sl.lead}</p>`:""}
    ${inner}
    <div class="tmnav noprint">
      <button class="btn btn-ghost" onclick="teachPrev()" ${TM.i===0?"disabled":""}>← Back</button>
      ${last ? `<button class="btn btn-primary" onclick="teachRails()">Open the builder demo →</button>`
             : `<button class="btn btn-primary" onclick="teachNext()">Next →</button>`}
    </div>
  </div>`;
}


/* Dim every highlight in the Frayer sentence except the one named. Passing ""
   clears it. Class on the container, so one toggle repaints the whole thing. */
function teachLight(hl){
  const f=$("frayer"); if(!f) return;
  f.className = "frayer" + (hl ? " lit lit-"+hl.replace("hl-","") : "");
}
function teachExit(){
  document.removeEventListener("keydown", teachKeys);
  TM=null;
  document.body.classList.remove("rails");
  go("home");
}
function teachKeys(e){
  if(!TM) return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); if(TM.i!==undefined) teachNext(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); if(TM.i!==undefined) teachPrev(); }
  else if(e.key==="Escape"){ e.preventDefault(); teachExit(); }
}

/* The one slide: four colours, four questions, nothing else on it. */
function teachColours(){
  TM={};
  document.body.classList.remove("rails");
  document.addEventListener("keydown", teachKeys);
  document.body.classList.remove("wide");
  $("homeBtn").style.display="none";
  const tb=$("teachBtn"); if(tb) tb.style.display="none";
  screen="teach";
  /* Frayer-shaped: the Year 7 sentence in the middle, one card per corner,
     each card the colour of the part of the sentence it names. Hovering or
     tapping a card dims everything in the sentence except its own phrase, so
     the link is shown rather than described. */
  const card = c => `<div class="tmf tmf-${c.c} pos-${c.pos}"
      onmouseenter="teachLight('${c.hl}')" onmouseleave="teachLight('')"
      onclick="teachLight('${c.hl}')">
      <b>${esc(c.t)}</b><span>${esc(c.q)}</span></div>`;
  const at = p => TEACH_COLOURS.filter(c=>c.pos===p).map(card).join("");
  $("body").innerHTML=`<div class="teach">
    <div class="tmbar noprint"><span class="tmtag">Teacher mode</span>
      <button class="linkbtn" onclick="teachExit()">Leave (Esc)</button></div>
    <div class="frayer" id="frayer">
      ${at("tl")}${at("tr")}
      <div class="frsent"><span>${teachSentence(null)}</span></div>
      ${at("bl")}${at("br")}
    </div>
    <div class="tmnav noprint">
      <button class="btn btn-ghost" onclick="teachRails()">← back to the demo</button>
      <button class="btn btn-ghost" onclick="runTeach(0)">the slides</button>
      <button class="btn btn-primary" onclick="teachExit()">Done</button>
    </div>
  </div>`;
}

/* ---------- TEACHER MODE · the builder on rails ----------
   The real builder, preloaded: focus locked to Protection and survival, level
   set to 7, and the TEACH_RAILS sentence on the canvas with its one flaw. The
   rails flag makes every write to the student's record a no-op, so a teacher
   can demonstrate on any signed-in device without leaving a mark on it. */
function teachRails(){
  document.removeEventListener("keydown", teachKeys);
  TM=null;
  WK={armed:null, placed:{}, firstTried:{}, focus:TEACH_RAILS_FOCUS, canvas:[], harvested:[],
      level:TEACH_RAILS_LEVEL, versions:{}, tried:{}, wallStart:0, climbStart:0, rails:true, culled:{}};
  const lists={open:WK_BUILD.opens, subj:WK_BUILD.subjects, verb:WK_BUILD.verbs,
               idea:WK_BUILD.ideas, eff:WK_BUILD.effects, con:WK_BUILD.cons};
  TEACH_RAILS.forEach(([k,t])=>{
    if(k==="q"){
      const qi=WK_BUILD.segs.findIndex(sg=>sg.t.includes(t));
      if(qi>=0){ if(!WK.harvested.includes(qi)) WK.harvested.push(qi); WK.canvas.push({k:"q",i:qi}); }
    } else {
      const ti=lists[k].findIndex(x=>x.t===t);
      if(ti>=0) WK.canvas.push({k,i:ti});
    }
  });
  /* The starting sentence goes on the wall, in the Level 5 column, before the
     demo touches it. The whole point of the demo is the difference between
     where it started and where it lands, and a class cannot see a difference
     from one sentence. */
  WK.versions[5]={t:wkText(WK.canvas), h:wkTextHtml(WK.canvas)};
  screen="wk";
  $("homeBtn").style.display="inline";
  document.body.classList.add("wide","rails");
  renderWkBuild();
}

/* ---------- REPORT ---------- */
function vcode(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return "V-"+Math.abs(h).toString(16).toUpperCase().slice(0,6); }
const MISS_LABELS={qr1:"Quickread: the Night Sea",qr2:"Quickread: caught by Beaver",fig:"Figurative → literal",voice:"Voice fingerprint",ev:"Evidence builder",wk:"Analysis workshop",
  qr3:"Quickread: lucky",qr4:"Quickread: what Alpha does to a person",qr5:"Quickread: the bone sparrow",
  qr6:"Quickread: a story from just Outside",qr7:"Quickread: Aussie Boy",qr8:"Quickread: Jimmie wants to know"};
const RECOMMEND={
 qr1:"Reread with a pencil (Lesson 09 annotation strategies) and use the chapter audio recordings while following along.",
 qr2:"Reread with a pencil (Lesson 09 annotation strategies) and use the chapter audio recordings while following along.",
 fig:"Revisit Lesson 09 (figurative language) and the simile/metaphor rows of 12w — Key ideas in the novel.",
 voice:"Revisit Lesson 07 — Character Voice before recording your voice memo; practise the word-class swap on two of your own sentences.",
 ev:"Revisit Lessons 04 and 06 (finding and embedding evidence). If joining clauses was the sticking point, do one round of Grammar Hub → Sentence Structure at your level, then rebuild the sentence.",
 wk:"Rebuild the WAGOLL wall in the Analysis workshop, then revisit Lessons 16–17 (writing about how the text is written).",
 qr3:"Reread chapter 6 with a pencil and mark every phrase that belongs to the town rather than to the Centre.",
 qr4:"Reread the Alpha pages and mark the sentence lengths: the long list, then the short verdict.",
 qr5:"Reread chapter 10 and list what the necklace means to Jimmie beside what it means to Subhi.",
 qr6:"Reread chapters 13–14 and mark every place a feeling is written as light, weather or food rather than named.",
 qr7:"Reread the Aussie Boy pages beside Maá's decision to stop speaking Rohingya, and note what each one costs.",
 qr8:"Reread Jimmie's questions and mark the punctuation: which ones are questions, and which have given up being questions."};
function renderReport(){
  const mods=["qr1","qr2","fig","voice","ev","wk","qr3","qr4","qr5","qr6","qr7","qr8"];
  let rows="", worst=null, worstErr=-1, anyDone=false;
  mods.forEach(m=>{
    const sc=scoreFor(m); if(!sc.total) return;
    anyDone=true;
    const err= 1 - sc.got/sc.total;
    if(err>worstErr && sc.total>=3){ worstErr=err; worst=m; }
    rows+=`<tr><td>${esc(MISS_LABELS[m])}</td><td><span class="${scoreBand(sc.got,sc.total)}">${sc.got} / ${sc.total}</span></td><td>${S.done[m]?"finished":"in progress"}</td></tr>`;
  });
  const missed=Object.keys(S.first).filter(k=>!S.first[k]);
  const scAll=mods.reduce((a,m)=>{const x=scoreFor(m);return{got:a.got+x.got,total:a.total+x.total}},{got:0,total:0});
  const code=vcode(JSON.stringify(S.first)+S.fname+S.lname+S.sid);
  const teach = !anyDone ? "" :
    `This student worked through the Reading &amp; Evidence Hub (reading progress set to ${S.chapter>20?"the whole novel":"chapter "+S.chapter}${S.eal?", EAL support on":""}). Every wrong answer was retried until correct (mastery loop), but the scores above are <b>first attempts only</b>  `
    + (worst!==null && worstErr>0.34 ? `The clearest next step: <b>${esc(MISS_LABELS[worst])}</b> — ${esc(RECOMMEND[worst])}` :
       worst!==null && worstErr>0 ? `Errors were spread thin; the softest area was <b>${esc(MISS_LABELS[worst])}</b>. ${esc(RECOMMEND[worst])}` :
       `A clean first-attempt run across everything attempted — extension: the 'stretch' rows of 12w, or drafting the voice memo unassisted.`);
  $("body").innerHTML=`<div class="eyebrow">My report</div><h2>Reading &amp; Evidence Hub — report</h2>
  <p class="lead"><b>${esc(S.fname)} ${esc(S.lname)}</b> · student ID ${esc(S.sid)} · first-attempt scores · overall <b>${scAll.got}/${scAll.total}</b>
  <button class="linkbtn noprint" onclick="go('id')">edit details</button></p>
  <table class="rpt"><tr><th>Activity</th><th>First attempt</th><th>Status</th></tr>${rows||`<tr><td colspan="3">Nothing attempted yet — go do an activity first.</td></tr>`}</table>
  ${S.kept.length?`<div class="panel"><b>My analytical sentences (Analysis workshop):</b>${S.kept.map((k,i)=>`<div class="kept" style="margin-top:8px">${i+1}. ${esc(k)}</div>`).join("")}</div>`:""}
  ${missed.length?`<div class="panel"><b>Missed on first try (${missed.length}):</b> <span style="color:var(--muted);font-size:13px">${missed.map(esc).join(", ")}</span></div>`:""}
  <div class="panel"><b>What this tells your teacher:</b> ${teach||"Attempt at least one activity to generate the summary."}</div>
  <p class="lead">Verification code: <span class="vcode">${code}</span></p>
  <div class="btnrow noprint">
    <button class="btn btn-primary" onclick="S.done.rpt=true;save();window.print()">Print / save as PDF</button>
    <button class="btn btn-ghost" onclick="go('home')">← back to the hub</button>
  </div>`;
}

/* ---------- deep links ----------
   Every screen in this hub has an address, so a teacher can post a link
   straight to one activity instead of "open the hub and scroll": #teach for
   the projector deck, #wk for the workshop, #qr5 for a quickread, and so on.
   Unknown or not-yet-reached targets fall through to the home screen rather
   than erroring, and the chapter gate still applies once inside. */
function hashTarget(){
  const h=(location.hash||"").replace(/^#/,"");
  if(!h) return null;
  if(h==="teach") return {s:"teach"};
  const m=MODULES.find(x=>x.id===h);
  if(m) return {s:m.kind, arg:m.id};
  if(["fig","voice","ev","wk","home"].includes(h)) return {s:h};
  return null;
}
(function boot(){
  if(location.hash==="#report"){ location.replace("index.html#report"); return; }
  if(location.hash==="#resume"){
    /* back from the vocab hub — pick up exactly where the student left off */
    try{
      const m=JSON.parse(localStorage.getItem("bonesparrow.return.v1"));
      localStorage.removeItem("bonesparrow.return.v1");
      history.replaceState(null,"",location.pathname);
      if(m && m.screen){ go(m.screen, m.arg||undefined); return; }
    }catch(e){}
  }
  const t=hashTarget();
  if(t && idOk()){ go(t.s, t.arg); return; }
  /* not signed in yet: remember where they were headed and go there after */
  if(t) PENDING_HASH=t;
  go("home");
})();
</script>
