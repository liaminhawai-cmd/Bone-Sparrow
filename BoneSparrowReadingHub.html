<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>The Bone Sparrow — Reading &amp; Evidence Hub</title>
<style>
/* ============================================================
   Palette matches Grammar Hub / Bone Sparrow Pre-reading Trainer
   so the suite reads as one. Accent doubles as the wrong-answer
   colour, so SELECTED state always uses --ink, never accent.
   ============================================================ */
:root{
  --bg:#f4efe6; --paper:#fbf7ee; --ink:#1f1f1f; --muted:#6b6256;
  --line:#d8cfbb; --line-soft:#e8e0cd; --accent:#a83232;
  --correct:#2f6a3e; --wrong:#a83232; --okbg:#eef5ee; --badbg:#f7ecec;
  --warnbg:#faeeda; --warntx:#854f0b;
  /* tile roles (sentence-builder colour key: colour is metalanguage) */
  --stem-bg:#d6eafc; --stem-tx:#0b447c;   /* blue   = sentence stem   */
  --quote-bg:#fff3b0; --quote-tx:#7a5a00; /* yellow = embedded quote  */
  --tail-bg:#fbeaf0;  --tail-tx:#993556;  /* pink   = ending / effect */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);
     display:flex;justify-content:center;padding:18px 10px 40px}
body.wide .container{max-width:min(1600px,98vw)}
@media (min-width:1500px){ body.wide .container{padding-left:34px;padding-right:34px} }
.container{width:100%;max-width:880px;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;padding:26px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:19px;margin:0 0 8px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.eyebrow{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.topbar .where{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.linkbtn:hover{text-decoration:underline}
a.linkbtn{text-decoration:none}
a.menulink{border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:#fff}
a.menulink:hover{border-color:var(--accent);text-decoration:none}
a{color:var(--accent)}
.btn{padding:11px 18px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
     cursor:pointer;background:var(--paper);color:var(--ink);transition:all .15s ease;font-family:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:#8c2828}
.btn-ghost{background:var(--bg);color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
p.lead{color:var(--muted);font-size:13.5px;margin:0 0 10px}

/* ---- home step list ---- */
.step{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
      border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;
      font-family:inherit;font-size:15px;transition:border-color .15s}
.step:hover:not(:disabled){border-color:var(--accent)}
.step:disabled{opacity:.55;cursor:not-allowed}
.step .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step.done .num{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
.step .t{font-weight:700}
.step .d{color:var(--muted);font-size:12.5px}
.step .tag{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
           color:var(--muted);white-space:nowrap}
.step.done .tag{color:var(--correct)}
/* Score bands. The number is the information and the colour is a second read
   of it, never the only one, so a colour-blind student loses nothing: "3/9
   first try" says the same thing in text. Bands are on the FIRST-ATTEMPT
   score, which is the only score this hub reports. */
.step .tag.band4,.rpt td .band4{color:#1e6b3a}   /* 85% and up  */
.step .tag.band3,.rpt td .band3{color:#7a6410}   /* 70 to 84    */
.step .tag.band2,.rpt td .band2{color:#a8541b}   /* 50 to 69    */
.step .tag.band1,.rpt td .band1{color:#9a3324}   /* under 50    */
.step.done .tag.band3{color:#7a6410}
.step.done .tag.band2{color:#a8541b}
.step.done .tag.band1{color:#9a3324}
.rpt td .band4,.rpt td .band3,.rpt td .band2,.rpt td .band1{font-weight:800}

/* ---- quiz ---- */
.stim{font-family:Georgia,serif;font-size:17px;background:#fff;border:1px solid var(--line);
      border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;margin:0 0 12px}
.stim .pg{display:block;margin-top:6px;font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--muted)}
.q{font-size:16px;font-weight:700;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.opts.chips{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
     font-family:inherit;font-size:14.5px;cursor:pointer;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--correct)}
.opt.wrongpick{background:var(--badbg);border-color:var(--wrong)}
.opt.nearpick{background:var(--warnbg);border-color:var(--warntx)}
.feedback{display:none;border-radius:8px;padding:11px 13px;font-size:14px;margin:0 0 12px;line-height:1.5;
  max-height:32vh;overflow-y:auto}
.feedback.show{display:block;animation:rise .2s ease}
.feedback.ok{display:block;background:var(--okbg);color:var(--correct);animation:rise .2s ease}
.feedback.bad{display:block;background:var(--badbg);color:#7c2626;animation:rise .2s ease}
.feedback.warn{display:block;background:var(--warnbg);color:var(--warntx);animation:rise .2s ease}
.feedback ul{margin:6px 0 0 18px;padding:0}
.feedback li{margin:0 0 4px}
.requote{font-family:Georgia,serif;background:#fff;border:1px solid var(--line);border-radius:6px;
         padding:8px 10px;margin-top:8px;color:var(--ink);font-size:14.5px}
.progress-track{height:8px;background:var(--line-soft);border-radius:99px;margin:0 0 16px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ---- evidence passage ---- */
.passage{font-family:Georgia,serif;font-size:16.5px;line-height:1.75;background:#fff;border:1px solid var(--line);
         border-radius:10px;padding:16px 18px;margin:0 0 12px}
.passage .pg{display:block;margin-top:8px;font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--muted)}
.seg{cursor:pointer;border-radius:4px;padding:1px 2px;border-bottom:2px solid transparent;transition:background .12s}
.seg:hover{background:var(--line-soft)}
.seg.picked{background:#efe6c8;border-bottom-color:var(--ink)}
.seg.hit{background:var(--okbg);border-bottom-color:var(--correct)}
.seg.miss{background:var(--badbg);border-bottom-color:var(--wrong)}
.idea-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fchoice{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-family:inherit;
         font-size:13.5px;font-weight:600;cursor:pointer}
.fchoice.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---- rubric ladder ---- */
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.lcard{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font-size:12px;
       line-height:1.35;cursor:pointer;font-family:inherit;text-align:left;transition:border-color .12s}
.lcard .lv{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block;margin-bottom:3px}
.lcard.now{border:2px solid var(--ink)}
.lcard.got{background:var(--okbg);border-color:var(--correct)}
.lcard.got .lv{color:var(--correct)}
.lcard.below{opacity:.55}
.ladder-hint{display:none;background:var(--bg);border:1px dashed var(--line);border-radius:8px;
             padding:10px 12px;font-size:13px;margin:0 0 12px}
.ladder-hint.show{display:block}
@media (max-width:640px){.ladder{grid-template-columns:repeat(2,1fr)}}

/* ---- sentence builder ---- */
.slotrow{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.slot{border:2px dashed var(--line);border-radius:10px;min-height:46px;padding:8px 10px;background:#fff;
      display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .slabel{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);flex:0 0 92px}
.slot .placed{border-radius:8px;padding:7px 10px;font-size:13.5px;cursor:pointer;border:1px solid transparent}
.slot .placed:after{content:" ✕";font-size:10px;color:var(--muted)}
.bins{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 0 12px}
@media (max-width:700px){.bins{grid-template-columns:1fr}}
.bin{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.bin h4{margin:0;padding:7px 10px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line-soft)}
/* No inner scrollbar: a bank that scrolls inside a page that also scrolls is
   two scroll surfaces under one thumb, and a tile dragged from a scrolled bank
   used to land against a canvas that had moved. The banks are as tall as their
   contents and the page does all the scrolling. */
.bin .binbody{padding:8px;display:flex;flex-direction:column;gap:6px;
  max-height:238px;overflow-y:auto;overflow-x:hidden}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;text-align:left;
      cursor:grab;font-family:inherit;transition:transform .1s, border-color .12s;touch-action:none}
.tile:hover{border-color:var(--ink)}
.tile.used{opacity:.4}
.bin.stems h4, .tile.k-stem{background:var(--stem-bg);color:var(--stem-tx)}
.bin.quotes h4, .tile.k-quote{background:var(--quote-bg);color:var(--quote-tx)}
.bin.tails h4, .tile.k-tail{background:var(--tail-bg);color:var(--tail-tx)}
.slot .placed.k-stem{background:var(--stem-bg);color:var(--stem-tx)}
.slot .placed.k-quote{background:var(--quote-bg);color:var(--quote-tx)}
.slot .placed.k-tail{background:var(--tail-bg);color:var(--tail-tx)}
.preview{font-family:Georgia,serif;font-size:16.5px;background:var(--bg);border:1px solid var(--line);
         border-radius:8px;padding:12px 14px;margin:0 0 12px;min-height:48px}
.preview .ph{color:var(--muted);font-size:13px;font-family:'Segoe UI',sans-serif}

/* ---- upgrader ---- */
.wag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
@media (max-width:640px){.wag{grid-template-columns:1fr}}
.grow{font-family:Georgia,serif;font-size:16.5px;line-height:1.6;background:#fff;border:1px solid var(--line);
      border-radius:10px;padding:14px 16px;margin:0 0 12px}
.grow .new{background:var(--okbg)}

/* ---- report ---- */
table.rpt{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 12px}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.rpt th{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.rowinp{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.rowinp label{font-size:12px;font-weight:700;display:block;margin-bottom:3px}
.rowinp input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.vcode{font-family:Georgia,serif;font-size:15px;letter-spacing:1px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ---- workshop: colour language, matching the EAL WAGOLL markers ----
   blue = language feature · orange = analytical verb ·
   yellow = embedded evidence · green = effect on the reader        */
:root{
  --feat-bg:#e7ddf6; --feat-tx:#4b2f7a;
  --verb-bg:#fae3cf; --verb-tx:#8a4b12;
  --ev-bg:#fff3b0;   --ev-tx:#7a5a00;
  --eff-bg:#dff0e2;  --eff-tx:#1f5c33;
  --idea-bg:#d6eafc; --idea-tx:#0b447c;
}
.hl-feat,.hl-verb,.hl-ev,.hl-eff,.hl-idea{font-style:normal;border-radius:4px;padding:1px 3px}
.hl-idea{background:var(--idea-bg);color:var(--idea-tx)}
.hl-feat{background:var(--feat-bg);color:var(--feat-tx)}
.hl-verb{background:var(--verb-bg);color:var(--verb-tx)}
.hl-ev{background:var(--ev-bg);color:var(--ev-tx)}
.hl-eff{background:var(--eff-bg);color:var(--eff-tx)}
.ckey{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.ckey span{display:flex;align-items:center;gap:6px}
.ckey .sw{width:13px;height:13px;border-radius:50%;display:inline-block}
.ckey .sw.idea,.sw.idea{background:#9ccbf2;border:1px solid var(--idea-tx)}
.ckey .sw.feat,.sw.feat{background:#c3aee8;border:1px solid var(--feat-tx)}
.ckey .sw.verb,.sw.verb{background:#f3b785;border:1px solid var(--verb-tx)}
.ckey .sw.ev,.sw.ev{background:#f2d34a;border:1px solid var(--ev-tx)}
.ckey .sw.eff,.sw.eff{background:#a4d4ae;border:1px solid var(--eff-tx)}
/* ---- workshop: the WAGOLL table (EAL sheet shape) ---- */
.wag2{display:grid;grid-template-columns:74px 52px repeat(3,1fr) 52px 34px;gap:0;margin:0 0 10px;
  border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line-soft)}
.wag2 .wcell{background:#fff;padding:9px 11px;font-size:12.5px;line-height:1.5;
  border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.wag2 .rowlab{background:var(--bg);color:var(--muted);font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;justify-content:center;text-align:center}
.wag2 .head{background:var(--bg)}
.wag2 .head .lvname{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.wag2 .head .lveal{font-size:10.5px;color:var(--muted);font-style:italic;margin-top:2px}
.wag2 .focus{font-family:Georgia,serif;font-size:13.5px}
.wag2 .vic{color:var(--muted);font-size:11.5px}
.wag2 .exp{font-size:11.5px;color:var(--muted);background:var(--paper)}
.wag2 .ex{min-height:64px}
.wag2 .ex.droppable{cursor:pointer;background:repeating-linear-gradient(45deg,#fff,#fff 8px,var(--bg) 8px,var(--bg) 16px)}
.wag2 .ex.droppable:hover{outline:2px solid var(--ink);outline-offset:-2px}
.wag2 .ex.filled{background:var(--okbg)}
.wag2 .ex.now{background:var(--bg);outline:2px solid var(--ink);outline-offset:-2px}
.wag2 .ex .wresp{font-family:Georgia,serif;font-size:12.5px;line-height:1.55}
.wag2 .ex .wempty{font-size:11px;color:var(--muted);font-style:italic}
.wag2 .head.active,.wag2 .focus.active,.wag2 .vic.active,.wag2 .exp.active{background:#f6f1e4}
.wag2 .head.done .lvname{color:var(--correct)}
/* the half-visible levels either side: clipped, faded, and clickable */
.wag2 .peek{cursor:pointer;overflow:hidden;position:relative;padding:9px 6px;font-size:11px;
  color:var(--muted);background:var(--bg);white-space:nowrap}
.wag2 .peek.empty{cursor:default;background:var(--bg);padding:0;border-right:0}
.wag2.nol{grid-template-columns:74px 0 repeat(3,1fr) 52px 34px}
.wag2.nor{grid-template-columns:74px 52px repeat(3,1fr) 0 34px}
.wag2.nol.nor{grid-template-columns:74px 0 repeat(3,1fr) 0 34px}
.wag2 .peek .lvname{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.wag2 .peek.l{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 78%);
  mask-image:linear-gradient(90deg,transparent 0,#000 78%);text-align:right;direction:rtl}
.wag2 .peek.r{-webkit-mask-image:linear-gradient(270deg,transparent 0,#000 78%);
  mask-image:linear-gradient(270deg,transparent 0,#000 78%)}
.wag2 .peek:not(.empty):hover{background:#f2ecdc;color:var(--ink)}
.wag2 .pager{border:1px solid var(--line);background:#fff;border-radius:6px;width:24px;height:28px;
  font-size:15px;cursor:pointer;color:var(--ink);font-family:inherit;padding:0}
.wag2 .pager:disabled{opacity:.3;cursor:not-allowed}
.wagnote{font-size:11px;color:var(--muted);margin:0 0 14px;text-align:right}
.ckey .sw,.wag2 .sw,.climbrow .sw{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:-1px;flex:none}
@media (max-width:640px){
  .wag2{grid-template-columns:56px 26px repeat(3,1fr) 26px 28px}
  .wag2 .wcell{padding:7px 6px;font-size:11.5px}
}
.wag2 .explock{font-style:italic;opacity:.55;font-size:11px}
.hl-feat,.hl-verb,.hl-ev,.hl-eff{transition:background .3s ease}
@keyframes lightUp{
  0%{background:transparent;box-shadow:none}
  40%{box-shadow:0 0 0 3px rgba(0,0,0,.06)}
  100%{box-shadow:none}
}
.lightup{animation:lightUp .55s ease both}
@keyframes expIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.wag2 .exp.reveal{animation:expIn .45s ease both}
@keyframes cellPop{0%{transform:scale(.985)}60%{transform:scale(1.008)}100%{transform:scale(1)}}
.wag2 .ex.justplaced{animation:cellPop .4s ease both}
/* ---- workshop: WAGOLL wall, horizontal (legacy) ---- */
.wallscroll{overflow-x:auto;margin:0 0 14px;padding-bottom:6px}
.wallcols{display:flex;gap:10px;min-width:min-content}
.wallcol{flex:0 0 240px;border:2px dashed var(--line);border-radius:10px;padding:10px 12px;background:#fff;
  display:flex;flex-direction:column}
.wallcol.droppable{cursor:pointer}
.wallcol.droppable:hover{border-color:var(--ink)}
.wallcol.filled{border-style:solid;border-color:var(--correct);background:var(--okbg)}
.wallcol .wl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.wallcol .wdesc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.wallcol .weal{font-size:11px;color:var(--muted);margin-top:3px;font-style:italic}
.wallcol .wresp{font-family:Georgia,serif;font-size:13px;line-height:1.55;margin-top:8px;background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.wallcol .wempty{margin-top:auto;padding-top:10px;font-size:11.5px;color:var(--muted);font-style:italic}
/* ---- workshop: WAGOLL wall (legacy vertical, used in the climb summary) ---- */
.wallgrid{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.wallslot{border:2px dashed var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:52px}
.wallslot .wl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.wallslot .wdesc{font-size:12.5px;color:var(--muted);margin-top:2px}
.wallslot .weal{font-size:11.5px;color:var(--stem-tx);margin-top:2px;font-style:italic}
.wallslot.filled{border-style:solid;border-color:var(--correct);background:var(--okbg)}
.wallslot .wresp{font-family:Georgia,serif;font-size:14px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.wallslot.droppable{cursor:pointer}
.wallslot.droppable:hover{border-color:var(--ink)}
.respbank{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.resp{font-family:Georgia,serif;text-align:left;font-size:14.5px;line-height:1.55;background:#fff;border:1px solid var(--line);
      border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .12s}
.resp:hover{border-color:var(--ink)}
.resp.armed{border:2px solid var(--ink);background:var(--bg)}
/* ---- workshop: the climb ---- */
.climb{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.climbrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.climbrow.locked{opacity:.5}
.climbrow.now{border:2px solid var(--ink);background:var(--bg)}
.climbrow.done{border-color:var(--correct);background:var(--okbg)}
.climbhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.climbhead .cl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.climbhead .cvic{font-size:12.5px;color:var(--muted)}
.climbhead .ceal{font-size:11.5px;color:var(--stem-tx);font-style:italic}
.climbrow .cmine{font-family:Georgia,serif;font-size:15px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;margin-top:8px}
.climbrow .cwhy{font-size:12px;color:var(--correct);margin-top:4px}
.climbrow .cgoal{font-size:13px;margin-top:8px;line-height:1.55}
.changed{display:flex;flex-direction:column;gap:5px;background:var(--bg);border:1px dashed var(--line);
  border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:12.5px;line-height:1.5}
.changed .cup,.changed .cdown{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.4px;border-radius:99px;padding:2px 8px;margin-right:6px}
.changed .cup{color:var(--correct);background:var(--okbg);border:1px solid var(--correct)}
.changed .cdown{color:var(--wrong);background:var(--badbg);border:1px solid var(--wrong)}
.ctile.retired{outline:2px solid var(--wrong);opacity:.7;text-decoration:line-through}
/* ---- teacher demo: the same machinery, bigger ----
   This is read from the back of a room, off a projector, by thirty people who
   are not holding the mouse. Every size here is the student page's size times
   --rk, so the demo scales as one thing rather than as thirty separate
   numbers: raise --rk for a bigger room, and everything keeps its proportions.
   The rubric table is down to its Example row on rails (see wagollTable), and
   that is what pays for the scale — three rows of small print nobody reads
   from row four, traded for a sentence they can. */
body.rails{--rk:1.6}
@media (max-height:820px){ body.rails{--rk:1.5} }    /* a 1366x768 laptop */
@media (max-height:660px){ body.rails{--rk:1.4} }

body.rails .container{max-width:min(1720px,99vw);padding:14px 18px}
body.rails h2{font-size:calc(17px * var(--rk));margin-bottom:4px}
body.rails .eyebrow{margin-bottom:2px}
body.rails .wag2 .wcell{padding:calc(5px * var(--rk)) calc(7px * var(--rk));
  font-size:calc(11px * var(--rk));line-height:1.35}
body.rails .wag2 .head .lvname{font-size:calc(10.5px * var(--rk))}
.wag2.nolab .rowlab{padding:0;border-left:0;border-right:0}
/* the sentence on the wall is the thing the room is looking at */
body.rails .wag2 .ex .wresp{font-size:calc(12.5px * var(--rk));line-height:1.5}
body.rails .wag2 .ex .wempty{font-size:calc(11px * var(--rk))}
body.rails .ckey{font-size:calc(10.5px * var(--rk));margin-bottom:6px}
body.rails .dock{padding:8px 0 6px}
body.rails .canvas{min-height:calc(44px * var(--rk));padding:calc(7px * var(--rk));gap:calc(5px * var(--rk))}
body.rails .ctile{font-size:calc(12.5px * var(--rk));padding:calc(4px * var(--rk)) calc(7px * var(--rk))}
body.rails .preview{font-size:calc(14px * var(--rk));padding:calc(7px * var(--rk)) calc(10px * var(--rk))}
body.rails .bins5{grid-template-columns:repeat(auto-fit,minmax(calc(132px * var(--rk)),1fr));gap:6px;margin-bottom:8px}
body.rails .bin{padding:5px 6px}
body.rails .bin h4{font-size:calc(9px * var(--rk));margin-bottom:3px}
/* The bank is the block that can afford to scroll: it is a list you pick from,
   not something you read straight through. */
body.rails .binbody{max-height:calc(104px * var(--rk));overflow-y:auto;overflow-x:hidden;padding:5px;gap:4px}
@media (max-height:820px){ body.rails .binbody{max-height:calc(74px * var(--rk))} }
body.rails .tile{font-size:calc(11.5px * var(--rk));padding:calc(4px * var(--rk)) calc(6px * var(--rk));
  border-radius:6px;line-height:1.3}
body.rails .q{font-size:calc(12px * var(--rk));margin:4px 0}
body.rails .feedback{font-size:calc(12.5px * var(--rk));padding:8px 10px}
body.rails .dock .btnrow{margin:0 0 4px}
body.rails .railbar{padding:6px 10px;font-size:calc(12.5px * var(--rk));margin-bottom:8px}
body.rails .btn{font-size:calc(14px * var(--rk))}

/* the tile in your hand: fixed to the pointer, free of every container */
.dragghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;margin:0;
  transform-origin:top left;box-shadow:0 10px 26px rgba(30,22,8,.3);
  transform:rotate(-1.5deg);opacity:.96;cursor:grabbing}
/* where it will land */
.dropgap{display:inline-block;min-width:54px;align-self:stretch;min-height:34px;border-radius:8px;
  border:2px dashed var(--ink);background:rgba(31,31,31,.06);animation:gapin .12s ease-out}
@keyframes gapin{from{min-width:0;opacity:0}to{min-width:54px;opacity:1}}
body.dragging{cursor:grabbing}
body.dragging .tile,body.dragging .ctile{cursor:grabbing}
.tile.used,.ctile.lifted{opacity:.32}
.ctile{cursor:grab;touch-action:none}
.bin.opens h4,.tile.k-open,.ctile.k-open{background:#e6e1d6;color:#5c503b}
/* ---- workshop: flexible builder ---- */
/* ---- the sticky sentence dock ----
   position:sticky needs a scroll container that is not clipping it, so the
   dock sits directly in the page flow rather than inside any overflow box.
   The bottom fade stops tiles looking cut off where the banks slide under. */
/* Pinned in both directions: while the dock's natural spot is below the
   viewport it rides the bottom edge, and once scrolled past it holds the top.
   The sentence being built is never off the page. */
.dock{position:sticky;top:0;bottom:0;z-index:20;background:var(--paper);
      padding-top:6px;margin:0 0 12px;
      box-shadow:0 10px 14px -12px rgba(31,31,31,.45)}
.dock .q{margin-bottom:6px}
.dock .canvas{margin-bottom:8px}
.dock .preview{margin-bottom:8px}
.dock .locked8{background:var(--okbg);border-color:var(--line);margin-bottom:6px}
@media (max-width:700px){ .dock .q{font-size:12.5px} }

.canvas{border:2px dashed var(--line);border-radius:10px;min-height:56px;padding:10px;background:#fff;
        display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.canvas .ph{color:var(--muted);font-size:13px}
.ctile{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13.5px;cursor:pointer;font-family:inherit}
.ctile:after{content:" \2715";font-size:9px;color:var(--muted)}
.ctile.flag-err{outline:2px solid var(--wrong)}
.ctile.flag-warn{outline:2px solid #cf8336}
/* align-items:start, or every bin inflates to the tallest column and the
   Evidence bin with one quote in it becomes half a metre of empty border. */
.bins5{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:0 0 12px;align-items:start}
@media (max-width:820px){.bins5{grid-template-columns:repeat(2,1fr)}}
.bin.subjects h4, .tile.k-subj, .ctile.k-subj{background:var(--feat-bg);color:var(--feat-tx)}
.bin.verbs h4, .tile.k-verb, .ctile.k-verb{background:var(--verb-bg);color:var(--verb-tx)}
.bin.effects h4, .tile.k-eff, .ctile.k-eff{background:var(--eff-bg);color:var(--eff-tx)}
.bin.ideas h4, .tile.k-idea, .ctile.k-idea{background:var(--idea-bg);color:var(--idea-tx)}
.bin.connects h4, .tile.k-con, .ctile.k-con{background:#eeebe3;color:#574d3a}
.bin.quotes h4, .tile.k-q, .ctile.k-q{background:var(--ev-bg);color:var(--ev-tx)}
.seg.harv{background:var(--quote-bg);border-bottom-color:var(--quote-tx)}
.kept{font-family:Georgia,serif;font-size:15px;background:var(--okbg);border:1px solid var(--correct);border-radius:8px;padding:9px 12px;margin:0 0 8px}
/* ---- teacher mode: the projector deck ----
   Sized for the back of a classroom, not for a phone: the type is deliberately
   large and the slide never scrolls if it can be helped. It borrows the
   workshop's tile and colour classes so what the room sees on the wall is what
   students meet on their screens. */
/* The deck sizes to the window: a slide that scrolls is a slide the back row
   cannot read. height, not min-height, so a full slide shrinks its own parts
   instead of pushing the navigation off the bottom of the screen. */
.teach{max-width:1400px;margin:0 auto;padding:6px 0 12px;
  height:calc(100vh - 156px);display:flex;flex-direction:column}
@media (max-width:820px){ .teach{height:auto} }
.tmbar{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.tmtag{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  background:var(--ink);color:#fff;border-radius:99px;padding:3px 10px}
.tmcount{font-size:12px;color:var(--muted)}
.tmbar .linkbtn{margin-left:auto}
.tmh{font-size:clamp(22px,min(3.6vw,4.6vh),50px);line-height:1.05;margin:0 0 8px}
.tmlead{font-size:clamp(15px,1.9vw,21px);line-height:1.45;color:var(--ink);margin:0 0 20px;max-width:44em}
.tmnav{display:flex;gap:10px;margin-top:auto;padding-top:18px}
.tmnav .btn{font-size:16px;padding:11px 20px}

/* Size against the SHORT side too. A 1280x720 laptop is wide but shallow, and
   sizing on vw alone put these slides 122px below the fold. */
.tmsent{font-family:Georgia,serif;font-size:clamp(18px,min(2.6vw,3.4vh),40px);line-height:1.5;background:#fff;
  border:1px solid var(--line);border-radius:16px;padding:min(3vh,28px) min(4vw,38px);margin:0 0 14px;
  display:flex;align-items:center;flex:1;min-height:0}
.tmbrief{font-size:clamp(15px,min(1.8vw,2.4vh),26px);line-height:1.4;max-width:44em}
.tmnote{font-size:15px;color:var(--muted);font-style:italic;margin-top:14px}
.tmh-idea{color:var(--idea-tx)} .tmh-verb{color:var(--verb-tx)}
.tmh-ev{color:var(--ev-tx)}     .tmh-eff{color:var(--eff-tx)}
/* ---- the Frayer slide ----
   Two columns, three rows: cards in the corners, the sentence spanning the
   middle band. The sentence is the centre of the model, so it gets the
   room. */
.frayer{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.frsent{grid-column:1 / -1;font-family:Georgia,serif;
  font-size:clamp(17px,1.85vw,26px);line-height:1.45;background:#fff;
  border:2px solid var(--line);border-radius:18px;min-height:0;
  padding:min(2.4vh,20px) min(3vw,30px);display:flex;align-items:center}
.frsent em{transition:opacity .18s, box-shadow .18s}
/* when a card is lit, everything but its colour steps back */
.frayer.lit .frsent em{opacity:.22}
.frayer.lit-idea .frsent .hl-idea,
.frayer.lit-eff  .frsent .hl-eff,
.frayer.lit-ev   .frsent .hl-ev,
.frayer.lit-verb .frsent .hl-verb{opacity:1;box-shadow:0 0 0 3px currentColor}
.frayer.lit .tmf{opacity:.4}
.frayer.lit-idea .tmf-idea,.frayer.lit-eff .tmf-eff,
.frayer.lit-ev .tmf-ev,.frayer.lit-verb .tmf-verb{opacity:1}
.tmf{transition:opacity .18s, transform .18s;cursor:pointer}
.tmf:hover{transform:translateY(-2px)}
/* the corner cards point at the sentence: a small arrow on the inner edge */
.pos-tl,.pos-tr,.pos-bl,.pos-br{position:relative}
.pos-tl:after,.pos-tr:after,.pos-bl:after,.pos-br:after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  border:10px solid transparent}
.pos-tl:after,.pos-tr:after{bottom:-19px;border-top-color:currentColor}
.pos-bl:after,.pos-br:after{top:-19px;border-bottom-color:currentColor}
@media (max-width:820px){
  .frayer{grid-template-columns:1fr;grid-template-rows:none}
  .frsent{grid-column:1}
  .pos-tl:after,.pos-tr:after,.pos-bl:after,.pos-br:after{display:none}
}
/* The cards used to have a slide to themselves. On the Frayer they share it
   with the sentence, so they size against the room that is left. */
.tmf{border-radius:16px;padding:min(2.6vh,20px) 16px;text-align:center;border:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;min-height:0}
.tmf b{display:block;font-family:Georgia,serif;font-size:clamp(22px,2.7vw,38px);line-height:1.05}
.tmf span{display:block;margin-top:4px;font-size:clamp(15px,1.7vw,23px);font-weight:700;opacity:.75}
.tmf-idea{background:var(--idea-bg);color:var(--idea-tx)}
.tmf-eff{background:var(--eff-bg);color:var(--eff-tx)}
.tmf-ev{background:var(--ev-bg);color:var(--ev-tx)}
.tmf-verb{background:var(--verb-bg);color:var(--verb-tx)}
.railbar{background:var(--bg);border:1px dashed var(--ink);border-radius:10px;padding:11px 14px;
  margin:0 0 14px;font-size:14px;line-height:1.55}
.railbar .linkbtn{margin-left:10px}

/* ---- identity gate & home controls ---- */
.idcard{max-width:520px;margin:20px auto}
.idcard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
.idcard .err{color:var(--wrong);font-size:12.5px;min-height:16px;margin-top:3px}
.homectl{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px}
.homectl label{font-size:12px;font-weight:700}
.homectl select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:var(--paper);max-width:100%}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;background:none;border:none;font-family:inherit}
.switch .track{width:38px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch .track:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on .track{background:var(--correct)}
.switch.on .track:after{left:20px}
.gatednote{font-size:12px;color:var(--muted);font-style:italic}
.passage .seg.spent{opacity:.4;cursor:default}
/* The teacher button lives in the top bar, on every screen, because it was a
   line of small red text in a breadcrumb before and nobody could find it. */
.teachbtn{font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:99px;
  padding:4px 12px;letter-spacing:.02em}
.teachbtn:hover{background:#000}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;padding:0}
  .container{border:none;box-shadow:none;max-width:100%}
  .noprint{display:none!important}
}
/* ---- word notepad ---- */
#gnoteBtn{position:fixed;right:18px;bottom:18px;z-index:60;width:52px;height:52px;border-radius:50%;
  border:1px solid #d8cfae;background:#fffdf2;box-shadow:0 4px 14px rgba(40,30,10,.22);font-size:24px;cursor:pointer;
  transition:transform .15s}
#gnoteBtn:hover{transform:scale(1.08) rotate(-4deg)}
.gpanel{position:fixed;right:18px;bottom:80px;z-index:60;width:min(370px,calc(100vw - 36px));
  max-height:min(580px,74vh);display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  background:#fffdf2;border:1px solid #d8cfae;box-shadow:0 12px 34px rgba(40,30,10,.28)}
.gpanel .ghead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff;
  background:var(--accent,#a03d29);font-weight:800;letter-spacing:.3px;font-size:14px;
  background-image:radial-gradient(circle at 8px 50%, rgba(255,255,255,.35) 2.5px, transparent 3px);
  background-size:22px 100%}
.gpanel .gx,.morphpop .gx{border:0;background:none;color:inherit;font-size:19px;cursor:pointer;line-height:1}
.gtools{display:flex;gap:8px;padding:8px 12px;border-bottom:1px dashed #d8cfae;background:#fbf7e6}
.gtools select{flex:1;min-width:0;border:1px solid #d8cfae;border-radius:7px;padding:4px 6px;font-size:12.5px;background:#fff}
.gtools .gaz{border:1px solid #d8cfae;background:#fff;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.gtools .gaz.on{background:var(--accent,#a03d29);color:#fff;border-color:var(--accent,#a03d29)}
.gbody{overflow-y:auto;padding:4px 12px 8px;flex:1;
  background-image:repeating-linear-gradient(transparent 0 27px, rgba(190,165,105,.28) 27px 28px)}
.gsec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#8a7c56;padding:12px 0 3px}
.gword{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer;line-height:22px}
.gword:hover .gt{text-decoration:underline}
.gword .st{width:9px;height:9px;border-radius:50%;flex:none;background:#d8cfae}
.gword.mastered .st{background:#2e7d32}
.gword.met .st{background:#e0a13c}
.gword .gt{font-weight:700;font-size:14px}
.gword .gpos{font-size:11px;color:#8a7c56;font-style:italic}
.gword .gtick{margin-left:auto;color:#2e7d32;font-weight:800}
.gword .glk{margin-left:auto;font-size:12px}
.gword.locked{cursor:default;color:#9a8f77}
.gword.locked .gt{font-weight:600}
.glock{font-size:12px;color:#8a7c56;padding:2px 2px 6px}
.glink{border:0;background:none;color:var(--accent,#a03d29);font-weight:700;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline}
.gdetail{padding:2px 4px 10px 17px}
.gparts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 6px}
.mchip{display:inline-flex;flex-direction:column;align-items:center;background:var(--idea-bg,#d6eafc);color:var(--idea-tx,#0b447c);
  border-radius:8px;padding:3px 9px;line-height:1.25}
.mchip b{font-size:13.5px}
.mchip small{font-size:10px;opacity:.85}
.mplus{font-weight:800;color:#8a7c56}
.gm{font-size:12.5px;line-height:1.45}
.gtr{font-size:14px;font-weight:700;margin-top:4px;color:#0b447c}
.gfoot{font-size:11px;color:#8a7c56;line-height:1.45;padding:8px 12px;border-top:1px dashed #d8cfae;background:#fbf7e6}
/* book words inside passages — the halo says which state they're in */
.gw{border:0;padding:1px 3px;margin:0 -1px;font:inherit;cursor:pointer;color:inherit;border-radius:5px;
  background:transparent;transition:background .14s,box-shadow .14s,color .14s}
.gw.gw-ok{box-shadow:0 0 0 2px rgba(46,125,50,.16), 0 0 8px 2px rgba(46,125,50,.22);background:rgba(46,125,50,.09)}
.gw.gw-part{box-shadow:0 0 0 2px rgba(46,125,50,.10), 0 0 7px 2px rgba(46,125,50,.13);background:rgba(46,125,50,.05)}
.gw.gw-todo{box-shadow:0 0 0 2px rgba(214,140,20,.20), 0 0 8px 2px rgba(214,140,20,.26);background:rgba(214,140,20,.11)}
.gw:hover,.gw:focus-visible{background:#fff;color:var(--ink);
  box-shadow:0 0 0 2px #fff, 0 2px 10px rgba(40,30,10,.28);outline:none}
@media (prefers-reduced-motion: reduce){ .gw{transition:none} }
/* the notepad's own badge */
#gnoteBtn{position:relative}
.gbadge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;
  font-size:11px;font-weight:800;line-height:19px;color:#fff;display:none}
.gbadge.ok{display:block;background:#2e7d32}
.gbadge.todo{display:block;background:#c8801a}
.gfoot .hint{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px}
.gfoot .hint.ok{background:rgba(46,125,50,.35);box-shadow:0 0 0 2px rgba(46,125,50,.18)}
.gfoot .hint.todo{background:rgba(214,140,20,.45);box-shadow:0 0 0 2px rgba(214,140,20,.22)}
.gword.on{background:#fbf7e6;border-radius:6px}
/* the decompose pop */
.morphpop{position:fixed;z-index:70;width:min(330px,calc(100vw - 24px));background:#fffdf2;border:1px solid #d8cfae;
  border-radius:12px;box-shadow:0 12px 34px rgba(40,30,10,.3);padding:12px 14px}
.morphpop .gx{position:absolute;top:6px;right:8px;color:#8a7c56}
.morphpop .mpw{font-family:Georgia,serif;font-size:19px;font-weight:700;margin-bottom:6px}
.morphpop .mchip.pop{opacity:0;transform:translateY(12px) scale(.55);animation:mchipIn .5s cubic-bezier(.2,.85,.3,1.25) forwards}
@keyframes mchipIn{to{opacity:1;transform:none}}
.morphpop .mpnote{font-size:10.5px;color:#8a7c56;margin-top:8px}
@media (prefers-reduced-motion: reduce){ .morphpop .mchip.pop{animation:none;opacity:1;transform:none} }
</style>

<script>
/* ============================================================================
   THE BONE SPARROW — READING & EVIDENCE HUB
   ----------------------------------------------------------------------------
   This block is the data spine. The engine below knows nothing about the
   novel; it only runs whatever is in these consts. To add content, copy an
   entry and follow its shape — every item needs an `id` and an `explain`/`fb`
   that names the trap and points the reader back to the line.

   Scoring rules (same as the Pre-reading Trainer and Grammar Hub):
   • wrong answers are retried until correct (mastery loop),

const QUICKREADS = [
{ id:"qr1", ch:1, step:"Quickread 1", title:"The Night Sea", where:"Chapter 1, pages 1–2",
  intro:"Read the opening of the novel carefully — twice is better. When you start the questions, the passage disappears.",
  passage:`Sometimes, at night, the dirt outside turns into a beautiful ocean. As red as the sun and as deep as the sky.<br><br>
I lie in my bed, Queeny's feet pushing against my cheek, and listen to the waves lapping at the tent. Queeny says I'm stupid, saying that kind of stuff. But it's true. She just doesn't see it, is all. Our maá says there are some people in this world who can see all the hidden bits and pieces of the universe blown in on the north wind and scattered about in the shadows. Queeny, she never tries to look in the shadows. She doesn't even squint.<br><br>
Maá sees though. She can hear the ocean outside too. 'You hear it, né?' I whisper, my fingers feeling for her smile in the dark.<br><br>
In the morning, the ground still wet and foamy from where those waves washed up, I sit and trace the hundreds of animals that have swum all the way up to the tent, their faces pushing against the flaps, trying to get a look at us inside on our beds…`,
  items:[
  { id:"qr1a", q:"The dirt 'turns into a beautiful ocean'. The Night Sea is best understood as:",
    opts:["A real ocean that floods the camp after dark and drains away by morning",
          "Subhi's imagination, which the story lets feel completely real",
          "A dream Subhi has while he is asleep and mistakes for something real",
          "A story that Queeny tells to help Subhi sleep"],
    a:1, explain:"Fraillon deliberately blurs the line — we see the world exactly as Subhi sees it, so his imagined sea gets described as fact. Queeny calling it 'stupid' is our clue that not everyone can see it.",
    line:"Sometimes, at night, the dirt outside turns into a beautiful ocean." },
  { id:"qr1b", q:"'Queeny says I'm stupid, saying that kind of stuff.' What does this suggest?",
    opts:["Queeny hates her brother, and says so whenever he talks about the sea",
          "Subhi really is stupid, and the story agrees with her about it",
          "Queeny doesn't share — or won't let herself share — Subhi's way of seeing",
          "Queeny cannot hear the ocean because she sleeps too heavily to notice"],
    a:2, explain:"'Hates' is too strong — the trap answer. Queeny dismisses the Night Sea, and the next lines tell us why: 'she never tries to look in the shadows. She doesn't even squint.' She refuses to look, which is different from hating him.",
    line:"Queeny, she never tries to look in the shadows. She doesn't even squint." },
  { id:"qr1c", q:"'She just doesn't see it, is all.' The little phrase 'is all' makes Subhi sound:",
    opts:["Furious with his sister for calling him stupid about the Night Sea",
          "Matter-of-fact and forgiving — he's not angry at Queeny",
          "Confused about what he saw, and no longer sure it was ever there",
          "Like he is boasting about his gift"],
    a:1, explain:"'Is all' shrugs the criticism off. Subhi explains Queeny rather than attacking her — one of the first signs of how gentle this narrator is.",
    line:"But it's true. She just doesn't see it, is all." },
  { id:"qr1d", q:"'…my fingers feeling for her smile in the dark.' This detail suggests:",
    opts:["Maá is asleep, and he is feeling for her face without waking her",
          "Subhi cannot see anything at all",
          "Maá is fast asleep, and he is trying to wake her to show her the sea",
          "It's too dark to see, so he checks by touch whether Maá shares the moment"],
    a:3, explain:"He isn't just touching her face — he's checking for the smile, hoping she hears the ocean too. It's a tiny action that shows warmth and closeness in one line.",
    line:"'You hear it, né?' I whisper, my fingers feeling for her smile in the dark." },
  { id:"qr1e", q:"In 'the waves lapping at the tent', the word 'lapping' means the waves are:",
    opts:["Crashing violently against the tent","Touching gently, again and again","Freezing cold","Disappearing quickly and leaving the ground dry"],
    a:1, explain:"Lapping is the soft, repeated touch of small waves — think of a dog lapping water. It makes the Night Sea calm and comforting, not threatening.",
    line:"…and listen to the waves lapping at the tent." },
  { id:"qr1f", q:"Subhi whispers 'You hear it, né?' The word 'né' tells us:",
    opts:["It is a spelling mistake that nobody has corrected in the book",
          "It is the name Subhi has given the ocean in his own private language",
          "Subhi's family speak another language, and its rhythms shape his English",
          "Subhi is too tired to finish his words properly by the end of a long day"],
    a:2, explain:"'Né' is a tag from the family's own language sitting naturally inside an English sentence. Fraillon builds Subhi's voice this way — his English carries his Rohingya family inside it.",
    line:"'You hear it, né?' I whisper…" }
]},
{ id:"qr2", ch:5, step:"Quickread 2", title:"Caught by Beaver", where:"Chapter 5, page 33",
  intro:"This is the moment Beaver catches Subhi with the package. Read it carefully — when you start the questions, the passage disappears.",
  passage:`My throat is as dry as the dirt. Eli always tells me, 'Never let anyone see your scared,' and I try as hard as I can but trying isn't doing, and I've never been handcuffed before and I've never been taken into the offices, and thinking on all of that is fouling my stomach close to spewing.<br><br>
'What are you doing back there?' Beaver's voice sounds as dark as the Jackets' dogs when they don't like a person. I can't talk. I can't say a single thing. His hand is hard and scratchy, grabbing at my shirt and pulling me towards him so that my teeth clang on my tongue and I can taste blood, and my brain is buzzing louder and louder.<br><br>
'I asked you a question.'<br><br>
I still can't talk. He shoves me backwards so hard that my feet leave the ground and my head cracks into the bricks behind me, and for a moment all I can see are little lights flashing in and out. When I crash into the dirt, Beaver has the package. And he's opening it.`,
  items:[
  { id:"qr2a", q:"Subhi says his throat is dry. This most likely shows that he is:",
    opts:["Thirsty after a hot day in the dirt","Frightened","Bored","Angry with Beaver"],
    a:1, explain:"The dry throat arrives with the fear, not the weather — it comes in the build-up to the confrontation, right beside 'never let anyone see your scared'.",
    line:"My throat is as dry as the dirt." },
  { id:"qr2b", q:"Subhi describes his brain as 'buzzing louder and louder'. This suggests:",
    opts:["Excitement about the package","Tiredness","Building panic","Confusion about what Beaver wants"],
    a:2, explain:"'Louder and louder' escalates as the physical threat escalates — it tracks rising panic, not a neutral state.",
    line:"…and my brain is buzzing louder and louder." },
  { id:"qr2c", q:"Beaver's dialogue is short and clipped ('What are you doing back there?' / 'I asked you a question.'). What does this best suggest about him in this moment?",
    opts:["He is calm and polite, and simply wants an answer","He doesn't know what to say, so he keeps it short","He is being friendly","He is trying to show that he is in control"],
    a:3, explain:"Short, blunt questions from Beaver read as authority and menace — he doesn't need many words because he holds all the power here.",
    line:"'I asked you a question.'" },
  { id:"qr2d", q:"What does the author compare Beaver's voice to?",
    opts:["The dry dirt of the camp","The darkness of the night","Guard dogs growling","Something hard and scratchy"],
    a:2, explain:"'As dark as the Jackets' dogs when they don't like a person.' 'Hard and scratchy' is his hand — the sneaky look-alike option.",
    line:"Beaver's voice sounds as dark as the Jackets' dogs when they don't like a person." },
  { id:"qr2e", q:"Why might the author show Subhi's fear through physical sensations (dry throat, buzzing brain, blood in his mouth) rather than simply writing 'Subhi was scared'?",
    opts:["It is shorter to write than a full description of what he was feeling",
          "It puts the reader inside Subhi's body, making the fear easier to feel",

    a:1, explain:"Showing fear through the body instead of naming it is a deliberate craft choice — first-person sensation immerses the reader in Subhi's experience.",
    line:"…thinking on all of that is fouling my stomach close to spewing." },
  { id:"qr2f", q:"Based on how Beaver behaves here and what we already know of him, what is the most likely outcome the next time they cross paths?",
    opts:["Beaver will keep targeting Subhi whenever the chance comes up",
          "Beaver will avoid Subhi from now on, in case somebody reports him",
          "Subhi will report Beaver to Harvey and be believed this time",
          "Beaver and Subhi will end up on the same side against the Jackets"],
    a:0, explain:"Beaver's established pattern — the extra kick, tipping Maá's dinner into the dirt, handcuffing Eli — shows targeting is habitual, not a one-off. That's the best-supported prediction from the characterisation so far.",
    line:"When I crash into the dirt, Beaver has the package. And he's opening it." },
  { id:"qr2g", q:"In the phrase 'fouling my stomach', 'fouling' most likely means:",
    opts:["Making his stomach growl with hunger","Making him excited","Making him feel sick","Filling him up after a meal"],
    a:2, explain:"'Fouling' here is nausea brought on by dread — it sits alongside 'close to spewing' and the rest of the fear imagery.",
    line:"…thinking on all of that is fouling my stomach close to spewing." }

{ id:"qr3", ch:6, step:"Quickread 3", title:"Lucky", where:"Chapter 6", vocabSet:"6-7",
  intro:"Chapter 6 leaves Subhi and follows Jimmie, on the outside of the fence. This extract is short, so read it twice. When you start the questions it disappears, and the last two questions ask you to connect evidence to an idea.",
  passage:`And then today at school, some of the kids had been talking. Saying how lucky those people were in the Centre. How they had everything. Good clothes and thousands of toys and books and computers and teachers and doctors who lived right there in the Centre so you didn't have to drive for two days if you were sick.`,
  items:[
  { id:"qr3a", q:"Who is saying that the people in the Centre are 'lucky'?",
    opts:["Jimmie","Kids at Jimmie's school","The Jackets who work in the Centre","Jimmie's dad"],
    a:1, explain:"'Some of the kids had been talking' — Jimmie is reporting what she heard at school, not what she believes. Chapter 6 follows her in third person, so we get the rumour at one remove.",
    line:"And then today at school, some of the kids had been talking." },
  { id:"qr3b", q:"The kids say 'those people'. What does that phrase do?",
    opts:["Names the people in the Centre respectfully, the way Jimmie's teacher would want them named",
          "Holds them at a distance as one lump, with no names and no differences between them",
          "Shows the kids know them personally, because somebody has been inside",
          "Refers to the Jackets"],
    a:1, explain:"'Those people' is the language of a group you have never met. Nobody in it has a name, a story or a face — which is exactly the condition the novel keeps showing you Subhi living inside.",
    line:"Saying how lucky those people were in the Centre." },
  { id:"qr3c", q:"'Good clothes and thousands of toys and books and computers and teachers and doctors…' Why pile it up with 'and' like that?",
    opts:["To show the writer ran out of punctuation and let the sentence run away with itself",
          "To make the list sound careful and factual, as if somebody had actually counted every item",
          "To make the rumour swell as it is repeated, the way playground talk grows",
          "To slow the sentence down so that each item lands separately"],
    a:2, explain:"Fraillon lets the list run on without stopping. It sounds like a rumour being passed along and getting bigger with every 'and' — nobody in it has counted anything.",
    line:"How they had everything. Good clothes and thousands of toys and books and computers and teachers and doctors…" },
  { id:"qr3d", q:"'…so you didn't have to drive for two days if you were sick.' What does this tell you about Jimmie's own town?",
    opts:["It has a hospital nearby that the kids are comparing the Centre with",
          "It has almost no services of its own, so the rumour bites",
          "It is close to a city",
          "The kids there are wealthy"],
    a:1, explain:"The detail is about the town, not the Centre. Two days' drive to a doctor is Jimmie's normal, which is why the rumour lands: the resentment grows out of a real lack, aimed at the wrong people.",
    line:"…doctors who lived right there in the Centre so you didn't have to drive for two days if you were sick." },
  { id:"qr3e", q:"Do the kids mean 'lucky' as a joke?",
    opts:["Yes, they are being sarcastic, and every one of them knows perfectly well it is false",
          "No, they mean it straight — the irony is the reader's, because we have seen inside",
          "Yes, because Jimmie has already told them the truth about the Centre",
          "No, because they have visited the Centre"],
    a:1, explain:"The kids believe it. We have spent five chapters inside the camp, so we can measure their picture against Subhi's fourteen pairs of shoes and half scoops. That gap between what a character believes and what the reader knows is dramatic irony.",
    line:"Saying how lucky those people were in the Centre. How they had everything." }
  ],
  links:[
  { id:"qr3L1", idea:"Grief has made Jimmie almost invisible inside her own family.",
    opts:["'A fence just means there's something interesting inside.'",
          "'Jimmie wonders if her dad even remembers that she can't read.'",
          "'Saying how lucky those people were in the Centre.'",
          "'…so you didn't have to drive for two days if you were sick.'"],
    a:1, explain:"Being unable to read at ten is the largest fact about Jimmie, and the line says her father may have lost track of it. That is invisibility measured against something specific.",
    why:{ opts:["It says outright that her dad is a bad father who has stopped caring about her at all",
                "It names one thing any parent would know, and shows it slipping, so the neglect is shown",
                "It describes the funeral, which is the moment everything in the house changed",
                "It compares her dad to the Jackets, who also stop noticing the people in front of them"],
          a:1, explain:"Fraillon never writes 'her father neglected her'. She picks one concrete fact and lets it go missing. When you write about this, the move to name is the choice of detail, not the emotion." } },
  { id:"qr3L2", idea:"Jimmie is drawn towards exactly what she has been fenced away from.",
    opts:["'Jimmie wonders if her dad even remembers that she can't read.'",
          "'A fence just means there's something interesting inside.'",
          "'How they had everything.'",
          "'And then today at school, some of the kids had been talking.'"],
    a:1, explain:"Jonah's rule, which Jimmie has kept after losing him, turns every barrier into an invitation. It is the line that explains why she ends up at the Centre's fence at all.",
    why:{ opts:["It tells us she is brave enough to go anywhere, including down to the Centre",
                "It flips a fence from a barrier into a reason, and that is what carries her there",
                "It describes the Centre's fences, which are the ones that matter in this story",
                "It shows Jonah is older than her, so she copies the way he sees the world"],
          a:1, explain:"The line works by reversal. A fence is built to mean 'stop', and Jonah taught her to read it as 'look'. Naming the reversal is stronger than calling her curious." } }
  ] },

{ id:"qr4", ch:8, step:"Quickread 4", title:"What Alpha does to a person", where:"Chapter 8", vocabSet:"8-10",
  intro:"Eli has been moved to Alpha, the compound for the men. Subhi is explaining what that place does. Read it twice — the passage hides when the questions start.",
  passage:`And something happens to those men when they live all together like that, without their families, without being able to work or learn or do anything, having to listen to the Jackets and their jangling keys all the time. It changes a person, Eli says. Some of those men can be real mean to a kid when they want to be.`,
  items:[
  { id:"qr4a", q:"Subhi says 'something happens to those men' rather than naming it. What does the vagueness do?",
    opts:["It shows he has not been paying enough attention to what has happened to the men in Alpha",
          "It keeps the change unnameable, which is more unsettling than any word he could pick",
          "It proves that nothing has really happened to the men who live there",
          "It is a mistake in the writing that an editor should have caught"],
    a:1, explain:"A ten-year-old narrator does not have the clinical word for it, and Fraillon does not lend him one. 'Something' leaves the damage the size of the reader's imagination.",
    line:"And something happens to those men when they live all together like that…" },
  { id:"qr4b", q:"'…without their families, without being able to work or learn or do anything…' Why repeat 'without'?",
    opts:["To fill out the sentence so that it sounds longer and sadder",
          "To list the things the men are given to make up for being there",
          "To define the men entirely by what has been taken from them",
          "To show Subhi is confused about what actually happens in Alpha"],
    a:2, explain:"Every item in the list is an absence. Repeating 'without' means the sentence never gets to say what these men have — because the point is that the camp has removed it.",
    line:"…without their families, without being able to work or learn or do anything…" },
  { id:"qr4c", q:"Why 'the Jackets and their jangling keys' rather than just 'the Jackets'?",
    opts:["The keys never stop, and every one belongs to a door that is not theirs",
          "It shows the Jackets are careless with the keys they are trusted with",
          "It is onomatopoeia put in for its own sake, because it sounds good",
          "The keys are something the men were given when they arrived in Alpha"],
    a:0, explain:"Keys are the sound of somebody else deciding when you move. 'All the time' makes it constant, so the reminder of who holds the doors never stops.",
    line:"…having to listen to the Jackets and their jangling keys all the time." },
  { id:"qr4d", q:"After that long sentence comes a very short one: 'It changes a person, Eli says.' What is the effect of the change in length?",
    opts:["It makes the writing sound rushed, as if Subhi were running out of time",
          "It lands like a verdict, and that is where the paragraph asks to be believed",
          "It shows Eli is interrupting Subhi before he can finish the thought",
          "It softens what came before, so the list does not sound so bleak"],
    a:1, explain:"Long sentence, then a short one, is a control most students can borrow straight away. The long list does the piling-up; the short sentence delivers the conclusion.",
    line:"It changes a person, Eli says." },
  { id:"qr4e", q:"'It changes a person, Eli says.' Whose judgement is this?",
    opts:["Subhi's own, worked out alone from what he has watched happen in Alpha",
          "Eli's, which Subhi is passing on to us",
          "Harvey's, from the one time he spoke about the men in Alpha",
          "Queeny's, passed down to Subhi with everything else she tells him"],
    a:1, explain:"Subhi reads the camp through Eli, which matters later, when Eli is taken and Subhi has to work things out for himself.",
    line:"It changes a person, Eli says." }
  ],
  links:[
  { id:"qr4L1", idea:"What a paper says about a person counts for more than the person.",
    opts:["'Some of those men can be real mean to a kid when they want to be.'",
          "'That’s not what his paper says. He was meant to move last week. And writing doesn’t lie.'",
          "'Do you know that there are seven different types of dirt?'",
          "'It changes a person, Eli says.'"],
    a:1, explain:"Everyone standing there, the Jacket included, can see Eli is years too young for Alpha. The paper wins anyway. 'Writing doesn’t lie' is said by the one person who knows it is lying.",
    why:{ opts:["It shows the Jacket is cruel, which is the thing every kid in the camp already knows",
                "It sets what everyone can see against what the paper says, and the paper wins",
                "It tells us the camp keeps careful records of every person being held there",
                "It shows Eli was supposed to move earlier, so the delay is really his own fault"],
          a:1, explain:"'And writing doesn’t lie' is the working part. The sentence is only quotable because everyone in it knows the opposite is true." } },
  { id:"qr4L2", idea:"The camp treats the idea of freedom itself as something to keep out.",
    opts:["'I guess they don’t want us getting any ideas, hey?'",
          "'And something happens to those men when they live all together like that, without their families, without being able to work or learn or do anything…'",
          "'That’s not what his paper says.'",
          "'Get your stuff. You’re moving to Alpha.'"],
    a:0, explain:"Boxes of muesli bars are sent back because of their wrappers: the bars are called Freedom Bars. Eli’s joke lands because the camp really is more careful with the word than with the people.",
    why:{ opts:["It shows Eli can still joke, which is what makes him good to be around",
                "The joke says the true thing straight: the word freedom is handled as contraband",
                "It explains why breakfast is porridge, and why the good food never reaches them",
                "It shows the Jackets follow rules about wrappers even when the rules waste food"],

{ id:"qr5", ch:10, step:"Quickread 5", title:"The bone sparrow", where:"Chapter 10", vocabSet:"8-10",
  intro:"Jimmie is telling Subhi what the necklace is. Short passage, read it twice — then it goes and the questions run cold.",
  passage:`Mum said it gives us luck and protection. She said all the souls of everyone in our family, all our stories and everything, rub right into that bone and he keeps us together.`,
  items:[
  { id:"qr5a", q:"According to Jimmie's mum, what does the bone sparrow actually hold?",
    opts:["Money and jewellery handed down through the family","The souls and stories of everyone in the family","A photograph of the family from before Jimmie was born","Nothing at all, because it is only a piece of decoration"],
    a:1, explain:"Not luck alone: souls and stories. In this novel a story is what keeps a family real, so an object that stores stories is the family itself, worn round a neck.",
    line:"…all the souls of everyone in our family, all our stories and everything, rub right into that bone…" },
  { id:"qr5b", q:"'rub right into that bone'. What does the verb 'rub' suggest about how this works?",
    opts:["It happens instantly, by magic, the moment it is put on",
          "It happens through years of ordinary handling and wearing",
          "It happens only after someone in the family has died",
          "It happens once, at birth, and never changes afterwards"],
    a:1, explain:"'Rub' is slow, physical and unglamorous. The necklace is not a spell; it is an object made meaningful by being carried, which is why it can be handed on.",
    line:"…rub right into that bone and he keeps us together." },
  { id:"qr5c", q:"Jimmie says 'Mum said… She said…' rather than explaining it herself. Why does that matter?",
    opts:["She does not understand the necklace well enough to explain it herself",
          "She is quoting because the necklace works by keeping her mother speaking",
          "She is unsure whether to trust Subhi with something of her mother's",
          "It shows she has forgotten most of what her mother told her"],
    a:1, explain:"Jimmie cannot read her mother's book, so her mother survives in remembered speech. Every 'Mum said' is the necklace doing its job inside the sentence.",
    line:"Mum said it gives us luck and protection." },
  { id:"qr5d", q:"Earlier in this chapter Subhi thinks Jimmie is 'wearing a symbol of death around her neck'. What does that clash show?",
    opts:["One of them is simply wrong about it, and the story tells us which one later on",
          "One object, two meanings, depending on the stories you were raised inside",
          "Subhi cannot see the necklace properly in the dark and mistakes it",
          "Jimmie is trying to frighten him"],
    a:1, explain:"Subhi has Maá's saying that a sparrow in the house is a sign of death; Jimmie has her mother's. Neither is mistaken. The novel keeps putting two true readings of one thing side by side.",
    line:"I wonder if maybe I shouldn't be sitting out here in the dark by myself with a girl I don't know, wearing a symbol of death around her neck" }
  ],
  links:[
  { id:"qr5L1", idea:"Jimmie's arrival gives Subhi back something the camp had taken from him.",
    opts:["'Jimmie isn't anything like Queeny.'",
          "'…knowing that Jimmie has a whole real book in her hands gives me a sort of brave that I haven't felt since Eli got taken.'",
          "'The two of us look at each other and I get to feeling that maybe I'm not understanding this girl so well.'",
          "'Mum said it gives us luck and protection.'"],
    a:1, explain:"The line names the feeling and dates it: brave, and not since Eli. Evidence that carries its own before-and-after is worth more than evidence that only reports a mood.",
    why:{ opts:["It tells us Jimmie owns a real book, which is rare enough to be worth saying",
                "It measures the new feeling against a loss, so one line carries both at once",
                "It shows Subhi is scared of Jimmie, and of what happens if he is caught",
                "It explains what happened to Eli, which is the loss the whole chapter sits on"],
          a:1, explain:"'Since Eli got taken' is the half students skip. It turns a nice moment into a repair, and a repair implies the damage." } },
  { id:"qr5L2", idea:"Fraillon lets the setting carry Subhi's feelings instead of naming them.",
    opts:["'…that quiet ballooning up and filling the air around us.'",
          "'Maybe she is like Queeny, just a bit.' … 'Jimmie isn’t anything like Queeny.'",
          "'Mum said it gives us luck and protection.'",
          "'I reckon Jimmie will be OK on her own.'"],
    a:0, explain:"Neither child says a word after the story of the dead mother, and the sentence gives the silence size and weight instead. That is where the feeling is written.",
    why:{ opts:["It describes the night accurately, which is what makes the scene feel real",
                "It puts the feeling into the air itself, so we feel the weight of it unnamed",
                "It shows the camp is quiet at night once the generators have gone off",
                "It proves the two children have nothing left to say to one another"],
          a:1, explain:"This is the move to name in your writing: the emotion is displaced onto the setting. Say what the image does, then say what it withholds — nobody in the scene says sad." } }
