<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>The Bone Sparrow — Reading &amp; Evidence Hub</title>
<style>
/* ============================================================
   Palette matches Grammar Hub / Bone Sparrow Pre-reading Trainer
   so the suite reads as one. Accent doubles as the wrong-answer
   colour, so SELECTED state always uses --ink, never accent.
   ============================================================ */
:root{
  --bg:#f4efe6; --paper:#fbf7ee; --ink:#1f1f1f; --muted:#6b6256;
  --line:#d8cfbb; --line-soft:#e8e0cd; --accent:#a83232;
  --correct:#2f6a3e; --wrong:#a83232; --okbg:#eef5ee; --badbg:#f7ecec;
  --warnbg:#faeeda; --warntx:#854f0b;
  /* tile roles (sentence-builder colour key: colour is metalanguage) */
  --stem-bg:#d6eafc; --stem-tx:#0b447c;   /* blue   = sentence stem   */
  --quote-bg:#fff3b0; --quote-tx:#7a5a00; /* yellow = embedded quote  */
  --tail-bg:#fbeaf0;  --tail-tx:#993556;  /* pink   = ending / effect */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);
     display:flex;justify-content:center;padding:18px 10px 40px}
.container{width:100%;max-width:880px;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;padding:26px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:19px;margin:0 0 8px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.eyebrow{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.topbar .where{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.linkbtn:hover{text-decoration:underline}
a.linkbtn{text-decoration:none}
a.menulink{border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:#fff}
a.menulink:hover{border-color:var(--accent);text-decoration:none}
a{color:var(--accent)}
.btn{padding:11px 18px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
     cursor:pointer;background:var(--paper);color:var(--ink);transition:all .15s ease;font-family:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:#8c2828}
.btn-ghost{background:var(--bg);color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
p.lead{color:var(--muted);font-size:13.5px;margin:0 0 10px}

/* ---- home step list ---- */
.step{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
      border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;
      font-family:inherit;font-size:15px;transition:border-color .15s}
.step:hover:not(:disabled){border-color:var(--accent)}
.step:disabled{opacity:.55;cursor:not-allowed}
.step .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step.done .num{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
.step .t{font-weight:700}
.step .d{color:var(--muted);font-size:12.5px}
.step .tag{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
           color:var(--muted);white-space:nowrap}
.step.done .tag{color:var(--correct)}

/* ---- quiz ---- */
.stim{font-family:Georgia,serif;font-size:17px;background:#fff;border:1px solid var(--line);
      border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;margin:0 0 12px}
.stim .pg{display:block;margin-top:6px;font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--muted)}
.q{font-size:16px;font-weight:700;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.opts.chips{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
     font-family:inherit;font-size:14.5px;cursor:pointer;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--correct)}
.opt.wrongpick{background:var(--badbg);border-color:var(--wrong)}
.feedback{display:none;border-radius:8px;padding:11px 13px;font-size:14px;margin:0 0 12px;line-height:1.5}
.feedback.show{display:block;animation:rise .2s ease}
.feedback.ok{display:block;background:var(--okbg);color:var(--correct);animation:rise .2s ease}
.feedback.bad{display:block;background:var(--badbg);color:#7c2626;animation:rise .2s ease}
.feedback.warn{display:block;background:var(--warnbg);color:var(--warntx);animation:rise .2s ease}
.feedback ul{margin:6px 0 0 18px;padding:0}
.feedback li{margin:0 0 4px}
.requote{font-family:Georgia,serif;background:#fff;border:1px solid var(--line);border-radius:6px;
         padding:8px 10px;margin-top:8px;color:var(--ink);font-size:14.5px}
.progress-track{height:8px;background:var(--line-soft);border-radius:99px;margin:0 0 16px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ---- evidence passage ---- */
.passage{font-family:Georgia,serif;font-size:16.5px;line-height:1.75;background:#fff;border:1px solid var(--line);
         border-radius:10px;padding:16px 18px;margin:0 0 12px}
.passage .pg{display:block;margin-top:8px;font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--muted)}
.seg{cursor:pointer;border-radius:4px;padding:1px 2px;border-bottom:2px solid transparent;transition:background .12s}
.seg:hover{background:var(--line-soft)}
.seg.picked{background:#efe6c8;border-bottom-color:var(--ink)}
.seg.hit{background:var(--okbg);border-bottom-color:var(--correct)}
.seg.miss{background:var(--badbg);border-bottom-color:var(--wrong)}
.idea-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fchoice{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-family:inherit;
         font-size:13.5px;font-weight:600;cursor:pointer}
.fchoice.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---- rubric ladder ---- */
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.lcard{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font-size:12px;
       line-height:1.35;cursor:pointer;font-family:inherit;text-align:left;transition:border-color .12s}
.lcard .lv{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block;margin-bottom:3px}
.lcard.now{border:2px solid var(--ink)}
.lcard.got{background:var(--okbg);border-color:var(--correct)}
.lcard.got .lv{color:var(--correct)}
.lcard.below{opacity:.55}
.ladder-hint{display:none;background:var(--bg);border:1px dashed var(--line);border-radius:8px;
             padding:10px 12px;font-size:13px;margin:0 0 12px}
.ladder-hint.show{display:block}
@media (max-width:640px){.ladder{grid-template-columns:repeat(2,1fr)}}

/* ---- sentence builder ---- */
.slotrow{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.slot{border:2px dashed var(--line);border-radius:10px;min-height:46px;padding:8px 10px;background:#fff;
      display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .slabel{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);flex:0 0 92px}
.slot .placed{border-radius:8px;padding:7px 10px;font-size:13.5px;cursor:pointer;border:1px solid transparent}
.slot .placed:after{content:" ✕";font-size:10px;color:var(--muted)}
.bins{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 0 12px}
@media (max-width:700px){.bins{grid-template-columns:1fr}}
.bin{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.bin h4{margin:0;padding:7px 10px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line-soft)}
.bin .binbody{padding:8px;display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;text-align:left;
      cursor:pointer;font-family:inherit;transition:transform .1s, border-color .12s}
.tile:hover{border-color:var(--ink)}
.tile.used{opacity:.4}
.bin.stems h4, .tile.k-stem{background:var(--stem-bg);color:var(--stem-tx)}
.bin.quotes h4, .tile.k-quote{background:var(--quote-bg);color:var(--quote-tx)}
.bin.tails h4, .tile.k-tail{background:var(--tail-bg);color:var(--tail-tx)}
.slot .placed.k-stem{background:var(--stem-bg);color:var(--stem-tx)}
.slot .placed.k-quote{background:var(--quote-bg);color:var(--quote-tx)}
.slot .placed.k-tail{background:var(--tail-bg);color:var(--tail-tx)}
.preview{font-family:Georgia,serif;font-size:16.5px;background:var(--bg);border:1px solid var(--line);
         border-radius:8px;padding:12px 14px;margin:0 0 12px;min-height:48px}
.preview .ph{color:var(--muted);font-size:13px;font-family:'Segoe UI',sans-serif}

/* ---- upgrader ---- */
.wag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
@media (max-width:640px){.wag{grid-template-columns:1fr}}
.grow{font-family:Georgia,serif;font-size:16.5px;line-height:1.6;background:#fff;border:1px solid var(--line);
      border-radius:10px;padding:14px 16px;margin:0 0 12px}
.grow .new{background:var(--okbg)}

/* ---- report ---- */
table.rpt{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 12px}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.rpt th{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.rowinp{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.rowinp label{font-size:12px;font-weight:700;display:block;margin-bottom:3px}
.rowinp input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.vcode{font-family:Georgia,serif;font-size:15px;letter-spacing:1px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ---- workshop: colour language, matching the EAL WAGOLL markers ----
   blue = language feature · orange = analytical verb ·
   yellow = embedded evidence · green = effect on the reader        */
:root{
  --feat-bg:#d6eafc; --feat-tx:#0b447c;
  --verb-bg:#fae3cf; --verb-tx:#8a4b12;
  --ev-bg:#fff3b0;   --ev-tx:#7a5a00;
  --eff-bg:#dff0e2;  --eff-tx:#1f5c33;
}
.hl-feat,.hl-verb,.hl-ev,.hl-eff{font-style:normal;border-radius:4px;padding:1px 3px}
.hl-feat{background:var(--feat-bg);color:var(--feat-tx)}
.hl-verb{background:var(--verb-bg);color:var(--verb-tx)}
.hl-ev{background:var(--ev-bg);color:var(--ev-tx)}
.hl-eff{background:var(--eff-bg);color:var(--eff-tx)}
.ckey{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.ckey span{display:flex;align-items:center;gap:6px}
.ckey .sw{width:13px;height:13px;border-radius:3px;display:inline-block}
.ckey .sw.feat{background:var(--feat-bg);border:1px solid var(--feat-tx)}
.ckey .sw.verb{background:var(--verb-bg);border:1px solid var(--verb-tx)}
.ckey .sw.ev{background:var(--ev-bg);border:1px solid var(--ev-tx)}
.ckey .sw.eff{background:var(--eff-bg);border:1px solid var(--eff-tx)}
/* ---- workshop: WAGOLL wall, horizontal ---- */
.wallscroll{overflow-x:auto;margin:0 0 14px;padding-bottom:6px}
.wallcols{display:flex;gap:10px;min-width:min-content}
.wallcol{flex:0 0 240px;border:2px dashed var(--line);border-radius:10px;padding:10px 12px;background:#fff;
  display:flex;flex-direction:column}
.wallcol.droppable{cursor:pointer}
.wallcol.droppable:hover{border-color:var(--ink)}
.wallcol.filled{border-style:solid;border-color:var(--correct);background:var(--okbg)}
.wallcol .wl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.wallcol .wdesc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.wallcol .weal{font-size:11px;color:var(--feat-tx);margin-top:3px;font-style:italic}
.wallcol .wresp{font-family:Georgia,serif;font-size:13px;line-height:1.55;margin-top:8px;background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.wallcol .wempty{margin-top:auto;padding-top:10px;font-size:11.5px;color:var(--muted);font-style:italic}
/* ---- workshop: WAGOLL wall (legacy vertical, used in the climb summary) ---- */
.wallgrid{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.wallslot{border:2px dashed var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:52px}
.wallslot .wl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.wallslot .wdesc{font-size:12.5px;color:var(--muted);margin-top:2px}
.wallslot .weal{font-size:11.5px;color:var(--stem-tx);margin-top:2px;font-style:italic}
.wallslot.filled{border-style:solid;border-color:var(--correct);background:var(--okbg)}
.wallslot .wresp{font-family:Georgia,serif;font-size:14px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.wallslot.droppable{cursor:pointer}
.wallslot.droppable:hover{border-color:var(--ink)}
.respbank{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.resp{font-family:Georgia,serif;text-align:left;font-size:14.5px;line-height:1.55;background:#fff;border:1px solid var(--line);
      border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .12s}
.resp:hover{border-color:var(--ink)}
.resp.armed{border:2px solid var(--ink);background:var(--bg)}
/* ---- workshop: the climb ---- */
.climb{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.climbrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.climbrow.locked{opacity:.5}
.climbrow.now{border:2px solid var(--ink);background:var(--bg)}
.climbrow.done{border-color:var(--correct);background:var(--okbg)}
.climbhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.climbhead .cl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.climbhead .cvic{font-size:12.5px;color:var(--muted)}
.climbhead .ceal{font-size:11.5px;color:var(--stem-tx);font-style:italic}
.climbrow .cmine{font-family:Georgia,serif;font-size:15px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;margin-top:8px}
.climbrow .cwhy{font-size:12px;color:var(--correct);margin-top:4px}
.climbrow .cgoal{font-size:13px;margin-top:8px;line-height:1.55}
.changed{display:flex;flex-direction:column;gap:5px;background:var(--bg);border:1px dashed var(--line);
  border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:12.5px;line-height:1.5}
.changed .cup,.changed .cdown{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.4px;border-radius:99px;padding:2px 8px;margin-right:6px}
.changed .cup{color:var(--correct);background:var(--okbg);border:1px solid var(--correct)}
.changed .cdown{color:var(--wrong);background:var(--badbg);border:1px solid var(--wrong)}
.ctile.retired{outline:2px solid var(--wrong);opacity:.7;text-decoration:line-through}
.ctile.grabbing{transform:scale(1.05);box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:grabbing}
.ctile{cursor:grab;touch-action:none}
.bin.opens h4,.tile.k-open,.ctile.k-open{background:#e8e2f2;color:#4a3f63}
/* ---- workshop: flexible builder ---- */
.canvas{border:2px dashed var(--line);border-radius:10px;min-height:56px;padding:10px;background:#fff;
        display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.canvas .ph{color:var(--muted);font-size:13px}
.ctile{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13.5px;cursor:pointer;font-family:inherit}
.ctile:after{content:" \2715";font-size:9px;color:var(--muted)}
.ctile.flag-err{outline:2px solid var(--wrong)}
.ctile.flag-warn{outline:2px solid #cf8336}
.bins5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px}
@media (max-width:820px){.bins5{grid-template-columns:repeat(2,1fr)}}
.bin.subjects h4, .tile.k-subj, .ctile.k-subj{background:var(--feat-bg);color:var(--feat-tx)}
.bin.verbs h4, .tile.k-verb, .ctile.k-verb{background:var(--verb-bg);color:var(--verb-tx)}
.bin.effects h4, .tile.k-eff, .ctile.k-eff{background:var(--eff-bg);color:var(--eff-tx)}
.bin.connects h4, .tile.k-con, .ctile.k-con{background:#eeebe3;color:#574d3a}
.bin.quotes h4, .tile.k-q, .ctile.k-q{background:var(--ev-bg);color:var(--ev-tx)}
.seg.harv{background:var(--quote-bg);border-bottom-color:var(--quote-tx)}
.kept{font-family:Georgia,serif;font-size:15px;background:var(--okbg);border:1px solid var(--correct);border-radius:8px;padding:9px 12px;margin:0 0 8px}
/* ---- identity gate & home controls ---- */
.idcard{max-width:520px;margin:20px auto}
.idcard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
.idcard .err{color:var(--wrong);font-size:12.5px;min-height:16px;margin-top:3px}
.homectl{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px}
.homectl label{font-size:12px;font-weight:700}
.homectl select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:var(--paper);max-width:100%}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;background:none;border:none;font-family:inherit}
.switch .track{width:38px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch .track:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on .track{background:var(--correct)}
.switch.on .track:after{left:20px}
.gatednote{font-size:12px;color:var(--muted);font-style:italic}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;padding:0}
  .container{border:none;box-shadow:none;max-width:100%}
  .noprint{display:none!important}
}
</style>
</head>

<div class="container">
  <div class="topbar noprint">
    <span class="where" id="whereLbl">Year 7 English · The Bone Sparrow · Units 5–6</span>
    <span style="display:flex;gap:16px;align-items:center;margin-left:auto">
      <button class="linkbtn" id="homeBtn" onclick="go('home')" style="display:none">← all activities</button>
      <button class="linkbtn menulink" onclick="go('rpt')">My report</button>
      <a class="linkbtn menulink" href="index.html">⌂ Main menu</a>
    </span>
  </div>
  <div id="body"></div>
</div>

<script>
/* ============================================================================
   THE BONE SPARROW — READING & EVIDENCE HUB
   ----------------------------------------------------------------------------
   This block is the data spine. The engine below knows nothing about the
   novel; it only runs whatever is in these consts. To add content, copy an
   entry and follow its shape — every item needs an `id` and an `explain`/`fb`
   that names the trap and points the reader back to the line.

   Scoring rules (same as the Pre-reading Trainer and Grammar Hub):
   • wrong answers are retried until correct (mastery loop),
   • but only the FIRST attempt is scored and reported.

   Passages are short page-referenced extracts already used in the unit's
   printed resources, reproduced for enrolled students under the school's
   statutory licence. Keep extracts short; do not paste whole chapters.
   ============================================================================ */

/* ==================== QUICKREADS (cold-excerpt inference checks) ============
   Each quickread: read the passage, then the passage HIDES and the questions
   run "cold". A misread item is retaught immediately: the feedback re-quotes
   the exact line (item.line) so the reteach happens at the point of error.
   =========================================================================== */
const QUICKREADS = [
{ id:"qr1", ch:1, step:"Quickread 1", title:"The Night Sea", where:"Chapter 1, pages 1–2",
  intro:"Read the opening of the novel carefully — twice is better. When you start the questions, the passage disappears. That's the point: this checks what you understood, not what you can look up.",
  passage:`Sometimes, at night, the dirt outside turns into a beautiful ocean. As red as the sun and as deep as the sky.<br><br>
I lie on my bed, Queeny's feet pushing against my cheek, and listen to the waves lapping at the tent. Queeny says I'm stupid, saying that kind of stuff. But it's true. She just doesn't see it, is all. Our maá says there are some people in this world who can see all the hidden bits and pieces of the universe blown in on the north wind and scattered about in the shadows. Queeny, she never tries to look in the shadows. She doesn't even squint.<br><br>
Maá sees though. She can hear the ocean outside too. 'You hear it, né?' I whisper, my fingers feeling for her smile in the dark.<br><br>
In the morning, the ground still wet and foamy from where those waves washed up, I sit and trace the hundreds of animals that have swum all the way up to the tent, their faces pushing against the flaps, trying to get a look at us inside on our beds…`,

{ id:"qr2", ch:5, step:"Quickread 2", title:"Caught by Beaver", where:"Chapter 5, page 33",
  intro:"This is the moment Beaver catches Subhi with the package. Read it carefully — when you start the questions, the passage disappears.",
  passage:`My throat is as dry as the dirt. Eli always tells me, 'Never let anyone see your scared,' and I try as hard as I can but trying isn't doing, and I've never been handcuffed before and I've never been taken into the offices, and thinking on all of that is fouling my stomach close to spewing.<br><br>
'What are you doing back there?' Beaver's voice sounds as dark as the Jackets' dogs when they don't like a person. I can't talk. I can't say a single thing. His hand is hard and scratchy, grabbing at my shirt and pulling me towards him so that my teeth clang on my tongue and I can taste blood, and my brain is buzzing louder and louder.<br><br>
'I asked you a question.'<br><br>
I still can't talk. He shoves me backwards so hard that my feet leave the ground and my head cracks into the bricks behind me, and for a moment all I can see are little lights flashing in and out. When I crash into the dirt, Beaver has the package. And he's opening it.`,

/* ---------- GENERIC QUIZ RUNNER (mcq, multi-step items) ----------
   cfg: {mod, title, where, items:[{id, stim?, steps:[{key,q,opts,a,explain,requote?}]}], onDone}
   Mastery loop: any missed step re-queues the whole item; first attempts recorded once. */
function runQuizzer(cfg){
  let queue=cfg.items.slice(), idx=0, stepIdx=0, round=1;
  const missed=[];
  /* Redundancy: a miss never hands back the same question. We draw a parallel
     item — same skill, same chapter, different material — and keep drawing a
     new one each time it is missed again. Parallel items are never scored;
     the report still shows first attempts on the real set. */
  const usedRx=new Set();
  function drawParallel(skill){
    const pool=(REDUNDANCY[skill]||[]).filter(x=>(x.ch||1)<=(S.chapter||1) && !usedRx.has(x.id));
    if(!pool.length) return null;
    /* stay on the passage they are working on where we can */
    const near = cfg.preferCh ? pool.filter(x=>x.ch===cfg.preferCh) : [];
    const from = near.length ? near : pool;
    const x=from[Math.floor(Math.random()*from.length)];
    usedRx.add(x.id);
    const opts = x.opts || (skill==="voicewho" ? VOICE_WHO : null);
    if(!opts) return null;
    return { id:x.id, stim:x.stim, page:x.page, redundant:true,
      steps:[{ key:"a", q:x.q, opts:opts, a:x.a, explain:x.explain, requote:x.line,
               chips:skill==="voicewho", noShuffle:skill==="voicewho", skill:skill }] };
  }
  function draw(){
    const item=queue[idx], step=item.steps[stepIdx];
    const total=cfg.items.reduce((n,it)=>n+it.steps.length,0);
    const answered=Object.keys(S.first).filter(k=>k.startsWith(cfg.mod+".")).length;
    let h=`<div class="eyebrow">${esc(cfg.where)}</div><h2>${esc(cfg.title)}</h2>`;
    if(cfg.subnote) h+=`<p class="lead">${esc(cfg.subnote)}</p>`;
    h+=`<div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,answered/total*100)}%"></div></div>`;
    if(item.redundant) h+=`<p class="lead"><b>Same skill, new question.</b> You'll get a fresh one every time you miss it — the way through is to do it again, not to remember the answer. This one isn't scored; your first attempt is already saved.</p>`;
    else if(round>1) h+=`<p class="lead">Mastery round ${round} — the questions you missed, replaced with new ones on the same skill. (Your first attempts are already saved.)</p>`;
    if(item.stim) h+=`<div class="stim">${item.stim}${item.page?`<span class="pg">(${esc(item.page)})</span>`:""}</div>`;
    h+=`<p class="q">${esc(step.q)}</p><div class="opts ${step.chips?"chips":""}" id="opts"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <button class="btn btn-primary" id="nextBtn" style="display:none"></button>`;
    $("body").innerHTML=h;
    const order = step.noShuffle ? step.opts.map((_,i)=>i) : shuffle(step.opts.map((_,i)=>i));
    order.forEach(oi=>{
      const b=document.createElement("button");
      b.className="opt"; b.innerHTML=esc(step.opts[oi]);
      b.onclick=()=>grade(oi,b);
      $("opts").appendChild(b);
    });
  }
  function grade(oi,btn){
    const item=queue[idx], step=item.steps[stepIdx];
    const correct = oi===step.a;
    document.querySelectorAll("#opts .opt").forEach((b,k)=>{ b.disabled=true; });
    [...document.querySelectorAll("#opts .opt")].forEach(b=>{
      if(b.textContent===step.opts[step.a]) b.classList.add("right");
    });
    if(!correct) btn.classList.add("wrongpick");
    const key=cfg.mod+"."+item.id+"."+step.key;
    const firstTime = !item.redundant && S.first[key]===undefined;
    if(!item.redundant) recFirst(key, correct);
    if(!correct && firstTime) missed.push({item,label:cfg.missLabel(item,step)});
    const fb=$("fb");
    fb.className="feedback "+(correct?"ok":"bad");
    fb.innerHTML=(correct?"<b>Correct.</b> ":`<b>Not quite — the answer is “${esc(step.opts[step.a])}”.</b> `)+step.explain
      +(!correct&&step.requote?`<div class="requote">“${esc(step.requote)}”</div>`:"");
    if(!correct){ (item._missed=item._missed||[]).push(step); }
    const nb=$("nextBtn");
    nb.style.display="inline-block";
    nb.textContent = stepIdx<item.steps.length-1 ? "Next part →" : "Next →";
    nb.onclick=()=>{
      if(stepIdx<item.steps.length-1){ stepIdx++; draw(); return; }
      if(item._missed && item._missed.length){
        const again=item._missed.slice(); delete item._missed;
        again.forEach(st=>{
          const alt = drawParallel(st.skill);
          queue.push(alt || { id:item.id, stim:item.stim, page:item.page, redundant:true, steps:[st] });
        });
      }
      stepIdx=0; idx++;
      if(idx>=queue.length){ finish(); } else {
        if(idx>=cfg.items.length && queue[idx]) round= Math.max(round, 2);
        draw();
      }
    };
  }
  function finish(){
    S.done[cfg.mod]=true; save();
    const sc=scoreFor(cfg.mod);
    const pct=sc.total? sc.got/sc.total : 0;
    const band = pct>=0.8 ? "Strong reading. Every miss got retaught and retried — check the report to see your first-try picture."
      : pct>=0.6 ? "A good start — here's how to lift it: reread the lines quoted in the feedback you got, then tell someone WHY the right answer was right."
      : "Worth a slower second pass. Reread the passage in your own copy of the novel, then come back — the reteach lines in the feedback are your map."
        + (cfg.lowNote? " "+cfg.lowNote : "");
    $("body").innerHTML=`<h2>${esc(cfg.title)} — done</h2>
    <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} on first attempt.</b> ${band}</p></div>
    ${cfg.doneNote?`<div class="panel" style="background:var(--bg)"><p class="lead" style="margin:0">${cfg.doneNote}</p></div>`:""}
    <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  }
  draw();
}

/* ---------- EVIDENCE BUILDER ---------- */
let EV = null; /* transient per-round state */
function evRounds(){ return EV_ROUNDS.filter(r=>(r.ch||1)<=(S.chapter||1)); }
function renderEv(roundIdx){
  const round=evRounds()[roundIdx];
  if(!round){ evFinish(); return; }
  EV={ roundIdx, round, level:1, idea:null, picked:new Set(), checked:false, slots:{stem:null,frag:null,tail:null}, builderChecked:false };
  if(round.mode==="idea") renderEvIdea();
  else renderEvSelect();
}
function evLadderHtml(active){
  const gotLv = S.evLv||0;
  let h=`<div class="ladder">`;
  EV_LADDER.forEach((L,i)=>{
    const st = (i+1)<=gotLv ? "got" : (i+1)===active ? "now" : (i+1)>active ? "below":"";
    h+=`<button class="lcard ${st}" onclick="evHint(${i},${active})"><span class="lv">${esc(L.lv)} ${(i+1)<=gotLv?"✓":""}</span>${esc(L.text)}</button>`;
  });
  h+=`</div><div class="ladder-hint" id="ladderHint"></div>`;
  return h;
}
function evHint(i,active){
  const box=$("ladderHint"); if(!box) return;
  if((i+1)>active && (i+1)>(S.evLv||0)){ box.className="ladder-hint show"; box.innerHTML="<b>Locked.</b> Finish the level you're on and this one opens — with its sentence stems."; return; }
  box.className="ladder-hint show";
  box.innerHTML="<b>"+esc(EV_LADDER[i].lv)+" scaffold:</b> "+esc(EV_LADDER[i].hint);
}
function renderEvIdea(){
  const r=EV.round;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(1);
  h+=`<p class="lead">${esc(r.question)}</p><div class="idea-chips">`;
  r.ideas.forEach(idea=>{ h+=`<button class="fchoice" onclick="evPickIdea('${idea.id}')">${esc(idea.label)}</button>`; });
  h+=`</div><p class="lead">Pick the idea you want to prove, then the passage opens for evidence-hunting.</p>`;
  $("body").innerHTML=h;
}
function evPickIdea(id){ EV.idea=id; EV.picked=new Set(); EV.locked=false; renderEvSelect(); }
function renderEvSelect(){
  const r=EV.round;
  const ideaLabel = EV.idea ? r.ideas.find(i=>i.id===EV.idea).label : null;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 1</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(1);
  h+=`<p class="q">${esc(r.mode==="idea" ? "Find the evidence for: "+ideaLabel : r.question)}</p>
  <p class="lead">${esc(r.qNote)}</p><div class="passage" id="pass">`;
  r.segs.forEach((seg,i)=>{ h+=`<span class="seg" id="seg${i}" onclick="evToggle(${i})">${esc(seg.t)}</span> `; });
  h+=`<span class="pg">${esc(r.where)} — The Bone Sparrow, Zana Fraillon</span></div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow"><button class="btn btn-primary" id="chk" onclick="evCheck()">Check my evidence</button>
  ${r.mode==="idea"?`<button class="btn btn-ghost" onclick="renderEvIdea()">← different idea</button>`:""}</div>`;
  $("body").innerHTML=h;
}
function evToggle(i){
  if(EV.locked) return;
  const el=$("seg"+i);
  el.classList.remove("hit","miss");
  if(EV.picked.has(i)){ EV.picked.delete(i); el.classList.remove("picked"); }
  else { EV.picked.add(i); el.classList.add("picked"); }
  $("fb").className="feedback";
}
function segRole(seg){ return EV.round.mode==="idea" ? (seg.roles[EV.idea]||"plain") : seg.role; }
function segFb(seg){ return EV.round.mode==="idea" ? (seg.fbs[EV.idea]||"") : seg.fb; }
function evCheck(){
  const r=EV.round, fb=$("fb");
  if(EV.picked.size===0){ fb.className="feedback bad"; fb.innerHTML="<b>Nothing selected.</b> Click the part of the passage that answers the question, then check."; return; }
  const picked=[...EV.picked].map(i=>({i,seg:r.segs[i],role:segRole(r.segs[i])}));
  const gold=picked.filter(p=>p.role==="gold"), okp=picked.filter(p=>p.role==="ok");
  const bad=picked.filter(p=>["other","plain","frame"].includes(p.role));
  picked.forEach(p=>{
    const el=$("seg"+p.i); el.classList.remove("picked");
    el.classList.add(p.role==="gold"||p.role==="ok" ? "hit" : "miss");
  });
  const findings=[];
  gold.forEach(p=>findings.push({sev:"ok", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  okp.forEach(p=>findings.push({sev:"warn", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  bad.forEach(p=>findings.push({sev:"warn", text:"“"+p.seg.t.slice(0,52)+(p.seg.t.length>52?"…”":"”")+" — "+segFb(p.seg)}));
  const pass = gold.length>=1 && bad.length===0;
  if(!EV.checked){ recFirst("ev."+r.id+".l1", pass); EV.checked=true; }
  let head, cls;
  if(pass){ head="Strong evidence selected."; cls="ok"; }
  else if(gold.length>=1){ head="A good start — here's how to lift it: your strongest pick is right, but deselect the ones that don't belong."; cls="warn"; }
  else if(okp.length>=1){ head="Close — that supports the answer, but there's a stronger line. Deselect and look again."; cls="warn"; }
  else { head="Something needs fixing — none of these picks answer the question yet."; cls="bad"; }
  fb.className="feedback "+cls;
  fb.innerHTML="<b>"+esc(head)+"</b><ul>"+findings.map(f=>"<li>"+esc(f.text)+"</li>").join("")+"</ul>";
  if(pass){
    EV.locked=true;
    S.evLv=Math.max(S.evLv||0,1); save();
    fb.innerHTML+=`<div style="margin-top:8px"><b>Level 1 achieved:</b> ${esc(EV_LADDER[0].text)}.</div>`;
    document.querySelector(".btnrow").innerHTML=`<button class="btn btn-primary" onclick="renderEvL2()">Level 2: explain the relevance →</button>`;
  } else {
    picked.filter(p=>p.role!=="gold"&&p.role!=="ok").forEach(p=>{ EV.picked.delete(p.i); });
  }
}
function renderEvL2(){
  const r=EV.round;
  const l2 = r.mode==="idea" ? r.l2s[EV.idea] : r.l2;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 2</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(2);
  h+=`<p class="q">${esc(l2.q)}</p><div class="opts" id="opts"></div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="brow"></div>`;
  $("body").innerHTML=h;
  let first=true;
  shuffle(l2.opts.map((_,i)=>i)).forEach(oi=>{
    const o=l2.opts[oi];
    const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    b.onclick=()=>{
      const good=o.q==="good";
      if(first){ recFirst("ev."+r.id+".l2", good); first=false; }
      const fb=$("fb");
      if(good){
        document.querySelectorAll("#opts .opt").forEach(x=>x.disabled=true);
        b.classList.add("right");
        fb.className="feedback ok"; fb.innerHTML="<b>Correct.</b> "+esc(o.fb);
        S.evLv=Math.max(S.evLv,2); save();
        fb.innerHTML+=`<div style="margin-top:8px"><b>Level 2 achieved:</b> ${esc(EV_LADDER[1].text)}.</div>`;
        $("brow").innerHTML=`<button class="btn btn-primary" onclick="renderEvBuilder()">Level 3: embed the quote →</button>`;
      } else {
        b.disabled=true; b.classList.add("wrongpick");
        fb.className="feedback bad"; fb.innerHTML="<b>Not this one.</b> "+esc(o.fb);
      }
    };
    $("opts").appendChild(b);
  });
}
function renderEvBuilder(){
  const r=EV.round;
  const B = r.mode==="idea" ? r.builders[EV.idea] : r.builder;
  EV.slots={stem:null,frag:null,tail:null};
  EV.builderChecked=false;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 3</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(3);
  h+=`<p class="lead">${esc(B.intro)} Tap a tile to place it; tap a placed tile to remove it. Colours are the parts: <b style="color:var(--stem-tx)">blue = stem</b>, <b style="color:var(--quote-tx)">yellow = quote</b>, <b style="color:var(--tail-tx)">pink = ending</b>.</p>
  <div class="slotrow">
    <div class="slot" id="slot-stem"><span class="slabel">Stem</span><span id="in-stem"></span></div>
    <div class="slot" id="slot-frag"><span class="slabel">Quote</span><span id="in-frag"></span></div>
    <div class="slot" id="slot-tail"><span class="slabel">Ending</span><span id="in-tail"></span></div>
  </div>
  <div class="preview" id="prev"></div>
  <div class="bins">
    <div class="bin stems"><h4>Sentence stems</h4><div class="binbody" id="bin-stem"></div></div>
    <div class="bin quotes"><h4>Trimmed quotes</h4><div class="binbody" id="bin-frag"></div></div>
    <div class="bin tails"><h4>Endings</h4><div class="binbody" id="bin-tail"></div></div>
  </div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="brow"><button class="btn btn-primary" onclick="evBuildCheck()">Check my sentence</button>
  <button class="btn btn-ghost" onclick="renderEvBuilder()">Reset</button></div>`;
  $("body").innerHTML=h;
  const fill=(kind,list)=>{
    const bin=$("bin-"+kind);
    shuffle(list).forEach(x=>{
      const b=document.createElement("button"); b.className="tile k-"+(kind==="stem"?"stem":kind==="frag"?"quote":"tail");
      b.textContent=x.t; b.onclick=()=>{ EV.slots[kind]=x; drawSlots(B); };
      bin.appendChild(b);
    });
  };
  fill("stem",B.stems); fill("frag",B.frags); fill("tail",B.tails);
  drawSlots(B);
}
function drawSlots(B){
  ["stem","frag","tail"].forEach(kind=>{
    const holder=$("in-"+kind); holder.innerHTML="";
    const x=EV.slots[kind];
    if(x){ const b=document.createElement("button");
      b.className="placed k-"+(kind==="stem"?"stem":kind==="frag"?"quote":"tail");
      b.textContent=x.t; b.onclick=()=>{ EV.slots[kind]=null; drawSlots(B); };
      holder.appendChild(b); }
  });
  const {stem,frag,tail}=EV.slots;
  const prev=$("prev");
  if(stem||frag||tail){
    let s=(stem?stem.t:"…")+" "+(frag?"“"+frag.t+"”":"“…”")+(tail?tail.t:" …");
    prev.textContent=s;
  } else prev.innerHTML=`<span class="ph">Your sentence appears here as you build it.</span>`;
  const fb=$("fb"); if(fb) fb.className="feedback";
}
function evBuildCheck(){
  const r=EV.round;
  const {stem,frag,tail}=EV.slots;
  const fb=$("fb");
  const findings=[];
  if(!stem||!frag||!tail){
    fb.className="feedback bad";
    fb.innerHTML="<b>Something needs fixing.</b> The sentence needs all three parts — a stem, a trimmed quote, and an ending.";
    return;
  }
  if(stem.q==="point") findings.push({sev:"warn", text:stem.fb});
  if(frag.q==="long"||frag.q==="short") findings.push({sev:"warn", text:frag.fb});
  if(frag.q==="view") findings.push({sev:"err", text:frag.fb});
  if(frag.q==="off") findings.push({sev:"warn", text:frag.fb});
  if(frag.q==="nofit" || (stem.accepts && ["good","view","off"].includes(frag.q) && !stem.accepts.includes(frag.id))){
    EV.flowFails=(EV.flowFails||0)+1;
    let msg = frag.q==="nofit" ? frag.fb : "Read the preview aloud — the quote doesn't continue the stem's grammar. Swap one of them so it flows as a single sentence.";
    if(EV.flowFails>=2) msg += " Still stuck on how clauses join? Do exactly this: open " + hubRef("GrammarHuboffline.html","Grammar Hub → Sentence Structure","run one round at your level, then come back and rebuild this sentence.");
    findings.push({sev:"err", text:msg, html:true});
  }
  if(tail.q==="point"||tail.q==="retell") findings.push({sev:"warn", text:tail.fb});
  const level = findings.some(f=>f.sev==="err") ? "err" : findings.length ? "warn" : "ok";
  const pass = level==="ok";
  if(!EV.builderChecked){ recFirst("ev."+r.id+".l3", pass); EV.builderChecked=true; }
  if(pass){
    fb.className="feedback ok";
    let msg="<b>Strong analytical sentence.</b> Stem, embedded quote and an ending that explains — read it back once more, out loud if you can. This is the level to aim for in your essay.";
    if(tail.q==="bonus") msg+=" <b>And you've woven in a second quote — that's above the standard: “I can correctly embed multiple quotes into an explanation.”</b>";
    fb.innerHTML=msg+`<div style="margin-top:8px"><b>Level 3 achieved:</b> ${esc(EV_LADDER[2].text)}.</div>`;
    S.evLv=Math.max(S.evLv, r.id==="r2"?4:3); save();
    const nextIdx=EV.roundIdx+1, nextR=evRounds()[nextIdx];
    $("brow").innerHTML = nextR
      ? `<button class="btn btn-primary" onclick="renderEv(${nextIdx})">${esc(nextR.title)} →</button>`
      : `<button class="btn btn-primary" onclick="evFinish()">Finish the evidence builder →</button>`;
  } else {
    fb.className="feedback "+(level==="err"?"bad":"warn");
    fb.innerHTML="<b>"+(level==="err"?"Something needs fixing.":"A good start — here's how to lift it:")+"</b><ul>"
      +findings.map(f=>"<li>"+(f.html?f.text:esc(f.text))+"</li>").join("")+"</ul>";
  }
}
function evFinish(){
  S.done.ev=true; save();
  const sc=scoreFor("ev");
  $("body").innerHTML=`<h2>Evidence builder — done</h2>
  ${evLadderHtml(5)}
  <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} levels passed on the first check.</b>
  You've climbed the same ladder that's on your assessment rubric: find it → explain it → embed it → make it explain something.
  The wrong turns you met on the way — retelling, overreaching, pointing at the quote — are the exact traps to avoid in your essay.</p></div>
  <div class="panel" style="background:var(--bg)"><p class="lead" style="margin:0">The <b>Analysis workshop</b> has just unlocked on the hub${S.chapter<5?" (it opens once you've read to chapter 5)":""} — build the WAGOLL wall against the CAT rubric, then write with your own harvested evidence.</p></div>
  <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
}

/* ---------- ANALYSIS WORKSHOP ---------- */
let WK=null;
function runWk(){
  WK={armed:null, placed:{}, firstTried:{}, focus:null, canvas:[], harvested:[],
      level:WK_LEVELS[0].n, versions:{}, tried:{}};
  renderWall();
}
function wallDone(){ return WK_WALL.resps.every(r=>WK.placed[r.id]!==undefined); }
function wkColourKey(){
  return `<div class="ckey">
    <span><i class="sw feat"></i>language feature / technique</span>
    <span><i class="sw verb"></i>analytical verb</span>
    <span><i class="sw ev"></i>embedded evidence</span>
    <span><i class="sw eff"></i>effect on the reader</span>
  </div>`;
}
function renderWall(){
  let h=`<div class="eyebrow">Analysis workshop · part A — build the WAGOLL wall</div>
  <h2>${esc(WK_WALL.q)}</h2><p class="lead">${esc(WK_WALL.note)}</p>
  ${wkColourKey()}
  <p class="lead" style="margin-top:-4px">Watch the colours as you build it: the weakest response is almost bare, the strongest is full. That density is the difference between retelling and analysing.</p>`;

  /* levels across the page, like the EAL WAGOLL table */
  h+=`<div class="wallscroll"><div class="wallcols">`;
  WK_WALL.levels.forEach((L,i)=>{
    const placedResp=WK_WALL.resps.find(r=>WK.placed[r.id]===i);
    h+=`<div class="wallcol ${placedResp?"filled":"droppable"}" onclick="wallDrop(${i})" role="button" tabindex="0">
      <div class="wl">${esc(L.lv)} ${placedResp?"✓":""}</div>
      <div class="wdesc">${esc(L.vic)}</div>
      ${S.eal?`<div class="weal">${esc(L.eal)}</div>`:""}
      ${placedResp?`<div class="wresp">${placedResp.h||esc(placedResp.t)}</div>`:`<div class="wempty">tap a response, then tap here</div>`}</div>`;
  });
  h+=`</div></div>`;

  const remaining=WK_WALL.resps.filter(r=>WK.placed[r.id]===undefined);
  if(remaining.length){
    h+=`<p class="q">Responses to place (${remaining.length} left) — tap one, then tap its level:</p><div class="respbank">`;
    remaining.forEach(r=>{ h+=`<button class="resp ${WK.armed===r.id?"armed":""}" onclick="wallArm('${r.id}')">${r.h||esc(r.t)}</button>`; });
    h+=`</div>`;
  }
  h+=`<div class="feedback" id="fb" aria-live="polite"></div>`;
  if(wallDone()){
    h+=`<div class="feedback ok"><b>Wall complete.</b> Read it left to right — watch the responses stop retelling and start analysing, and watch the colours fill in. This wall stays with you in Part B, and it's the same rubric your CAT is marked on.</div>
    <div class="btnrow"><button class="btn btn-primary" onclick="renderWkBuild()">Part B: write it yourself, then climb the rubric →</button></div>`;
  }
  $("body").innerHTML=h;
}
function wallArm(id){ WK.armed = WK.armed===id? null : id; renderWall(); }
function wallDrop(i){
  if(!WK.armed) return;
  const r=WK_WALL.resps.find(x=>x.id===WK.armed);
  if(WK.placed[r.id]!==undefined) return;
  const correct = r.lvl===i;
  if(!WK.firstTried[r.id]){ WK.firstTried[r.id]=true; recFirst("wk.wall."+r.id, correct); }
  if(correct){
    WK.placed[r.id]=i; WK.armed=null;
    renderWall();
    const fb=$("fb"); fb.className="feedback ok";
    fb.innerHTML="<b>Placed.</b> "+esc(r.why);
  } else {
    const fb=$("fb"); fb.className="feedback bad";
    fb.innerHTML="<b>Look again.</b> "+esc(r.why)+" Which level descriptor says that?";
  }
}
function wkFocusLabel(){ const f=WK_BUILD.focuses.find(x=>x.id===WK.focus); return f?f.label:""; }
/* ---------- ANALYSIS WORKSHOP · PART B — THE CLIMB ----------
   One sentence, rejigged up the rubric. Each level snapshots the student's
   own wording, and the snapshots stack under the rubric so the climb reads
   like the EAL WAGOLL table: the same idea, said better each time. */
function wkLevel(){ return WK_LEVELS.find(L=>L.n===WK.level); }
function wkLevelIdx(){ return WK_LEVELS.findIndex(L=>L.n===WK.level); }
function wkAvail(list){ return list.map((x,i)=>({x,i})).filter(o=>{
  const lv=o.x.lv||[5,8]; return WK.level>=lv[0] && WK.level<=lv[1]; }); }
function wkRetired(x){ const lv=x.lv||[5,8]; return WK.level>lv[1]; }
function wkFocusLabel(){ const f=WK_BUILD.focuses.find(x=>x.id===WK.focus); return f?f.label:""; }

function wkTileData(c){
  if(c.k==="open") return WK_BUILD.opens[c.i];
  if(c.k==="subj") return WK_BUILD.subjects[c.i];
  if(c.k==="verb") return WK_BUILD.verbs[c.i];
  if(c.k==="idea") return WK_BUILD.ideas[c.i];
  if(c.k==="eff")  return WK_BUILD.effects[c.i];
  if(c.k==="con")  return WK_BUILD.cons[c.i];
  if(c.k==="q"){ const sg=WK_BUILD.segs[c.i]; return {t:"“"+sg.t.replace(/[.,]$/,"")+"”", seg:sg}; }
  return {t:""};
}
function wkKindClass(k){
  return k==="subj"?"k-subj":k==="verb"?"k-verb":k==="q"?"k-q":
         k==="eff"?"k-eff":k==="idea"?"k-eff":k==="open"?"k-open":"k-con";
}
function wkText(canvas){
  let out="";
  (canvas||WK.canvas).forEach(c=>{
    const t=wkTileData(c).t;
    if(!out) out=t;
    else if(t===","||t===".") out+=t;
    else out+=" "+t;
  });
  if(out){
    out=out.charAt(0).toUpperCase()+out.slice(1);
    if(!/[.!?]$/.test(out)) out+=".";
  }
  return out;
}

    `<span class="pg">${esc(WK_BUILD.where)} — The Bone Sparrow, Zana Fraillon</span></div>`;
  }

  /* ---- canvas ---- */
  h+=`<p class="q">Your sentence — <b>drag tiles to reorder them</b>, or tap one to take it out:</p>
  <div class="canvas" id="wkCanvas"></div><div class="preview" id="wkPrev"></div>`;

  /* ---- banks, filtered to this level ---- */
  h+=`<div class="bins5">`;
  if(WK.level>=8) h+=`<div class="bin opens"><h4>Lead-in</h4><div class="binbody" id="wb-open"></div></div>`;
  h+=`<div class="bin subjects"><h4>Subjects</h4><div class="binbody" id="wb-subj"></div></div>
      <div class="bin verbs"><h4>Verbs</h4><div class="binbody" id="wb-verb"></div></div>`;

  if(WK.level<=6) h+=`<div class="bin effects"><h4>Key ideas</h4><div class="binbody" id="wb-idea"></div></div>`;
  else h+=`<div class="bin effects"><h4>Effect on the reader</h4><div class="binbody" id="wb-eff"></div></div>`;

  </div>`;
  $("body").innerHTML=h;
  wkFillBins(); wkDraw();

function wkHarvest(i){
  const at=WK.harvested.indexOf(i);
  if(at>=0){ WK.harvested.splice(at,1); WK.canvas=WK.canvas.filter(c=>!(c.k==="q"&&c.i===i)); }
  else WK.harvested.push(i);
  renderWkBuild();
}

function wkFillBins(){
  const fill=(elId, list, kind, cls)=>{
    const bin=$(elId); if(!bin) return;
    bin.innerHTML="";
    wkAvail(list).forEach(o=>{
      const b=document.createElement("button");
      b.className="tile "+cls;
      b.textContent=o.x.t;
      b.onclick=()=>{ WK.canvas.push({k:kind,i:o.i}); wkDraw(); };
      bin.appendChild(b);
    });
  };
  fill("wb-open", WK_BUILD.opens, "open", "k-open");
  fill("wb-subj", WK_BUILD.subjects, "subj", "k-subj");
  fill("wb-verb", WK_BUILD.verbs, "verb", "k-verb");
  fill("wb-idea", WK_BUILD.ideas, "idea", "k-eff");
  fill("wb-eff",  WK_BUILD.effects, "eff", "k-eff");
  fill("wb-con",  WK_BUILD.cons, "con", "k-con");
  const qbin=$("wb-q");
  if(qbin){
    qbin.innerHTML = WK.harvested.length ? "" : `<span class="gatednote">Tap lines in the passage above to collect quotes.</span>`;
    WK.harvested.forEach(i=>{
      const sg=WK_BUILD.segs[i];
      const b=document.createElement("button"); b.className="tile k-q";
      b.textContent="“"+sg.t.replace(/[.,]$/,"")+"”";
      b.onclick=()=>{ WK.canvas.push({k:"q",i}); wkDraw(); };
      qbin.appendChild(b);
    });
  }
}

/* ---- canvas render + drag-to-reorder ----
   Pointer drag with an 8px threshold, so a tap still removes a tile and a
   drag rearranges it. Works with mouse, trackpad and touch. */
function wkDraw(){
  const cv=$("wkCanvas"); if(!cv) return;
  cv.innerHTML="";
  if(!WK.canvas.length) cv.innerHTML=`<span class="ph">Tap tiles below to build your sentence here.</span>`;
  WK.canvas.forEach((c,idx)=>{
    const d=wkTileData(c);
    const b=document.createElement("button");
    b.className="ctile "+wkKindClass(c.k)+(wkRetired(d)?" retired":"");
    b.textContent=d.t;
    b.dataset.idx=idx;
    b.title=wkRetired(d)?"Retired at this level — swap it out":"Drag to move, tap to remove";
    wkBindDrag(b, idx);
    cv.appendChild(b);
  });
  const prev=$("wkPrev");
  if(prev){
    if(WK.canvas.length) prev.textContent=wkText();
    else prev.innerHTML=`<span class="ph">Your sentence appears here as you build.</span>`;
  }
  const fb=$("fb"); if(fb) fb.className="feedback";
  const kb=$("wkrow"); const old=kb&&kb.querySelector("#liftBtn"); if(old) old.remove();
}
function wkBindDrag(el, idx){
  /* Drag = move the DOM node only (no re-render mid-drag, so handlers stay
     alive), then commit the new order from DOM position on release.
     Insertion index = how many OTHER tiles have their midpoint left of the
     pointer — the standard computation, and the one that matches what the
     student sees. Under the 8px threshold it's a tap, which removes. */
  let sx=0, sy=0, dragging=false;
  el.addEventListener("pointerdown", e=>{
    if(e.button) return;
    sx=e.clientX; sy=e.clientY; dragging=false;
    try{ el.setPointerCapture(e.pointerId); }catch(_){}

    const move=ev=>{
      if(!dragging){
        if(Math.hypot(ev.clientX-sx, ev.clientY-sy) < 8) return;
        dragging=true; el.classList.add("grabbing");
      }
      ev.preventDefault();
      const cv=$("wkCanvas"); if(!cv) return;
      const others=[...cv.querySelectorAll(".ctile")].filter(t=>t!==el);
      let ins=0;
      for(const t of others){
        const r=t.getBoundingClientRect();
        if(ev.clientX > r.left + r.width/2) ins++; else break;
      }
      const ref=others[ins] || null;
      if(ref!==el.nextSibling) cv.insertBefore(el, ref);
    };

    const up=()=>{
      el.removeEventListener("pointermove", move);
      el.classList.remove("grabbing");
      if(!dragging){
        WK.canvas.splice(+el.dataset.idx, 1);
      } else {
        const cv=$("wkCanvas");
        const order=[...cv.querySelectorAll(".ctile")].map(t=>+t.dataset.idx);
        WK.canvas = order.map(i=>WK.canvas[i]);
      }
      wkDraw();
    };

    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up, {once:true});
    el.addEventListener("pointercancel", up, {once:true});
  });
}
/* ---- grammar: order matters, not just presence ---- */
function wkGrammar(kinds){
  const f=[];
  if(!kinds.length) return f;
  const first=kinds[0], last=kinds[kinds.length-1];
  const iOpen=kinds.indexOf("open"), iS=kinds.indexOf("subj"), iV=kinds.indexOf("verb");
  const iE=kinds.indexOf("eff"), iI=kinds.indexOf("idea"), iQ=kinds.indexOf("q");
  if(iOpen>0)
    f.push({sev:"err", text:"Your lead-in phrase has to come first — drag it to the front of the sentence."});
  if(first==="con")
    f.push({sev:"err", text:"Your sentence starts on a joiner. Start with your subject (or a lead-in phrase), not with a connecting word."});
  if(first==="verb")
    f.push({sev:"err", text:"Your sentence starts on a verb. Something has to be doing it — put your subject first."});
  if(iS>=0 && iV>=0 && iV<iS)
    f.push({sev:"err", text:"Your verb comes before your subject. Drag the subject in front of the verb — read it aloud and you'll hear it."});
  if(iV>=0 && iE>=0 && iE<iV)
    f.push({sev:"err", text:"Your effect clause lands before the verb. The order is subject → verb → what it reveals."});
  if(iV>=0 && iI>=0 && iI<iV)
    f.push({sev:"err", text:"Your key idea lands before the verb. The order is subject → verb → idea."});
  if(kinds.filter(k=>k==="verb").length>1)
    f.push({sev:"err", text:"There are two verbs doing the same job. Take one out — a sentence like this needs a single main verb."});
  if(last==="verb")
    f.push({sev:"err", text:"Your sentence ends on a verb, so it never says what the verb does. Put the idea or effect after it."});
  if(last==="con")
    f.push({sev:"err", text:"Your sentence ends on a joiner — it stops mid-thought. Finish it, or take the joiner off."});
  for(let i=0;i<kinds.length-1;i++){
    if(kinds[i]===kinds[i+1] && (kinds[i]==="subj"||kinds[i]==="verb"))
      f.push({sev:"err", text:"Two "+(kinds[i]==="subj"?"subjects":"verbs")+" are sitting side by side. Put a joiner between them or remove one."});
  }
  if(iQ>0){
    const before=kinds[iQ-1];
    if(!["con","verb","open"].includes(before))
      f.push({sev:"warn", text:"Your quotation is dropped straight in. Put a joiner in front of it — 'when he says', 'in the line' — so it reads as one sentence."});
  }
  return f;
}

function wkCheck(){
  const fb=$("fb"), L=wkLevel();
  if(!WK.focus){ fb.className="feedback bad"; fb.innerHTML="<b>Choose your focus first</b> — the check needs to know which idea your sentence is aiming at."; return; }
  if(!WK.canvas.length){ fb.className="feedback bad"; fb.innerHTML="<b>The canvas is empty.</b> Tap tiles to build a sentence first."; return; }
  const tiles=WK.canvas.map(c=>({c, d:wkTileData(c)}));
  const kinds=WK.canvas.map(c=>c.k);
  const findings=[];

  /* retired tiles must be traded out */
  tiles.forEach(t=>{ if(wkRetired(t.d))
    findings.push({sev:"err", text:"“"+t.d.t+"” belongs to a level you've passed. "+(L.retires||"Swap it for one of the tiles that unlocked at this level.")}); });

  /* what this level requires */
  L.need.forEach(k=>{
    if(kinds.includes(k)) return;
    const msg={
      open:"This level opens with a lead-in phrase — pick one from the Lead-in bank and put it first.",
      subj:"There's no subject. Who or what is this sentence about?",
      verb:"There's no verb. What does your subject DO?",
      idea:"Name the key idea this relates to — pick one from Key ideas.",
      q:"This level needs evidence. Harvest a line from the passage and weave it in.",
      eff:"This level needs an effect on the reader — what does the writing make us understand or feel?"
    }[k];
    findings.push({sev:"err", text:msg});
  });

  /* grammar / word order */
  wkGrammar(kinds).forEach(f=>findings.push(f));

  /* quality */
  const subj=tiles.filter(t=>t.c.k==="subj"), verbs=tiles.filter(t=>t.c.k==="verb");
  if(subj.some(t=>t.d.q==="vague"))
    findings.push({sev:"err", text:"You've used a vague subject ('this', 'it', 'the quote', 'the book'). Name the actual thing — a body, a voice, a technique, or the author."});
  if(WK.level>=8 && !subj.some(t=>t.d.q==="craft"))
    findings.push({sev:"warn", text:"At this level the subject of your sentence should be a writing choice — the simile, the clipped dialogue, the narration, or Fraillon herself."});
  if(WK.level>=7 && verbs.some(t=>t.d.q==="weak"))
    findings.push({sev:"warn", text:"That verb is flat. Trade up to an analytical verb — reveals, suggests, exposes, betrays, emphasises."});
  tiles.filter(t=>t.c.k==="q").forEach(t=>{
    const th=t.d.seg.themes||{};
    if(!Object.keys(th).length) findings.push({sev:"warn", text:"Your quote is "+t.d.seg.note+". Swap it for a line that shows the idea."});
    else if(!th[WK.focus]) findings.push({sev:"warn", text:"That quote is "+t.d.seg.note+" — but your focus is "+wkFocusLabel()+". Match the quote to the focus, or switch focus."});
  });
  tiles.filter(t=>t.c.k==="idea"||t.c.k==="eff").forEach(t=>{
    if(t.d.q==="weak") findings.push({sev:"warn", text:t.d.fb});
    else if(t.d.themes && !t.d.themes.includes(WK.focus))
      findings.push({sev:"warn", text:"Your ending is about a different idea than your focus ("+wkFocusLabel()+"). Match them — or switch your focus chip."});
  });

  const level = findings.some(f=>f.sev==="err") ? "err" : findings.length ? "warn" : "ok";
  if(!WK.tried["L"+WK.level]){ WK.tried["L"+WK.level]=true; recFirst("wk.build.L"+WK.level, level==="ok"); }

  if(level==="ok"){
    WK.versions[WK.level]=wkText();
    save();
    const next=WK_LEVELS[wkLevelIdx()+1];
    fb.className="feedback ok";
    fb.innerHTML="<b>Level "+WK.level+" reached.</b> "+esc(L.why)+
      (next?" Now keep this sentence and rejig it — you don't start again, you lift what you've already got.":" That's the top of the ladder.");
    const btn=document.createElement("button");
    btn.id="liftBtn"; btn.className="btn btn-primary";
    btn.textContent = next ? "Lift it to Level "+next.n+" →" : "Finish the climb →";
    btn.onclick = next ? wkLift : wkFinishClimb;
    $("wkrow").insertBefore(btn, $("wkrow").firstChild);
  } else {
    fb.className="feedback "+(level==="err"?"bad":"warn");
    fb.innerHTML="<b>"+(level==="err"?"Not there yet.":"Close — here's how to lift it:")+"</b><ul>"+
      findings.map(f=>"<li>"+esc(f.text)+"</li>").join("")+"</ul>";
  }
}
function wkLift(){
  const next=WK_LEVELS[wkLevelIdx()+1];
  if(!next) return wkFinishClimb();
  WK.level=next.n;
  renderWkBuild();
  const fb=$("fb");
  fb.className="feedback warn";
  fb.innerHTML="<b>Level "+next.n+" — "+esc(next.name)+".</b> "+esc(next.goal)+
    (next.retires?" <br><b>Watch out:</b> "+esc(next.retires):"");
}
function wkFinishClimb(){
  if(!S.kept.includes(wkText())) S.kept.push(wkText());
  S.done.wk=true; save();
  const sc=scoreFor("wk");
  let h=`<h2>Analysis workshop — the climb</h2>
  <div class="panel"><p style="margin:0 0 10px"><b>${sc.got}/${sc.total} first-attempt.</b> One idea, said four ways — each level lifting the last:</p>`;
  WK_LEVELS.forEach(lv=>{ const v=WK.versions[lv.n]; if(!v) return;
    h+=`<div class="climbrow done" style="margin-bottom:8px">
      <div class="climbhead"><span class="cl">Level ${lv.n} · ${esc(lv.name)}</span>
      <span class="cvic">${esc(lv.vic)}</span></div>
      <div class="cmine">${esc(v)}</div></div>`; });
  h+=`<p class="lead" style="margin:10px 0 0">Read the first and the last one after each other. Nothing was thrown away — you kept the same idea and kept lifting how you said it. That is exactly what redrafting is, and it is what the CAT is marked on.</p></div>
  <div class="btnrow"><button class="btn" onclick="runWk()">Climb again with a new focus</button>
  <button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  $("body").innerHTML=h;
}

/* ---------- REPORT ---------- */
function vcode(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return "V-"+Math.abs(h).toString(16).toUpperCase().slice(0,6); }
const MISS_LABELS={qr1:"Quickread: the Night Sea",qr2:"Quickread: caught by Beaver",fig:"Figurative → literal",voice:"Voice fingerprint",ev:"Evidence builder",wk:"Analysis workshop"};
const RECOMMEND={
 qr1:"Reread with a pencil (Lesson 09 annotation strategies) and use the chapter audio recordings while following along.",
 qr2:"Reread with a pencil (Lesson 09 annotation strategies) and use the chapter audio recordings while following along.",
 fig:"Revisit Lesson 09 (figurative language) and the simile/metaphor rows of 12w — Key ideas in the novel.",
 voice:"Revisit Lesson 07 — Character Voice before recording your voice memo; practise the word-class swap on two of your own sentences.",
 ev:"Revisit Lessons 04 and 06 (finding and embedding evidence). If joining clauses was the sticking point, do one round of Grammar Hub → Sentence Structure at your level, then rebuild the sentence.",
 wk:"Rebuild the WAGOLL wall in the Analysis workshop, then revisit Lessons 16–17 (writing about how the text is written)."};
function renderReport(){
  const mods=["qr1","qr2","fig","voice","ev","wk"];
  let rows="", worst=null, worstErr=-1, anyDone=false;
  mods.forEach(m=>{
    const sc=scoreFor(m); if(!sc.total) return;
    anyDone=true;
    const err= 1 - sc.got/sc.total;
    if(err>worstErr && sc.total>=3){ worstErr=err; worst=m; }
    rows+=`<tr><td>${esc(MISS_LABELS[m])}</td><td>${sc.got} / ${sc.total}</td><td>${S.done[m]?"finished":"in progress"}</td></tr>`;
  });
  const missed=Object.keys(S.first).filter(k=>!S.first[k]);
  const scAll=mods.reduce((a,m)=>{const x=scoreFor(m);return{got:a.got+x.got,total:a.total+x.total}},{got:0,total:0});
  const code=vcode(JSON.stringify(S.first)+S.fname+S.lname+S.sid);
  const teach = !anyDone ? "" :
    `This student worked through the Reading &amp; Evidence Hub (reading progress set to ${S.chapter>20?"the whole novel":"chapter "+S.chapter}${S.eal?", EAL support on":""}). Every wrong answer was retried until correct (mastery loop), but the scores above are <b>first attempts only</b> — genuine independent reading, not final-state guessing. `
    + (worst!==null && worstErr>0.34 ? `The clearest next step: <b>${esc(MISS_LABELS[worst])}</b> — ${esc(RECOMMEND[worst])}` :
       worst!==null && worstErr>0 ? `Errors were spread thin; the softest area was <b>${esc(MISS_LABELS[worst])}</b>. ${esc(RECOMMEND[worst])}` :
       `A clean first-attempt run across everything attempted — extension: the 'stretch' rows of 12w, or drafting the voice memo unassisted.`);
  $("body").innerHTML=`<div class="eyebrow">My report</div><h2>Reading &amp; Evidence Hub — report</h2>
  <p class="lead"><b>${esc(S.fname)} ${esc(S.lname)}</b> · student ID ${esc(S.sid)} · first-attempt scores · overall <b>${scAll.got}/${scAll.total}</b>
  <button class="linkbtn noprint" onclick="go('id')">edit details</button></p>
  <table class="rpt"><tr><th>Activity</th><th>First attempt</th><th>Status</th></tr>${rows||`<tr><td colspan="3">Nothing attempted yet — go do an activity first.</td></tr>`}</table>
  ${S.kept.length?`<div class="panel"><b>My analytical sentences (Analysis workshop):</b>${S.kept.map((k,i)=>`<div class="kept" style="margin-top:8px">${i+1}. ${esc(k)}</div>`).join("")}</div>`:""}
  ${missed.length?`<div class="panel"><b>Missed on first try (${missed.length}):</b> <span style="color:var(--muted);font-size:13px">${missed.map(esc).join(", ")}</span></div>`:""}
  <div class="panel"><b>What this tells your teacher:</b> ${teach||"Attempt at least one activity to generate the summary."}</div>
  <p class="lead">Verification code: <span class="vcode">${code}</span></p>
  <div class="btnrow noprint">
    <button class="btn btn-primary" onclick="S.done.rpt=true;save();window.print()">Print / save as PDF</button>
    <button class="btn btn-ghost" onclick="go('home')">← back to the hub</button>
  </div>`;
}

if(location.hash==="#report") go("rpt"); else go("home");
</script>
</body>
</html>
