<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three ways into a sentence — The Bone Sparrow</title>
<style>
:root{
  --bg:#f4efe6; --paper:#fbf7ee; --ink:#1f1f1f; --muted:#6b6256;
  --line:#d8cfbb; --accent:#a83232;
  --correct:#2f6a3e; --okbg:#eef5ee; --warnbg:#faeeda; --warntx:#854f0b; --badbg:#f7ecec;
  --idea-bg:#d6eafc; --idea-tx:#0b447c;
  --verb-bg:#fae3cf; --verb-tx:#8a4b12;
  --ev-bg:#fff3b0;   --ev-tx:#7a5a00;
  --eff-bg:#dff0e2;  --eff-tx:#1f5c33;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink)}
.serif{font-family:Georgia,'Times New Roman',serif}
main{max-width:720px;margin:0 auto;padding:22px 16px 70px}
h1{font-family:Georgia,serif;font-size:20px;margin:0 0 2px}
.where{color:var(--muted);font-size:12.5px;margin:0 0 18px}

.routes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.routes button{border:1px solid var(--line);border-radius:8px;background:var(--paper);
  padding:10px 14px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.routes button.on{border-color:var(--ink);font-weight:600}
.routes button .n{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;
  background:var(--bg);border:1px solid var(--line);text-align:center;font-size:11px;margin-right:6px}
.routes button.done .n{background:var(--correct);color:#fff;border-color:var(--correct)}

.given{border:1px solid var(--line);border-radius:10px;background:var(--paper);
  padding:14px 16px;margin-bottom:18px}
.given .k{font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.given .t{font-family:Georgia,serif;font-size:18px}
.k.idea{color:var(--idea-tx)} .k.verb{color:var(--verb-tx)}
.k.ev{color:var(--ev-tx)} .k.eff{color:var(--eff-tx)} .k.feat{color:#4b2f7a}

.step{margin-bottom:16px}
.step .q{font-size:13px;color:var(--muted);margin-bottom:8px}
.step .q b{font-size:13px;letter-spacing:.06em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:8px;background:#fff;padding:11px 13px;
  font-family:Georgia,serif;font-size:15.5px;text-align:left;cursor:pointer;color:var(--ink);
  transition:border-color .12s}
.opt:hover{border-color:var(--accent)}
.opt.picked{border-color:var(--ink);border-width:2px;padding:10px 12px}
.opt.no{background:var(--badbg);border-color:#c99}
.opt:disabled{cursor:default;opacity:.55}
.opt.picked:disabled,.opt.no:disabled{opacity:1}
.why{font-size:13px;border-radius:8px;padding:9px 12px;margin-top:8px;font-family:'Segoe UI',sans-serif}
.why.good{background:var(--okbg);color:var(--correct)}
.why.ok{background:var(--warnbg);color:var(--warntx)}
.why.weak{background:var(--badbg);color:var(--accent)}

.sentence{border:1px solid var(--line);border-radius:10px;background:var(--paper);
  padding:16px 18px;margin-top:6px;font-family:Georgia,serif;font-size:17px;line-height:1.8}
.sentence em{font-style:normal;border-radius:4px;padding:1px 4px}
em.hl-idea{background:var(--idea-bg);color:var(--idea-tx)}
em.hl-verb{background:var(--verb-bg);color:var(--verb-tx)}
em.hl-ev{background:var(--ev-bg);color:var(--ev-tx)}
em.hl-eff{background:var(--eff-bg);color:var(--eff-tx)}
em.hl-feat{background:#e7ddf6;color:#4b2f7a}
.after{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.after button{border:1px solid var(--line);border-radius:8px;background:var(--paper);
  padding:10px 14px;font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
@media screen and (max-width:520px){ .given .t{font-size:16px} }
</style>
</head>
<body>
<main>
<h1>Three ways into a sentence</h1>
<p class="where">Chapter 5, page 33 — Beaver at the fence</p>
<div class="routes" id="routes"></div>
<div id="stage"></div>
</main>
<script>
"use strict";
/* ---------------- data ---------------- */
const ROUTES=[
{ id:"ev", name:"From the evidence",
  given:{kind:"ev", label:"THE LINE", text:"“My throat is as dry as the dirt”"},
  steps:[
   {kind:"verb", ask:"What does the line do?", opts:[
     {t:"reveals", q:"good", why:"An analytical verb — the writing uncovers something that wasn't said."},
     {t:"shows",   q:"ok",   why:"True, but flat. 'Shows' is the Level 5 verb — swap it up when you rewrite."},
     {t:"is",      q:"weak", why:"'Is' tells us what something equals. Pick a verb that says what the writing does."}]},
   {kind:"idea", ask:"What is it about?", opts:[
     {t:"the fear in the camp",   q:"good", why:"A broad idea the whole scene carries — the body answers before Subhi does."},
     {t:"that Subhi is thirsty",  q:"weak", why:"That reads the line as information. The dry throat is fear, not thirst."},
     {t:"who has the power here", q:"good", why:"Beaver hasn't touched him, and Subhi's body already obeys."}]},
   {kind:"eff", ask:"What does it do to the reader?", opts:[
     {t:"which makes the reader feel the danger before Subhi names it", q:"good", why:"Says what the reader gets, and when."},
     {t:"which makes the reader feel sorry for him",                    q:"ok",   why:"A general feeling — the Level 5 ending. Name what the reader feels and why."},
     {t:"which makes the sentence more interesting",                    q:"weak", why:"That's about the sentence, not the reader."}]}],
  build:p=>`<em class="hl-ev">“My throat is as dry as the dirt”</em> <em class="hl-verb">${p[0]}</em> <em class="hl-idea">${p[1]}</em>, <em class="hl-eff">${p[2]}</em>.`
},
{ id:"idea", name:"From the idea",
  given:{kind:"idea", label:"THE IDEA", text:"power"},
  steps:[
   {kind:"ev", ask:"Which line proves it?", opts:[
     {t:"“I asked you a question”",    q:"good", why:"A question that is really an order — power in six words."},
     {t:"“my feet leave the ground”",  q:"good", why:"Beaver moves Subhi's body without permission."},
     {t:"“the dirt outside turns into a beautiful ocean”", q:"weak", why:"A real line — from Chapter 1, the Night Sea. Wrong scene for this idea."}]},
   {kind:"verb", ask:"What does the writing do with the idea?", opts:[
     {t:"is exposed when",  q:"good", why:"Exposed says the scene strips something bare."},
     {t:"is shown when",    q:"ok",   why:"Works, but flat — the Level 5 verb again."},
     {t:"is mentioned when",q:"weak", why:"Nothing here is mentioned. The scene acts it out."}]},
   {kind:"eff", ask:"What does it do to the reader?", opts:[
     {t:"which positions the reader to fear Beaver before he is described", q:"good", why:"Positions is the Level 8 move — the writing steers where you stand."},
     {t:"which makes the reader understand how little control a child has", q:"good", why:"Understand, not just feel — the Level 7 move."},
     {t:"which makes the reader keep reading",                              q:"weak", why:"True of any page of any book."}]}],
  build:p=>`<em class="hl-idea">The issue of power</em> <em class="hl-verb">${p[1]}</em> we read <em class="hl-ev">${p[0]}</em>, <em class="hl-eff">${p[2]}</em>.`
},
{ id:"eff", name:"From the effect",
  given:{kind:"eff", label:"THE PURPOSE", text:"make the reader feel how little control a child has"},
  steps:[
   {kind:"feat", ask:"Which writing does it?", opts:[
     {t:"Beaver shoving Subhi",               q:"good", why:"Subhi's body is simply moved — no answer possible."},
     {t:"questions with no right answer",     q:"good", why:"Every reply is wrong before it's spoken."},
     {t:"the Night Sea",                      q:"weak", why:"That's Chapter 1 — Subhi's imagination, not Beaver's power."}]},
   {kind:"ev", ask:"Which line carries it?", opts:[
     {t:"“my feet leave the ground”",         q:"good", why:"The moment control is gone — his own feet aren't his."},
     {t:"“I asked you a question”",           q:"good", why:"An order dressed as a question."},
     {t:"“as red as the sun and as deep as the sky”", q:"weak", why:"The Night Sea again — beautiful, and in the wrong chapter."}]},
   {kind:"verb", ask:"What does Fraillon do?", opts:[
     {t:"writes",    q:"good", why:"Plain and strong — the author made this happen on purpose."},
     {t:"describes", q:"ok",   why:"Fine, but describing is the Level 6 verb."},
     {t:"has",       q:"weak", why:"'Has Beaver shoving' hides that this is the author's choice."}]}],
  build:p=>`To <em class="hl-eff">make the reader feel how little control a child has</em>, Fraillon <em class="hl-verb">${p[2]}</em> <em class="hl-feat">${p[0]}</em> until <em class="hl-ev">${p[1]}</em>.`
}];

/* ---------------- state ---------------- */
const S={route:Math.max(0,ROUTES.findIndex(r=>"#"+r.id===location.hash)), step:0, picks:[], done:[false,false,false]};
window.addEventListener("hashchange",()=>{const i=ROUTES.findIndex(r=>"#"+r.id===location.hash);
  if(i>=0&&i!==S.route){S.route=i;S.step=0;S.picks=[];draw();}});

const $=id=>document.getElementById(id);
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function drawRoutes(){
  $("routes").innerHTML=ROUTES.map((r,i)=>
    `<button class="${i===S.route?'on':''} ${S.done[i]?'done':''}" data-r="${i}">`+
    `<span class="n">${S.done[i]?'✓':i+1}</span>${esc(r.name)}</button>`).join("");
  [...$("routes").querySelectorAll("button")].forEach(b=>
    b.addEventListener("click",()=>{S.route=+b.dataset.r;S.step=0;S.picks=[];draw();}));
}

function draw(){
  drawRoutes();
  const R=ROUTES[S.route];
  let h=`<div class="given"><div class="k ${R.given.kind}">${R.given.label}</div>`+
        `<div class="t serif">${esc(R.given.text)}</div></div>`;

  R.steps.forEach((st,i)=>{
    if(i>S.step) return;
    const picked=S.picks[i];
    h+=`<div class="step" data-s="${i}">`+
       `<div class="q"><b class="k ${st.kind}">${st.ask.toUpperCase()}</b></div>`+
       `<div class="opts">`+
       st.opts.map((o,j)=>{
         const cls=picked===j?"picked":(S.no&&S.no.s===i&&S.no.j===j?"no":"");
         const dis=picked!==undefined?"disabled":"";
         return `<button class="opt ${cls}" ${dis} data-s="${i}" data-j="${j}">${esc(o.t)}</button>`;
       }).join("")+
       `</div>`+
       (picked!==undefined?`<div class="why ${st.opts[picked].q}">${esc(st.opts[picked].why)}</div>`:
        (S.no&&S.no.s===i?`<div class="why weak">${esc(st.opts[S.no.j].why)}</div>`:""))+
       `</div>`;
  });

  if(S.picks.length===R.steps.length){
    S.done[S.route]=true;
    h+=`<div class="sentence">${R.build(S.picks.map((j,i)=>esc(R.steps[i].opts[j].t)))}</div>`;
    const next=S.done.indexOf(false);
    h+=`<div class="after">`+
       `<button id="again">Again, different choices</button>`+
       (next>=0?`<button id="next">${esc(ROUTES[next].name)}</button>`:"")+
       `</div>`;
  }
  $("stage").innerHTML=h;

  [...document.querySelectorAll(".opt:not(:disabled)")].forEach(b=>
    b.addEventListener("click",()=>pick(+b.dataset.s,+b.dataset.j)));
  const ag=$("again"); if(ag) ag.addEventListener("click",()=>{S.step=0;S.picks=[];S.done[S.route]=false;draw();});
  const nx=$("next"); if(nx) nx.addEventListener("click",()=>{S.route=S.done.indexOf(false);S.step=0;S.picks=[];draw();});
  drawRoutes();
}

function pick(s,j){
  const st=ROUTES[S.route].steps[s];
  if(st.opts[j].q==="weak"){ S.no={s,j}; draw(); return; }
  S.no=null; S.picks[s]=j;
  if(S.step<ROUTES[S.route].steps.length-1 && s===S.step) S.step++;
  draw();
}

draw();
</script>
</body>
</html>
