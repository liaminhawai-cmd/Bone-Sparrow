<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonnets: projector</title>
<style>
:root{
  /* The grammar session decks' slide colours, measured from the .pptx. */
  --maroon:#8C072D; --ink:#212121; --vote:#F7F0F1; --icon:#751400;
  --grey:#888888; --grey-text:#6B6B6B;
  /* Marked-word colours. Each also has its own weight or underline, so
     colour is never the only signal, and the reveal shows a legend. */
  --subj:#A24800; --verb:#0F6E4D; --prep:#1F5FA8;
  --frame:#1c1c1c; --frame-ink:#c8c3c3; --frame-hi:#2e2e2e;
  --font:Aptos,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--frame);font-family:var(--font);color:var(--ink);display:flex;flex-direction:column}

/* ---- control strip ---- */
#bar{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 8px;min-height:40px;flex-wrap:wrap;
     color:var(--frame-ink)}
#bar .sp{flex:1}
#count{font-size:13px;font-weight:600;min-width:48px;text-align:right;padding-right:8px;
       font-variant-numeric:tabular-nums}
.btn{padding:0 12px;border:1px solid transparent;border-radius:6px;font:600 13px/1 var(--font);
     cursor:pointer;background:transparent;color:var(--frame-ink);min-height:40px;min-width:40px}
.btn:hover:not(:disabled){background:var(--frame-hi);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn-primary{color:#fff;border-color:#4a4a4a}
.btn[aria-pressed="true"]{background:#5a1326;border-color:#5a1326;color:#fff}
.menulink{color:var(--frame-ink);font-weight:600;text-decoration:none;font-size:13px;padding:0 10px;
          min-height:40px;display:inline-flex;align-items:center}
.menulink:hover{color:#fff;text-decoration:underline}
:focus-visible{outline:2px solid #f3c6d1;outline-offset:2px}

/* ---- the slide: a 16:9 box letterboxed in the window.
   --k is the slide width over 1280, set by size(). ---- */
#frame{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#slide{--k:1;position:relative;flex:0 0 auto;background:#fff;overflow:hidden;
       display:grid;grid-template-rows:calc(var(--k)*140px) minmax(0,1fr) calc(var(--k)*62px);
       padding:0 calc(var(--k)*64px) 0 calc(var(--k)*78px)}
#slide.vote{background:var(--vote)}

#hd{display:flex;align-items:flex-start;gap:calc(var(--k)*24px);min-width:0}
#hdtext{flex:1 1 auto;min-width:0;padding-top:calc(var(--k)*26px)}
#h{margin:0;font-size:calc(var(--k)*32px);font-weight:700;color:var(--maroon);line-height:1.2}
#sub{margin:calc(var(--k)*12px) 0 0;font-size:calc(var(--k)*24px);font-style:italic;color:var(--grey-text);
     line-height:1.25;min-height:1.25em}
#icons{flex:0 0 auto;display:flex;gap:calc(var(--k)*10px);padding-top:calc(var(--k)*22px)}
#icons svg{display:block;width:calc(var(--k)*86px);height:calc(var(--k)*86px)}

#stage{min-height:0;overflow:hidden;display:flex}
#wrap{width:100%;margin:0 0 auto}
.is-title #wrap,.is-go #wrap{margin:auto 0}

#ft{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--k)*24px);
    font-size:calc(var(--k)*18px);padding-bottom:calc(var(--k)*8px)}
#foot{font-style:italic;color:var(--grey-text);min-width:0}
#code{color:var(--grey-text);flex:0 0 auto}
.legend{display:inline-flex;gap:1.6em;font-style:normal;font-size:calc(var(--k)*17px)}

/* ---- title and pointer slides ---- */
.rule{line-height:1.3;margin:0 0 calc(var(--k)*44px)}
.key{font-size:calc(var(--k)*34px);margin:0;line-height:1.55}
.go{line-height:1.35;margin:0}
.go p{margin:0}
.go a{color:var(--maroon)}
.qs{margin:.5em 0 0;padding-left:1.6em;font-size:.82em}
.qs li{margin-top:.3em}
.qs li::marker{color:var(--grey);font-weight:700}
.no{display:inline-block;color:var(--grey);font-weight:700;margin-right:.4em}

/* ---- the video slide: the player on the left, the instruction beside it.
   The player has a fixed size inside the slide, so it cannot push the page. ---- */
.vid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--k)*40px);align-items:center}
.vbox iframe{display:block;width:calc(var(--k)*720px);height:calc(var(--k)*405px);border:0;background:#000}
.wl{margin:calc(var(--k)*10px) 0 0;font-size:calc(var(--k)*20px);line-height:1.3}
.wl a{color:var(--maroon)}

/* ---- poem rows: number, line, then the reveal tags ---- */
.rows{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:.55em;align-items:baseline;
      line-height:1.5}
.rows .no{margin:0;text-align:right}
.rows .tx{white-space:nowrap}
.rows .row{display:contents}
/* A sonnet sits in two columns, lines 1 to 8 and 9 to 14, so the type stays large. */
.rows2{display:flex;gap:1.6em;align-items:flex-start}
.rows2 > .rows{flex:1 1 0;min-width:0}
.rows .tag{font-size:.62em;color:var(--grey-text);white-space:nowrap;padding-left:1em;visibility:hidden;
           display:inline-flex;gap:.8em;align-items:baseline}
.rows .tag .r{font-weight:700;color:var(--maroon);font-size:1.45em}
.rows .tag .n,.rows .tag .m{font-weight:600}
.rev .rows .tag{visibility:visible}
.rows .lab{grid-column:1 / -1;font-size:.55em;font-weight:700;color:var(--maroon);margin-top:.5em;
           line-height:1.4}
.rows .lab:first-child{margin-top:0}
.rows .gap{grid-column:1 / -1;height:.45em}
.rows .hidden{visibility:hidden}
.rev .rows .row.hit > *{background:#F0DDE2}
/* The turn of a sonnet: a gold band and "turn" beside the line, the same on every slide. */
.rev .rows .row.turn > *{background:#FBE3A6}
.rev .rows .row.turn .tx{font-weight:700}
.rows .tag .t{font-weight:700;color:#6B4400}
.rev .rows .row.hit .tx{font-weight:700}
.rev .rows .row.hit .tag .m{color:var(--maroon)}
/* Each rhyme sound has its own colour on the reveal, on the letter and on the
   underlined end word. The letter stays, so colour is never the only signal. */
.rows .e.LA,.rows .tag .r.LA{color:#1F5FA8;font-weight:700}
.rows .e.LB,.rows .tag .r.LB{color:#A24800;font-weight:700}
.rows .e.LC,.rows .tag .r.LC{color:#0F6E4D;font-weight:700}
.rows .e.LD,.rows .tag .r.LD{color:#7A2FA0;font-weight:700}
.rows .e.LE,.rows .tag .r.LE{color:#B0174F;font-weight:700}
.rows .e.LF,.rows .tag .r.LF{color:#00707A;font-weight:700}
.rows .e.LG,.rows .tag .r.LG{color:#7A5A00;font-weight:700}
.rev .rows .e,.k-e .b{text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.14em}
.k-s .b{color:var(--subj);font-weight:700}
.k-v .b{color:var(--verb);font-weight:700;font-style:italic}
.k-p .b{color:var(--prep);font-weight:700}
.k-c .b{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-thickness:.08em;
        text-underline-offset:.14em}
.src{font-size:calc(var(--k)*20px);color:var(--grey-text);margin:calc(var(--k)*8px) 0 0}
.ans{display:grid;gap:calc(var(--k)*6px);margin-top:calc(var(--k)*14px);padding-left:calc(var(--k)*62px);
     font-size:calc(var(--k)*28px);line-height:1.3}
.ans .chip:first-child{font-weight:700;color:var(--maroon)}
.ans.hide{visibility:hidden}

/* ---- two places side by side ---- */
.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:1.2em;line-height:1.35}
.col + .col{border-left:2px solid #E6D8DA;padding-left:1.2em}
.clab{font-size:.5em;font-weight:700;color:var(--maroon)}
.place{font-weight:700;margin:.05em 0 .25em}
.col ul{margin:0;padding-left:1.1em;font-size:.72em}
.col li{margin-top:.15em}

.rev .rows,.rev .ans,.rev .cols{animation:fade .25s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}

/* ---- teacher notes ---- */
#notes{flex:0 0 auto;display:none;max-height:36vh;overflow:auto;background:#fff;border-top:1px solid #d4cfc2;
       padding:10px 18px 12px;font-size:15px;line-height:1.5}
body.notes #notes{display:block}
.nrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:4px 0;border-bottom:1px solid #e6e1d6}
.nrow:last-child{border-bottom:0}
.nrow b{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#655f55;padding-top:2px}
.broken{color:#a83232;font-size:18px;white-space:pre-wrap}

@media screen and (max-width:860px){
  .nrow{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (prefers-reduced-motion:reduce){
  .rev .rows,.rev .ans,.rev .cols{animation:none}
}
</style>
</head>

   and punctuation, nothing modernised:
     Wordsworth, Composed upon Westminster Bridge, September 3, 1802:
       The Poetical Works of William Wordsworth, ed. William Knight, vol. II
       (1896), Project Gutenberg #12145. The edition's line numbers and
       its footnote marker after "soul" are left out.
     Shakespeare, Sonnet 18: The Sonnets, Project Gutenberg #1041.
   "notes" is the teacher strip (N): each row is [label, text].
   The PowerPoint copy, SonnetsDeck.pptx, is built from this block by
   tools/deck-pptx (extract.js, then build.ps1). After an edit here,

const SLIDES = [

 { kind:"poem",

          "Each line has ten small sounds, and five are strong:",

 { kind:"cols",
   h:"Shakespeare’s English",
   sub:"How do we say it today?",
   src:"Sonnet 18, Westminster Bridge",
   cols:[ {label:"Then", place:"In the poems",

   notes:[

     ["Ask","“Where is he? What time of day is it? What is he looking at?” London, early morning, the city and the river."],

     ["Teaching point","Fourteen lines is the first rule of a sonnet. A ballad stanza has six."] ] },

 { kind:"poem",
   h:"Syllables and beats",

   legend:[["p","Strong syllable"]],
   ans:["10 syllables: weak, strong, five times","da-DUM, da-DUM, da-DUM, da-DUM, da-DUM","Five beats: this pattern is iambic pentameter"],
   notes:[
     ["Display","Say line 1 together. Put a hand under your chin and count the drops. Then say it again and tap the strong syllables. Take a count of each before you reveal."],
     ["Answer","10 syllables. Earth HAS not AN-y THING to SHOW more FAIR. The beat falls on every second syllable, weak then strong, five times: da-DUM da-DUM da-DUM da-DUM da-DUM. Five beats of two syllables is called iambic pentameter."],
     ["Ask","“How many syllables? How many taps? Where does your last tap land?” On fair."],
     ["If students disagree","11 usually comes from counting any as three syllables. It is two: an-y. Some readers put the first tap on Earth. Accept it if they can still show five taps and ten syllables."],

};

const TAGS = {s:"changed word", c:"rhyme to fix", p:"strong syllable", e:"rhyme sound", v:"story"};
const RUN = /\[([a-z]+):([^\[\]]*)\]/g;
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* The markup with the brackets taken away: the words as the source has them. */
function plain(m){ return m.replace(RUN, (x,k,t) => t); }

/* The markup as runs: [{t:"Kew", k:"s"}, {t:" and ", k:""}, ...] */
function runsOf(m){
  const out = []; let last = 0;
  m.replace(RUN, (x, k, t, at) => {
    if(at > last) out.push({t: m.slice(last, at), k: ""});
    out.push({t, k});
    last = at + x.length;
    return x;
  });
  if(last < m.length) out.push({t: m.slice(last), k: ""});
  return out;
}

/* The runs of one poem line. On a reveal that shows a rhyme letter, the end
   word is marked (k "e"), so the rhyme is underlined where it sits. */
function lineRuns(t, end, rev, markEnd){
  if(rev && /\[[a-z]+:/.test(t)) return runsOf(t);
  const p = plain(t);
  if(rev && markEnd && end){
    const i = p.lastIndexOf(end);
    if(i >= 0){
      const out = [];
      if(i > 0) out.push({t:p.slice(0,i), k:""});
      out.push({t:end, k:"e", l:typeof markEnd === "string" ? markEnd : ""});
      if(i + end.length < p.length) out.push({t:p.slice(i + end.length), k:""});
      return out;
    }
  }
  return [{t:p, k:""}];
}

/* What shows to the right of a line on the reveal: [{t, k:"r"|"n"|"m"}]. */
function tagParts(tag){
  const o = [];
  if(!tag) return o;
  if(tag.r) o.push({t:tag.r, k:"r", l:tag.r});
  if(tag.n != null) o.push({t:tag.n + (tag.n === 1 ? " syllable" : " syllables"), k:"n"});
  if(tag.m) o.push({t:tag.m, k:"m"});
  return o;
}

/* The rows of a poem or vote slide, for the display (rev false) or the
   reveal (rev true). Both the web page and the PowerPoint build read this.
   A "nonum" slide's lines have an empty number. */
function rowsOf(sl, rev){
  const rows = [], start = sl.first || 1;
  const lines = (L, ends, tags, hit, shown, label) => {
    if(label) rows.push({type:"label", text:label, hidden:!shown});
    L.forEach((t, i) => rows.push({
      type:"line", no: sl.nonum ? "" : start + i, hidden:!shown,
      runs: lineRuns(t, ends && ends[i], rev && shown, (tags && tags[i] && tags[i].r) || false),
      tag: (tags ? tagParts(tags[i]) : []).concat(L === sl.lines && sl.turn && sl.turn.indexOf(i) >= 0 ? [{t:"↻ turn", k:"t"}] : []), tagOn: rev && shown,
      hit: !!(rev && hit && hit.indexOf(i) >= 0),
      turn: !!(rev && shown && L === sl.lines && sl.turn && sl.turn.indexOf(i) >= 0) }));
  };
  if(sl.kind === "move"){
    lines(sl.from.lines, null, null, null, true, sl.from.label);
    rows.push({type:"gap"});
    lines(sl.to.lines, null, null, null, rev, sl.to.label);
    return rows;
  }
  lines(sl.lines, sl.ends, sl.tags, sl.hit, true, null);
  if(sl.opts){
    rows.push({type:"gap"});
    sl.opts.forEach((o, i) => rows.push({type:"line", no:i + 1, hidden:false, tag:[], tagOn:false,
      runs:[{t:o, k:""}], hit: !!(rev && sl.hitOpt === i) }));
  }
  return rows;
}

/* The last alphabetic word of a line, for checking the "ends" lists. */
function lastWord(s){ return (s.match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g) || []).pop() || ""; }

/* Every problem a hand edit to the content block could cause. If there are
   any, the deck shows them instead of a slide. */
function problems(){
  const out = [];
  const look = (m, where) => {
    m.replace(RUN, (x,k) => { if(!TAGS[k]) out.push(`${where}: unknown part "${k}"`); return x; });
    if(/[\[\]]/.test(m.replace(RUN, ""))) out.push(`${where}: a bracket is not closed or not opened`);
  };
  const poemLines = (sl, w) => {
    const n = (sl.lines || []).length;
    if(!n){ out.push(w + ": no lines"); return; }
    sl.lines.forEach((t, i) => look(t, `${w} line ${i+1}`));
    if(sl.ends){
      if(sl.ends.length !== n) out.push(w + ": ends and lines are not the same length");
      sl.lines.forEach((t, i) => { if(sl.ends[i] && lastWord(plain(t)).toLowerCase() !== sl.ends[i].toLowerCase())
        out.push(`${w}: line ${i+1} ends in "${lastWord(plain(t))}", not "${sl.ends[i]}"`); });
    }
    if(sl.tags){
      if(sl.tags.length !== n) out.push(w + ": tags and lines are not the same length");
      const count = {};
      sl.tags.forEach(t => { if(t && t.r) count[t.r] = (count[t.r] || 0) + 1; });
      Object.keys(count).forEach(r => { if(count[r] < 2) out.push(`${w}: rhyme letter ${r} is used once`); });
      if(sl.scheme && sl.tags.map(t => t.r || "-").join("") !== sl.scheme)
        out.push(`${w}: the letters ${sl.tags.map(t => t.r || "-").join("")} are not ${sl.scheme}`);
    }
    if(sl.hit) sl.hit.forEach(h => { if(!(h >= 0 && h < n)) out.push(w + ": hit is not a line"); });
  };
  const legend = (sl, w) => { if(sl.legend) sl.legend.forEach(l => { if(!TAGS[l[0]]) out.push(`${w}: legend part "${l[0]}" is unknown`); }); };
  SLIDES.forEach((sl, i) => {
    const w = "Slide " + (i+1);
    if(!sl.notes || !sl.notes.length) out.push(w + ": no teacher notes");
    legend(sl, w);
    if(sl.kind === "title"){
      look(sl.rule, w);
      if(!sl.key || !sl.key.length) out.push(w + ": no key");
    } else if(sl.kind === "poem"){
      if(!sl.h) out.push(w + ": no heading");
      poemLines(sl, w);
      if(!sl.tags) out.push(w + ": a poem slide needs tags");
    } else if(sl.kind === "vote"){
      if(!sl.ask || !sl.key) out.push(w + ": a vote needs ask and key");
      poemLines(sl, w);
      if(!(sl.fingers >= 1 && sl.fingers <= 4)) out.push(w + ": fingers must be 1 to 4");
      if(sl.opts && !(sl.hitOpt >= 0 && sl.hitOpt < sl.opts.length)) out.push(w + ": hitOpt is not an option");
      if(!sl.opts && !(sl.hit && sl.hit.length)) out.push(w + ": a vote with no options needs a hit line");
      if(sl.opts && sl.opts.length !== sl.fingers) out.push(w + ": one option for each finger");
    } else if(sl.kind === "cols"){
      if(!sl.h) out.push(w + ": no heading");
      ["cols","turned"].forEach(s => {
        if(!Array.isArray(sl[s]) || sl[s].length !== 2) out.push(`${w}: ${s} needs two columns`);
        else sl[s].forEach((c, j) => { if(!c.label || !c.place || !(c.items && c.items.length))
          out.push(`${w}: ${s} column ${j+1} needs label, place and items`); });
      });
    } else if(sl.kind === "go"){
      if(!sl.line || !sl.h) out.push(w + ": a pointer slide needs h and line");
      if(sl.video && !(sl.video.embed && sl.video.watch && sl.video.label)) out.push(w + ": video needs embed, watch and label");
      if(sl.list && !(Array.isArray(sl.list) && sl.list.length)) out.push(w + ": list needs at least one question");
    } else out.push(w + ": unknown kind " + sl.kind);
    if(sl.kind !== "title" && sl.kind !== "go" && !(sl.ans && sl.ans.length)) out.push(w + ": no reveal lines");
  });
  return out;
}

/* ---------- state: in memory only, nothing is saved ---------- */
const at = {i:0, rev:false};
const $ = id => document.getElementById(id);
const canReveal = i => /^(poem|vote|move|cols)$/.test(SLIDES[i].kind);

function forward(){
  if(canReveal(at.i) && !at.rev) at.rev = true;
  else if(at.i < SLIDES.length-1){ at.i++; at.rev = false; }
  render();
}
function back(){
  if(at.rev) at.rev = false;
  else if(at.i > 0){ at.i--; at.rev = canReveal(at.i); }
  render();
}
function next(){ if(at.i < SLIDES.length-1){ at.i++; at.rev = false; render(); } }
function toggleReveal(){ if(canReveal(at.i)){ at.rev = !at.rev; render(); } }
function toggleNotes(){
  const on = document.body.classList.toggle("notes");
  $("bNotes").setAttribute("aria-pressed", on);
  fit();
}

/* The markup as HTML. Runs of k "e" are the marked rhyme sounds. */
function runsHtml(runs){
  return runs.map(r =>
    r.k === "e" ? `<span class="e${r.l ? " L" + r.l : ""}">${esc(r.t)}</span>`
    : r.k ? `<span class="k-${r.k}"><span class="b">${esc(r.t)}</span></span>`
    : esc(r.t)).join("");
}
const marked = m => runsHtml(runsOf(m));

function rowHtml(r){
  if(r.type === "label") return `<div class="lab${r.hidden ? " hidden" : ""}">${esc(r.text)}</div>`;
  if(r.type === "gap") return `<div class="gap"></div>`;
  const tag = r.tag.map(p => `<span class="${p.k}${p.l ? " L" + p.l : ""}">${esc(p.t)}</span>`).join("");
  return `<div class="row${r.hit ? " hit" : ""}${r.turn ? " turn" : ""}${r.hidden ? " hidden" : ""}"><span class="no">${r.no}</span>` +
    `<span class="tx">${runsHtml(r.runs)}</span><span class="tag">${tag}</span></div>`;
}

function colsHtml(cols){
  return `<div class="cols fitme">${cols.map(c => `<div class="col"><div class="clab">${esc(c.label)}</div>` +
    `<div class="place">${esc(c.place)}</div><ul>${c.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")}</div>`;
}

function goHtml(sl){
  const line = sl.href ? `<a href="${esc(sl.href)}">${esc(sl.line)}</a>` : esc(sl.line);
  const list = sl.list ? `<ol class="qs">${sl.list.map(q => `<li>${esc(q)}</li>`).join("")}</ol>` : "";
  const text = `<div class="go fitme"><p>${line}</p>${list}</div>`;
  if(!sl.video) return text;
  /* No autoplay: the player waits for the teacher. */
  return `<div class="vid"><div class="vbox"><iframe src="${esc(sl.video.embed)}" title="${esc(sl.video.label)}"` +
    ` allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>` +
    `<p class="wl"><a href="${esc(sl.video.watch)}" target="_blank" rel="noopener">${esc(sl.video.label)}</a></p></div>${text}</div>`;
}

/* The finger icons for a vote: 1 to 4, never worked out from the answer. */
function icons(sl){
  if(sl.kind === "title" || sl.kind === "go") return ["book"];
  if(at.rev) return ["think"];
  if(sl.kind === "vote") return [1,2,3,4].slice(0, sl.fingers).map(j => "f" + j);
  return ["book"];
}

function render(){
  const sl = SLIDES[at.i], n = SLIDES.length;
  $("count").textContent = `${at.i+1} / ${n}`;
  $("bBack").disabled = at.i === 0 && !at.rev;
  $("bNext").disabled = at.i === n-1;
  $("bReveal").disabled = !canReveal(at.i);
  $("bReveal").setAttribute("aria-pressed", at.rev);
  const isVote = sl.kind === "vote" && !at.rev;
  $("slide").className = `is-${sl.kind}` + (at.rev ? " rev" : "") + (isVote ? " vote" : "");

  let html = "", h = "", sub = "", foot = "";
  const ans = () => `<div class="ans">${sl.ans.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>`;
  if(sl.kind === "title"){
    h = FRAME.know; sub = sl.h;
    html = `<p class="rule fitme">${marked(sl.rule)}</p>
      <p class="key">${sl.key.map(k => `<span class="no">${esc(k[0])}</span>${esc(k[1])}`).join("<br>")}</p>`;
  } else if(sl.kind === "go"){
    h = sl.h; sub = sl.mod;
    html = goHtml(sl);
  } else if(sl.kind === "cols"){
    h = at.rev ? FRAME.reveal : sl.h; sub = at.rev ? sl.h : (sl.sub || "");
    html = colsHtml(at.rev ? sl.turned : sl.cols) + `<p class="src">${esc(sl.src)}</p>${ans()}`;
  } else {
    const rows = rowsOf(sl, at.rev);
    if(sl.kind === "vote"){ h = at.rev ? FRAME.reveal : sl.ask; sub = at.rev ? sl.ask : sl.key; }
    else { h = at.rev ? FRAME.reveal : sl.h; sub = at.rev ? sl.h : (sl.sub || ""); }
    let n = 0;
    const cut = (sl.lines.length >= 12 && !sl.opts) ? rows.findIndex(x => x.type === "line" && ++n === 9) : -1;
    const body = cut > 0
      ? `<div class="rows2 fitme"><div class="rows">${rows.slice(0, cut).map(rowHtml).join("")}</div>` +
        `<div class="rows">${rows.slice(cut).map(rowHtml).join("")}</div></div>`
      : `<div class="rows fitme">${rows.map(rowHtml).join("")}</div>`;
    html = body +
      `<p class="src">${esc(sl.src)}</p>${ans()}`;
    const lg = sl.kind === "move" ? FRAME.legend : sl.legend;
    if(at.rev && lg) foot = `<span class="legend">` + lg.map(l =>
      `<span class="k-${l[0]}"><span class="b">${esc(l[1])}</span></span>`).join("") + `</span>`;
    else foot = (sl.kind === "vote" && !at.rev) ? esc(FRAME.vote) : "";
  }
  $("h").textContent = h;
  $("sub").textContent = sub;
  $("icons").innerHTML = icons(sl).map(k => ICONS[k] || "").join("");
  $("wrap").innerHTML = html;
  $("foot").innerHTML = foot;
  $("code").textContent = FRAME.code;
  $("notes").innerHTML = sl.notes.map(r =>
    `<div class="nrow"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("");
  fit();
}

/* The slide is the largest 16:9 box that fits under the control strip (and
   above the notes, when they are open). Returns the scale against a
   1280 x 720 slide. */
function size(){
  const f = $("frame"), s = $("slide");
  const W = f.clientWidth - 16, H = f.clientHeight - 8;
  const w = Math.max(160, Math.floor(Math.min(W, H * 16 / 9)));
  s.style.width = w + "px";
  s.style.height = Math.floor(w * 9 / 16) + "px";
  s.style.setProperty("--k", (w / 1280).toFixed(4));
  return w / 1280;
}

/* Largest type that fits the slide in one view. The tags and the answer lines
   are present but hidden on the display, so the size does not change when
   the reveal comes and nothing jumps. Sizes are for a 1280 x 720 slide. */
const SIZES = {title:[60,32], go:[48,24], poem:[34,14], vote:[34,14], move:[34,14], cols:[40,16]};
function fit(){
  const k = size();
  const sl = SLIDES[at.i], el = document.querySelector(".fitme");
  if(!el) return;
  const ans = document.querySelector(".ans");
  if(ans) ans.classList.remove("hide");
  const stage = $("stage"), wrap = $("wrap");
  const fits = () => wrap.offsetHeight <= stage.clientHeight && wrap.scrollWidth <= wrap.clientWidth + 1
    && el.scrollWidth <= el.clientWidth + 1
    && ![...el.querySelectorAll(".tx")].some(t => t.scrollWidth > t.clientWidth + 1);
  let [s, min] = SIZES[sl.kind].map(v => Math.round(v * k));
  el.style.fontSize = s + "px";
  while(s > min && !fits()){ s -= 1; el.style.fontSize = s + "px"; }
  if(ans && !at.rev) ans.classList.add("hide");
}

/* ---------- controls ---------- */
$("bBack").addEventListener("click", back);
$("bNext").addEventListener("click", next);
$("bReveal").addEventListener("click", toggleReveal);
$("bNotes").addEventListener("click", toggleNotes);
/* A mouse click should not leave a button focused, or the next Space would
   press it again instead of moving the deck on. Tab focus is unaffected. */
document.querySelectorAll("#bar button").forEach(b =>
  b.addEventListener("mousedown", e => e.preventDefault()));
document.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const onControl = /^(BUTTON|A)$/.test(e.target.tagName);
  if(onControl && (e.key === " " || e.key === "Enter")) return;
  if(e.key === "ArrowRight" || e.key === " " || e.key === "PageDown"){ e.preventDefault(); forward(); }
  else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); back(); }
  else if(e.key === "n" || e.key === "N"){ e.preventDefault(); toggleNotes(); }
  else if(e.key === "Home"){ e.preventDefault(); at.i = 0; at.rev = false; render(); }
  else if(e.key === "End"){ e.preventDefault(); at.i = SLIDES.length-1; at.rev = false; render(); }
});
addEventListener("resize", fit);

/* #4 opens on slide 4, #4r on its reveal, so a lesson plan can link straight in. */
(function start(){
  const bad = problems();
  if(bad.length){
    size();
    $("wrap").innerHTML = `<p class="broken">The content block has a problem, so the deck will not run:\n${esc(bad.join("\n"))}</p>`;
    return;
  }
  const h = /^#(\d+)(r?)$/.exec(location.hash);
  if(h){ const i = +h[1]-1; if(i >= 0 && i < SLIDES.length){ at.i = i; at.rev = !!h[2] && canReveal(i); } }
  render();
})();
</script>
</body>
