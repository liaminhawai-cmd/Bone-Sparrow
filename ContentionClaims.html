<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contention and claims — Writing Folio</title>
<style>
:root{
  --bg:#f1efe8; --paper:#fbfaf6; --ink:#1f1f1f; --muted:#655f55;
  --line:#d4cfc2; --line-soft:#e6e1d6; --accent:#2c5f7c;
  --correct:#2f6a3e; --okbg:#eef5ee; --wrong:#a83232; --wrongbg:#fbeeee;
  --warn:#8a5a12; --warnbg:#fdf4e3;
  /* Colour is a taxonomy: one colour, one named category, legend always on
     screen beside it. Correctness is never carried by these. */
  --cont-bg:#cfe0f5; --cont-tx:#17406e;
  --claim-bg:#d4ecd8; --claim-tx:#1d5c2e;
  --fact-bg:#fdf0b8; --fact-tx:#6a5200;
  --rhetq-bg:#e6dcf7; --rhetq-tx:#4a2f7d;
  --emot-bg:#fbd9da; --emot-tx:#8d2733;
  --incl-bg:#fde0c8; --incl-tx:#8a4a12;
  /* Morphemes keep the colours they have in the vocab hub, so a part of a
     word means the same thing in both places. */
  --mpre:#2c6fa8; --mpre-bg:#e5eef5;
  --mroot:#9a5518; --mroot-bg:#f5e7d8;
  --msuf:#3f7a4a; --msuf-bg:#e6f1e8;
  --mcon:#6c6353; --mcon-bg:#ece7db;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);
     display:flex;justify-content:center;padding:18px 12px 60px}
.container{width:100%;max-width:880px;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
body.wide .container{max-width:min(1200px,98vw)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:0 0 4px}
h2{font-family:Georgia,'Times New Roman',serif;font-size:20px;margin:0 0 10px}
h3{font-family:Georgia,serif;font-size:16px;margin:18px 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.55}
.eyebrow{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin:0 0 6px}
p.lead{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 14px}
.topbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 16px;font-size:13px}
.topbar .sp{margin-left:auto;display:flex;gap:14px}
.menulink{color:var(--accent);font-weight:600;text-decoration:none}
.menulink:hover{text-decoration:underline}

.btn{padding:10px 17px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
     cursor:pointer;background:var(--paper);color:var(--ink);font-family:inherit;transition:all .15s ease}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#24506a}
.btn-ghost{background:var(--bg);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.fields{display:flex;flex-direction:column;gap:12px;max-width:420px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
      font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{line-height:1.6;resize:vertical}
.err{color:var(--wrong);font-size:12.5px;min-height:17px;margin-top:3px}

/* ---- step list ---- */
.step{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:#fff;
      border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:0 0 10px;
      font-family:inherit;font-size:15px;color:inherit;cursor:pointer;transition:border-color .15s}
.step:hover{border-color:var(--accent)}
.step .num{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
           display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.step.done .num{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
.step .t{font-weight:700}
.step .d{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.5}
.step .tag{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;
           letter-spacing:.4px;color:var(--muted);white-space:nowrap;padding-top:4px}

/* ---- deck ---- */
.deckbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
         border-radius:10px;padding:9px 14px;margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.deckbar b{color:var(--ink)}
.meter{flex:1;min-width:120px;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.cardbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 14px}
.prompt{font-size:14px;font-weight:700;margin:0 0 10px}
.stim{font-family:Georgia,serif;font-size:17px;line-height:1.6;background:var(--bg);
      border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 15px;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 14px;
     font-size:14.5px;font-family:inherit;color:inherit;cursor:pointer;line-height:1.5}
.opt:hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.chosen{border:2px solid var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--correct)}
.opt.wrong{background:var(--wrongbg);border-color:var(--wrong)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{flex:0 1 auto}
.fb{border-radius:9px;padding:12px 15px;margin:14px 0 0;font-size:13.5px;line-height:1.6;display:none}
.fb.on{display:block}
.fb.ok{background:var(--okbg);border:1px solid var(--correct)}
.fb.bad{background:var(--wrongbg);border:1px solid var(--wrong)}
.fb.warn{background:var(--warnbg);border:1px solid var(--warn)}
.fb ul{margin:7px 0 0;padding-left:20px}
.fb li{margin:3px 0}
.fb .rule{display:block;font-weight:700;margin-bottom:3px}
.notjudged{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px}

/* ---- samples: clickable chunks ---- */
.sample{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px;
        font-family:Georgia,serif;font-size:16px;line-height:1.85}
.chunk{cursor:pointer;border-radius:4px;padding:1px 2px;border-bottom:1px dotted var(--line)}
.chunk:hover{background:var(--bg)}
.chunk.picked{outline:2px solid var(--ink);outline-offset:1px}
.chunk.right{background:var(--okbg)}
.chunk.wrong{background:var(--wrongbg)}
.src{display:block;font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--muted);margin-top:10px}

/* ---- the taxonomy ---- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:12px;color:var(--muted)}
.legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:5px}
.sw.cont{background:var(--cont-bg);border:1px solid var(--cont-tx)}
.sw.claim{background:var(--claim-bg);border:1px solid var(--claim-tx)}
.sw.fact{background:var(--fact-bg);border:1px solid var(--fact-tx)}
.sw.rhetq{background:var(--rhetq-bg);border:1px solid var(--rhetq-tx)}
.sw.emot{background:var(--emot-bg);border:1px solid var(--emot-tx)}
.sw.incl{background:var(--incl-bg);border:1px solid var(--incl-tx)}
.m-cont{background:var(--cont-bg);color:var(--cont-tx)}
.m-claim{background:var(--claim-bg);color:var(--claim-tx)}
.m-fact{background:var(--fact-bg);color:var(--fact-tx)}
.m-rhetq{background:var(--rhetq-bg);color:var(--rhetq-tx)}
.m-emot{background:var(--emot-bg);color:var(--emot-tx)}
.m-incl{background:var(--incl-bg);color:var(--incl-tx)}

/* ---- marker ---- */
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pbtn{border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;
      font-family:inherit;cursor:pointer;background:#fff;color:var(--ink)}
.pbtn.on{outline:2px solid var(--ink);outline-offset:1px}
.canvasdoc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;
           font-family:Georgia,serif;font-size:16px;line-height:2.05;margin:0 0 12px}
.tok{cursor:pointer;border-radius:3px;padding:1px 0}
.tok:hover{box-shadow:inset 0 -2px 0 var(--accent)}
.tok.anchor{outline:2px solid var(--ink);outline-offset:1px}
.tok.mk{padding:2px 1px}
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:0 0 12px}
.covcell{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.covcell .n{font-size:19px;font-weight:800}
.covcell .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}

table.rpt{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 10px;background:#fff}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.rpt th{background:var(--bg);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.dim{color:#97907f}
.vcode{letter-spacing:1px;font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}

/* key words, tappable wherever they appear */
.kw{cursor:help;padding:0 1px;border-radius:3px;border-bottom:2px dotted var(--accent)}
.kw:hover,.kw:focus-visible{background:#fff;box-shadow:0 0 0 2px #fff,0 2px 10px rgba(40,30,10,.25);outline:none}
.kwpop{position:fixed;z-index:80;width:min(330px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);
       border-radius:12px;box-shadow:0 12px 34px rgba(40,30,10,.3);padding:13px 15px}
.kwpop .gx{position:absolute;top:5px;right:8px;border:0;background:none;color:var(--muted);font-size:19px;cursor:pointer;line-height:1}
.kwpop .kww{font-family:Georgia,serif;font-size:19px;font-weight:700;margin-bottom:7px}
.kwparts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 8px}
.mchip{display:inline-flex;flex-direction:column;align-items:center;border:1px solid transparent;
       border-radius:8px;padding:3px 9px;line-height:1.25;opacity:0;transform:translateY(10px) scale(.6);
       animation:chipIn .45s cubic-bezier(.2,.85,.3,1.25) forwards}
.mp{background:var(--mpre-bg); color:var(--mpre); border-color:var(--mpre)}
.mr{background:var(--mroot-bg);color:var(--mroot);border-color:var(--mroot)}
.ms{background:var(--msuf-bg); color:var(--msuf); border-color:var(--msuf)}
.mc{background:var(--mcon-bg); color:var(--mcon); border-color:var(--mcon)}
.tile.mp,.opt.mp{background:var(--mpre-bg); color:var(--mpre); border-color:var(--mpre)}
.tile.mr,.opt.mr{background:var(--mroot-bg);color:var(--mroot);border-color:var(--mroot)}
.tile.ms,.opt.ms{background:var(--msuf-bg); color:var(--msuf); border-color:var(--msuf)}
.tile.mc,.opt.mc{background:var(--mcon-bg); color:var(--mcon); border-color:var(--mcon)}
.metword{font-family:Georgia,serif;font-size:27px;font-weight:700;line-height:1.2}
.metword .pos{font-family:'Segoe UI',sans-serif;font-size:12.5px;font-weight:400;font-style:italic;color:var(--muted);margin-left:6px}
.metm{font-size:15.5px;line-height:1.6;margin:6px 0 12px}
.metnote{font-size:13px;line-height:1.65;color:var(--muted);background:var(--bg);border-radius:8px;padding:11px 14px;margin:12px 0 0}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:12px}
.mlegend i{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:5px}
.slotline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px}
.mslot{min-width:62px;min-height:38px;border:1px dashed var(--line);border-radius:8px;background:#fff;
       display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px;line-height:1.2}
.mslot b{font-size:14px} .mslot small{font-size:9.5px;opacity:.85}
.mslot.mp{background:var(--mpre-bg); color:var(--mpre); border-color:var(--mpre)}
.mslot.mr{background:var(--mroot-bg);color:var(--mroot);border-color:var(--mroot)}
.mslot.ms{background:var(--msuf-bg); color:var(--msuf); border-color:var(--msuf)}
.mslot.mc{background:var(--mcon-bg); color:var(--mcon); border-color:var(--mcon)}
.mchip b{font-size:13.5px} .mchip small{font-size:10px;opacity:.85}
.mplus{font-weight:800;color:var(--muted)}
.kwm{font-size:13px;line-height:1.55}
@keyframes chipIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .mchip{animation:none;opacity:1;transform:none} }
/* grammar drills */
.gsent{font-family:Georgia,serif;font-size:18px;line-height:2.1;background:var(--bg);border-radius:8px;
       padding:12px 15px;margin:0 0 12px}
.gw2{cursor:pointer;border-radius:4px;padding:1px 3px}
.gw2:hover{box-shadow:inset 0 -2px 0 var(--accent)}
.gw2.on{background:var(--cont-bg);color:var(--cont-tx);font-weight:700}
.gw2.right{background:var(--claim-bg);color:var(--claim-tx);font-weight:700}
.gw2.wrong{background:var(--emot-bg);color:var(--emot-tx)}
.scale{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.scale .slot{min-width:84px;min-height:40px;border:1px dashed var(--line);border-radius:8px;
             display:flex;align-items:center;justify-content:center;font-weight:700;background:#fff}
.scale .slot.full{border-style:solid;background:var(--cont-bg);color:var(--cont-tx)}
.scale .arrow{color:var(--muted);font-size:12px}
.strands{display:flex;flex-direction:column;gap:10px}
.railrow{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;flex-wrap:wrap}
.raillab{flex:0 0 96px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
         color:var(--muted);padding-top:11px}
.railsent{font-family:Georgia,serif;font-size:17px;line-height:1.6;background:var(--bg);
          border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 15px;margin:4px 0 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media screen and (max-width:860px){ .container{padding:16px} }
@media print{
  body{background:#fff;padding:0;display:block}
  .container{max-width:none;border:0;box-shadow:none;padding:0;border-radius:0}
  .noprint{display:none !important}
  .container{background:#fff}
  .canvasdoc,.panel,table.rpt,.covcell{border-color:#999}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h1,h2,h3{page-break-after:avoid}
  table.rpt,.canvasdoc{page-break-inside:auto}
}
</style>

<body>
<div class="container"><div id="body"></div></div>

<script>
/* ============================================================================
   CONTENTION AND CLAIMS
   Single file, no build, no dependencies. Data first, engine after.

   Source material. The card sorts (Sets D and E) and the six sentences in the
   "which of these are her claims" task are the teacher's own wording from
   06.1c and 06.1w. Where the mentor text itself is needed — because locating a
   contention in real prose is the skill — short extracts are quoted and
   attributed, paragraph by paragraph, with the printed reading copy (05.1r)
   as the text students actually read from. The whole article is not
   reproduced here: this site is public.
   ========================================================================== */

const CATS = {
  cont : { label:"Contention",         cls:"cont",  tx:"the writer's position: what they want you to think or do" },
  claim: { label:"Claim",              cls:"claim", tx:"a reason given to show the contention is true" },
  fact : { label:"Fact",               cls:"fact",  tx:"something checkable: a number, a date, a finding" },
  rhetq: { label:"Rhetorical question", cls:"rhetq", tx:"a question asked to make a point, not to get an answer" },
  emot : { label:"Emotive language",   cls:"emot",  tx:"words chosen to make the reader feel something" },
  incl : { label:"Inclusive language", cls:"incl",  tx:"we, us, our — pulling the reader onto the writer's side" }
};
const CAT_ORDER = ["cont","claim","fact","rhetq","emot","incl"];

/* ---- why a contention isn't one yet ---------------------------------- */
const MISSING = {
  vague : { s:"Too vague",        l:"Too vague — it doesn't say what should happen about it." },
  fact  : { s:"A fact",           l:"That's a fact, not a position. Nobody can disagree with it." },
  fence : { s:"Sits on the fence",l:"It sits on the fence. A contention takes one side." },
  quest : { s:"A question",       l:"That's a question. A contention is a statement." },
  topic : { s:"A topic",          l:"That's a topic, not a sentence. A contention is a full statement." },
  want  : { s:"What you want",    l:"That says what you want, not what should happen." }
};

/* ============================ THE SAMPLES ================================ */
/* Each chunk carries every category that honestly applies to it, so a chunk
   that is both a claim and inclusive language is right for either question. */
const SAMPLES = {
  lunch: {
    title:"Lunchtime — a Year 7 student's letter",
    src:"Written for this task.",
    chunks:[
      { t:"Every student in this school deserves a lunchtime long enough to eat.", c:["cont"] },
      { t:"Right now we get twenty minutes.", c:["fact"] },
      { t:"Is that really enough time for a growing teenager?", c:["rhetq"] },
      { t:"A recent school survey found that 68 per cent of Year 7 students throw food away because they run out of time.", c:["fact"] },
      { t:"Children are left hungry, rushed and miserable.", c:["emot"] },
      { t:"We all know what it feels like to sit down and be told to stand up again.", c:["incl"] },
      { t:"Students who eat properly concentrate better in afternoon classes.", c:["claim"] },
      { t:"The canteen is on the north side of the campus.", c:[] }
    ]
  },
  homework: {
    title:"Homework over the holidays",
    src:"Written for this task.",
    chunks:[
      { t:"Schools should not set homework over the holidays.", c:["cont"] },
      { t:"Holidays are the only time many families can travel together.", c:["claim"] },
      { t:"Last year, 41 per cent of our students reported doing schoolwork during the September break.", c:["fact"] },
      { t:"Why should a thirteen-year-old spend their break staring at a worksheet?", c:["rhetq"] },
      { t:"Our children come back exhausted before the year has even started.", c:["emot","incl"] },
      { t:"We owe them a proper rest.", c:["incl"] },
      { t:"Term three finishes on the nineteenth of September.", c:[] }
    ]
  },
  /* --- mentor text, quoted in short extracts and attributed --- */
  cm16: {
    title:"The Courier Mail — paragraphs 16–19",
    src:"Eleni Paneras, “Why delaying social media is the best gift we can give our children”, The Courier Mail, 23 November 2025. Extract. Full text: reading copy 05.1r.",
    chunks:[
      { t:"That’s why I support Australia’s decision to delay social media access for kids under 16 – not ban it, delay it.", c:["cont"] },
      { t:"Because this isn’t about denying them something.", c:[] },
      { t:"It’s about protecting them until they’re old enough to handle it.", c:["claim"] },
      { t:"If we would never hand our kids alcohol or cigarettes, why do we hand them social media?", c:["rhetq","incl"] },
      { t:"Remember when people said smoking was a personal choice?", c:["rhetq"] }
    ]
  },
  cm27: {
    title:"The Courier Mail — paragraphs 27–28",
    src:"Eleni Paneras, The Courier Mail, 23 November 2025. Extract. Full text: reading copy 05.1r.",
    chunks:[
      { t:"Parents are fighting an unwinnable battle against trillion-dollar tech companies whose business models depend on keeping users – including our children – hooked.", c:["claim","incl"] },
      { t:"Because if we’re honest, none of us want to see our kids trapped in the scroll.", c:["emot","incl"] },
      { t:"None of us want to watch them measure their worth in likes and views.", c:["emot","incl"] },
      { t:"My son is eight.", c:["fact"] }
    ]
  }
};

/* ============================ THE CARD POOL ============================== */
/* rule = the thing the card tests. Siblings share a rule, so a miss pulls in
   a different card testing the same rule rather than the same card again. */
const POOL = [
 /* ---- contention / claim / fact, from 06.1w Part 3 ---- */
 { id:"s1", type:"sort", rule:"claimfact", stim:"Parents cannot win against tech companies that design apps to keep children hooked.",
   a:"claim", why:"A reason she gives for her position — and one you could argue with." },
 { id:"s2", type:"sort", rule:"claimfact", stim:"The writer's son is eight years old.",
   a:"fact", why:"Checkable, and nobody would argue about it. It supports her story, but it isn't a reason." },
 { id:"s3", type:"sort", rule:"claimfact", stim:"Social media makes young people measure their worth in likes and views.",
   a:"claim", why:"A reason, stated as something that happens. Somebody could disagree." },
 { id:"s4", type:"sort", rule:"claimfact", stim:"Mixtapes used to be recorded off the radio.",
   a:"fact", why:"True, checkable, and not a reason for anything she argues." },
 { id:"s5", type:"sort", rule:"claimfact", stim:"We would never give children alcohol or cigarettes, so we should not give them social media either.",
   a:"claim", why:"A reason, built by comparison. Disagreeing with it is possible, which is what makes it a claim." },
 { id:"s6", type:"sort", rule:"contclaim", stim:"Under-16s should not be allowed to have social media accounts.",
   a:"cont", why:"It names what should happen. That is the position itself, not a reason for it." },
 { id:"s7", type:"sort", rule:"contclaim", stim:"Gaming late at night stops students from getting enough sleep.",
   a:"claim", why:"A reason. It would sit underneath a contention about limiting gaming." },
 { id:"s8", type:"sort", rule:"claimfact", stim:"Sixty-eight per cent of Year 7 students throw food away at lunch.",
   a:"fact", why:"A number from a survey. Evidence for a claim, not the claim itself." },

/* ====================== THE WORDS BEHIND THE WORK ========================
   One record per key word, used three ways: the starter builds them from
   their parts, the grammar drills name them, and anywhere one appears in a
   prompt or a piece of feedback it can be tapped to come apart again. */
const GRAM_TERMS = {
  Declarative :{ parts:[["de-","fully"],["clar","clear"],["-ative","tending to"]],
    m:"A statement. It is the sentence type that carries both facts and claims." },
  Interrogative:{ parts:[["inter-","between"],["rog","to ask"],["-ative","tending to"]],
    m:"A question. The subject sits inside the verb group: <i>Are we prepared…</i>" },
  Imperative  :{ parts:[["imper","to command"],["-ative","tending to"]],
    m:"A command. The subject is not written down — it is you, the reader." },
  Modal       :{ parts:[["mod","measure, manner"],["-al","to do with"]],
    m:"A verb added in front of another verb to measure how certain a claim is: might, could, should, will, must." },
  Fragment    :{ parts:[["frag","to break"],["-ment","the result of"]],
    m:"A broken piece of a sentence: no subject, no verb, or neither." },
  Verifiable  :{ parts:[["ver","true"],["-ify","to make"],["-able","able to be"]],
    m:"Able to be checked by somebody else. A fact is verifiable; a claim is not." }
};
let TERMS = null;
function terms(){
  if(TERMS) return TERMS;
  TERMS={};
  WORDS.forEach(w=>{ TERMS[w.w]={ parts:w.parts, m:w.m }; });
  Object.keys(GRAM_TERMS).forEach(k=>{ TERMS[k]=GRAM_TERMS[k]; });
  return TERMS;
}
/* Wrap any key word in a span that can be tapped. Only called on static text —
   never on the clickable chunks of a sample, where a nested button would
   swallow the click the task depends on. */
function glossify(html){
  const T=terms(), keys=Object.keys(T).sort((a,b)=>b.length-a.length);
  const re=new RegExp("\\b("+keys.join("|")+")(s|es)?\\b","gi");
  const seen={};
  return String(html).split(/(<[^>]*>)/).map(part=>{
    if(part.charAt(0)==="<") return part;
    return part.replace(re,(m)=>{
      const base=keys.find(k=>k.toLowerCase()===m.toLowerCase().replace(/(es|s)$/,"")
                             || k.toLowerCase()===m.toLowerCase());
      if(!base || seen[base]) return m;
      seen[base]=1;
      return `<span class="kw" role="button" tabindex="0" data-w="${base}" onclick="termPop(event)"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();termPop(event);}"
        title="What does this word mean?">${m}</span>`;
    });
  }).join("");
}
/* prefix, root, suffix or connector — the same test the vocab hub uses */
function classifyMorph(piece){
  if(/^-.*-$/.test(piece)) return "mc";
  if(/^-/.test(piece)) return "ms";
  if(/-$/.test(piece)) return "mp";
  return "mr";
}
const MORPH_LEGEND = `<div class="mlegend">
  <span style="color:var(--mpre)"><i style="background:var(--mpre)"></i>prefix</span>
  <span style="color:var(--mroot)"><i style="background:var(--mroot)"></i>root</span>
  <span style="color:var(--msuf)"><i style="background:var(--msuf)"></i>suffix</span></div>`;
function termPop(ev){
  ev.stopPropagation(); ev.preventDefault();
  termPopClose();
  const w=ev.currentTarget.dataset.w, t=terms()[w]; if(!t) return;
  const d=document.createElement("div"); d.className="kwpop"; d.id="kwpop";
  d.innerHTML=`<button class="gx" onclick="termPopClose()" aria-label="close">×</button>
    <div class="kww">${esc(w)}</div>
    <div class="kwparts">${t.parts.map((x,i)=>
      `<span class="mchip ${classifyMorph(x[0])}" style="animation-delay:${90+i*150}ms"><b>${esc(x[0])}</b><small>${esc(x[1])}</small></span>`)
      .join(`<span class="mplus">+</span>`)}</div>
    <div class="kwm">${t.m}</div>`;
  document.body.appendChild(d);
  const r=d.getBoundingClientRect();
  d.style.left=Math.min(Math.max(8,ev.clientX-r.width/2), window.innerWidth-r.width-8)+"px";
  d.style.top=(ev.clientY+r.height+16>window.innerHeight ? Math.max(8,ev.clientY-r.height-14) : ev.clientY+14)+"px";
  setTimeout(()=>document.addEventListener("pointerdown", termPopAway),0);
}
function termPopAway(e){
  const pp=$("kwpop");
  if(!pp){ document.removeEventListener("pointerdown", termPopAway); return; }
  if(!pp.contains(e.target)){ pp.remove(); document.removeEventListener("pointerdown", termPopAway); }
}
function termPopClose(){ const pp=$("kwpop"); if(pp) pp.remove(); }

   first-go success, and a later success cannot hide a first-go miss. */

function vcode(str){
  let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; }
  return "F-"+h.toString(36).toUpperCase().padStart(7,"0").slice(0,7);
}

      <p class="prompt">Build the word that means this, part by part, in order:</p>
      <div class="stim" style="font-family:'Segoe UI',sans-serif;font-size:15px">${esc(item.m)}</div>
      ${MORPH_LEGEND}
      <div class="stim"><div class="slotline" id="slot">${
        item.parts.map((p,i)=>{
          const got=W.picked[i];
          return got
            ? `<span class="mslot ${classifyMorph(got[0])}" style="border-style:solid"><b>${esc(got[0])}</b><small>${esc(got[1])}</small></span>`
            : `<span class="mslot"></span>`;
        }).join(`<span class="mplus">+</span>`)}</div></div>
      <div class="chips" id="tiles">
        ${tiles.map((t,i)=>`<button class="opt ${classifyMorph(t[0])}" data-i="${i}" onclick="wordTile(${i})">${esc(t[0])} <small style="opacity:.8">${esc(t[1])}</small></button>`).join("")}
      </div>
      <div class="btnrow"><button class="btn btn-ghost" onclick="W.picked=[];renderWords()">Clear</button></div>
      <div class="fb" id="fb"></div></div>`;
    $("body").innerHTML=h;
    window.__tiles = tiles;
    return;
  }
  /* phase: use */
  const opts = W.optOrder || (W.optOrder = shuffle(item.opts.map((t,i)=>({t,i}))));
  h+=`<div class="cardbox">
    <p class="prompt">${esc(item.q)}</p>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="wordAnswer(${o.i},${k})">${esc(o.t)}</button>`).join("")}</div>
    <div class="fb" id="fb"></div></div>`;
  $("body").innerHTML=h;
}
function wordTile(i){
  const item=WORDS[W.i], t=window.__tiles[i];
  W.picked.push(t);
  const want = item.parts;
  const n = W.picked.length;
  if(W.picked[n-1][0] !== want[n-1][0]){
    if(!W.tried["b"+W.i]){ W.tried["b"+W.i]=true; recFirst("w.build."+item.w, false); }
    W.picked.pop();
    renderWords();
    const fb=$("fb"); fb.className="fb bad on";
    fb.innerHTML=`<span class="rule">Not that part, or not yet.</span>${esc(t[0])} means “${esc(t[1])}”. ${n===1?"Start with the part that comes first in the word.":"The part you need next comes straight after “"+esc(want[n-2][0])+"”."}`;
    return;
  }
  if(W.picked.length===want.length){
    if(!W.tried["b"+W.i]){ W.tried["b"+W.i]=true; recFirst("w.build."+item.w, true); }
    W.phase="use"; W.optOrder=null; renderWords();
    const fb=$("fb"); fb.className="fb ok on";
    fb.innerHTML=`<b>${esc(item.w)}</b> = `+want.map(p=>
      `<span class="mchip ${classifyMorph(p[0])}" style="animation:none;opacity:1;transform:none"><b>${esc(p[0])}</b><small>${esc(p[1])}</small></span>`)
      .join(`<span class="mplus"> + </span>`);
    return;
  }
  renderWords();
}
function wordAnswer(i,k){
  const item=WORDS[W.i], ok = (i===item.a);
  if(!W.tried["u"+W.i]){ W.tried["u"+W.i]=true; recFirst("w.use."+item.w, ok); }
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("o"+k).classList.add(ok?"right":"wrong");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML = (ok?"":`<span class="rule">Not that one.</span>`)+item.ex+
    `<div class="btnrow"><button class="btn btn-primary nextb" onclick="wordNext()">${ok?"Next →":"Try the next word →"}</button></div>`;
}
function wordNext(){ W.i++; W.phase="meet"; W.picked=[]; W.optOrder=null; renderWords(); }

/* ====================== GRAMMAR · SESSIONS 08-10 ========================= */
const GRAM = {
 /* --- 08: the sentence type that carries both facts and claims --- */
 declar:[
  { t:"Australia introduced the social media ban for under-16s in November 2024.",
    verb:"introduced", a:"fact", why:"The date is documented, so somebody else can check it." },
  { t:"The social media ban will protect young people from serious harm.",
    verb:"will protect", a:"claim", why:"Nobody can check a prediction yet. The verb group is “will protect”, modal and verb together." },
  { t:"Social media platforms profit from the attention of vulnerable teenagers.",
    verb:"profit", a:"claim", why:"“Vulnerable” is a judgement, so the sentence argues even though it is shaped like a fact." },
  { t:"Water boils at 100 degrees.",
    verb:"boils", a:"fact", why:"Anybody with a thermometer can check it." },
  { t:"Grammar is the most important subject in school.",
    verb:"is", a:"claim", why:"“Most important” cannot be checked by anyone. It is the writer's argument." },
  { t:"Sixty-eight per cent of Year 7 students threw food away at lunch.",
    verb:"threw", a:"fact", why:"A survey figure. Somebody counted it." }
 ],
 /* --- 09: the question that argues --- */
 rhet:[
  { t:"How many more tragedies do we need before action is taken?", a:"rhet",
    implied:"We already have enough reason to act.",
    build:{ tail:"to act.",
      subj:[["We",1],
            ["Tragedies",0,"The question asks what <i>we</i> need, so the statement starts with us."],
            ["Nobody",0,"“Nobody” answers a question starting with “Who”. This one starts with “How many”."]],
      verb:[["already have enough reason",1],
            ["need more tragedies",0,"That says what the question asks on the surface. A rhetorical question implies the opposite."],
            ["do not have enough reason",0,"That argues for waiting. The writer is pushing you the other way."]] },
    why:"It expects no answer. The answer it implies is meant to feel obvious." },
  { t:"What time does the submission close?", a:"gen",
    why:"This one expects an answer. Same sentence type as the one above, different purpose." },
  { t:"Social media has transformed how young people experience adolescence.", a:"decl",
    why:"A statement: subject, then verb." },
  { t:"Watch the movie before you form an opinion.", a:"imp",
    why:"A command. The verb comes first and the subject is not written down: it is you." },
  { t:"Are we really prepared to trust something when we don't understand how it works?", a:"rhet",
    implied:"We are not prepared to trust something when we don't understand how it works.",
    build:{ tail:"to trust something when we don't understand how it works.",
      subj:[["We",1],
            ["Something",0,"“Something” is what we would be trusting, not the one doing the trusting."],
            ["Nobody",0,"The question is about us in particular, not about everyone."]],
      verb:[["are not prepared",1],
            ["are prepared",0,"The question implies the answer <i>no</i>, so the verb has to be negative."],
            ["were not prepared",0,"The question is about now, so keep the present tense."]] },
    why:"The subject “we” sits inside the verb group: <i>Are we … prepared</i>. That inversion is what makes it an interrogative." },
  { t:"Who can truly say if the same will happen again?", a:"rhet",
    implied:"Nobody can truly say if the same will happen again.",
    build:{ tail:"if the same will happen again.",
      subj:[["Nobody",1],
            ["Everybody",0,"That is the opposite of what the question implies."],
            ["We",0,"“Who” is asking which people can say. The implied answer names them: nobody."]],
      verb:[["can truly say",1],
            ["cannot truly say",0,"“Nobody cannot say” is a double negative. The subject already carries the <i>no</i>."],
            ["could truly say",0,"The question is about now, so keep the present tense."]] },
    why:"“Who” is the subject and a question word at once, so it comes first. The implied answer is nobody." }
 ],
 /* --- 10: measuring how certain you are --- */
 scale:["might","could","should","will","must"],
 modal:[
  { t:"Screen time ___ affect sleep in some teenagers.", a:"might",
    ev:"one small study, mixed results",
    why:"Weak evidence takes a weak modal. “Must” here invites the reader to push back." },
  { t:"The ban ___ have some unintended consequences.", a:"could",
    ev:"no data yet, but it is plausible",
    why:"“Could” claims only that it is possible, which is all you can support." },
  { t:"Parents ___ discuss digital safety with their children.", a:"should",
    ev:"expert advice, widely agreed",
    why:"“Should” recommends. Strong enough to argue, not so strong it overreaches." },
  { t:"Governments ___ act before the situation worsens.", a:"must",
    ev:"strong evidence of serious harm",
    why:"“Must” leaves no room for doubt, so only strong evidence earns it." }
 ]
};
const RHET_TYPES = { rhet:"Rhetorical question", gen:"Genuine question", decl:"Declarative", imp:"Imperative" };

/* The sentence is the source of truth: the data says which words are the verb
   group, and the position is worked out from the sentence itself. A hand-
   counted index is invisible when it is wrong — this one told a student the
   verb of "…Year 7 students threw food away…" was "students". */
function verbSpan(it){
  if(it._span!==undefined) return it._span;
  const bare=x=>x.toLowerCase().replace(/[^a-z0-9'’-]/g,"");
  const ws=it.t.split(/\s+/).map(bare), want=it.verb.split(/\s+/).map(bare);
  let at=-1, hits=0;
  for(let i=0;i+want.length<=ws.length;i++){
    if(want.every((w,k)=>ws[i+k]===w)){ hits++; if(at<0) at=i; }
  }
  it._span = (hits===1) ? [at, at+want.length-1] : null;
  return it._span;
}
let G = null;
function renderGram(){
  G = G || { strand:0, i:0, phase:"pick", sel:[], order:[], tried:{} };
  const strands=[gramDeclar, gramRhet, gramModal];
  if(G.strand>=strands.length){
    recFirst("gramdone", true);
    $("body").innerHTML=topbar()+`<h2>Grammar</h2>
      <div class="fb ok on">All three done.</div>
      <div class="btnrow"><button class="btn btn-primary" onclick="go('deck')">The deck →</button>
      <button class="btn btn-ghost" onclick="G=null;go('gram')">Again</button>
      <button class="btn btn-ghost" onclick="go('home')">All steps</button></div>`;
    return;
  }
  strands[G.strand]();
}
function gramBar(n,total,label){
  return `<div class="deckbar"><b>${esc(label)}</b><span class="meter"><i style="width:${Math.round(100*n/total)}%"></i></span>
    <span>${n} of ${total}</span></div>`;
}
function gramNext(){ G.i++; G.phase="pick"; G.sel=[]; G.pick={}; G.order2=null; G.railWrong=[];
  const lens=[GRAM.declar.length, GRAM.rhet.length, GRAM.modal.length+1];
  if(G.i>=lens[G.strand]){ G.strand++; G.i=0; G.order=[]; }
  renderGram();
}
function gramBtn(){ return `<div class="btnrow"><button class="btn btn-primary nextb" onclick="gramNext()">Next →</button></div>`; }

/* ---- 08 ---- */
function gramDeclar(){
  const it=GRAM.declar[G.i], ws=it.t.split(/\s+/), span=verbSpan(it);
  if(!span){
    $("body").innerHTML=topbar()+`<h2>Grammar</h2>
      <div class="fb bad on">This card can't be shown: “${esc(it.verb)}” does not appear exactly once in the sentence.</div>
      <div class="btnrow"><button class="btn btn-primary" onclick="gramNext()">Skip it →</button></div>`;
    return;
  }
  let h=topbar()+`<h2>Grammar</h2>`+gramBar(G.i,GRAM.declar.length,"Declaratives: fact or claim");
  h+=`<div class="cardbox">
    <p class="prompt">${glossify(G.phase==="pick"
      ? "Click the verb group. In a Declarative, everything hangs off it."
      : "Can somebody else check this sentence, or is it the writer's argument?")}</p>
    <div class="gsent">${ws.map((w,i)=>{
      let cls="gw2";
      if(G.phase!=="pick"){ if(i>=span[0]&&i<=span[1]) cls+=" right";
        else if(G.sel.includes(i)) cls+=" wrong"; }
      else if(G.sel.includes(i)) cls+=" on";
      return `<span class="${cls}" ${G.phase==="pick"?`onclick="gramWord(${i})"`:""}>${esc(w)}</span>`;
    }).join(" ")}</div>`;
  if(G.phase==="pick") h+=`<div class="btnrow"><button class="btn btn-primary" onclick="gramCheckVerb()">Check the verb</button>
    <button class="btn btn-ghost" onclick="G.sel=[];renderGram()">Clear</button></div>`;
  else h+=`<div class="chips">
      <button class="opt" id="oF" onclick="gramFactClaim('fact')">Fact</button>
      <button class="opt" id="oC" onclick="gramFactClaim('claim')">Claim</button></div>`;
  h+=`<div class="fb" id="fb"></div></div>`;
  $("body").innerHTML=h;
  if(G.phase==="fc" && G.verbFb){ const fb=$("fb"); fb.className="fb "+G.verbFb.k+" on"; fb.innerHTML=G.verbFb.h; }
}
function gramWord(i){ const at=G.sel.indexOf(i); if(at>=0) G.sel.splice(at,1); else G.sel.push(i); renderGram(); }
function gramCheckVerb(){
  const it=GRAM.declar[G.i], span=verbSpan(it);
  if(!span) return;
  const want=[]; for(let i=span[0];i<=span[1];i++) want.push(i);
  const got=G.sel.slice().sort((a,b)=>a-b);
  const ok = got.length===want.length && got.every((v,i)=>v===want[i]);
  if(!G.tried["v"+G.i]){ G.tried["v"+G.i]=true; recFirst("g.verb."+G.i, ok); }
  const words=it.t.split(/\s+/).slice(span[0], span[1]+1).join(" ");
  G.phase="fc";
  G.verbFb = ok
    ? { k:"ok", h:`<span class="rule">That's the verb group.</span>${esc(words)}` }
    : { k:"bad", h:`<span class="rule">The verb group is “${esc(words)}”.</span>`+
        (span[1]>span[0]?glossify("A Modal and the verb it measures count as one verb group. Take both or neither."):
         "Green shows it in the sentence.") };
  renderGram();
}
function gramFactClaim(v){
  const it=GRAM.declar[G.i], ok=(v===it.a);
  if(!G.tried["f"+G.i]){ G.tried["f"+G.i]=true; recFirst("g.fact."+G.i, ok); }
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $(v==="fact"?"oF":"oC").classList.add(ok?"right":"wrong");
  if(!ok) $(it.a==="fact"?"oF":"oC").classList.add("right");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?"":`<span class="rule">It's a ${it.a}.</span>`)+glossify(it.why)+
    glossify(`<div class="notjudged">Both are Declarative sentences. What separates them is whether the sentence is Verifiable.</div>`)+gramBtn();
}

/* ---- 09 ---- */
function gramRhet(){
  const it=GRAM.rhet[G.i];
  let h=topbar()+`<h2>Grammar</h2>`+gramBar(G.i,GRAM.rhet.length,"Rhetorical questions");
  if(G.phase==="pick"){
    const keys=shuffle(Object.keys(RHET_TYPES));
    h+=`<div class="cardbox">
      <p class="prompt">Which is it?</p>
      <div class="stim">${esc(it.t)}</div>
      <div class="opts">${keys.map((k,i)=>`<button class="opt" id="o${i}" onclick="gramRhetPick('${k}',${i})">${esc(RHET_TYPES[k])}</button>`).join("")}</div>
      <div class="fb" id="fb"></div></div>`;
  } else {
    const b=it.build;
    G.pick = G.pick || {};
    const row=(kind,label)=>{
      const got=G.pick[kind];
      return `<div class="railrow"><span class="raillab">${label}</span>
        <div class="chips">${(G.order2&&G.order2[kind]||b[kind]).map((o,i)=>
          `<button class="opt ${got===o[0]?"chosen":""}" onclick="gramRail('${kind}',${i})"
            ${got!==undefined&&got!==null?"disabled":""}>${esc(o[0])}</button>`).join("")}</div></div>`;
    };
    if(!G.order2) G.order2={ subj:shuffle(b.subj), verb:shuffle(b.verb) };
    h+=`<div class="cardbox">
      <p class="prompt">Build the claim it implies, as a Declarative sentence.</p>
      <div class="stim">${esc(it.t)}</div>
      ${row("subj","Who or what")}
      ${row("verb","Verb group")}
      <div class="railsent">${esc(G.pick.subj||"…")} ${esc(G.pick.verb||"…")} ${esc(b.tail)}</div>
      <div class="fb" id="fb"></div></div>`;
  }
  $("body").innerHTML=glossify_safe(h);

}
/* glossify only the prompt line: the stim and the options must stay plain so a
   nested button can never swallow the click the task needs */
function glossify_safe(h){
  return h.replace(/<p class="prompt">([\s\S]*?)<\/p>/g, (m,inner)=>`<p class="prompt">${glossify(inner)}</p>`);
}
function gramRhetPick(k,i){
  const it=GRAM.rhet[G.i], ok=(k===it.a);
  if(!G.tried["r"+G.i]){ G.tried["r"+G.i]=true; recFirst("g.rhet."+G.i, ok); }
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("o"+i).classList.add(ok?"right":"wrong");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?"":`<span class="rule">It's a ${esc(RHET_TYPES[it.a].toLowerCase())}.</span>`)+glossify(it.why)+
    (it.a==="rhet"
      ? `<div class="btnrow"><button class="btn btn-primary nextb" onclick="G.phase='say';G.pick={};G.order2=null;renderGram()">Now build what it implies →</button></div>`
      : gramBtn());
}
function gramRail(kind,i){
  const it=GRAM.rhet[G.i], o=G.order2[kind][i];
  G.pick[kind]=o[0];
  G.railWrong=G.railWrong||[];
  if(!o[1]) G.railWrong.push(o[2]||"");
  renderGram();
  if(G.pick.subj===undefined||G.pick.subj===null||G.pick.verb===undefined||G.pick.verb===null) return;
  /* both halves chosen — judge the sentence they have built */
  const sub=G.order2.subj.find(x=>x[0]===G.pick.subj), vb=G.order2.verb.find(x=>x[0]===G.pick.verb);
  const ok=!!(sub&&sub[1]&&vb&&vb[1]);
  if(!G.tried["i"+G.i]){ G.tried["i"+G.i]=true; recFirst("g.implied."+G.i, ok); }
  const sent=G.pick.subj+" "+G.pick.verb+" "+it.build.tail;
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  const faults=[sub&&!sub[1]?sub[2]:null, vb&&!vb[1]?vb[2]:null].filter(Boolean);
  fb.innerHTML=(ok?`<span class="rule">That's the claim it implies.</span>`
    :`<span class="rule">Not what it implies.</span><ul>`+faults.map(x=>`<li>${x}</li>`).join("")+`</ul>`)+
    (ok?"":`<div class="stim" style="margin:8px 0 0">${esc(it.implied)}</div>`)+
    (ok?"":`<div class="btnrow"><button class="btn btn-ghost" onclick="G.pick={};G.order2=null;renderGram()">Build it again</button></div>`)+
    gramBtn();
}

/* ---- 10 ---- */
function gramModal(){
  let h=topbar()+`<h2>Grammar</h2>`+gramBar(G.i,GRAM.modal.length+1,"Modal verbs");
  if(G.i===0){
    const left=GRAM.scale.filter(m=>!G.order.includes(m));
    h+=`<div class="cardbox">
      <p class="prompt">Put the Modal verbs in order, weakest first.</p>
      <div class="scale">${GRAM.scale.map((_,k)=>
        `<span class="slot ${G.order[k]?"full":""}">${esc(G.order[k]||"")}</span>`+
        (k<GRAM.scale.length-1?`<span class="arrow">→</span>`:"")).join("")}</div>
      <div class="chips">${shuffle(left).map(m=>`<button class="opt" onclick="gramRank('${m}')">${esc(m)}</button>`).join("")}</div>
      <div class="btnrow"><button class="btn btn-ghost" onclick="G.order=[];renderGram()">Clear</button></div>
      <div class="fb" id="fb"></div></div>`;
  } else {
    const it=GRAM.modal[G.i-1];
    h+=`<div class="cardbox">
      <p class="prompt">Your evidence: <b>${esc(it.ev)}</b>. Which Modal does that evidence earn?</p>
      <div class="stim">${esc(it.t)}</div>
      <div class="chips">${shuffle(GRAM.scale).map((m,k)=>`<button class="opt" id="o${k}" data-m="${esc(m)}" onclick="gramModalPick('${m}',${k})">${esc(m)}</button>`).join("")}</div>
      <div class="fb" id="fb"></div></div>`;
  }
  $("body").innerHTML=glossify_safe(h);
}
function gramRank(m){
  G.order.push(m);
  if(G.order.length<GRAM.scale.length){ renderGram(); return; }
  const ok=G.order.every((x,i)=>x===GRAM.scale[i]);
  if(!G.tried["rank"]){ G.tried["rank"]=true; recFirst("g.rank", ok); }
  renderGram();
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?`<span class="rule">That's the scale.</span>`
    :`<span class="rule">Not quite. The scale runs:</span><div class="stim" style="margin:6px 0">${GRAM.scale.join(" → ")}</div>`)+
    glossify("A Modal measures how certain you are, so the one you pick has to match the evidence you actually have.")+
    `<div class="btnrow"><button class="btn btn-primary nextb" onclick="G.order=[];gramNext()">Next →</button>
     ${ok?"":`<button class="btn btn-ghost" onclick="G.order=[];renderGram()">Try it again</button>`}</div>`;
}
function gramModalPick(m,k){
  const it=GRAM.modal[G.i-1], ok=(m===it.a);
  if(!G.tried["m"+G.i]){ G.tried["m"+G.i]=true; recFirst("g.modal."+G.i, ok); }
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("o"+k).classList.add(ok?"right":"wrong");
  if(!ok) document.querySelectorAll(".opt").forEach(b=>{ if(b.dataset.m===it.a) b.classList.add("right"); });
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?"":`<span class="rule">“${esc(it.a)}” fits that evidence.</span>`)+glossify(it.why)+
    `<div class="stim" style="margin:9px 0 0">${esc(it.t.replace("___", it.a))}</div>`+gramBtn();
}

/* ====================== STEP 3 · THE DECK ================================
   A card leaves the deck after two correct answers in a row. A wrong answer
   sends it back down the deck, resets its streak, and pulls in a different
   card testing the same rule — so the way out is the rule, not the item. */
const SESSION_SIZE = 16;
const RETIRE_STREAK = 2;
const PENALTY_GAP = 4;
let D = null;

function startDeck(){
  if(!D){
    const byType = {};
    POOL.forEach(c=>{ (byType[c.type]=byType[c.type]||[]).push(c); });
    const picked=[], used={};
    /* stratified: every type and every rule gets into the session */
    Object.keys(byType).forEach(t=>{
      const take = shuffle(byType[t]).slice(0, Math.max(2, Math.round(SESSION_SIZE/5)));
      take.forEach(c=>{ if(!used[c.id]){ used[c.id]=1; picked.push(c); } });
    });
    const rest = shuffle(POOL.filter(c=>!used[c.id]));
    while(picked.length < SESSION_SIZE && rest.length) { const c=rest.shift(); used[c.id]=1; picked.push(c); }
    D = { queue: shuffle(picked).map(c=>({ id:c.id, streak:0 })),
          bank: POOL.filter(c=>!used[c.id]).map(c=>c.id),
          retired:0, total:picked.length, phase:null, pick:[], sub:null };
  }
  renderCard();
}
function card(id){ return POOL.find(c=>c.id===id); }
function deckDone(){
  S.deckDone=true; save();
  const sc=deckScore();
  $("body").innerHTML = topbar()+`<h2>The deck</h2>
    <div class="fb ok on"><b>Deck clear.</b> ${sc.got} of ${sc.total} right on the first go.</div>
    <div class="btnrow"><button class="btn btn-primary" onclick="go('draft')">Your draft →</button>
    <button class="btn btn-ghost" onclick="D=null;go('deck')">New deck</button>
    <button class="btn btn-ghost" onclick="go('home')">All steps</button></div>`;
}
function missCard(entry){
  /* back down the deck, streak gone, and a sibling on the same rule joins it */
  entry.streak=0;
  const c=card(entry.id);
  D.queue.shift();
  const at=Math.min(PENALTY_GAP, D.queue.length);
  D.queue.splice(at,0,entry);
  const sib=D.bank.find(id=>card(id).rule===c.rule);
  if(sib){
    D.bank=D.bank.filter(x=>x!==sib);
    D.queue.splice(Math.min(at+1,D.queue.length),0,{id:sib,streak:0});
    D.total++;
  }
}
function hitCard(entry){
  entry.streak++;
  D.queue.shift();
  if(entry.streak>=RETIRE_STREAK){ D.retired++; }
  else { D.queue.splice(Math.min(PENALTY_GAP+2, D.queue.length),0,entry); }
}
function deckBar(){
  const left=D.queue.length;
  return `<div class="deckbar"><b>${left}</b> card${left===1?"":"s"} to clear
    <span class="meter"><i style="width:${Math.round(100*D.retired/Math.max(1,D.total))}%"></i></span>
    <span>two in a row clears a card</span></div>`;
}
function renderCard(){
  if(!D.queue.length) return deckDone();
  const entry=D.queue[0], c=card(entry.id);
  D.phase=null; D.pick=[]; D.sub=null;
  let h=topbar()+`<h2>The deck</h2>`+deckBar();
  if(c.type==="sort")   h+=cardSort(c);
  if(c.type==="strong") h+=cardStrong(c);
  if(c.type==="fix")    h+=cardFix(c);
  if(c.type==="spot")   h+=cardSpot(c);
  if(c.type==="match")  h+=cardMatch(c);
  $("body").innerHTML=h;
  if(c.type==="fix"){ const t=$("fixIn"); if(t) t.focus(); }
}
function fbBox(){ return `<div class="fb" id="fb"></div>`; }
function nextBtn(label){ return `<div class="btnrow"><button class="btn btn-primary nextb" id="nextBtn" onclick="renderCard()">${label||"Next card →"}</button></div>`; }

/* ---- sort ---- */
function cardSort(c){
  const opts=shuffle([["cont","Contention"],["claim","Claim"],["fact","Fact"],["none","None of these"]]);
  D.optOrder=opts;
  return `<div class="cardbox">
    <p class="prompt">Contention, claim, or fact?</p>
    <div class="stim">${esc(c.stim)}</div>
    <div class="chips">${opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="ansSort('${o[0]}',${k})">${esc(o[1])}</button>`).join("")}</div>
    ${fbBox()}</div>`;
}
function ansSort(v,k){
  const entry=D.queue[0], c=card(entry.id), ok=(v===c.a);
  recFirst(c.id, ok);
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("o"+k).classList.add(ok?"right":"wrong");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  const name={cont:"a contention",claim:"a claim",fact:"a fact",none:"none of these"}[c.a];
  fb.innerHTML=(ok?"":`<span class="rule">It's ${name}.</span>`)+esc(c.why)+
    (ok?"":`<div class="notjudged">This card goes back into the deck, with another one like it.</div>`)+
    nextBtn();
  if(ok) hitCard(entry); else missCard(entry);
}

/* ---- strong contention, two steps ---- */
function cardStrong(c){
  return `<div class="cardbox">
    <p class="prompt">Strong contention, or not yet?</p>
    <div class="stim">${esc(c.stim)}</div>
    <div class="chips">
      <button class="opt" id="oY" onclick="ansStrong(true)">Strong contention</button>
      <button class="opt" id="oN" onclick="ansStrong(false)">Not a contention yet</button>
    </div>
    ${fbBox()}</div>`;
}
function ansStrong(said){
  const entry=D.queue[0], c=card(entry.id), ok=(said===c.ok);
  const fb=$("fb");
  if(!ok){
    recFirst(c.id, false);
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    $(said?"oY":"oN").classList.add("wrong"); $(c.ok?"oY":"oN").classList.add("right");
    fb.className="fb bad on";
    fb.innerHTML=`<span class="rule">${c.ok?"It is one.":"Not yet."}</span>`+
      (c.ok?"It takes a side, it is specific, and it is a statement."
           :esc(MISSING[c.miss].l))+
      `<div class="notjudged">This card goes back into the deck, with another one like it.</div>`+nextBtn();
    missCard(entry);
    return;
  }
  if(c.ok){
    recFirst(c.id, true);
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    $("oY").classList.add("right");
    fb.className="fb ok on";
    fb.innerHTML=`It takes a side, it is specific, and it is a statement.`+nextBtn();
    hitCard(entry);
    return;
  }
  /* right that it isn't one — now say what is missing */
  D.phase="why";
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("oN").classList.add("right");
  const opts=shuffle(Object.keys(MISSING));
  fb.className="fb warn on";
  fb.innerHTML=`<span class="rule">Right. Now what is missing?</span>
    <div class="chips" style="margin-top:9px">${opts.map((m,k)=>
      `<button class="opt" id="w${k}" onclick="ansWhy('${m}',${k})">${esc(MISSING[m].s)}</button>`).join("")}</div>`;
}
function ansWhy(m,k){
  const entry=D.queue[0], c=card(entry.id), ok=(m===c.miss);
  recFirst(c.id, ok);
  $("fb").querySelectorAll("button.opt").forEach(b=>b.disabled=true);
  $("w"+k).classList.add(ok?"right":"wrong");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?`<span class="rule">Yes.</span>`:`<span class="rule">Not that.</span>`)+esc(MISSING[c.miss].l)+
    (ok?"":`<div class="notjudged">This card goes back into the deck, with another one like it.</div>`)+nextBtn();
  if(ok) hitCard(entry); else missCard(entry);
}

/* ---- rewrite, typed ---- */
function cardFix(c){
  return `<div class="cardbox">
    <p class="prompt">${esc(c.ask)}</p>
    <div class="stim">${esc(c.stim)}<span class="src">${esc(MISSING[c.note].l)}</span></div>
    <textarea id="fixIn" rows="2" placeholder="Type your sentence"></textarea>
    <div class="btnrow"><button class="btn btn-primary" onclick="ansFix()">Check it</button></div>
    ${fbBox()}</div>`;
}
/* Only properties a machine can actually read are judged, and the card says
   which judgements it is not making. */
function judgeWrite(txt, want, stim){
  const t=(txt||"").trim(), low=t.toLowerCase(), f=[];
  const words=t.split(/\s+/).filter(Boolean);
  if(!t) return [{r:"Nothing typed yet."}];
  if(words.length<5) f.push({r:"Too short to be a sentence.", d:"A contention or claim is a full sentence — give it a subject and a verb."});
  if(/\?\s*$/.test(t)) f.push({r:"That's a question.", d:"A contention is a statement. Turn it round: say what should happen."});
  if(low.replace(/[^a-z ]/g,"").trim()===stim.toLowerCase().replace(/[^a-z ]/g,"").trim())
    f.push({r:"That's the same sentence.", d:"Change it so it takes a side and says what should happen."});
  if(/\b(some people .* (and )?(some|others))|\bit depends\b|\bmaybe\b|\bsort of\b|\bkind of\b/.test(low))
    f.push({r:"It sits on the fence.", d:"Pick one side. 'Some people… and some people…' is not a position."});
  if(/^\s*i (want|like|love|hate|reckon|feel)\b/.test(low))
    f.push({r:"That says what you want.", d:"A contention says what SHOULD happen, not what you'd like."});
  if(want==="cont"){
    if(!/\b(should|shouldn't|should not|must|mustn't|must not|ought|need(s)? to|has to|have to|deserve[sd]?|allow(ed)?|ban(ned)?|stop|start|require[sd]?)\b/.test(low))
      f.push({r:"It doesn't take a side.", d:"A contention names what should happen — should, must, ought to, needs to, should not be allowed."});
    if(/^(social media|homework|phones?|lunchtime|gambling|school)\s+(is|are)\s+(bad|good|great|terrible|annoying|rubbish|awful|fine)\s*\.?$/.test(low))
      f.push({r:"Still too vague.", d:"Bad how, and what should happen about it? Name the change you want."});
    if(/^(lots of|many|most|some|a lot of|there (is|are))\b/.test(low) &&
       !/\b(should|must|ought|need)\b/.test(low))
      f.push({r:"That's a fact, not a position.", d:"Nobody can disagree with it. Say what should change."});
  }
  if(want==="claim"){
    if(!/\b(because|since|so|stops?|helps?|makes?|means?|leads? to|gives?|takes?|prevents?|lets?|causes?|costs?)\b/.test(low))
      f.push({r:"It doesn't give a reason yet.", d:"A claim says what happens as a result — it stops, it means, it helps, because…"});
  }
  return f;
}
/* Punctuation and a capital are worth fixing, but a sentence that does the
   thinking should not fail on them. */
function tidyWrite(t){
  let out=(t||"").trim(), notes=[];
  if(out && !/^[A-Z]/.test(out)){ out=out.charAt(0).toUpperCase()+out.slice(1); notes.push("a capital letter to start"); }
  if(out && !/[.!?]$/.test(out)){ out+="."; notes.push("a full stop to finish"); }
  return { out, notes };
}
function ansFix(){
  const entry=D.queue[0], c=card(entry.id);
  const txt=$("fixIn").value;
  const tidy=tidyWrite(txt);
  const f=judgeWrite(tidy.out, c.want, c.stim);
  const ok=!f.length;
  recFirst(c.id, ok);
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  const notJudged = `<div class="notjudged">Checked: it takes a side, it is specific, it is a statement, it is a full sentence.
    Not checked: whether it is true, and whether it is your strongest point — your teacher reads that.</div>`;
  if(ok){
    fb.innerHTML=`<span class="rule">That works as a ${c.want==="cont"?"contention":"claim"}.</span>
      <div class="stim" style="margin:8px 0 0">${esc(tidy.out)}</div>`+
      (tidy.notes.length?`<p class="dim" style="font-size:12.5px;margin:7px 0 0">Tidied for you: ${esc(tidy.notes.join(" and "))}.</p>`:"")+
      notJudged+nextBtn();
    hitCard(entry);
  } else {
    fb.innerHTML=`<span class="rule">Not yet.</span><ul>`+
      f.map(x=>`<li><b>${esc(x.r)}</b>${x.d?" "+esc(x.d):""}</li>`).join("")+`</ul>`+notJudged+
      `<div class="btnrow"><button class="btn btn-primary nextb" onclick="renderCard()">This one goes back in the deck →</button></div>`;
    missCard(entry);
  }
}

/* ---- spot it in a sample ---- */
function cardSpot(c){
  const s=SAMPLES[c.sample], cat=CATS[c.want];
  return `<div class="cardbox">
    <p class="prompt">Click the ${esc(cat.label.toLowerCase())}. <span class="dim">${esc(cat.tx)}</span></p>
    <div class="legend"><span><i class="sw ${cat.cls}"></i>${esc(cat.label)}</span></div>
    <div class="sample">${s.chunks.map((ch,i)=>`<span class="chunk" id="c${i}" onclick="spotPick(${i})">${esc(ch.t)}</span> `).join("")}
      <span class="src">${esc(s.title)} · ${esc(s.src)}</span></div>
    <div class="btnrow"><button class="btn btn-primary" onclick="ansSpot()">Check</button>
      <button class="btn btn-ghost" onclick="D.pick=[];spotPaint()">Clear</button></div>
    <p class="dim" style="font-size:12.5px;margin:8px 0 0">${c.need>1?`There ${c.need===2?"are two":"are "+c.need}.`:"There is one."}</p>
    ${fbBox()}</div>`;
}
function spotPick(i){
  const at=D.pick.indexOf(i);
  if(at>=0) D.pick.splice(at,1); else D.pick.push(i);
  spotPaint();
}
function spotPaint(){
  const c=card(D.queue[0].id), s=SAMPLES[c.sample];
  s.chunks.forEach((ch,i)=>{ const el=$("c"+i); if(el) el.classList.toggle("picked", D.pick.includes(i)); });
}
function ansSpot(){
  const entry=D.queue[0], c=card(entry.id), s=SAMPLES[c.sample];
  const right=s.chunks.map((ch,i)=>ch.c.includes(c.want)?i:-1).filter(i=>i>=0);
  const picked=D.pick.slice().sort(), want=right.slice().sort();
  const ok = picked.length===want.length && picked.every((v,i)=>v===want[i]);
  recFirst(c.id, ok);
  s.chunks.forEach((ch,i)=>{
    const el=$("c"+i); if(!el) return;
    el.classList.remove("picked");
    el.onclick=null;
    if(right.includes(i)) el.classList.add("right");
    else if(D.pick.includes(i)) el.classList.add("wrong");
  });
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  const cat=CATS[c.want];
  const missed=right.filter(i=>!D.pick.includes(i)).length, extra=D.pick.filter(i=>!right.includes(i)).length;
  fb.innerHTML=(ok?`<span class="rule">All of it.</span>`
    :`<span class="rule">${missed?`${missed} missed`:""}${missed&&extra?", ":""}${extra?`${extra} that isn't ${cat.label.toLowerCase()}`:""}.</span>`)+
    `${esc(cat.label)}: ${esc(cat.tx)}. Green is every one in this extract.`+
    (ok?"":`<div class="notjudged">This card goes back into the deck, with another one like it.</div>`)+nextBtn();
  if(ok) hitCard(entry); else missCard(entry);
}

/* ---- which contention does it support ---- */
function cardMatch(c){
  const keys=shuffle(Object.keys(CONTENTIONS));
  D.optOrder=keys;
  return `<div class="cardbox">
    <p class="prompt">Which contention does this claim support?</p>
    <div class="stim">${esc(c.stim)}</div>
    <div class="opts">${keys.map((k,i)=>`<button class="opt" id="o${i}" onclick="ansMatch('${k}',${i})">${esc(CONTENTIONS[k])}</button>`).join("")}</div>
    ${fbBox()}</div>`;
}
function ansMatch(k,i){
  const entry=D.queue[0], c=card(entry.id), ok=(k===c.a);
  recFirst(c.id, ok);
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("o"+i).classList.add(ok?"right":"wrong");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?`<span class="rule">Yes.</span>`:`<span class="rule">It supports this one:</span><div class="stim" style="margin:8px 0">${esc(CONTENTIONS[c.a])}</div>`)+
    `A claim has to give a reason for <i>that</i> position. Two of these four argue the opposite side.`+
    (ok?"":`<div class="notjudged">This card goes back into the deck, with another one like it.</div>`)+nextBtn();
  if(ok) hitCard(entry); else missCard(entry);
}

/* ====================== STEP 4 · DRAFT =================================== */
function renderDraft(){
  $("body").innerHTML=topbar()+`<h2>Your draft</h2>
  <p class="lead">Write your persuasive piece. One contention, at least three claims, and the evidence and techniques that back them up.</p>
  <textarea id="draftIn" rows="16" placeholder="Start typing.">${esc(S.draft.text||"")}</textarea>
  <div class="btnrow">
    <button class="btn btn-primary" onclick="saveDraft(true)">Save and mark it up →</button>
    <button class="btn btn-ghost" onclick="saveDraft(false)">Save</button>
  </div>
  <div class="fb" id="fb"></div>`;
  $("draftIn").addEventListener("input", ()=>{ clearTimeout(window.__dt);
    window.__dt=setTimeout(()=>{ S.draft.text=$("draftIn").value; save(); }, 700); });
}
function saveDraft(move){
  const t=$("draftIn").value;
  if(t!==S.draft.text){ S.draft.text=t; S.draft.marks=[]; }
  save();
  if(move) go("mark");
  else { const fb=$("fb"); fb.className="fb ok on"; fb.textContent="Saved."; }
}

/* ====================== STEP 5 · MARK IT UP ==============================
   Click the first word of a span, then the last, then a colour. Tagging by
   word runs from a single phrase up to a whole sentence with one mechanic. */
let MK = { cat:"cont", anchor:null };
function tokens(){
  const t=S.draft.text||"";
  const out=[]; const re=/\S+/g; let m;
  while((m=re.exec(t))!==null) out.push({ s:m.index, e:m.index+m[0].length, w:m[0] });
  return out;
}
function renderMark(){
  const toks=tokens();
  if(!toks.length){
    $("body").innerHTML=topbar()+`<h2>Mark it up</h2>
      <div class="fb warn on">There's no draft to mark yet.</div>
      <div class="btnrow"><button class="btn btn-primary" onclick="go('draft')">Write your draft →</button></div>`;
    return;
  }
  let h=topbar()+`<h2>Mark it up</h2>
  <p class="lead">Click the first word of a part, then the last word, then the colour it belongs to. Click a coloured part to take the colour off.</p>
  <div class="palette noprint">${CAT_ORDER.map(k=>
    `<button class="pbtn m-${CATS[k].cls} ${MK.cat===k?"on":""}" onclick="MK.cat='${k}';MK.anchor=null;renderMark()">${esc(CATS[k].label)}</button>`).join("")}</div>
  <div class="canvasdoc" id="doc">${markHtml(toks,true)}</div>`;
  h+=coverage();
  h+=`<div class="btnrow noprint">
    <button class="btn btn-primary" onclick="go('send')">Send it to your teacher →</button>
    <button class="btn btn-ghost" onclick="go('draft')">Back to the draft</button></div>`;
  $("body").innerHTML=h;
}
function markAt(i){ return (S.draft.marks||[]).find(m=>i>=m.a && i<=m.b); }
function markHtml(toks, live){
  let h="", i=0;
  while(i<toks.length){
    const m=markAt(i);
    if(m){
      const txt=toks.slice(m.a,m.b+1).map(t=>t.w).join(" ");
      h+=`<span class="tok mk m-${CATS[m.c].cls}" ${live?`onclick="unmark(${m.a})"`:""} title="${esc(CATS[m.c].label)}">${esc(txt)}</span> `;
      i=m.b+1;
    } else {
      h+=`<span class="tok ${MK.anchor===i?"anchor":""}" ${live?`onclick="tapTok(${i})"`:""}>${esc(toks[i].w)}</span> `;
      i++;
    }
  }
  return h;
}
function tapTok(i){
  if(MK.anchor===null){ MK.anchor=i; renderMark(); return; }
  const a=Math.min(MK.anchor,i), b=Math.max(MK.anchor,i);
  for(let k=a;k<=b;k++) if(markAt(k)){ MK.anchor=null; renderMark(); return; }
  S.draft.marks.push({a,b,c:MK.cat}); S.draft.marks.sort((x,y)=>x.a-y.a);
  MK.anchor=null; save(); renderMark();
}
function unmark(a){
  S.draft.marks=(S.draft.marks||[]).filter(m=>m.a!==a); save(); renderMark();
}
function counts(){
  const n={}; CAT_ORDER.forEach(k=>n[k]=0);
  (S.draft.marks||[]).forEach(m=>{ n[m.c]=(n[m.c]||0)+1; });
  return n;
}
function modalsUsed(){
  const t=(S.draft.text||"").toLowerCase();
  return GRAM.scale.concat(["may","need to","can"]).filter(m=>new RegExp("\\b"+m+"\\b").test(t));
}
function coverage(){
  const n=counts();
  const mods=modalsUsed();
  return `<div class="cov">${CAT_ORDER.map(k=>
    `<div class="covcell"><div class="n m-${CATS[k].cls}" style="display:inline-block;padding:0 8px;border-radius:6px">${n[k]}</div>
     <div class="l">${esc(CATS[k].label)}</div></div>`).join("")}</div>
   <p class="dim" style="font-size:12.5px;margin:0 0 6px">Counts only. Whether each part does its job is your teacher's call.</p>
   ${mods.length?`<p class="dim" style="font-size:12.5px;margin:0 0 10px">Modal verbs in your draft: ${mods.map(m=>`<b>${esc(m)}</b>`).join(", ")}. Each one tells the reader how certain you are.</p>`:""}`;
}

/* ====================== STEP 6 · SEND ==================================== */
function byRule(){
  const out={};
  POOL.forEach(c=>{ if(S.first[c.id]===undefined) return;
    const r=out[c.rule]=out[c.rule]||{got:0,total:0};
    r.total++; if(S.first[c.id]) r.got++; });
  return out;
}
function gramRows(){
  const out={};
  Object.keys(S.first).forEach(k=>{
    if(k.indexOf("g.")!==0) return;
    const part=k.split(".")[1];
    const r=out[part]=out[part]||{got:0,total:0};
    r.total++; if(S.first[k]) r.got++;
  });
  return Object.keys(out).map(p=>
    `<tr><td>${esc(GRAM_LABEL[p]||p)}</td><td><b>${out[p].got} / ${out[p].total}</b></td></tr>`).join("");
}
function renderSend(){
  const n=counts(), toks=tokens(), rules=byRule();
  const sc=deckScore();
  const wordsN=toks.length;
  const code=vcode(JSON.stringify(S.first)+"|"+S.fname+"|"+S.lname+"|"+S.sid+"|"+(S.draft.text||"")+"|"+JSON.stringify(S.draft.marks||[]));
  const dt=new Date().toLocaleString("en-AU",{dateStyle:"full",timeStyle:"short"});
  let h=topbar()+`
  <div class="btnrow noprint" style="margin:0 0 14px">
    <button class="btn btn-primary" onclick="S.exported=true;save();window.print()">Save as PDF</button>
    <button class="btn btn-ghost" onclick="go('mark')">Back to mark-up</button>
  </div>
  <p class="lead noprint">Save as PDF, then email the file to your teacher.</p>

  <h1>Contention and claims</h1>
  <p class="sub"><b>${esc(S.fname)} ${esc(S.lname)}</b> · ${esc(S.sid)} · ${esc(dt)}</p>

  ${gramRows()?`<h3>Grammar — first attempt</h3>
  <table class="rpt"><tr><th>What it tested</th><th>First go</th></tr>${gramRows()}</table>`:""}

  <h3>The deck — first attempt</h3>
  <table class="rpt"><tr><th>What it tested</th><th>First go</th></tr>
  ${Object.keys(rules).length
    ? Object.keys(rules).map(r=>`<tr><td>${esc(RULE_LABEL[r]||r)}</td><td><b>${rules[r].got} / ${rules[r].total}</b></td></tr>`).join("")
    : `<tr><td colspan="2" class="dim">Deck not started.</td></tr>`}
  ${sc.total?`<tr><td><b>All cards</b></td><td><b>${sc.got} / ${sc.total}</b>${sc.total?` (${Math.round(100*sc.got/sc.total)}%)`:""}</td></tr>`:""}
  </table>
  <p class="dim" style="font-size:12.5px">Every card was answered until it was right; the score above is the first attempt at each one.</p>

  <h3>The draft</h3>
  <div class="legend">${CAT_ORDER.map(k=>`<span><i class="sw ${CATS[k].cls}"></i>${esc(CATS[k].label)}</span>`).join("")}</div>
  ${wordsN?`<div class="canvasdoc">${markHtml(toks,false)}</div>`:`<div class="panel dim">No draft written.</div>`}
  <table class="rpt"><tr>${CAT_ORDER.map(k=>`<th>${esc(CATS[k].label)}</th>`).join("")}<th>Words</th></tr>
    <tr>${CAT_ORDER.map(k=>`<td><b>${n[k]}</b></td>`).join("")}<td><b>${wordsN}</b></td></tr></table>
  <p class="dim" style="font-size:12.5px">Marked by the student. The colours report what they labelled, not whether the label is right.</p>
  <p class="dim" style="font-size:12.5px">Verification code: <span class="vcode">${code}</span> — changes if the name, code, draft or any score changes.</p>`;
  $("body").innerHTML=h;
}

/* ---- boot ---- */
(function boot(){
  if(!idOk()){ go("id"); return; }
  const m=(location.hash||"").replace("#","");
  go(["words","gram","deck","draft","mark","send"].includes(m) ? m : "home");
})();
</script>
