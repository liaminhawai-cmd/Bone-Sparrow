<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence fluency: projector</title>
<style>
:root{
  /* The grammar session decks' slide colours, measured from the .pptx. */
  --maroon:#8C072D; --ink:#212121; --vote:#F7F0F1; --icon:#751400;
  /* #888888 is the decks' grey. It is kept for the large bold item numbers;
     smaller grey text is darkened to stay above 4.5:1 on both backgrounds. */
  --grey:#888888; --grey-text:#6B6B6B;
  /* The grammar session decks' part colours, exactly. Each also has its own
     weight, slant or underline and a printed label, so colour is never the
     only signal. */
  --subj:#A24800; --verb:#0F6E4D; --prep:#1F5FA8;
  /* letterbox and control strip around the slide */
  --frame:#1c1c1c; --frame-ink:#c8c3c3; --frame-hi:#2e2e2e;
  --font:Aptos,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--frame);font-family:var(--font);color:var(--ink);display:flex;flex-direction:column}

/* ---- control strip: slim and quiet so the slide dominates ---- */
#bar{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 8px;min-height:40px;flex-wrap:wrap;
     color:var(--frame-ink)}
#bar .sp{flex:1}
#count{font-size:13px;font-weight:600;min-width:48px;text-align:right;padding-right:8px;
       font-variant-numeric:tabular-nums}
.btn{padding:0 12px;border:1px solid transparent;border-radius:6px;font:600 13px/1 var(--font);
     cursor:pointer;background:transparent;color:var(--frame-ink);min-height:40px;min-width:40px}
.btn:hover:not(:disabled){background:var(--frame-hi);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn-primary{color:#fff;border-color:#4a4a4a}
.btn[aria-pressed="true"]{background:#5a1326;border-color:#5a1326;color:#fff}
.menulink{color:var(--frame-ink);font-weight:600;text-decoration:none;font-size:13px;padding:0 10px;
          min-height:40px;display:inline-flex;align-items:center}
.menulink:hover{color:#fff;text-decoration:underline}
:focus-visible{outline:2px solid #f3c6d1;outline-offset:2px}

/* ---- the slide: a 16:9 box letterboxed in the window ----
   --k is the slide width over 1280, set by size(). Every length on the slide
   is written as a size on a 1280 x 720 slide times --k, so the whole slide
   scales as one picture. */
#frame{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#slide{--k:1;position:relative;flex:0 0 auto;background:#fff;overflow:hidden;
       display:grid;grid-template-rows:calc(var(--k)*140px) minmax(0,1fr) calc(var(--k)*62px);
       padding:0 calc(var(--k)*64px) 0 calc(var(--k)*78px)}
#slide.vote{background:var(--vote)}

#hd{display:flex;align-items:flex-start;gap:calc(var(--k)*24px);min-width:0}
#hdtext{flex:1 1 auto;min-width:0;padding-top:calc(var(--k)*26px)}
#h{margin:0;font-size:calc(var(--k)*32px);font-weight:700;color:var(--maroon);line-height:1.2}
#sub{margin:calc(var(--k)*12px) 0 0;font-size:calc(var(--k)*24px);font-style:italic;color:var(--grey-text);
     line-height:1.25;min-height:1.25em}
#icons{flex:0 0 auto;display:flex;gap:calc(var(--k)*10px);padding-top:calc(var(--k)*22px)}
#icons svg{display:block;width:calc(var(--k)*86px);height:calc(var(--k)*86px)}

#stage{min-height:0;overflow:hidden;display:flex}
#wrap{width:100%;margin:0 0 auto}
.is-title #wrap{margin:auto 0}

#ft{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--k)*24px);
    font-size:calc(var(--k)*18px);padding-bottom:calc(var(--k)*8px)}
#foot{font-style:italic;color:var(--grey-text);min-width:0}
#code{color:var(--grey-text);flex:0 0 auto}
.legend{display:inline-flex;gap:1.1em;font-style:normal;font-size:calc(var(--k)*17px)}

/* ---- sentence slides ---- */
.sent{line-height:1.8;margin:0;color:var(--ink)}
.src{font-size:calc(var(--k)*20px);color:var(--grey-text);margin:calc(var(--k)*4px) 0 0}
.ans{display:grid;gap:calc(var(--k)*6px);margin-top:calc(var(--k)*20px);padding-left:calc(var(--k)*62px);
     font-size:calc(var(--k)*28px);line-height:1.3}
.ans .chip:first-child{font-weight:700;color:var(--maroon)}
.ans.hide{visibility:hidden}

/* coloured runs: in sentences (ruby, with a label under each run) and in answer lines */
ruby{ruby-position:under;-webkit-ruby-position:after;ruby-align:center}
rt{font:700 calc(var(--k)*15px)/1 var(--font);font-style:normal;letter-spacing:.03em;text-decoration:none;
   padding-top:2px}
.k-s .b{color:var(--subj);font-weight:700}
.k-v .b{color:var(--verb);font-weight:700;font-style:italic}
.k-p .b{color:var(--prep);font-weight:700}
.k-c .b{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-thickness:.08em;
        text-underline-offset:.14em}
.k-s rt{color:var(--subj)} .k-v rt{color:var(--verb)} .k-p rt{color:var(--prep)} .k-c rt{color:var(--ink)}
.rev .sent,.rev .ans{animation:fade .25s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}

/* grey bold number before a numbered item, as in the decks */
.no{display:inline-block;color:var(--grey);font-weight:700;margin-right:.4em}

/* ---- title slide ---- */
.rule{line-height:1.3;margin:0 0 calc(var(--k)*44px)}
.key{font-size:calc(var(--k)*34px);margin:0;line-height:1.55}

/* ---- length slide ---- */
.len{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:calc(var(--k)*56px);align-items:end}
.pass{line-height:1.35;margin:0}
.pass .s{display:block;margin:0 0 .55em;border-radius:4px}
.pass .s:last-child{margin-bottom:0}
.len + .src{margin-top:calc(var(--k)*16px)}
.rev .pass .s.hit{outline:2px solid var(--maroon);outline-offset:.1em;text-decoration:underline;
                  text-decoration-thickness:.07em;text-underline-offset:.15em}
.bars{display:flex;align-items:flex-end;gap:calc(var(--k)*18px);height:calc(var(--k)*290px)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.col .num{font-size:calc(var(--k)*24px);font-weight:700;color:var(--grey);margin-bottom:calc(var(--k)*4px)}
.col .barbox{width:100%;flex:1;display:flex;align-items:flex-end}
.col .bar{width:100%;background:#D8C6CB;border-radius:4px 4px 0 0}
.rev .col.hit .bar{background:var(--maroon)}
.col .wc{font-size:calc(var(--k)*26px);font-weight:700;margin-top:calc(var(--k)*6px);white-space:nowrap}
.col .wc small{font-size:.65em;font-weight:600;color:var(--grey-text)}
.col .tag{font-size:calc(var(--k)*16px);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
          color:var(--maroon);height:1.3em;visibility:hidden}
.rev .col.hit .tag{visibility:visible}

/* ---- teacher notes ---- */
#notes{flex:0 0 auto;display:none;max-height:36vh;overflow:auto;background:#fff;border-top:1px solid #d4cfc2;
       padding:10px 18px 12px;font-size:15px;line-height:1.5}
body.notes #notes{display:block}
.nrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:4px 0;border-bottom:1px solid #e6e1d6}
.nrow:last-child{border-bottom:0}
.nrow b{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#655f55;padding-top:2px}
.broken{color:#a83232;font-size:18px;white-space:pre-wrap}

@media screen and (max-width:860px){
  .nrow{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (prefers-reduced-motion:reduce){
  .rev .sent,.rev .ans{animation:none}
}
</style>
</head>

<div id="bar">
  <a class="menulink" href="index.html">&#8962; Year 7 English</a>

  <span class="sp"></span>

  <button class="btn" id="bBack" type="button">&larr; Back</button>
  <button class="btn btn-primary" id="bReveal" type="button" aria-pressed="false">Reveal</button>
  <button class="btn" id="bNext" type="button">Next &rarr;</button>
  <button class="btn" id="bNotes" type="button" aria-pressed="false" aria-controls="notes">Notes</button>
</div>
<div id="frame">
  <section id="slide">
    <header id="hd">
      <div id="hdtext"><h1 id="h"></h1><p id="sub"></p></div>

    </header>
    <main id="stage"><div id="wrap"></div></main>
    <footer id="ft"><span id="foot"></span><span id="code"></span></footer>
  </section>
</div>

<script>
"use strict";
/* ======================= CONTENT: edit here =======================
   Each sentence is written in a small markup:
     [s:words]  subject        [v:words]  verb
     [p:words]  prep phrase    [c:words]  conjunction
   Anything outside brackets is plain. Take the brackets away and what is
   left must be the source, word for word.
   "ans" holds the reveal lines and may use the same markup.
   "notes" is the teacher strip (N): each row is [label, text].
   A "length" slide lists its sentences one by one; the bars and the word
   counts are worked out from the text, so they cannot drift from it.
   ================================================================== */
const SLIDES = [
 { kind:"title",
   h:"Sentence fluency",
   rule:"A clause is a [v:verb] plus [s:who is doing it].",
   key:[["1","One finger per clause."],["0","A fist for none."]],
   notes:[
     ["Say","A clause is a verb plus who is doing it. For each sentence, count the clauses and hold up your fingers on my signal. One finger per clause. A fist if there are none."],
     ["Timing","About 5 minutes. Under a minute per sentence: display, fingers up, scan the room, reveal and model."],
     ["Keys","Right arrow or Space: reveal, then next. Left: back. N: these notes."] ] },

 { kind:"sentence",
   src:"The Courier Mail",
   m:"[s:It] [v:took] decades, [c:but] [s:culture] finally [v:shifted].",
   ans:["2 clauses","joined by [c:but]: compound","finally: not a verb"],
   notes:[
     ["Display","Count the clauses. Fingers up on my signal. Scan the room before you reveal."],
     ["Answer","2. took: who? It. shifted: who? culture. Joined by but, so it is compound."],
     ["Ask","“What is the verb? Who’s doing that?” Then: “Can ‘It took decades’ stand on its own? Can ‘culture finally shifted’?” Both can."],
     ["If students disagree","One finger usually means “It took decades” was read as a lead-in. Cover the second half: “It took decades.” is a full sentence. Three fingers usually means finally was counted. “Can you put ‘I’ in front of it? I finally?” It is not a verb: it tells you when."],
     ["Teaching point","But joins two clauses of equal weight. Two clauses joined that way make a compound sentence."] ] },

 { kind:"sentence",
   src:"Six-word story",
   m:"[p:For sale]: baby shoes, never worn.",
   ans:["Fist: 0 clauses","no verb with a who","worn describes the shoes","a fragment, on purpose"],
   notes:[
     ["Display","Count the clauses. A fist if there are none."],
     ["Answer","A fist. 0 clauses. “For sale” is a prep phrase. “baby shoes” is a noun phrase. “worn” describes the shoes: nobody in the sentence does the wearing."],
     ["Ask","“What is the verb? Who’s doing that?” There is no pair to find."],
     ["If students disagree","One finger usually means worn was counted. “Who is doing the wearing? What would need to change to make it a clause?” For example: “The shoes were never worn.” Now were worn has a who: the shoes."],
     ["Teaching point","A fragment is a choice when the form calls for it: an ad, a sign, an ingredients list. This one is written as a newspaper ad. Inside a paragraph of a review, the same thing reads as a mistake."] ] },

 { kind:"sentence",
   src:"How to Do Crunches, wikiHow",
   m:"[v:Cross] your arms [p:in front of your chest] [p:with your hands just below your shoulders].",
   ans:["1 clause","[v:Cross]: who? you, not written","in front of…, with your hands…: phrases"],
   notes:[
     ["Display","Count the clauses."],
     ["Answer","1. Verb: Cross. Who is doing it? You, the reader. It is an instruction (imperative), so the who is not written. “in front of your chest” and “with your hands just below your shoulders” are phrases: no verb."],
     ["Ask","“What is the verb? Who’s doing that?” For the imperative: “Who is doing this? It’s implied: you, the reader.”"],
     ["If students disagree","A fist usually means nobody was found. “Who crosses their arms?” You do. Two fingers usually means a phrase was counted. “Is there a verb in ‘with your hands just below your shoulders’?” No verb, so no clause."],
     ["Teaching point","An instruction still has a who. A how-to text leaves it out because the reader is always the one doing it."] ] },

 { kind:"sentence",
   src:"Rolling Stone, review of 5 Seconds of Summer’s Everyone’s a Star!",
   m:"[s:They] [v:may not be reinventing] the wheel [p:on Everyone’s a Star!] [c:but] [s:their humour and musical restlessness] [v:make] it a breezy listen.",
   ans:["2 clauses","joined by [c:but]: coordinating","compound","left with: a breezy listen"],
   notes:[
     ["Display","Count the clauses."],
     ["Answer","2. may not be reinventing: who? They (the band). make: who? their humour and musical restlessness. Joined by but, a coordinating conjunction, so it is compound. The reader is left with the clause after but: the album is a breezy listen."],
     ["Watch for","Everyone’s a Star! is the album’s name. A name counts as one thing, like Dear Santa, and the ! belongs to the name. “Reinventing the wheel” means making something completely new."],
     ["Ask","“What is the verb? Who’s doing that?” Then: “Which judgement does the reviewer leave you with?”"],
     ["If students disagree","“What would need to change to make it complex?” For example: “Although they may not be reinventing the wheel on Everyone’s a Star!, their humour and musical restlessness make it a breezy listen.” Although is subordinating; the reader is still left with the breezy listen. Then swap the two clauses around but: which judgement wins now?"],
     ["Teaching point","Put the judgement you want remembered last: after but, or in the main clause after an although clause."] ] },

 { kind:"length",
   src:"The Guardian, review of Dear Santa",
   ask:"Which sentence lands hardest? Why?",
   key:"Fingers: the number of the sentence.",
   sentences:[
     "We’re trapped between a sweet-natured kids movie full of life lessons about family and acceptance and a black-hearted adult comedy about a devil trying to steal the soul of a pre-teen.",
     "Unsurprisingly, and less interestingly, the former wins out." ],
   lands:1,
   after:"the short one lands because of the long one before it",
   notes:[
     ["Display","“Which sentence lands hardest? Why?” Fingers up: the number of the sentence."],
     ["Answer","Sentence 2. It lands because of the long sentence before it: the reader is carried through a long, crowded comparison, then the verdict arrives in a handful of words."],
     ["Gloss","“the former” means the first of the two things just named: the sweet-natured kids movie."],
     ["Ask","Read both sentences aloud. “What does the long one let the reviewer do? What does the short one do?”"],
     ["If students disagree","“What would need to change to make sentence 2 land less?” Put it first, or stretch it with a reason."],
     ["Choppy version","Read aloud, not on screen: “We’re trapped between two films. One is a sweet kids movie. One is a dark adult comedy. The kids movie wins.” Every sentence the same length, so none of them lands."],
     ["Teaching point","Short sentences land a verdict. Long sentences allow nuance and analysis. The contrast does the work; a run of short sentences reads as choppy."] ] }
];

/* The words on the slide frame, in the grammar session decks' wording. */

  code:     "SF",
  know:     "What you need to know",
  count:    "Count the clauses",
  countSub: "One finger per clause. A fist for none.",
  reveal:   "Reveal and model",
  vote:     "Vote with your fingers, scan the room before revealing."
};

const TAGS = {s:"subject", v:"verb", p:"prep phrase", c:"conjunction"};
const RUN = /\[([a-z]+):([^\[\]]*)\]/g;
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* The markup with the brackets taken away: the words as the source has them. */
function plain(m){ return m.replace(RUN, (x,k,t) => t); }

/* The markup as HTML. ruby=true puts the part's name under each run, for the
   sentence on a reveal; ruby=false is the flat form used in answer lines. */
function marked(m, ruby){
  let out = "", last = 0;
  m.replace(RUN, (x,k,t,at) => {
    out += esc(m.slice(last, at));
    out += ruby
      ? `<ruby class="k-${k}"><span class="b">${esc(t)}</span><rt>${TAGS[k]}</rt></ruby>`
      : `<span class="k-${k}"><span class="b">${esc(t)}</span></span>`;
    last = at + x.length;
    return x;
  });
  return out + esc(m.slice(last));
}

/* A word is any space-separated piece with a letter or digit in it, so a
   hyphenated word or a contraction counts once and lone punctuation not at all. */
function words(s){ return s.trim().split(/\s+/).filter(w => /[A-Za-z0-9]/.test(w)).length; }

/* Reveal lines for a length slide, built from the counts. */
function lengthAns(sl){
  const n = sl.sentences.map(words), i = sl.lands;
  const before = n.slice(Math.max(0,i-2), i);
  return [`Sentence ${i+1} lands: ${n[i]} words, after ${before.join(" and ")}`, sl.after];
}

/* Every problem a hand edit to the content block could cause. If there are
   any, the deck shows them instead of a slide. */
function problems(){
  const out = [];
  const look = (m, where) => {
    m.replace(RUN, (x,k) => { if(!TAGS[k]) out.push(`${where}: unknown part "${k}"`); return x; });
    const left = m.replace(RUN, "");
    if(/[\[\]]/.test(left)) out.push(`${where}: a bracket is not closed or not opened`);
  };
  SLIDES.forEach((sl, i) => {
    const w = "Slide " + (i+1);
    if(sl.kind === "title") look(sl.rule, w);
    else if(sl.kind === "sentence"){ look(sl.m, w); (sl.ans||[]).forEach(a => look(a, w + " answer")); }
    else if(sl.kind === "length"){
      if(!(sl.lands >= 0 && sl.lands < sl.sentences.length)) out.push(w + ": lands is not one of the sentences");
      sl.sentences.forEach(s => { if(!words(s)) out.push(w + ": an empty sentence"); });
    }
    else out.push(w + ": unknown kind " + sl.kind);
  });
  return out;
}

/* ---------- state: in memory only, nothing is saved ---------- */
const at = {i:0, rev:false};
const $ = id => document.getElementById(id);
const canReveal = i => SLIDES[i].kind !== "title";

function forward(){
  if(canReveal(at.i) && !at.rev) at.rev = true;
  else if(at.i < SLIDES.length-1){ at.i++; at.rev = false; }
  render();
}
function back(){
  if(at.rev) at.rev = false;
  else if(at.i > 0){ at.i--; at.rev = canReveal(at.i); }
  render();
}
function next(){ if(at.i < SLIDES.length-1){ at.i++; at.rev = false; render(); } }
function toggleReveal(){ if(canReveal(at.i)){ at.rev = !at.rev; render(); } }
function toggleNotes(){
  const on = document.body.classList.toggle("notes");
  $("bNotes").setAttribute("aria-pressed", on);
  fit();
}

function legend(){
  return `<span class="legend">` + ["s","v","p","c"].map(k =>
    `<span class="lg k-${k}"><span class="b">${TAGS[k][0].toUpperCase()+TAGS[k].slice(1)}</span></span>`
  ).join("") + `</span>`;
}

/* Icons for the top right. A clause slide always shows 1 and 2 (every answer
   here is 0, 1 or 2), never an icon worked out from the answer, which would
   give it away. A length slide shows one icon per sentence number. */
function icons(sl){
  if(sl.kind === "title") return ["book"];
  if(at.rev) return ["think"];
  if(sl.kind === "sentence") return ["f1","f2"];
  return sl.sentences.map((s,j) => "f" + (j+1)).filter(k => ICONS[k]);
}

function render(){
  const sl = SLIDES[at.i], n = SLIDES.length;
  $("count").textContent = `${at.i+1} / ${n}`;
  $("bBack").disabled = at.i === 0 && !at.rev;
  $("bNext").disabled = at.i === n-1;
  $("bReveal").disabled = !canReveal(at.i);
  $("bReveal").setAttribute("aria-pressed", at.rev);
  $("slide").className = `is-${sl.kind}` + (at.rev ? " rev" : "") + (canReveal(at.i) && !at.rev ? " vote" : "");

  let html = "", h = "", sub = "", foot = "";
  if(sl.kind === "title"){
    h = FRAME.know; sub = sl.h;
    html = `<p class="rule fitme">${marked(sl.rule, false)}</p>
      <p class="key">${sl.key.map(k => `<span class="no">${esc(k[0])}</span>${esc(k[1])}`).join("<br>")}</p>`;
  } else if(sl.kind === "sentence"){
    h = at.rev ? FRAME.reveal : FRAME.count;
    sub = at.rev ? "" : FRAME.countSub;
    html = `<p class="sent fitme"></p><p class="src">${esc(sl.src)}</p>
      <div class="ans">${sl.ans.map(a => `<span class="chip">${marked(a, false)}</span>`).join("")}</div>`;
    foot = at.rev ? legend() : esc(FRAME.vote);
  } else if(sl.kind === "length"){
    h = at.rev ? FRAME.reveal : sl.ask;
    sub = at.rev ? sl.ask : sl.key;
    const counts = sl.sentences.map(words), max = Math.max(...counts);
    html = `<div class="len">
        <p class="pass fitme">${sl.sentences.map((s,j) =>
          `<span class="s${j===sl.lands?" hit":""}"><span class="no">${j+1}.</span>${esc(s)}</span>`).join(" ")}</p>
        <div class="bars" aria-label="Words per sentence">${counts.map((c,j) =>
          `<div class="col${j===sl.lands?" hit":""}"><span class="tag">lands</span><span class="num">${j+1}</span>
             <div class="barbox"><div class="bar" style="height:${(c/max*100).toFixed(1)}%"></div></div>
             <span class="wc">${c} <small>words</small></span></div>`).join("")}</div>
      </div>
      <p class="src">${esc(sl.src)}</p>
      <div class="ans">${lengthAns(sl).map(a => `<span class="chip">${marked(a, false)}</span>`).join("")}</div>`;
    foot = at.rev ? "" : esc(FRAME.vote);
  }
  $("h").textContent = h;
  $("sub").textContent = sub;
  $("icons").innerHTML = icons(sl).map(k => ICONS[k] || "").join("");
  $("wrap").innerHTML = html;
  $("foot").innerHTML = foot;
  $("code").textContent = FRAME.code;
  $("notes").innerHTML = sl.notes.map(r =>
    `<div class="nrow"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("");
  fit();
}

/* The slide is the largest 16:9 box that fits under the control strip (and
   above the notes, when they are open). Returns the scale against a
   1280 x 720 slide. */
function size(){
  const f = $("frame"), s = $("slide");
  const W = f.clientWidth - 16, H = f.clientHeight - 8;
  const w = Math.max(160, Math.floor(Math.min(W, H * 16 / 9)));
  s.style.width = w + "px";
  s.style.height = Math.floor(w * 9 / 16) + "px";
  s.style.setProperty("--k", (w / 1280).toFixed(4));
  return w / 1280;
}

/* Largest type that fits the slide in one view. A sentence slide is sized
   with the reveal in place (bold runs, labels, answer lines), and the display
   state keeps that size, so nothing jumps when the answer appears. The answer
   lines are hidden, not removed, so their space is held without showing
   anything. Sizes are for a 1280 x 720 slide and scale with it. */
const SIZES = {title:[60,32], sentence:[64,30], length:[40,18]};
function fit(){
  const k = size();
  const sl = SLIDES[at.i], el = document.querySelector(".fitme");
  if(!el) return;
  const sent = sl.kind === "sentence", ans = document.querySelector(".ans");
  if(sent){ el.innerHTML = marked(sl.m, true); }
  if(ans) ans.classList.remove("hide");
  const stage = $("stage"), wrap = $("wrap");
  const fits = () => wrap.offsetHeight <= stage.clientHeight && el.scrollWidth <= el.clientWidth + 1;
  let [s, min] = SIZES[sl.kind].map(v => Math.round(v * k));
  el.style.fontSize = s + "px";
  while(s > min && !fits()){ s -= 2; el.style.fontSize = s + "px"; }
  if(sent && !at.rev) el.textContent = plain(sl.m);
  if(ans && !at.rev) ans.classList.add("hide");
}

/* ---------- controls ---------- */
$("bBack").addEventListener("click", back);
$("bNext").addEventListener("click", next);
$("bReveal").addEventListener("click", toggleReveal);
$("bNotes").addEventListener("click", toggleNotes);
/* A mouse click should not leave a button focused, or the next Space would
   press it again instead of moving the deck on. Tab focus is unaffected. */
document.querySelectorAll("#bar button").forEach(b =>
  b.addEventListener("mousedown", e => e.preventDefault()));
document.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const onControl = /^(BUTTON|A)$/.test(e.target.tagName);
  if(onControl && (e.key === " " || e.key === "Enter")) return;
  if(e.key === "ArrowRight" || e.key === " " || e.key === "PageDown"){ e.preventDefault(); forward(); }
  else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); back(); }
  else if(e.key === "n" || e.key === "N"){ e.preventDefault(); toggleNotes(); }
  else if(e.key === "Home"){ e.preventDefault(); at.i = 0; at.rev = false; render(); }
  else if(e.key === "End"){ e.preventDefault(); at.i = SLIDES.length-1; at.rev = false; render(); }
});
addEventListener("resize", fit);

/* #4 opens on slide 4, #4r on its reveal, so a lesson plan can link straight in. */
(function start(){
  const bad = problems();
  if(bad.length){
    size();
    $("wrap").innerHTML = `<p class="broken">The content block has a problem, so the deck will not run:\n${esc(bad.join("\n"))}</p>`;
    return;
  }
  const h = /^#(\d+)(r?)$/.exec(location.hash);
  if(h){ const i = +h[1]-1; if(i >= 0 && i < SLIDES.length){ at.i = i; at.rev = !!h[2] && canReveal(i); } }
  render();
})();
</script>
