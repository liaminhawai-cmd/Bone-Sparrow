<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teacher — The Bone Sparrow</title>
<style>
:root{
  --bg:#f4efe6; --paper:#fbf7ee; --ink:#1f1f1f; --muted:#6b6256;
  --line:#d8cfbb; --accent:#a83232;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink)}
h1,.serif{font-family:Georgia,'Times New Roman',serif}
main{max-width:640px;margin:0 auto;padding:40px 20px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 28px}
ul{list-style:none;margin:0;padding:0}
li{border:1px solid var(--line);background:var(--paper);border-radius:8px;
   margin-bottom:10px;overflow:hidden}
a.res{display:block;padding:14px 16px;color:var(--ink);text-decoration:none}
a.res:hover{border-color:var(--accent)}
.name{font-family:Georgia,serif;font-size:16px}
.meta{color:var(--muted);font-size:12.5px;margin-top:3px}
</style>
</head>
<body>
<main>
<h1>Teacher</h1>
<p class="sub">The Bone Sparrow — print resources</p>
<ul>
  <li><a class="res" href="../BoneSparrow-A3-booklet.docx">
    <div class="name">A3 writing booklet</div>
    <div class="meta">One sheet per student, double-sided, folded once — three cycles into a sentence plus the wall.</div>
  </a></li>
</ul>
</main>
</body>
</html>
