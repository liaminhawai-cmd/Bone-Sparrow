<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TEEL essay — The Bone Sparrow</title>
<style>
:root{
  --bg:#f4efe6; --paper:#fbf7ee; --ink:#1f1f1f; --muted:#6b6256;
  --line:#d8cfbb; --accent:#a83232; --deep:#1d3c34;
  --idea-bg:#d6eafc; --idea-tx:#0b447c;
  --verb-bg:#fae3cf; --verb-tx:#8a4b12;
  --ev-bg:#fff3b0;   --ev-tx:#7a5a00;
  --eff-bg:#dff0e2;  --eff-tx:#1f5c33;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:18px 22px 90px}
h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.sub a{color:var(--muted)}
h2{font-family:Georgia,serif;font-size:19px;color:var(--deep);margin:40px 0 14px;
   border-bottom:2px solid var(--deep);padding-bottom:6px}

em{font-style:normal;border-radius:4px;padding:1px 4px;font-weight:600}
em.hl-idea{background:var(--idea-bg);color:var(--idea-tx)}
em.hl-verb{background:var(--verb-bg);color:var(--verb-tx)}
em.hl-ev{background:var(--ev-bg);color:var(--ev-tx);font-style:italic}
em.hl-eff{background:var(--eff-bg);color:var(--eff-tx)}

/* theme picker */
.themes{display:flex;gap:8px;flex-wrap:wrap}
.themes button{border:1px solid var(--line);border-radius:999px;background:var(--paper);
  padding:9px 16px;font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.themes button.on{background:var(--idea-bg);color:var(--idea-tx);border-color:var(--idea-tx);font-weight:700}
.themes button b{display:inline-block;font-size:12px;background:var(--idea-tx);color:#fff;border-radius:50%;
  width:20px;height:20px;line-height:20px;text-align:center;margin-right:8px;vertical-align:1px}
body.v-plain .themes button b,body.v-spot .themes button b{background:var(--ink)}

.modes{display:flex;gap:8px;margin-top:10px}
.modes button{border:1px solid var(--line);border-radius:8px;background:var(--paper);
  padding:7px 14px;font-family:inherit;font-size:14px;color:var(--muted);cursor:pointer;letter-spacing:.04em}
.modes button.on{color:var(--ink);border-color:var(--ink);font-weight:700}
.palette{display:flex;gap:6px;align-items:center;margin:14px 0 0;flex-wrap:wrap}
.palette button{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-family:inherit;
  font-size:13.5px;cursor:pointer;font-weight:700}
.palette .p-idea{background:var(--idea-bg);color:var(--idea-tx)}
.palette .p-verb{background:var(--verb-bg);color:var(--verb-tx)}
.palette .p-ev{background:var(--ev-bg);color:var(--ev-tx);font-style:italic}
.palette .p-eff{background:var(--eff-bg);color:var(--eff-tx)}
.palette .p-plain{background:#fff;color:var(--muted);font-weight:500}

/* skeleton */
.skel{display:grid;gap:10px}
.part{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:12px 16px}
.part .pn{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.part .txt{font-family:Georgia,serif;font-size:16.5px;line-height:1.75}
.gap{display:inline-block;min-width:110px;border-bottom:2px solid var(--ink);margin:0 3px;vertical-align:-2px}
.gap.long{min-width:320px}
.part.onday{border-style:dashed;color:var(--muted);background:transparent}
.part.onday .txt{font-family:inherit;font-size:14px;color:var(--muted)}
.part.onday .ts{font-family:Georgia,serif;font-size:20px;color:var(--ink);display:block;margin-bottom:4px}
.part.A{border-color:var(--deep);border-width:2px}

/* co-construct frame */
.frame{border:2px solid var(--deep);border-radius:12px;background:var(--paper);padding:6px 0;margin-top:12px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 16px;align-items:start}
.slot+.slot{border-top:1px dashed var(--line)}
.slot .l{font-family:Georgia,serif;font-size:26px;font-weight:700;color:var(--deep);line-height:1.2}
.slot .dots{font-size:11.5px;color:var(--muted);margin-top:2px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:2px;vertical-align:-1px}
.dot.idea{background:var(--idea-bg);border:1.5px solid var(--idea-tx)}
.dot.ev{background:var(--ev-bg);border:1.5px solid var(--ev-tx)}
.dot.verb{background:var(--verb-bg);border:1.5px solid var(--verb-tx)}
.dot.eff{background:var(--eff-bg);border:1.5px solid var(--eff-tx)}
.slot .box{font-family:Georgia,serif;font-size:19px;line-height:1.7;min-height:52px;
  border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px;outline:none}
.slot .box:focus{border-color:var(--deep)}
.slot .box:empty:before{content:attr(data-stem);color:#b8ae9d;font-style:italic}
.slot .box.reveal{animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns button{border:1px solid var(--line);border-radius:8px;background:var(--paper);
  padding:10px 16px;font-family:inherit;font-size:14.5px;color:var(--ink);cursor:pointer}
.btns button.primary{background:var(--deep);color:#f6f1e6;border-color:var(--deep)}

/* the middle: a line of chips with joiners between */
.modes .sp{flex:1}
.modes button.way{border-radius:999px}
.slot .line{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;
  font-family:Georgia,serif;font-size:18px;line-height:2.2;min-height:52px}
.join{display:inline;min-width:14px;padding:2px 3px;border-bottom:1.5px dashed #c9bfae;color:var(--ink);outline:none;white-space:pre-wrap}
.join:empty{padding:2px 8px}
.join:empty:before{content:attr(data-stem);color:#b8ae9d;font-style:italic}
.join:focus{border-bottom-color:var(--ink)}
.chip{display:inline-block;border-radius:8px;padding:3px 10px 3px 6px;margin:2px 1px;font-weight:600;cursor:grab;
  vertical-align:baseline;line-height:1.6;max-width:100%}
.chip.idea{background:var(--idea-bg);color:var(--idea-tx)}
.chip.verb{background:var(--verb-bg);color:var(--verb-tx)}
.chip.quote{background:var(--ev-bg);color:var(--ev-tx);font-style:italic}
.chip.eff{background:var(--eff-bg);color:var(--eff-tx)}
.chip .grab{opacity:.45;margin-right:5px;font-size:12px;letter-spacing:-2px;cursor:grab}
.chip .ct{outline:none;cursor:text}
.chip .ct:empty:before{content:attr(data-stem);opacity:.55;font-style:italic;font-weight:500}
.chip.dragging{opacity:.4}
.chip.over{box-shadow:0 0 0 2px var(--ink)}

/* branch */
.branch{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.qcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media screen and (max-width:700px){.qcard{grid-template-columns:1fr}}
.qcard .q{font-family:Georgia,serif;font-size:16.5px;color:var(--ev-tx);font-style:italic;
  background:var(--ev-bg);border-radius:8px;padding:8px 12px}
.qcard .q small{display:block;font-style:normal;font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--muted);margin-top:4px}
.qcard .e{font-size:15px;color:var(--eff-tx);background:var(--eff-bg);border-radius:8px;padding:8px 12px}
.arrow{color:var(--muted);text-align:center;font-size:20px;line-height:1}

/* ---- display: plain / spotlight / full ---- */
.view{position:fixed;top:12px;right:14px;display:flex;gap:4px;z-index:20;
  background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.view button{border:0;border-radius:999px;background:transparent;padding:6px 12px;
  font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.view button.on{background:var(--deep);color:#f6f1e6}
.spot{display:none;gap:6px;margin:12px 0 0;align-items:center}
.spot button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:6px 12px;
  font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.spot button.on{color:var(--ink);border-color:var(--ink);font-weight:700}
body.v-spot .spot{display:flex}
body.v-spot .palette,body.v-plain .palette{display:none}

/* plain: every role reads as ink; the letters carry the structure */
body.v-plain em[class^="hl-"],body.v-spot em[class^="hl-"]{background:transparent;color:inherit;font-weight:inherit;padding:0;font-style:inherit}
body.v-plain .chip,body.v-spot .chip{background:#fff;color:var(--ink);border:1px solid var(--line);font-style:normal;font-weight:500}
body.v-plain .dots,body.v-spot .dots{display:none}
body.v-plain .qcard .q,body.v-spot .qcard .q{background:transparent;color:var(--ink);padding:0}
body.v-plain .qcard .e,body.v-spot .qcard .e{background:transparent;color:var(--muted);padding:0}
body.v-plain .themes button.on,body.v-spot .themes button.on{background:var(--paper);color:var(--ink);border-color:var(--ink)}
body.v-plain .skel em,body.v-spot .skel em{background:transparent;color:inherit;font-weight:inherit;padding:0}
body.v-plain .branch>div:first-child,body.v-spot .branch>div:first-child{background:transparent!important;color:var(--ink)!important;padding:0!important}

/* spotlight: one role lit */
body.v-spot[data-spot="idea"] em.hl-idea,body.v-spot[data-spot="idea"] .skel em.hl-idea{background:var(--idea-bg);color:var(--idea-tx);font-weight:600;padding:1px 4px}
body.v-spot[data-spot="idea"] .chip.idea{background:var(--idea-bg);color:var(--idea-tx);border-color:var(--idea-bg);font-weight:600}
body.v-spot[data-spot="verb"] em.hl-verb,body.v-spot[data-spot="verb"] .skel em.hl-verb{background:var(--verb-bg);color:var(--verb-tx);font-weight:600;padding:1px 4px}
body.v-spot[data-spot="verb"] .chip.verb{background:var(--verb-bg);color:var(--verb-tx);border-color:var(--verb-bg);font-weight:600}
body.v-spot[data-spot="ev"] em.hl-ev,body.v-spot[data-spot="ev"] .skel em.hl-ev{background:var(--ev-bg);color:var(--ev-tx);font-weight:600;font-style:italic;padding:1px 4px}
body.v-spot[data-spot="ev"] .chip.quote{background:var(--ev-bg);color:var(--ev-tx);border-color:var(--ev-bg);font-weight:600;font-style:italic}
body.v-spot[data-spot="ev"] .qcard .q{background:var(--ev-bg);color:var(--ev-tx);padding:8px 12px}
body.v-spot[data-spot="eff"] em.hl-eff,body.v-spot[data-spot="eff"] .skel em.hl-eff{background:var(--eff-bg);color:var(--eff-tx);font-weight:600;padding:1px 4px}
body.v-spot[data-spot="eff"] .chip.eff{background:var(--eff-bg);color:var(--eff-tx);border-color:var(--eff-bg);font-weight:600}
body.v-spot[data-spot="eff"] .qcard .e{background:var(--eff-bg);color:var(--eff-tx);padding:8px 12px}

/* ---- slides ---- */
main{max-width:1120px;padding:0 40px 80px;min-height:100vh}
.slide{display:none;min-height:100vh;flex-direction:column;justify-content:center;padding:56px 0 70px}
.slide.on{display:flex}
.slide h2{margin:0 0 22px;font-size:26px}
.slide.title{align-items:flex-start}
.slide.title h1{font-size:44px;margin:0 0 6px}
.slide.title .sub{font-size:16px;margin-bottom:34px}
.slide.title .lab{font-size:12.5px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:26px 0 8px}
.slide.title .themes button{font-size:19px;padding:12px 22px}
.slide.title .modes{margin-top:0}
.slide.title .modes button{font-size:16px;padding:9px 16px}
.slide.title .modes .sp{display:none}
.part .txt{font-size:20px;line-height:1.8}
.slot .box{font-size:22px}
.slot .line{font-size:21px}
.slot .l{font-size:30px}
.qcard .q{font-size:20px}
.qcard .e{font-size:18px}
.rule{font-size:16.5px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;justify-content:center;
  padding:10px;background:linear-gradient(transparent,var(--bg) 40%);z-index:20}
.nav button{border:1px solid var(--line);border-radius:999px;background:var(--paper);width:40px;height:40px;
  font-size:18px;color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.nav .dots{display:flex;gap:7px}
.nav .dots span{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.nav .dots span.on{background:var(--deep)}
.nav .now{font-size:13px;color:var(--muted);min-width:170px}
.here{font-size:13px;color:var(--muted);letter-spacing:.06em;margin:0 0 6px}

/* rule */
.rule{border-left:4px solid var(--accent);background:var(--paper);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:14px 0 0;font-size:15.5px}
</style>
</head>

 {id:"loneliness", name:"loneliness", link:"Loneliness in this novel does not need a fence.",
  quotes:[
   {q:"Jimmie wonders if her dad even remembers that she can't read.", ch:"Chapter 6",
    e:"makes the reader feel that Jimmie has become invisible in her own house", lead:"Jimmie sits in her own kitchen", verb:"reveals", idea:"how lonely Jimmie is even at home", e2:"makes the reader feel that she is as unseen as Subhi", eInf:"make the reader feel that she is as unseen as Subhi"},
   {q:"Jimmie has never felt so alone.", ch:"Chapter 20",
    e:"shows the reader that loneliness reaches the free side of the fence too", lead:"her father turns to the sports pages", verb:"shows", idea:"loneliness on the free side of the fence", e2:"makes the reader feel that the fence is not the only thing that shuts people away", eInf:"make the reader feel that the fence is not the only thing that shuts people away"}],
  para:[
   "Fraillon <em class=\"hl-verb\">presents</em> <em class=\"hl-idea\">loneliness</em> as something that reaches both sides of the fence.",
   "Inside her own house, <em class=\"hl-ev\">\"Jimmie wonders if her dad even remembers that she can't read.\"</em>",

 {id:"hope", name:"hope", link:"Hope, in the camp, is something you do.",

   {q:"Tonight, you look up at that sky, and there will be a new star there.", ch:"Chapter 17",

  para:[
   "Fraillon <em class=\"hl-verb\">presents</em> <em class=\"hl-idea\">hope</em> as something people in the camp have to make for themselves.",

   "By making hope an action rather than a feeling, Fraillon <em class=\"hl-verb\">shows</em> that <em class=\"hl-idea\">the people inside the fence</em> <em class=\"hl-eff\">are not waiting to be rescued</em>."]}
];

/* Paragraph shape: T, then the middle (one line per piece of evidence, four
   chips each), then A in TEEAL, then L. The chips are the unit's four colours:
   idea, verb, quote, effect. Their order is dragged; the joiners between
   them are typed. */
const OUTER={
 TEEL: [{l:"T",dots:["idea"],stem:"Fraillon presents … as …"},"MID",{l:"L",dots:["idea","eff"],stem:"By … , Fraillon shows that …"}],
 TEEAL:[{l:"T",dots:["idea"],stem:"Fraillon presents … as …"},"MID",{l:"A",dots:["idea","eff"],stem:"By … , Fraillon shows that …"},{l:"L",dots:["idea"],stem:"… , then, …"}]
};
/* the three ways in: chip order and the joiners around them */
const WAYS={
 evidence:{name:"Evidence first", order:["quote","verb","idea","eff"],
   joins:q=>["When "+q.lead+", ", " ", " ", ", which ", "."], hints:["When …, ","","",", which ","."], eff:"e2"},
 idea:    {name:"Idea first",     order:["verb","idea","quote","eff"],
   joins:q=>["Fraillon ", " ", " when "+q.lead+": ", ", which ", "."], hints:["Fraillon ",""," when …: ",", which ","."], eff:"e2"},
 effect:  {name:"Effect first",   order:["eff","verb","idea","quote"],
   joins:q=>["To ", ", Fraillon ", " ", " when "+q.lead+": ", "."], hints:["To ",", Fraillon ",""," when …: ","."], eff:"eInf"}
};
const CHIPTEXT=(q,k,way)=>k==="quote"?"“"+q.q.replace(/\.$/,"")+"”":k==="eff"?q[WAYS[way].eff]:q[k];
const STEM=k=>({idea:"what this shows about "+T().name,verb:"verb",quote:"quote",eff:"effect on the reader"})[k];
const dkey=()=>S.theme+"."+S.mode;

/* ---------------- state ---------------- */
const $=id=>document.getElementById(id);
const KEY="bonesparrow.teel.v2";
let S={theme:"power", picks:["power"], mode:"TEEL", way:"evidence", drafts:{}};
try{ const j=JSON.parse(localStorage.getItem(KEY)); if(j&&j.theme) S=j; }catch(e){}
S.mode=S.mode||"TEEL"; S.way=S.way||"evidence"; S.drafts=S.drafts||{};
if(!S.picks||!S.picks.length) S.picks=[S.theme]; S.theme=S.picks[0];
const NAME=id=>{const t=THEMES.find(t=>t.id===id); return t?t.name:"";};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const T=()=>THEMES.find(t=>t.id===S.theme);
/* a draft: outer boxes by letter index, and two rows of chips + joiners */
function blank(){ return {outer:{0:`Fraillon <em class="hl-verb">presents</em> <em class="hl-idea">${T().name}</em> in the novel.`}, rows:T().quotes.map(q=>({
  chips:WAYS[S.way].order.map(k=>({k,t:""})), joins:["","","","",""]}))}; }
function D(){ if(!S.drafts[dkey()]) S.drafts[dkey()]=blank(); return S.drafts[dkey()]; }

/* ---------------- draw ---------------- */
function drawThemes(){
  $("themes").innerHTML=THEMES.map(t=>{
    const i=S.picks.indexOf(t.id);
    return `<button class="${i>=0?'on':''}" data-t="${t.id}">${i>=0?'<b>'+"ABC"[i]+'</b>':''}${t.name}</button>`;}).join("");
  [...$("themes").querySelectorAll("button")].forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.t, i=S.picks.indexOf(id);
    if(i>=0){ if(S.picks.length>1) S.picks.splice(i,1); }
    else { if(S.picks.length>=3) S.picks.pop(); S.picks.push(id); }
    S.theme=S.picks[0]; save(); drawAll();
  }));
}
function drawModes(){
  $("modes").innerHTML=Object.keys(OUTER).map(m=>
    `<button class="${m===S.mode?'on':''}" data-m="${m}">${m.split("").join(" · ")}</button>`).join("");
  $("ways").innerHTML=Object.keys(WAYS).map(w=>`<button class="way ${w===S.way?'on':''}" data-w="${w}">${WAYS[w].name}</button>`).join("");
  [...$("modes").querySelectorAll("button[data-m]")].forEach(b=>b.addEventListener("click",()=>{
    S.mode=b.dataset.m; save(); drawAll();
  }));
  [...$("ways").querySelectorAll("button[data-w]")].forEach(b=>b.addEventListener("click",()=>{
    S.way=b.dataset.w; applyWay(); save(); drawAll();
  }));
}
/* a way sets the order and the joiners; chip text stays, except the effect
   chip, whose form depends on where it sits */
function applyWay(){
  const d=D(), W=WAYS[S.way];
  d.rows.forEach((row,ri)=>{
    const q=T().quotes[ri];
    const by={}; row.chips.forEach(c=>by[c.k]=c.t);
    row.chips=W.order.map(k=>({k,t:by[k]||""}));
    if(row.chips.some(c=>c.t.trim())) row.joins=W.joins(q); else row.joins=["","","","",""];
    const eff=row.chips.find(c=>c.k==="eff");
    if(eff.t===q.e2||eff.t===q.eInf) eff.t=q[W.eff];
  });
}
function drawSkel(){
  const [a,b,c]=S.picks.map(NAME);
  const I=n=>n?`<em class="hl-idea">${n}</em>`:`<span class="gap"></span>`;
  const list=`${I(a)}, ${I(b)} and ${I(c)}`;
  const para=(L,n)=>`<div class="part onday"><div class="pn">PARAGRAPH ${L}${n?' · '+n.toUpperCase():''}</div><div class="txt">
    ${n?`<span class="ts">Fraillon also presents ${I(n)}.</span> `:''}on the day</div></div>`;
  document.querySelectorAll(".skel").forEach(el=>el.innerHTML=`
  <div class="part"><div class="pn">INTRODUCTION</div><div class="txt">
    In <i>The Bone Sparrow</i>, Zana Fraillon tells the story of Subhi, a boy born inside a detention camp, and Jimmie, the girl who finds a way in.
    Through these two children, Fraillon presents ${list}.</div></div>
  <div class="part A"><div class="pn">PARAGRAPH A · ${a.toUpperCase()}</div><div class="txt skelA"></div></div>
  ${para("B",b)}${para("C",c)}
  <div class="part"><div class="pn">CONCLUSION</div><div class="txt">
    Fraillon uses Subhi and Jimmie to show the reader ${list}.
    Together, these ideas suggest that <span class="gap long"></span>.</div></div>`);
  syncSkelA();
}
const CL={idea:"hl-idea",verb:"hl-verb",quote:"hl-ev",eff:"hl-eff"};
function rowHtml(row){ /* the row as coloured prose */
  let h="";
  row.chips.forEach((c,i)=>{ h+=esc(row.joins[i]||""); if(c.t) h+=`<em class="${CL[c.k]}">${c.t}</em>`; });
  h+=esc(row.joins[row.chips.length]||"");
  return h;
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function syncSkelA(){
  const d=D(), shape=OUTER[S.mode];
  let out=[]; let oi=0;
  shape.forEach(part=>{
    if(part==="MID") d.rows.forEach(r=>{ if(r.chips.some(c=>c.t.trim())) out.push(rowHtml(r)); });
    else { const t=d.outer[oi++]||""; if(t.replace(/<[^>]+>/g,"").trim()) out.push(t); }
  });
  document.querySelectorAll(".skelA").forEach(el=>el.innerHTML=out.length?out.join(" "):'<span style="color:#b8ae9d">T · E · E · L</span>');
}
function outerBox(part,oi){
  const d=D();
  return `<div class="slot">
    <div><div class="l">${part.l}</div><div class="dots">${part.dots.map(k=>`<span class="dot ${k}"></span>`).join("")}</div></div>
    <div class="box" contenteditable="true" spellcheck="false" data-o="${oi}" data-stem="${part.stem}">${d.outer[oi]||""}</div></div>`;
}
function lineHtml(row,ri){
  return row.chips.map((c,i)=>
      `<span class="join" contenteditable="true" spellcheck="false" data-r="${ri}" data-j="${i}" data-stem="${esc(WAYS[S.way].hints[i]||"")}">${esc(row.joins[i]||"")}</span>`+
      `<span class="chip ${c.k}" data-r="${ri}" data-i="${i}"><span class="grab">⋮⋮</span><span class="ct" contenteditable="true" spellcheck="false" data-stem="${STEM(c.k)}">${c.t}</span></span>`
    ).join("")+
    `<span class="join" contenteditable="true" spellcheck="false" data-r="${ri}" data-j="${row.chips.length}" data-stem="${esc(WAYS[S.way].hints[row.chips.length]||"")}">${esc(row.joins[row.chips.length]||"")}</span>`;
}
function midRows(){
  return D().rows.map((row,ri)=>`<div class="slot"><div><div class="l">E</div><div class="dots">
      <span class="dot idea"></span><span class="dot verb"></span><span class="dot ev"></span><span class="dot eff"></span></div></div>
    <div class="line" data-r="${ri}">${lineHtml(row,ri)}</div></div>`).join("");
}
function drawFrame(){
  $("buildH").textContent="Paragraph A, built with the class — "+T().name;
  let oi=0;
  $("frame").innerHTML=OUTER[S.mode].map(part=>part==="MID"?midRows():outerBox(part,oi++)).join("");
}
/* typing anywhere in the frame: one delegated listener, so a redrawn line
   needs no re-wiring */
$("frame").addEventListener("input",e=>{
  const t=e.target;
  if(t.classList.contains("box")) D().outer[+t.dataset.o]=t.innerHTML;
  else if(t.classList.contains("join")) D().rows[+t.dataset.r].joins[+t.dataset.j]=t.textContent;
  else if(t.classList.contains("ct")){ const ch=t.closest(".chip"); D().rows[+ch.dataset.r].chips[+ch.dataset.i].t=t.textContent; }
  else return;
  save(); syncSkelA();
});
/* drag a chip by its handle: the line re-sorts live under the pointer.
   The joiners are the slots between positions and stay where they are. */
let drag=null;
$("frame").addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grab"); if(!g) return;
  e.preventDefault();
  const chip=g.closest(".chip"), line=chip.parentElement;
  drag={line, r:+chip.dataset.r, i:+chip.dataset.i, id:e.pointerId};
  line.setPointerCapture(e.pointerId);
  chip.classList.add("dragging");
});
$("frame").addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const line=drag.line;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const over=el&&el.closest?el.closest(".chip"):null;
  if(!over||over.parentElement!==line) return;
  const to=+over.dataset.i; if(to===drag.i) return;
  const b=over.getBoundingClientRect();
  const before=e.clientX<b.left+b.width/2;
  const target=before?(drag.i<to?to-1:to):(drag.i<to?to:to+1);
  if(target===drag.i) return;
  const row=D().rows[drag.r]; const [c]=row.chips.splice(drag.i,1); row.chips.splice(target,0,c);
  drag.i=target;
  line.innerHTML=lineHtml(row,drag.r);
  line.querySelector(`.chip[data-i="${target}"]`).classList.add("dragging");
});
const endDrag=e=>{
  if(!drag||e.pointerId!==drag.id) return;
  drag.line.querySelectorAll(".chip.dragging").forEach(c=>c.classList.remove("dragging"));
  drag=null; save(); syncSkelA();
};
$("frame").addEventListener("pointerup",endDrag);
$("frame").addEventListener("pointercancel",endDrag);
function drawBranch(){
  const t=T();
  $("branch").innerHTML=
    `<div style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--idea-tx);background:var(--idea-bg);border-radius:10px;padding:10px 16px;display:inline-block">${t.name}</div>`+
    `<div class="arrow">↓</div>`+
    t.quotes.map(q=>`<div class="qcard"><div class="q">“${q.q}”<small>${q.ch}</small></div><div class="e">${q.e}</div></div>`).join("");
}
function drawAll(){ drawThemes(); drawModes(); drawSkel(); drawFrame(); drawBranch(); }

/* ---------------- buttons ---------------- */
$("prepared").addEventListener("click",()=>{
  const d=blank(); const t=T(), W=WAYS[S.way];
  /* outer: T, (A), L from the prepared paragraph */
  const outerParts=OUTER[S.mode].filter(p=>p!=="MID");
  const texts=S.mode==="TEEAL"?[t.para[0],t.para[t.para.length-1],t.link]:[t.para[0],t.para[t.para.length-1]];
  outerParts.forEach((p,i)=>d.outer[i]=texts[i]);
  d.rows=t.quotes.map(q=>({chips:W.order.map(k=>({k,t:CHIPTEXT(q,k,S.way)})),joins:W.joins(q)}));
  S.drafts[dkey()]=d; save(); drawFrame();
  /* reveal a line at a time */
  [...$("frame").querySelectorAll(".slot")].forEach((el,i)=>{ el.style.opacity=0; setTimeout(()=>{ el.style.transition="opacity .35s"; el.style.opacity=1; },420*i); });
  syncSkelA();
});
$("clear").addEventListener("click",()=>{ S.drafts[dkey()]=blank(); save(); drawFrame(); syncSkelA(); });

/* ---------------- colour the selection (outer boxes) ---------------- */
[...$("palette").querySelectorAll("button")].forEach(b=>{
  b.addEventListener("mousedown",e=>e.preventDefault());
  b.addEventListener("click",()=>colour(b.dataset.c));
});
function colour(cls){
  const sel=getSelection(); if(!sel.rangeCount) return;
  const r=sel.getRangeAt(0); if(r.collapsed) return;
  const node=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;
  const box=node.closest(".box"); if(!box) return;
  const txt=r.toString(); r.deleteContents();
  if(cls==="plain"){ r.insertNode(document.createTextNode(txt)); }
  else { const em=document.createElement("em"); em.className="hl-"+cls; em.textContent=txt; r.insertNode(em); }
  box.querySelectorAll("em em").forEach(inner=>{ const outer=inner.parentElement; outer.replaceWith(...outer.childNodes); });
  box.normalize();
  D().outer[+box.dataset.o]=box.innerHTML; save(); syncSkelA(); sel.removeAllRanges();
}

/* ---------------- display ---------------- */
const VKEY="bonesparrow.view.v1";
let V={view:"full",spot:"ev"};
try{ const j=JSON.parse(localStorage.getItem(VKEY)); if(j&&j.view) V=j; }catch(e){}
function applyView(){
  document.body.classList.remove("v-plain","v-spot","v-full");
  document.body.classList.add("v-"+V.view);
  document.body.dataset.spot=V.spot;
  [...$("view").querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.v===V.view));
  [...$("spot").querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.s===V.spot));
  try{ localStorage.setItem(VKEY,JSON.stringify(V)); }catch(e){}
}
[...$("view").querySelectorAll("button")].forEach(b=>b.addEventListener("click",()=>{V.view=b.dataset.v;applyView();}));
[...$("spot").querySelectorAll("button")].forEach(b=>b.addEventListener("click",()=>{V.spot=b.dataset.s;applyView();}));
/* ---------------- slides ---------------- */
const SLIDES=[...document.querySelectorAll(".slide")];
const NAMES=["Paragraph A","The essay","Where A comes from","Built with the class","A in the essay"];
let cur=Math.min(SLIDES.length-1,Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));
$("dots").innerHTML=SLIDES.map((_,i)=>`<span data-i="${i}"></span>`).join("");
function go(i){
  cur=Math.min(SLIDES.length-1,Math.max(0,i));
  SLIDES.forEach((el,j)=>el.classList.toggle("on",j===cur));
  [...$("dots").children].forEach((d,j)=>d.classList.toggle("on",j===cur));
  $("prev").disabled=cur===0; $("next").disabled=cur===SLIDES.length-1;
  $("now").textContent=(cur+1)+" / "+SLIDES.length+"  ·  "+NAMES[cur];
  history.replaceState(null,"","#"+(cur+1));
  scrollTo(0,0);
}
$("prev").addEventListener("click",()=>go(cur-1));
$("next").addEventListener("click",()=>go(cur+1));
[...$("dots").children].forEach(d=>d.addEventListener("click",()=>go(+d.dataset.i)));
addEventListener("keydown",e=>{
  if(e.target.isContentEditable) return;
  if(e.key==="1"){V.view="plain";applyView();}
  if(e.key==="2"){V.view="spot";applyView();}
  if(e.key==="3"){V.view="full";applyView();}
  if(e.target.tagName==="BUTTON"&&e.key===" ") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();go(cur+1);}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1);}
  if(e.key==="Home"){go(0);} if(e.key==="End"){go(SLIDES.length-1);}
});
applyView();
drawAll();
go(cur);
</script>
</body>
</html>
