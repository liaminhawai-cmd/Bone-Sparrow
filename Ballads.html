<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballads: Writing Folio</title>
<style>
:root{
  --bg:#f1efe8; --paper:#fbfaf6; --ink:#1f1f1f; --muted:#655f55;
  --line:#d4cfc2; --line-soft:#e6e1d6; --accent:#2c5f7c;
  --correct:#2f6a3e; --okbg:#eef5ee; --wrong:#a83232; --wrongbg:#fbeeee;
  --warn:#8a5a12; --warnbg:#fdf4e3;
  /* Rhyme pairs. Each badge also prints its letter, so colour is never the
     only signal. */
  --ra:#1f5fa8; --rabg:#e3ecf7; --rb:#6b3f7e; --rbbg:#efe5f3; --rc:#2f6a3e; --rcbg:#e5f1e7; --rd:#8a5a12; --rdbg:#fdf4e3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);
     display:flex;justify-content:center;padding:12px}
.container{width:100%;max-width:1180px;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;padding:18px 22px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:0 0 4px}
h2{font-family:Georgia,'Times New Roman',serif;font-size:20px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.55}
.topbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:13px}
.topbar .sp{margin-left:auto;display:flex;gap:14px}
.menulink{color:var(--accent);font-weight:600;text-decoration:none;padding:10px 0}
.menulink:hover{text-decoration:underline}

.btn{padding:10px 17px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
     cursor:pointer;background:var(--paper);color:var(--ink);font-family:inherit;transition:all .15s ease;
     text-decoration:none;display:inline-block;min-height:40px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#24506a}
.btn-ghost{background:var(--bg);color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fields{display:flex;flex-direction:column;gap:12px;max-width:420px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
      font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;line-height:1.45}
.err{color:var(--wrong);font-size:12.5px;min-height:17px;margin-top:3px}

.poemsw{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.step{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:#fff;
      border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:0 0 9px;
      font-family:inherit;font-size:15px;color:inherit;cursor:pointer;transition:border-color .15s}
.step:hover{border-color:var(--accent)}
.step .num{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
           display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.step.done .num{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
.step .t{font-weight:700}
.step .d{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.5}
.step .tag{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;
           letter-spacing:.4px;color:var(--muted);white-space:nowrap;padding-top:4px}

.deckbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
         border-radius:10px;padding:4px 14px;margin:0 0 12px;font-size:12.5px;color:var(--muted);min-height:50px}
.deckbar b{color:var(--ink)}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{min-width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:12px;
     font-weight:800;cursor:pointer;font-family:inherit;color:var(--muted);padding:0 8px}
.pip.on{border-color:var(--accent);color:var(--accent);background:#fff;box-shadow:inset 0 0 0 1px var(--accent)}
.pip.seen{color:var(--ink);background:#fff}
.pip.lock{border-style:dashed;background:transparent;color:#9a9385;cursor:not-allowed}

.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.cardbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
/* One view on a school laptop: each column scrolls inside itself rather than
   pushing the page past the bottom of the screen. */
.cols>.cardbox{max-height:calc(100vh - 128px);overflow:auto}
.lab{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:12px 0 4px}
.lab:first-child{margin-top:0}
.dim{color:#6f685c;font-size:12.5px;line-height:1.5}
.broken{background:var(--wrongbg);border:1px solid var(--wrong);border-radius:9px;padding:12px 15px;font-size:14px;line-height:1.6}

/* ---- read and analyse ---- */
.cols.ana{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pl{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 8px;align-items:baseline;padding:0 6px;border-radius:6px}
.pl .n{font-size:11px;color:var(--muted);text-align:right}
.pl .tx{font-family:Georgia,serif;font-size:17px;line-height:1.95}
.pl.ind .tx{padding-left:22px}
.pl .notes{grid-column:2;display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;margin:2px 0 8px;font-size:13px}
.pl .notes .split{flex-basis:100%;order:5}
.split{font-family:Georgia,serif;font-size:13.5px;color:#3d3a34}
.split .dot{color:#9a9385;margin:0 1px}
.split b.st{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.split b.op{font-weight:400;text-decoration:underline dotted;text-underline-offset:3px}
.brk{font-family:Georgia,serif;color:var(--muted);letter-spacing:10px;margin:0 0 4px 34px}
.cols.wide{grid-template-columns:minmax(0,2.5fr) minmax(0,1fr)}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.note{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 7px;white-space:nowrap;background:#fff}
.rk{font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap;border:1px solid}
.rk.A{color:var(--ra);background:var(--rabg);border-color:var(--ra)}
.rk.B{color:var(--rb);background:var(--rbbg);border-color:var(--rb)}
.rk.C{color:var(--rc);background:var(--rcbg);border-color:var(--rc)}
.rk.D{color:var(--rd);background:var(--rdbg);border-color:var(--rd)}
.vocab{display:inline;font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted var(--accent);
       padding:6px 1px 1px;margin:0;cursor:pointer;border-radius:3px 3px 0 0}
.vocab:hover{background:var(--bg)}
.vocab.on{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);border-bottom-style:solid}
.credit{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.glossbox{border-top:1px solid var(--line-soft);margin-top:10px;padding-top:10px}
.gw{font-family:Georgia,serif;font-size:20px;font-weight:700;margin:0 0 4px}
.gm{font-size:15px;line-height:1.5;margin:0}
.parts{display:flex;flex-direction:column;gap:6px;margin:10px 0 0}
.part{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px;line-height:1.45;background:var(--paper)}
.part b{font-size:15px}
.part i{color:var(--muted);font-size:12px;margin:0 4px}
.tr{font-size:18px;margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--paper)}
.glang{margin:10px 0 0;max-width:260px}
.model dt{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:10px 0 2px}
.model dt:first-child{margin-top:0}
.model dd{margin:0;font-size:15px;line-height:1.5}

.qi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--paper)}
.qi.clean{border-color:var(--correct)}
.qi.shown{border-color:var(--wrong)}
.qh{margin:0 0 8px;font-size:15px;line-height:1.45;font-weight:600}
.qt{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-right:6px;background:#fff;vertical-align:2px}
.ws{display:flex;flex-wrap:wrap;gap:5px}
.w{min-height:40px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:15px Georgia,serif;
   color:var(--ink);cursor:pointer}
.w[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.w.key{border-color:var(--correct);background:var(--okbg);font-weight:700}
.w.key::after{content:" \2713"}
.w.either{border-style:dashed;border-color:var(--correct)}
.w[disabled]{cursor:default}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{min-height:40px;text-align:left;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
     font-family:inherit;font-size:14.5px;color:var(--ink);cursor:pointer;line-height:1.35}
.opt.ln{font-family:Georgia,serif}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.key{border-color:var(--correct);background:var(--okbg)}
.opt.key::before{content:"\2713  ";font-weight:800;color:var(--correct)}
.opt[disabled]{cursor:default}
.lr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin:0 0 5px}
.lr .end{font-family:Georgia,serif;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{width:40px;height:40px;border:0;background:#fff;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button[disabled]{cursor:default}
.num{width:90px;font-size:17px;font-weight:700;text-align:center}
.clap{display:inline-flex;gap:6px;align-items:center;margin-left:8px;font-size:13px;color:var(--muted)}
.clap b{min-width:28px;text-align:center;color:var(--ink);font-size:16px}
.qrow{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-top:8px}
.fb{flex:1 1 220px;font-size:13.5px;line-height:1.5;padding:7px 10px;border-radius:8px;border:1px solid transparent;outline:none}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);border-color:var(--correct)}
.fb.ok .v{color:var(--correct)}
.fb.no{background:var(--wrongbg);border-color:var(--wrong)}
.fb.no .v{color:var(--wrong)}
.fb.mid{background:var(--warnbg);border-color:var(--warn)}
.fb.mid .v{color:var(--warn)}
.fb .v{display:block;font-weight:800}
.fb .split{font-size:13px}
.ownq textarea{min-height:64px}
.next{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:4px}

/* ---- word helper: the ELC word dialog, in the house palette ---- */
:root{ --prefix:#315f9d; --prefix-bg:#e2ebf8; --root:#8a4f12; --root-bg:#f5e6ce; --suffix:#6b467e; --suffix-bg:#ece2f1; }
dialog#wordDialog{border:0;padding:0;background:transparent;color:var(--ink);width:min(600px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog#wordDialog::backdrop{background:rgba(18,14,9,.55)}
.word-pop{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 26px)}
.pop-head{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-soft);background:var(--paper);border-radius:14px 14px 0 0}
.pop-head h2{font-size:24px;margin:0}
.close{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:50%;width:40px;height:40px;cursor:pointer;font-weight:900;font-size:18px;flex:0 0 auto}
.pop-body{padding:12px 16px 16px;overflow:auto}
.definition{font-size:15.5px;margin:0 0 8px;line-height:1.5}
.context{padding:8px 11px;background:#e9f0f4;border-left:4px solid var(--accent);border-radius:8px;margin:0 0 6px;font-size:14px;line-height:1.5}
.pop-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin:12px 0 5px}
.morphs{display:flex;gap:6px;flex-wrap:wrap}
.morph{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:5px;border-radius:10px;padding:5px 10px;font-weight:800;font-size:15px}
.morph small{font-weight:600;font-size:12.5px}
.morph small.ty{text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.morph.prefix{background:var(--prefix-bg);color:var(--prefix)} .morph.root{background:var(--root-bg);color:var(--root)} .morph.suffix{background:var(--suffix-bg);color:var(--suffix)}
.whole{color:var(--muted);font-size:13.5px;font-style:italic;margin:0}
.translation{font-weight:700;font-size:18px}
.related{display:flex;gap:6px;flex-wrap:wrap}
.related span{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 9px;font-size:13px}

.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin:0 0 2px}
.task{margin:0 0 10px;font-size:14px;line-height:1.5;color:var(--ink)}
.opt.end2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pairtag{font-family:'Segoe UI',Tahoma,sans-serif;font-size:11.5px;font-weight:800;border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:99px;padding:1px 8px;white-space:nowrap}
.pairtag.open{border-style:dashed}
.sw{display:flex;flex-wrap:wrap;gap:14px}
.sword{display:inline-flex}
.lt{min-width:40px;height:44px;padding:0 6px;border:1px solid var(--line);border-right-width:1px;background:#fff;font:19px Georgia,serif;color:var(--ink);cursor:pointer;margin:0;border-radius:0}
.lt+.lt{border-left:0}
.lt.fixed{display:inline-flex;align-items:center;cursor:default;background:var(--paper)}
.lt.cut{border-right:4px solid var(--accent);font-weight:700}
.sword .lt:first-child{border-radius:8px 0 0 8px}.sword .lt:last-child{border-radius:0 8px 8px 0}

/* ---- remix: Paterson beside the student's line ---- */
.offer{border:1px solid var(--accent);background:#eef4f7;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.offer ol{margin:6px 0 0;padding-left:22px;font-family:Georgia,serif;font-size:14.5px;line-height:1.45}
.kwhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.kwcols{display:grid;grid-template-columns:32px minmax(0,.85fr) minmax(0,1fr) 82px;gap:8px;margin:0 0 2px}
.kwcols .lab{margin:0}
.kw{display:grid;grid-template-columns:32px minmax(0,.85fr) minmax(0,1fr) auto;gap:3px 8px;align-items:start;margin:0 0 8px}
.kw .under{grid-column:2 / 5}
.pat{font:14px/1.4 Georgia,serif;color:#4b463e;padding-top:8px}
.ownset{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.ownset select{width:auto;min-height:40px}
.rl.D,.rl.E,.rl.F,.rl.G,.rl.H{color:var(--rd);background:var(--rdbg);border-color:var(--rd)}

/* ---- class mode: projector type that scales with the screen ---- */
body.proj{font-size:clamp(16px,1.42vw,30px);padding:.5em;background:var(--paper)}
body.proj .container{max-width:none;border:0;box-shadow:none;padding:.2em .8em;background:transparent}
body.proj .slide{display:flex;flex-direction:column;height:calc(100vh - 1.4em);gap:.45em}
body.proj .slidehead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
body.proj .slidehead h1{font-size:1.45em;margin:0}
body.proj .slidehead .tools{margin-left:auto;display:flex;gap:.4em;align-items:center}
body.proj .slidehead .btn{font-size:.62em;padding:.45em .9em}
body.proj .rows{flex:1 1 auto;overflow:auto;min-height:0}
body.proj .cl{display:grid;grid-template-columns:1.7em minmax(0,.9fr) minmax(0,1.25fr) auto;gap:.15em .55em;align-items:center;padding:.18em 0;border-bottom:1px solid var(--line-soft)}
body.proj .cl .pat{font:.78em/1.35 Georgia,serif;color:#4b463e;padding:0}
body.proj .cl .pat .vocab{padding:0 1px}
body.proj .cl .rt{font:1.08em/1.25 Georgia,serif;padding:.15em .4em;min-height:40px;border-color:var(--line)}
body.proj .cl .rl{width:1.55em;height:1.55em;font-size:.85em;margin:0}
body.proj .clm{display:flex;align-items:center;gap:.3em}
body.proj .clm .met{font-size:.62em;white-space:nowrap}
body.proj .foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.3fr);gap:.45em;align-items:stretch}
body.proj .rc{font-size:.62em;margin:0;padding:.35em .6em}
body.proj .rc .v{font-size:1.15em}
body.proj .bankbox{border:1px solid var(--line);border-radius:9px;padding:.3em .5em;background:#fff;display:flex;flex-direction:column;gap:.3em}
body.proj .bankbox .bankf{margin:0;font-size:.62em}
body.proj .bankbox .chips{gap:.3em}
body.proj .bankbox .chip{font-size:.62em;min-height:40px}
body.proj .bankbox .dim{font-size:.55em;margin:0}
body.proj #linkOut{font-size:.5em}
body.proj .copied{font-size:.55em}
body.proj dialog#wordDialog{zoom:1.4;max-height:calc((100vh - 24px)/1.4)}
body.proj .word-pop{max-height:calc((100vh - 26px)/1.4)}
@media (min-width:1600px){ body.proj dialog#wordDialog{zoom:1.9;max-height:calc((100vh - 24px)/1.9)} body.proj .word-pop{max-height:calc((100vh - 26px)/1.9)} }

/* ---- rewrite ---- */
.rw{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:3px 8px;align-items:start;margin:0 0 9px}
.rl{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-top:5px;border:1px solid}
.rl.A{color:var(--ra);background:var(--rabg);border-color:var(--ra)}
.rl.B{color:var(--rb);background:var(--rbbg);border-color:var(--rb)}
.rl.C{color:var(--rc);background:var(--rcbg);border-color:var(--rc)}
.rt{font:16px/1.4 Georgia,serif;padding:7px 10px;min-height:40px}
.under{grid-column:2 / 4;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.job{flex:1 1 200px;font-size:12.5px;color:var(--muted)}
.met{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);background:#fff}
.met.good{color:var(--correct);background:var(--okbg);border-color:var(--correct)}
.met.warn{color:var(--warn);background:var(--warnbg);border-color:var(--warn)}
.met.bad{color:var(--wrong);background:var(--wrongbg);border-color:var(--wrong)}
.fix{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fix button{width:40px;height:40px;border:0;background:#fff;font-family:inherit;font-weight:800;font-size:16px;line-height:1;cursor:pointer;color:var(--ink)}
.fix button+button{border-left:1px solid var(--line)}
.rc{border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin:8px 0 0;font-size:13.5px;line-height:1.5}
.rc .v{display:block;font-weight:800}
.rc.ok{background:var(--okbg);border-color:var(--correct)} .rc.ok .v{color:var(--correct)}
.rc.unsure{background:var(--warnbg);border-color:var(--warn)} .rc.unsure .v{color:var(--warn)}
.rc.bad{background:var(--wrongbg);border-color:var(--wrong)} .rc.bad .v{color:var(--wrong)}
.bankf{display:flex;gap:8px;margin:0 0 8px}
.bankf input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;padding:0 0 0 11px;font-weight:700;font-size:14px;background:var(--paper);min-height:40px}
.chip.fixed{padding-right:11px}
.chip button{width:40px;height:38px;border:0;background:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:15px;line-height:1;color:var(--muted);border-radius:99px}
.mine{font-family:Georgia,serif;font-size:15.5px;line-height:1.7;margin:0;padding:0;list-style:none}
.mine li{display:flex;gap:8px;align-items:baseline}
.mine .rk{flex:0 0 auto}

table.rpt{width:100%;border-collapse:collapse;font-size:13px;background:#fff}

  "whiskers":{"w":"whiskers","m":"Hair growing on a man’s cheeks or around the mouth; facial hair.","c":"He asks the barber to remove both his beard and whiskers.","o":"whisker + -s (plural).","rel":["whisker","whiskers","whiskered"],"parts":[["whisker","root","a hair or group of facial hairs"],["s","suffix","more than one"]],"tr":{"zh":"胡须；络腮胡","yue":"鬍鬚；絡腮鬍","vi":"râu quai nón; ria","fa":"سبیل و موی صورت"}},
  "man-of-mark":{"w":"man of mark","m":"A man who is noticeable, important or respected.","c":"He thinks a city haircut will make people at home see him as impressive.","o":"An old fixed expression. Mark here means distinction or reputation, not a written score.","rel":["of note","distinguished","notable"],"parts":[],"tr":{"zh":"有名望的人","yue":"有名望的人","vi":"người đàn ông có danh tiếng","fa":"مردی نامدار و مهم"}},
  "toff":{"w":"toff","m":"An old mocking word for a fashionable upper-class person.","c":"He plans to copy the appearance and manners of a stylish Sydney gentleman.","o":"Nineteenth-century British slang; it is best learned as a whole word.","rel":["toff","toffish"],"parts":[],"tr":{"zh":"衣着讲究的上流人士（旧俚语）","yue":"衣著講究的上流人士（舊俚語）","vi":"người thượng lưu ăn diện (tiếng lóng cũ)","fa":"آدم اشرافی و شیک‌پوش (عامیانهٔ قدیمی)"}},
  "flash":{"w":"flash","m":"Showy, stylish and trying to attract attention.","c":"The barber’s appearance is impressive but also a little boastful.","o":"Old slang use of flash. It is not the burst of light meaning.","rel":["flashy","flashily","showy"],"parts":[],"tr":{"zh":"花哨而招摇的","yue":"花哨而招搖的","vi":"hào nhoáng; thích phô trương","fa":"پرزرق‌وبرق و خودنما"}},
  "strike-your-fancy":{"w":"strike your fancy","m":"Catch your attention or strongly appeal to you.","c":"A strike-your-fancy sash is so bright or unusual that people notice it.","o":"A fixed idiom. Fancy here means liking or imagination.","rel":["catch your eye","appeal to","fancy"],"parts":[],"tr":{"zh":"吸引你的注意；合你的意","yue":"吸引你的注意；合你的意","vi":"thu hút sự chú ý; hợp ý","fa":"توجه یا پسند کسی را جلب کردن"}},
  "humorist":{"w":"humorist","m":"A person skilled at making people laugh, especially through stories or writing.","c":"The narrator presents the barber as someone known for jokes.","o":"humor + -ist (a person who practises or specialises in something).","rel":["humour","humorous","humorist"],"parts":[["humor","root","what is funny; comedy"],["ist","suffix","a person who practises or specialises"]],"tr":{"zh":"幽默家；爱讲笑话的人","yue":"幽默家；愛講笑話的人","vi":"nhà hài hước; người giỏi pha trò","fa":"طنزپرداز؛ شوخ‌طبع"}},
  "of-note":{"w":"of note","m":"Important, well known or worth noticing.","c":"A humorist of note is a person with a reputation for humour.","o":"A fixed expression. It has a similar meaning to notable.","rel":["notable","noteworthy","man of mark"],"parts":[],"tr":{"zh":"著名的；重要的","yue":"著名的；重要的","vi":"nổi tiếng; đáng chú ý","fa":"مشهور یا قابل‌توجه"}},
  "keen":{"w":"keen","m":"Quick, sharp or highly skilled.","c":"Keen at repartee means very good at giving clever replies.","o":"An old sense related to sharpness; compare a keen blade and a keen mind.","rel":["keen","keenly","keenness"],"parts":[],"tr":{"zh":"敏锐的；擅长的","yue":"敏銳的；擅長的","vi":"sắc sảo; rất giỏi","fa":"تیز و ماهر"}},
  "repartee":{"w":"repartee","m":"A quick exchange of clever, witty replies.","c":"The barber enjoys fast verbal jokes as well as practical jokes.","o":"Borrowed from French répartie, meaning a quick reply. It has no useful modern English morpheme split.","rel":["banter","witty reply","retort"],"parts":[],"tr":{"zh":"机智的对答","yue":"機智的對答","vi":"đối đáp dí dỏm","fa":"جواب‌های سریع و شوخ‌طبعانه"}},
  "laid-odds":{"w":"laid the odds","m":"Set or offered the betting odds.","c":"This detail links the barber to gambling and horse-racing culture.","o":"A betting expression; learn the phrase as a whole.","rel":["odds","bet","wager"],"parts":[],"tr":{"zh":"开出赔率","yue":"開出賠率","vi":"đưa ra tỷ lệ cá cược","fa":"ضریب شرط‌بندی تعیین کرد"}},
  "tote":{"w":"tote","m":"A totalisator: a system that pools bets and calculates the payout.","c":"The narrator jokes ‘whatever that may be’, signalling an old specialist word.","cs":{"8":"The visitor repeats the city word in his own story, but he still treats the tote as part of the barbers’ strange world."},"o":"Short for totalisator, a machine or system for pool betting.","rel":["totalisator","betting pool","odds"],"parts":[],"tr":{"zh":"赛马总彩池系统（旧称）","yue":"賽馬總彩池系統（舊稱）","vi":"hệ thống cá cược chung (totalisator)","fa":"سامانهٔ شرط‌بندی تجمیعی"}},
  "lark":{"w":"lark","m":"A prank, joke or playful adventure.","c":"The barber calls his planned trick a lark, although it will not feel harmless to the visitor.","cs":{"7":"The visitor repeats the word lark sarcastically: he clearly does not accept that the frightening trick was harmless fun."},"o":"Old slang. This is different from lark, the bird.","rel":["prank","mischief","practical joke"],"parts":[],"tr":{"zh":"恶作剧；玩笑","yue":"惡作劇；玩笑","vi":"trò đùa nghịch; trò tinh quái","fa":"شوخی یا شیطنت"}},
  "gilded":{"w":"gilded","m":"Covered with a thin layer of gold; figuratively, rich-looking or showy.","c":"Gilded youths suggests fashionable young men whose bright surface may hide little substance.","cs":{"6":"The nearest gilded youth is one of the fashionable onlookers who encouraged the joke; now he is pulled into the fight."},"o":"gild + -ed.","rel":["gild","gilded","gilding"],"parts":[["gild","root","cover with a thin layer of gold"],["ed","suffix","having been; described as"]],"tr":{"zh":"镀金的；表面华丽的","yue":"鍍金的；表面華麗的","vi":"mạ vàng; hào nhoáng bề ngoài","fa":"زراندود؛ ظاهراً پرزرق‌وبرق"}},
  "dull":{"w":"dull","m":"Not sharp or lively; here, slow to think.","c":"The insult describes the watching youths as mentally empty, not merely bored.","o":"An old English word with several connected meanings: blunt, dim, boring and slow.","rel":["dull","dully","dullness"],"parts":[],"tr":{"zh":"迟钝的；乏味的","yue":"遲鈍的；乏味的","vi":"đần độn; buồn tẻ","fa":"کندذهن؛ کسل‌کننده"}},
  "passed-wink":{"w":"passed the wink","m":"Gave a secret signal by winking.","c":"The barber silently tells the young men that a joke is about to begin.","o":"An old fixed expression; modern English more often says gave them a wink.","rel":["wink","signal","give the nod"],"parts":[],"tr":{"zh":"使眼色；暗中示意","yue":"使眼色；暗中示意","vi":"nháy mắt ra hiệu","fa":"با چشمک علامت مخفی داد"}},
  "dexter":{"w":"dexter","m":"On the right-hand side.","c":"His dexter eyelid is his right eyelid. It closes to make the secret wink.","o":"A Latin word meaning right or right hand. Compare dexterity: skill with the hands.","rel":["dexterity","dexterous","ambidextrous"],"parts":[],"tr":{"zh":"右边的；右手侧的","yue":"右邊的；右手側的","vi":"bên phải; thuộc tay phải","fa":"سمت راست؛ راست‌دست"}},
  "eyelid":{"w":"eyelid","m":"The fold of skin that opens and closes over the eye.","c":"The barber shuts one eyelid to wink at the others.","o":"A transparent compound: eye + lid.","rel":["eye","eyelid","eyelids"],"parts":[["eye","root","the organ used for seeing"],["lid","root","a cover"]],"tr":{"zh":"眼皮","yue":"眼皮","vi":"mí mắt","fa":"پلک چشم"}},
  "bloomin":{"w":"bloomin’","m":"An old mild intensifier meaning very or ‘that annoying …’.","c":"The apostrophe shows casual speech. It strengthens the insult without adding literal flower meaning.","o":"Old colloquial speech; do not split it as bloom + -ing for this meaning.","rel":["blimming","blasted","very"],"parts":[],"tr":{"zh":"真是的；非常（旧式加强语）","yue":"真是的；非常（舊式加強語）","vi":"thật là; cực kỳ (từ nhấn mạnh kiểu cũ)","fa":"لعنتی؛ خیلی (تأکید قدیمی)"}},
  "yokel":{"w":"yokel","m":"An insulting old word for a supposedly unsophisticated country person.","c":"The barber looks down on the visitor because he comes from the bush.","o":"Old slang; learn it as a whole word. It is disrespectful when used about a person.","rel":["country bumpkin","rustic","outsider"],"parts":[],"tr":{"zh":"乡巴佬（侮辱语）","yue":"鄉巴佬（侮辱語）","vi":"đồ nhà quê (mang tính xúc phạm)","fa":"دهاتی ساده‌لوح (توهین‌آمیز)"}},
  "green":{"w":"green","m":"Inexperienced or easily fooled; literally, also the colour green.","c":"The barber makes a pun: the country flats may be green with plants, and country people may be ‘green’ or naïve.","o":"A figurative extension from unripe green fruit to an inexperienced person.","rel":["greenhorn","inexperienced","naïve"],"parts":[],"tr":{"zh":"幼稚无经验的；绿色的","yue":"幼稚無經驗的；綠色的","vi":"non nớt; màu xanh","fa":"بی‌تجربه؛ سبز"}},
  "grunt":{"w":"grunt","m":"A short, low sound made instead of speaking.","c":"The bushman does not answer the barber’s insult with words.","o":"An imitative sound-word: its sound resembles the noise it names.","rel":["grunt","grunted","grunting"],"parts":[],"tr":{"zh":"咕哝声；哼声","yue":"咕噥聲；哼聲","vi":"tiếng càu nhàu; tiếng hừ","fa":"صدای خرخر یا نالهٔ کوتاه"}},
  "bushman":{"w":"bushman","m":"A man who lives or works in the Australian bush or inland country.","c":"The narrator contrasts the country visitor with the city barber.","o":"A transparent compound: bush + man.","rel":["bush","bushman","bushmen"],"parts":[["bush","root","rural Australian country"],["man","root","an adult male person"]],"tr":{"zh":"澳大利亚内陆乡下人","yue":"澳洲內陸鄉下人","vi":"người đàn ông vùng bụi rậm/nội địa Úc","fa":"مردِ نواحی بوته‌زار و روستایی استرالیا"}},
  "boiling":{"w":"boiling hot","m":"Extremely hot; hot enough to boil.","c":"The barber heats the water so the blunt back of the razor will leave a painful mark.","o":"boil + -ing; hot completes the phrase.","rel":["boil","boiled","boiling"],"parts":[["boil","root","heat a liquid until it bubbles"],["ing","suffix","ongoing action or resulting quality"],["hot","root","having a high temperature"]],"tr":{"zh":"滚烫的","yue":"滾燙的","vi":"nóng sôi; cực nóng","fa":"جوشان و بسیار داغ"}},
  "black-brow":{"w":"his brow grew black","m":"His face became dark and threatening.","c":"The phrase is figurative: the barber performs anger to make the fake attack convincing.","o":"An old descriptive idiom. Brow means the forehead and the area around the eyebrows.","rel":["scowl","dark expression","threatening"],"parts":[],"tr":{"zh":"他脸色阴沉下来","yue":"他臉色陰沉下來","vi":"sắc mặt ông ta trở nên dữ tợn","fa":"چهره‌اش تیره و تهدیدآمیز شد"}},
  "gloat":{"w":"gloat","m":"Show pleasure at another person’s trouble or at your own expected success.","c":"The barber pauses to enjoy the fear he expects to create.","o":"A single modern root; learn it as a whole word.","rel":["gloat","gloated","gloating"],"parts":[],"tr":{"zh":"幸灾乐祸地得意","yue":"幸災樂禍地得意","vi":"hả hê trước khó khăn của người khác","fa":"از گرفتاری دیگری با بدجنسی لذت بردن"}},
  "razor-back":{"w":"razor-back","m":"The blunt back edge of a razor, not its sharp cutting edge.","c":"The barber uses the heated back to make a mark without actually cutting the throat.","o":"A compound: razor + back.","rel":["razor","razor blade","back edge"],"parts":[["razor","root","a sharp tool used for shaving"],["back","root","the rear or blunt side"]],"tr":{"zh":"剃刀的刀背","yue":"剃刀的刀背","vi":"sống dao cạo (phần không sắc)","fa":"پشتِ کُندِ تیغ"}},
  "victim":{"w":"victim","m":"A person harmed, attacked or deceived by someone or something.","c":"The narrator briefly adopts the language of a real attack while describing the barber’s target.","o":"Borrowed through Latin and French; it has no useful modern English split.","rel":["victim","victimise","victimisation"],"parts":[],"tr":{"zh":"受害者","yue":"受害者","vi":"nạn nhân","fa":"قربانی"}},
  "livid":{"w":"livid","m":"Bluish-grey or dark purple, like a bruise.","c":"Here livid describes the colour of the mark on the newly shaved skin. It does not mean extremely angry in this line.","o":"The colour meaning is older; the angry meaning developed later from the idea of a face changing colour.","rel":["livid mark","bruise","livid with anger"],"parts":[],"tr":{"zh":"青紫色的（像淤青）","yue":"青紫色的（像淤青）","vi":"tím tái; thâm như vết bầm","fa":"کبود و مایل به بنفش"}},
  "took-in":{"w":"took him in","m":"Deceived or fooled him.","c":"The bushman believes the razor has really cut his throat.","o":"A phrasal verb. Took is the past of take, but the whole phrase has a special meaning.","rel":["take in","taken in","deceive"],"parts":[],"tr":{"zh":"骗过了他","yue":"騙過了他","vi":"đã lừa được ông ta","fa":"او را فریب داد"}},
  "fetched-yell":{"w":"fetched a wild yell","m":"Let out or produced a loud, wild yell.","c":"Fetched does not mean went and brought here; it introduces the sound he suddenly makes.","o":"An older use of fetch meaning give, produce or draw out.","rel":["let out a yell","gave a cry","shouted"],"parts":[],"tr":{"zh":"发出一声狂野的叫喊","yue":"發出一聲狂野的叫喊","vi":"thét lên một tiếng dữ dội","fa":"فریادی وحشیانه سر داد"}},
  "up-country":{"w":"up-country","m":"From a rural or inland area, away from the main city.","c":"The description marks the yell, and the man, as coming from the bush.","o":"A compound expression: up + country. Here up is a free word in the compound, not a bound prefix.","rel":["up-country","inland","the bush"],"parts":[["up","root","away from the main city; inland"],["country","root","rural land or region"]],"tr":{"zh":"内陆乡下的","yue":"內陸鄉下的","vi":"thuộc vùng quê/nội địa","fa":"مربوط به نواحی دورافتاده و روستایی"}},
  "full-well":{"w":"full well","m":"Very well; with complete certainty.","c":"He is completely sure, although wrongly, that his throat has been cut.","o":"An old fixed intensifying expression.","rel":["perfectly well","fully aware","certain"],"parts":[],"tr":{"zh":"非常清楚；完全知道","yue":"非常清楚；完全知道","vi":"rất rõ; hoàn toàn chắc chắn","fa":"کاملاً و به‌خوبی"}},
  "gamely":{"w":"gamely","m":"Bravely and with determination, especially while hurt or losing.","c":"He stands up to face the barber even though he thinks he is dying.","o":"game (brave and spirited) + -ly (in that manner).","rel":["game","gamely","game effort"],"parts":[["game","root","brave; willing to keep trying"],["ly","suffix","in this manner"]],"tr":{"zh":"勇敢顽强地","yue":"勇敢頑強地","vi":"gan dạ và kiên cường","fa":"شجاعانه و با سماجت"}},
  "murderous":{"w":"murd’rous (murderous)","m":"Intending or seeming ready to kill.","c":"The apostrophe compresses murderous to keep the beat of the line.","o":"murder + -ous (having the quality of).","rel":["murder","murderer","murderous","murderously"],"parts":[["murder","root","unlawfully kill a person"],["ous","suffix","full of; having the quality of"]],"tr":{"zh":"杀气腾腾的；凶残的","yue":"殺氣騰騰的；兇殘的","vi":"có ý giết người; đầy sát khí","fa":"آدم‌کشانه؛ مرگبار"}},
  "done-for":{"w":"done for me","m":"Killed or ruined me; made it impossible for me to survive.","c":"He believes the barber’s trick has fatally wounded him.","o":"An informal idiom: be done for means be defeated, ruined or near death.","rel":["done for","finished","ruined"],"parts":[],"tr":{"zh":"把我害死了；我完了","yue":"把我害死了；我完了","vi":"mày làm tao chết rồi; tao tiêu rồi","fa":"کارم را ساختی؛ مرا کشتی"}},
  "blessed":{"w":"blessed","m":"A mild old intensifier used to strengthen annoyance.","c":"He does not literally mean holy or fortunate; the word intensifies his insult.","o":"bless + -ed, but the phrase uses a special colloquial meaning.","rel":["bless","blessed","blessing"],"parts":[["bless","root","declare holy; wish good for"],["ed","suffix","described as"]],"tr":{"zh":"该死的；真是的（委婉加强语）","yue":"該死的；真是的（委婉加強語）","vi":"đáng ghét; thật là (từ nhấn mạnh kiểu cũ)","fa":"لعنتی (تأکید ملایم قدیمی)"}},
  "shark":{"w":"shark","m":"A ruthless or dishonest person.","c":"He compares the barber to a dangerous predator; he does not mean the sea animal literally.","o":"A metaphorical extension from the predatory fish.","rel":["loan shark","card shark","predator"],"parts":[],"tr":{"zh":"狠毒的人；恶棍","yue":"狠毒的人；惡棍","vi":"kẻ tàn nhẫn; đồ đểu","fa":"آدم بی‌رحم و درنده‌خو"}},
  "hairy-paw":{"w":"hairy paw","m":"A comic, animal-like description of the bushman’s large hairy hand.","c":"The narrator exaggerates his rough physical power before the punch.","o":"A descriptive compound phrase: hairy + paw.","rel":["hair","hairy","paw"],"parts":[["hair","root","strands growing from skin"],["y","suffix","full of; having"],["paw","root","an animal’s foot; here, a rough hand"]],"tr":{"zh":"毛茸茸的大手（像爪子）","yue":"毛茸茸的大手（像爪子）","vi":"bàn tay đầy lông như một cái vuốt","fa":"دست پشمالو و پنجه‌مانند"}},
  "tremendous":{"w":"tremendous","m":"Extremely large, powerful or great.","c":"The adjective enlarges the force of the single punch.","o":"tremend + -ous; historically linked to a Latin word for trembling.","rel":["tremendous","tremendously"],"parts":[["tremend","root","cause awe or trembling; very great"],["ous","suffix","full of; having the quality of"]],"tr":{"zh":"巨大的；威力惊人的","yue":"巨大的；威力驚人的","vi":"cực lớn; mạnh khủng khiếp","fa":"بسیار بزرگ و نیرومند"}},
  "clout":{"w":"clout","m":"A hard hit with the hand or fist.","c":"One clout knocks the barber unconscious.","o":"An old informal word; learn it as a whole root.","rel":["clout","hit","blow"],"parts":[],"tr":{"zh":"重重一击","yue":"重重一擊","vi":"một cú đánh mạnh","fa":"ضربهٔ محکم"}},
  "set-to-work":{"w":"set to work","m":"Began doing something energetically and seriously.","c":"He immediately starts wrecking the shop and attacking the onlookers.","o":"A fixed verb phrase; learn it as a whole.","rel":["get to work","set about","begin"],"parts":[],"tr":{"zh":"立即动手；卖力干起来","yue":"立即動手；賣力幹起來","vi":"bắt tay vào làm một cách quyết liệt","fa":"با جدیت شروع به کار کرد"}},
  "tooth-and-nail":{"w":"tooth and nail","m":"With every possible effort; fiercely.","c":"The idiom makes the fight sound animal-like and uncontrolled.","o":"An old idiom imagining fighting with both teeth and fingernails.","rel":["fight tooth and nail","fiercely","with all one’s strength"],"parts":[],"tr":{"zh":"拼命地；使尽全力地","yue":"拼命地；使盡全力地","vi":"quyết liệt; bằng mọi sức lực","fa":"با تمام توان و به‌شدت"}},
  "wreck":{"w":"wreck","m":"A badly damaged or destroyed place or thing.","c":"The shop becomes a wreck after the fight.","o":"A single root that can be a noun or a verb.","rel":["wreck","wrecked","wreckage"],"parts":[],"tr":{"zh":"被严重破坏的地方；废墟","yue":"被嚴重破壞的地方；廢墟","vi":"đống đổ nát; nơi bị phá tan","fa":"ویرانه؛ چیز به‌شدت خراب"}},
  "vital-spark":{"w":"vital spark","m":"The life force that keeps a person alive.","c":"He holds his throat because he thinks he must stop his life from escaping.","o":"A figurative phrase: vital means connected with life; spark suggests a tiny flame of life.","rel":["vital","vitality","life force"],"parts":[],"tr":{"zh":"生命之火；生命力","yue":"生命之火；生命力","vi":"tia lửa sự sống; sinh lực","fa":"جرقهٔ حیات؛ نیروی زندگی"}},
  "peeler":{"w":"peeler","m":"An old slang word for a police officer.","c":"The peeler hears the noise and enters to arrest the bushman.","o":"Named after Sir Robert Peel, associated with the creation of modern British policing: Peel + -er.","rel":["peeler","bobby","police officer"],"parts":[["Peel","root","the surname of Robert Peel"],["er","suffix","a person connected with"]],"tr":{"zh":"警察（旧俚语）","yue":"警察（舊俚語）","vi":"cảnh sát (tiếng lóng cũ)","fa":"پلیس (اصطلاح قدیمی)"}},
  "din":{"w":"din","m":"A loud, unpleasant and continuing noise.","c":"The shouting, smashing and fighting make enough noise to attract a police officer.","o":"An old single-root word; learn it as a whole.","rel":["din","racket","uproar"],"parts":[],"tr":{"zh":"喧闹声；嘈杂声","yue":"喧鬧聲；嘈雜聲","vi":"tiếng ồn inh tai","fa":"سروصدای بلند و آزاردهنده"}},

  return esc(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,(m,k,w)=>
    `<button type="button" class="vocab" data-k="${k}" onclick="openWord('${k}',${st})">${w}</button>`);
}
function normalWord(w){ return String(w||"").toLowerCase().replace(/[^a-z]/g,""); }
function words(line){ return String(line||"").match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g)||[]; }
function endWord(line){ const w=words(line); return w.length?w[w.length-1]:""; }
function wordCount(t){ return words(t).length; }

/* ---- syllable and stress tags (see the content notes) ---- */
function parseTok(raw){
  let tok=String(raw), opt=false, alt=null;
  if(tok[0]==="?"){ opt=true; tok=tok.slice(1); }
  const m=tok.match(/\|(\d+)$/); if(m){ alt=+m[1]; tok=tok.slice(0,m.index); }
  const syls=tok.split(".");
  const stress=syls.map(s=>/[A-Za-z]/.test(s) && s===s.toUpperCase());
  return { syls, n:syls.length, alt, opt, stress, strong:stress.some(Boolean), letters:normalWord(syls.join("")) };
}
function info(poem, s, k){
  const l=poem.stanzas[s].lines[k]; if(!l || !l.syl) return null;
  const ws=words(strip(l.t)), tg=l.syl.trim().split(/\s+/).map(parseTok);
  let pos=0, extra=0, hasAlt=false;
  const toks=ws.map((w,j)=>{ const t=tg[j]||parseTok("?"); const o=Object.assign({ w, start:pos+1 }, t);
    pos+=t.n; if(t.alt!=null){ extra+=t.alt-t.n; hasAlt=true; } return o; });
  return { toks, tags:tg, total:pos, alt:hasAlt?pos+extra:null };
}
/* Split a printed word at the syllable boundaries of its tag. */
function splitWord(t, mode){
  const lens=t.syls.map(x=>x.replace(/[^A-Za-z]/g,"").length);
  const out=[]; let cur="", si=0, cnt=0;
  for(const ch of t.w){
    if(/[A-Za-z]/.test(ch)){ if(cnt===lens[si] && si<lens.length-1){ out.push(cur); cur=""; si++; cnt=0; } cnt++; }
    cur+=ch;
  }
  out.push(cur);
  return out.map((p,j)=>{
    if(mode==="stress" && t.stress[j]) return `<b class="${t.opt?"op":"st"}">${esc(p.toUpperCase())}</b>`;
    return esc(p);
  }).join('<span class="dot">·</span>');
}
function splitLine(I, mode, hi){
  return `<span class="split">${I.toks.map((t,j)=>j===hi?`<b class="st">${splitWord(t,"")}</b>`:splitWord(t,mode)).join(" ")}</span>`;
}

/* ====================== RHYME ============================================ */
const FAMILY={};
Object.keys(BALLAD.rhymeFamilies).forEach(f=>BALLAD.rhymeFamilies[f].forEach(w=>{ FAMILY[normalWord(w)]=f; }));
function spellKey(w){ const c=w.replace(/e$/,""); const m=c.match(/([aeiouy]+[^aeiouy]*)$/); return m?m[1]:c.slice(-2); }
function sndOf(l){ return l.snd || ("-"+(FAMILY[normalWord(l.end)]||spellKey(normalWord(l.end)))); }
function rhymeWhy(s,a,b){
  const A=P.stanzas[s].lines[a], B=P.stanzas[s].lines[b];
  return A.rhyme===B.rhyme
    ? `Line ${a+1} ends in ${q1(A.end)} and line ${b+1} in ${q1(B.end)}: the same sound from the last strong vowel to the end (${sndOf(A)}), so they rhyme.`
    : `Line ${a+1} ends in ${q1(A.end)} (${sndOf(A)}) and line ${b+1} in ${q1(B.end)} (${sndOf(B)}): different sounds from the last strong vowel on, so they do not rhyme.`;
}
function partner(s,k){ const L=P.stanzas[s].lines; for(let j=0;j<L.length;j++) if(j!==k && L[j].rhyme===L[k].rhyme) return j; return -1; }

/* ====================== KEW WORKSHOP MACHINERY ===========================
   Lifted from ELC-Pages ballads.html ("Turn Ironbark into Kew"): the rhyme
   families, the class rhyme bank, the syllable estimate with - and +, the
   rhyme cards and the class link. Changed for Year 7: the checker gives
   three answers, and says "does not rhyme" only when both words are in
   known, different families, so it never says no to a rhyme it cannot hear.
   Anything else is "not sure: say it aloud". */
const SWAPFAM=FAMILY[normalWord(BALLAD.swap.to)];
function rhymeStatus(x, y, i, j, bank){
  const B=(bank||[]).map(normalWord), inB=w=>B.indexOf(w)>=0, famOf=w=>inB(w)?SWAPFAM:FAMILY[w];
  const a=normalWord(x), b=normalWord(y);
  if(!a||!b) return { k:"bad", v:"Not finished", why:`Line ${!a?i+1:j+1} has no last word yet.` };
  if(a===b) return { k:"bad", v:"Does not rhyme", why:`“${x}” ends both lines. A rhyme needs two different words with the same end sound.` };
  const fa=famOf(a), fb=famOf(b);
  if(fa && fb){
    if(fa===fb) return { k:"ok", v:"Rhymes", why:inB(a)&&inB(b)
      ? `Both are in the ${BALLAD.swap.to} rhyme bank.` : `Both end in the “-${fa}” sound.` };
    return { k:"bad", v:"Does not rhyme", why:`“${x}” ends in “-${fa}” and “${y}” ends in “-${fb}”. A rhyme needs the same end sound.` };
  }
  if(spellKey(a)===spellKey(b)) return { k:"ok", v:"Rhymes, by the spelling", why:`Both end in “-${spellKey(a)}”. Say them aloud to be sure.` };
  return { k:"unsure", v:"Not sure: say it aloud", why:`The checker can’t hear “${fa?y:x}”. Say “${x}” and “${y}” aloud. If the end sounds match, they rhyme.` };
}
/* Syllables are an estimate from spelling: vowel groups, with -ed and -es
   silent unless the stem needs its own syllable (wanted, boxes), a final
   consonant + le counted, and a silent final e dropped. Each line can be
   corrected with - and +. */
function wordSyllables(raw){
  let w=normalWord(raw); if(!w) return 0;
  if(BALLAD.syllables[w]) return BALLAD.syllables[w];
  if(w.length<=3) return 1;
  if(/ed$/.test(w)){ const s=w.slice(0,-2); if(!/[td]$/.test(s)) w=s; }
  else if(/es$/.test(w)){ const s=w.slice(0,-2); if(!/(?:[sxz]|ch|sh)$/.test(s)) w=s; }
  let n=(w.match(/[aeiouy]+/g)||[]).length;
  if(/[^aeiou]le$/.test(w)) n+=1;
  if(/e$/.test(w) && !/[aeiou]e$/.test(w)) n-=1;
  return Math.max(1,n);
}
function lineSyllables(line){ return words(line).reduce((t,w)=>t+wordSyllables(w),0); }
const PAIRS=[[0,1,"A"],[2,3,"B"],[4,5,"C"]];
const ST=BALLAD.stanzas;
function original(i){ return ST[i].lines.map(l=>strip(l.t)); }
/* The remix is "The Boy from Kew": the man from Ironbark becomes the boy from
   Kew, and any other Ironbark becomes Kew. Paterson's text is never changed. */
function startLines(i){ return original(i).map(t=>t.split("man from "+BALLAD.swap.from).join("boy from "+BALLAD.swap.to).split(BALLAD.swap.from).join(BALLAD.swap.to)); }
function cardHTML(r){ return `<div class="rc ${r.k}"><span class="v">${r.k==="ok"?"✓":r.k==="bad"?"✗":"?"} ${esc(r.L)} · ${esc(r.x||"?")} / ${esc(r.y||"?")}: ${esc(r.v)}</span>${esc(r.why)}</div>`; }
function metText(n, base){
  if(base==null) return { t:`≈ ${n} syllables`, c:"met" };
  const d=n-base, a=Math.abs(d);
  return { t:`≈ ${n} syllables · Paterson ≈ ${base} · `+(d===0?"same":`${a} ${d<0?"short":"long"}`), c:"met "+(a<=1?"good":a===2?"warn":"bad") };
}
function bankChips(bank, drop){
  return bank.map((w,k)=>k===0?`<span class="chip fixed">${esc(w)}</span>`:
    `<span class="chip">${esc(w)}<button type="button" onclick="${drop}(${k})" aria-label="Remove ${esc(w)}">×</button></span>`).join("");
}
function bankAdd(bank, raw){
  const w=endWord(raw);
  if(!w) return { msg:"Type one word." };
  if(bank.map(normalWord).indexOf(normalWord(w))>=0) return { msg:`“${w}” is already in the bank.` };
  return { word:w, msg:"" };
}

/* ====================== QUESTIONS ========================================
   Every answer is judged against the hand-tagged keys in the content block.
   Check after choosing. A wrong check names the rule for what was chosen,
   never the answer. The second wrong check shows the answer and marks the
   question missed. Ticks mean right on the first check. */
const TYPE={ rhymes:"Find the rhymes", split:"Group the syllables", letters:"Rhyme letters", count:"Syllable count", nth:"Find the syllable",
             beats:"Beats", internal:"Internal rhyme", mc:"Reading", own:"Your own words" };
function rec(s,qi){ const it=R().items[s]; return (it&&it[qi])||{}; }
function qsOf(s){ return P.stanzas[s].q||[]; }
function itemDone(s,qi){ const q=qsOf(s)[qi], r=rec(s,qi); return q.type==="own" ? wordCount(r.text)>=3 : !!r.res; }
function stanzaDone(s){ return qsOf(s).every((q,qi)=>itemDone(s,qi)); }
function stanzaClean(s){ const qs=qsOf(s); return qs.length>0 && qs.every((q,qi)=>q.type==="own"?itemDone(s,qi):rec(s,qi).res==="clean"); }
function isOpen(s){ if(OPEN || s<=1) return true; for(let k=1;k<s;k++) if(!stanzaDone(k)) return false; return true; }
function prompt(s,q){
  switch(q.type){
    case "rhymes": return "Tap two line endings that rhyme to pair them. Pair every rhyme in the stanza.";
    case "split": return `Tap between letters to cut ${q.words.length>1?"each word":q1(splitWordText(q.words[0]))} into syllables.`;
    case "letters": return "Give each line its rhyme letter.";
    case "count": return `How many syllables are in line ${q.line}?`;
    case "nth": return `Which word holds syllable ${q.n} of line ${q.line}?`;
    case "beats": return `Say line ${q.line} aloud. Tap every word that carries a beat.`;
    case "internal": return `Which word in line ${q.line} rhymes with ${q1(q.with)}?`;
    case "mc": case "own": return q.q;
  }
}
function judge(s,q,sel){
  const L=P.stanzas[s].lines;
  switch(q.type){
    case "rhymes": {
      const ends=L.map(l=>l.end), canon=rhymePairs(s), mine=pairsOf(sel.p);
      const key=p=>p[0]+"-"+p[1], cs=canon.map(key), ms=mine.map(key);
      const ok=cs.length===ms.length && cs.every(x=>ms.indexOf(x)>=0);
      const list=canon.map(([a,b])=>`${ends[a]} / ${ends[b]} (${sndOf(L[a])})`).join("; ");
      const loners=L.map((l,k)=>k).filter(k=>!canon.some(p=>p[0]===k||p[1]===k));
      const right=`${list}. Each pair ends in the same sound from the last strong vowel to the end.`+(loners.length?` ${loners.map(k=>q1(ends[k])).join(" and ")} match no other line.`:"");
      let msg=right;
      if(!ok){
        const bad=mine.find(p=>cs.indexOf(key(p))<0);
        if(bad) msg=`${q1(ends[bad[0]])} (${sndOf(L[bad[0]])}) and ${q1(ends[bad[1]])} (${sndOf(L[bad[1]])}) end in different sounds from the last strong vowel on, so they do not rhyme.`;
        else { const miss=canon.find(p=>ms.indexOf(key(p))<0); msg=`${q1(ends[miss[0]])} is not paired yet, and it has a rhyme in this stanza.`; }
      }
      return { ok, ans:mine.map(([a,b])=>ends[a]+"/"+ends[b]).join(", ")||"none", msg, reveal:right, canon };
    }
    case "split": {
      const W=q.words.map(splitWordText), parts=q.words.map(w=>w.split("."));
      const res=W.map((w,i)=>{ const g=groupsOf(w, sel[i]||[]); return { w, g, n:parts[i].length, bad:g.findIndex((x,j)=>vowelState(x, j===g.length-1)!=="ok") }; });
      const ok=res.every(r=>r.g.length===r.n && r.bad<0);
      const name=(w,g)=>`${w}: ${g.length} syllable${g.length>1?"s":""}, ${g.join(" and ")}`;
      let msg;
      if(ok) msg=res.map(r=>name(r.w,r.g)).join("; ")+". Each syllable has one vowel sound.";
      else {
        const r=res.find(r=>r.bad>=0 || r.g.length!==r.n);
        if(r.bad>=0){ const g=r.g[r.bad], st=vowelState(g, r.bad===r.g.length-1);
          msg = st==="silent" ? `${q1(g)} has only the silent e at the end of the word, so it is not a syllable on its own.` : `${q1(g)} has no vowel. Every syllable needs one vowel sound.`; }
        else msg=`You cut ${q1(r.w)} into ${r.g.length} part${r.g.length>1?"s":""}. Say it slowly and count the vowel sounds you hear: one syllable for each.`;
      }
      return { ok, ans:res.map(r=>r.g.join("|")).join(" "), msg, reveal:W.map((w,i)=>name(w,parts[i])).join("; ")+". Each syllable has one vowel sound." };
    }
    case "letters": {
      const canon=L.map(l=>l.rhyme), ok=sel.join("")===canon.join("");
      const groups=[...new Set(canon)].map(c=>{ const ix=canon.map((x,j)=>x===c?j:-1).filter(j=>j>=0);
        return ix.length>1 ? `${c}: ${ix.map(j=>L[j].end).join(", ")} (${sndOf(L[ix[0]])})` : `${c}: ${L[ix[0]].end}, which matches no other line`; }).join(". ");
      const right=`${canon.join(" ")}. ${groups}.`;
      let msg="";
      if(!ok){
        const k=sel.findIndex((x,j)=>x!==canon[j]), mine=sel[k];
        const j=sel.slice(0,k).indexOf(mine);
        if(k===0) msg="Line 1 starts the stanza, so it takes A.";
        else if(j>=0) msg=`Line ${k+1} has ${mine}, like line ${j+1}, but ${q1(L[k].end)} (${sndOf(L[k])}) and ${q1(L[j].end)} (${sndOf(L[j])}) end in different sounds. A new sound takes a new letter.`;
        else if(canon.slice(0,k).indexOf(canon[k])>=0) msg=`Line ${k+1} ends in ${q1(L[k].end)} (${sndOf(L[k])}). That sound has already had a letter higher up, and a sound that comes back takes the same letter again.`;
        else msg=`Line ${k+1} ends in a new sound, so it takes the next letter not used yet. Letters go in order: A for the first sound, B for the next new one, and so on.`;
      }
      return { ok, ans:sel.join(""), msg:ok?right:msg, reveal:right };
    }
    case "count": {
      const I=info(P,s,q.line-1), n=+sel, ok=n===I.total || (I.alt!=null && n===I.alt);
      const multi=I.toks.filter(t=>t.n>1).map(t=>q1(t.w));
      const alt=I.alt!=null?` (or ${I.alt}: ${I.toks.filter(t=>t.alt!=null).map(t=>q1(t.w)).join(", ")} can be said either way)`:"";
      const hi=Math.max(I.total, I.alt||0);
      const msg=ok?`${I.total}${alt}. `:`${n} is too ${n>hi?"many":"few"}. Say the line slowly and clap once for each vowel sound you hear. Check the longer words: ${multi.join(", ")}.`;
      return { ok, ans:String(n), msg, split:ok?splitLine(I):"", reveal:`${I.total} syllables${alt}.`, revealSplit:splitLine(I) };
    }
    case "nth": {
      const I=info(P,s,q.line-1), key=I.toks.findIndex(t=>q.n>=t.start && q.n<t.start+t.n), t=I.toks[sel];
      let msg;
      if(sel===key) msg=`${q1(t.w)} holds syllable ${q.n}.`;
      else if(sel+1===q.n) msg=`${q1(t.w)} is word ${q.n}, not syllable ${q.n}. Some words before it hold two or more syllables.`;
      else if(t.start>q.n) msg=`${q1(t.w)} comes after syllable ${q.n}. Count again from ${q1(I.toks[0].w)}, one for each vowel sound.`;
      else msg=`${q1(t.w)} comes before syllable ${q.n}. Count again from ${q1(I.toks[0].w)}, one for each vowel sound.`;
      return { ok:sel===key, ans:t.w, msg, split:sel===key?splitLine(I,"",key):"", reveal:`${q1(I.toks[key].w)} holds syllable ${q.n}.`, revealSplit:splitLine(I,"",key), key };
    }
    case "beats": {
      const I=info(P,s,q.line-1);
      const req=I.toks.map((t,j)=>t.strong&&!t.opt?j:-1).filter(j=>j>=0), opt=I.toks.map((t,j)=>t.opt?j:-1).filter(j=>j>=0);
      const extra=sel.filter(j=>req.indexOf(j)<0 && opt.indexOf(j)<0), missing=req.filter(j=>sel.indexOf(j)<0);
      const ok=!extra.length && !missing.length;
      const either=opt.length?` Either way: ${opt.map(j=>q1(I.toks[j].w)).join(", ")}.`:"";
      let msg="A careful reader stresses these; say it aloud."+either;
      if(!ok){
        msg = extra.length ? `You marked ${q1(I.toks[extra[0]].w)}. A careful reader says it lightly in this line.`+(missing.length?" Some words with a beat are not marked yet.":"")+" Say the line aloud and tap only where the beat lands."
                           : "Some words with a beat are not marked yet. Say the line aloud and tap on each beat.";
      }
      return { ok, ans:sel.slice().sort((a,b)=>a-b).map(j=>I.toks[j].w).join(" ")||"none",
               msg, split:ok?splitLine(I,"stress"):"", reveal:"A careful reader stresses these; say it aloud."+either, revealSplit:splitLine(I,"stress"), req, opt };
    }
    case "internal": {
      const ws=words(lineOf(s,q.line-1)), key=ws.findIndex(w=>normalWord(w)===normalWord(q.key));
      let wi=-1; ws.forEach((w,j)=>{ if(normalWord(w)===normalWord(q.with)) wi=j; });
      const msg = sel===key ? `${q1(q.key)} and ${q1(q.with)}: the same sound from the last strong vowel to the end (${q.snd}). A rhyme inside the line.`
        : sel===wi ? `${q1(q.with)} is the word to match. Find a different word in the line that ends in the same sound.`
        : `${q1(ws[sel])} and ${q1(q.with)} end in different sounds from the last strong vowel on. Say them one after the other.`;
      return { ok:sel===key, ans:ws[sel], msg, reveal:`${q1(q.key)} rhymes with ${q1(q.with)} (${q.snd}).`, key };
    }
    case "mc": return { ok:sel===q.key, ans:q.opts[sel][0], msg:q.opts[sel][1], reveal:`${q.opts[q.key][0]}. ${q.opts[q.key][1]}` };
  }
}
/* ---- find the rhymes: the student pairs line endings ---- */
function rhymePairs(s){
  const L=P.stanzas[s].lines, out=[];
  [...new Set(L.map(l=>l.rhyme))].forEach(c=>{ const ix=L.map((l,k)=>l.rhyme===c?k:-1).filter(k=>k>=0);
    for(let a=0;a<ix.length;a++) for(let b=a+1;b<ix.length;b++) out.push([ix[a],ix[b]]); });
  return out;
}
function pairsOf(p){ const by={}, out=[]; (p||[]).forEach((id,k)=>{ if(id!=null){ (by[id]=by[id]||[]).push(k); } });
  Object.keys(by).forEach(id=>{ const ix=by[id]; for(let a=0;a<ix.length;a++) for(let b=a+1;b<ix.length;b++) out.push([ix[a],ix[b]]); });
  return out.sort((x,y)=>x[0]-y[0]); }
/* ---- group the syllables: cuts are letter positions; judged on the number
   of parts and a vowel sound in each, never on one stored split ---- */
function splitWordText(w){ return w.split(".").join(""); }
function groupsOf(w, cuts){ const c=(cuts||[]).slice().sort((a,b)=>a-b), out=[]; let at=0; c.forEach(i=>{ out.push(w.slice(at,i+1)); at=i+1; }); out.push(w.slice(at)); return out.filter(x=>x.length); }
function vowelState(g, last){
  const t=g.toLowerCase().replace(/[^a-z]/g,"");
  if(!/[aeiouy]/.test(t)) return "none";
  if(last && /^[^aeiouy]+e$/.test(t)) return "silent";
  return "ok";
}
function ready(q,sel){
  if(q.type==="rhymes") return sel && sel.open==null && pairsOf(sel.p).length>0;
  if(q.type==="split") return Array.isArray(sel) && q.words.every((w,i)=>(sel[i]||[]).length>0);
  if(q.type==="letters") return Array.isArray(sel) && sel.length && sel.every(Boolean);
  if(q.type==="beats") return Array.isArray(sel) && sel.length>0;
  if(q.type==="count") return sel!=null && /^\d{1,2}$/.test(String(sel).trim());
  return sel!=null;
}

/* ====================== WORD HELPER ======================================
   The ELC word dialog. Everyone sees the meaning, what it means in this
   line, the word parts, the word story and related forms. Translations of
   the word and its parts appear only when the shared profile has EAL on:
   with a language named there, that language; without one, a select inside
   the dialog, saved on this page only. Escape closes it. */
const LANGS=[["zh","中文（简体）· Mandarin","zh-Hans"],["yue","中文（繁體）· Cantonese","zh-Hant"],
             ["vi","Tiếng Việt · Vietnamese","vi"],["fa","فارسی · Farsi","fa"]];
const SUITE=["zh","yue","vi","ar","fa"];
function eal(){
  const p=readProfile(); if(!p || p.eal!==true) return null;
  if(p.lang && SUITE.indexOf(p.lang)>=0) return { lang:p.lang, own:true };
  return { lang:S.glossLang||"", own:false };
}
function poemHasTr(){ return Object.keys(P.vocab).some(k=>P.vocab[k].tr); }
let WORD=null;
function openWord(key, st){
  WORD={ key, st };
  document.querySelectorAll(".vocab").forEach(b=>b.classList.toggle("on", b.dataset.k===key));
  drawWord();
  const d=$("wordDialog"); if(d && !d.open) d.showModal();
  const c=$("closeDialog"); if(c) c.focus();
}
function drawWord(){
  if(!WORD) return;
  const w=P.vocab[WORD.key]; if(!w) return;
  const e=eal(), L=e&&LANGS.find(x=>x[0]===e.lang), PT=P.parts||{};
  const context=(w.cs&&w.cs[String(WORD.st)])||w.c;
  $("popWord").textContent=w.w;
  const parts=(w.parts||[]).length?`<div class="morphs">${w.parts.map(([p,type,m,variant])=>{
      const t=L && PT[p+"|"+m] && PT[p+"|"+m][e.lang];
      return `<span class="morph ${esc(type)}"><b>${esc(p)}</b>${variant?`<small>≈ ${esc(variant)}</small>`:""}<small class="ty">${esc(type)}</small><small>${esc(m)}${t?` · <span lang="${L[2]}" dir="auto">${esc(t)}</span>`:""}</small></span>`; }).join("")}</div>`
    :`<p class="whole">No useful word parts here: learn it as a whole.</p>`;
  const related=(w.rel||[]).map(x=>`<span>${esc(x)}</span>`).join("");
  let h=`<p class="definition">${esc(w.m)}</p>${context?`<p class="context"><b>In this line:</b> ${esc(context)}</p>`:""}
    <div class="pop-label">Word build</div>${parts}
    ${w.o?`<div class="pop-label">Word story</div><p class="definition">${esc(w.o)}</p>`:""}`;
  if(e){

/* ====================== READ AND ANALYSE ================================= */
function firstLocked(){ for(let i=0;i<P.stanzas.length;i++) if(!isOpen(i)) return i; return P.stanzas.length; }
function readAt(i){ if(!isOpen(i)) return; bump((c,r)=>{ r.at=i; }); view.sel={}; view.claps={}; view.lastWrong={}; renderRead(); }
function readPips(on){
  return `<span class="pips">${P.stanzas.map((s,i)=>{
    const open=isOpen(i), clean=i>0&&stanzaClean(i), done=i>0&&stanzaDone(i);
    const lab=`Stanza ${i+1}`+(open?(clean?", every answer right first time":done?", answered":""):", opens when stanza "+i+" is answered");
    return `<button class="pip ${i===on?"on":""} ${done||i===0?"seen":""} ${open?"":"lock"}" ${open?`onclick="readAt(${i})"`:"disabled"}
      aria-label="${lab}" title="${lab}" ${i===on?'aria-current="true"':""}>${i+1}${clean?" ✓":""}</button>`; }).join("")}</span>`;
}
function renderRead(){
  let i=Math.max(0,Math.min(P.stanzas.length-1,R().at||0));
  if(!isOpen(i)) i=Math.max(0,firstLocked()-1);
  if(R().at!==i || !R().startedAt) bump((c,r)=>{ r.at=i; });
  const s=P.stanzas[i];
  const rows=s.lines.map((l,k)=>{
    let notes="";
    if(i===0){
      const I=info(P,0,k), inn=(s.model.internal||[]).find(x=>x[0]===k+1);
      notes=`<span class="notes"><span class="rk ${l.rhyme}">${l.rhyme} · ${esc(l.end)}</span>${splitLine(I,k===0?"stress":"")}<span class="note">${I.total} syllables</span>${inn?`<span class="note">inside: ${esc(inn[1])} / ${esc(inn[2])}</span>`:""}</span>`;
    }
    return `<div class="pl ${l.ind?"ind":""}"><span class="n">${k+1}</span><span class="tx">${marked(l.t,i+1)}</span>${notes}</div>`;
  }).join("");
  const legend=i===0?`<p class="dim">Line 1: <span class="split"><b class="st">BOLD</b></span> is a strong syllable; <span class="split"><b class="op">DOTTED</b></span> is a beat some readers say lightly. A careful reader stresses these; say it aloud.</p>`:"";
  $("body").innerHTML=bar("Read and analyse", readPips(i))+
    `<div class="cols ana"><div class="cardbox" id="poemcol">
      <p class="lab">${esc(P.title)} · stanza ${i+1} of ${P.stanzas.length}</p>
      ${s.brk?`<p class="brk" aria-hidden="true">.....</p>`:""}${rows}${legend}
      <p class="credit">${esc(P.title)}, ${esc(P.author)}, ${P.year}.</p></div>
    <div class="cardbox" id="qs"></div></div>`;

function nextHTML(i){

  const to=last?(PID==="ironbark"?`<button class="btn btn-primary" onclick="go('plan')">Plan →</button>`:`<button class="btn btn-primary" onclick="go('export')">Export →</button>`)
    :`<button class="btn btn-primary" ${done||OPEN?"":"disabled"} onclick="readAt(${i+1})">Stanza ${i+2} →</button>`;
  return `<div class="btnrow">${to}${!done&&!last&&!OPEN?`<span class="dim">Opens when every question here is answered.</span>`:""}</div>`;
}
function drawQs(i, focusQi){
  const box=$("qs"); if(!box) return;
  const top=box.scrollTop, s=P.stanzas[i];
  let h="";
  if(i===0){
    const m=s.model;
    h=`<p class="task">Stanza 1 is worked for you: rhyme letters, syllables, strong syllables and what happens. Read it, then go to stanza 2.</p><dl class="model"><dt>Who</dt><dd>${esc(m.who)}</dd><dt>What happens</dt><dd>${esc(m.what)}</dd><dt>Where</dt><dd>${esc(m.where)}</dd><dt>Why</dt><dd>${esc(m.why)}</dd></dl>`;
  } else h=`<p class="task">Answer each question, then press Check. Two misses show the answer. Tap an underlined word for its meaning.</p>`+qsOf(i).map((q,qi)=>itemHTML(i,qi)).join("");
  box.innerHTML=h+`<div class="next" id="nextwrap">${nextHTML(i)}</div>`;
  box.scrollTop=top;
  if(focusQi!=null){ const f=$("fb"+focusQi)||$("qc"+focusQi); if(f) f.focus(); }
}
function itemHTML(s,qi){
  const q=qsOf(s)[qi], r=rec(s,qi), lk=!!r.res, L=P.stanzas[s].lines;
  const sel=view.sel[qi]!==undefined?view.sel[qi]:null;
  const head=`<p class="qh" id="qh${qi}"><span class="qt">${TYPE[q.type]}</span>${esc(prompt(s,q))}</p>`;
  if(q.type==="own"){
    return `<div class="qi ownq" id="qc${qi}">${head}<textarea id="own${qi}" rows="3" aria-labelledby="qh${qi}" oninput="ownType(${s},${qi},this.value)">${esc(r.text||"")}</textarea>
      <p class="dim" style="margin:4px 0 0">Your teacher reads this. It is not marked here.</p></div>`;
  }
  const j=lk?judge(s,q,r.sv):null;
  let ctl="";
  const dis=lk?"disabled":"";
  if(q.type==="rhymes"){
    const st=lk?null:(sel||{ p:L.map(()=>null), open:null });
    const shown=lk?(()=>{ const p=L.map(()=>null); j.canon.forEach((x,i)=>{ p[x[0]]=i+1; p[x[1]]=i+1; }); return p; })():st.p;
    const ids=[...new Set(shown.filter(x=>x!=null))];
    ctl=`<div class="opts" role="group" aria-labelledby="qh${qi}">${L.map((l,k)=>{ const ws=words(strip(l.t)), id=shown[k];
      const tag=id!=null?`<span class="pairtag">pair ${ids.indexOf(id)+1}</span>`:(st&&st.open===k?`<span class="pairtag open">tap its rhyme</span>`:"");
      return `<button type="button" id="b${qi}_${k}" class="opt ln end2 ${lk&&id!=null?"key":""}" aria-pressed="${!!(st&&(st.open===k||id!=null))}" ${dis} onclick="pick(${s},${qi},${k})"><span>${k+1}. …${esc(ws.slice(-4).join(" "))}</span>${tag}</button>`; }).join("")}</div>`;
  }
  if(q.type==="split"){
    const W=q.words.map(splitWordText);
    ctl=`<div class="sw" role="group" aria-labelledby="qh${qi}">${W.map((w,wi)=>{
      const parts=q.words[wi].split("."), cuts=lk?parts.slice(0,-1).map((p,i)=>parts.slice(0,i+1).join("").length-1):((sel&&sel[wi])||[]);
      const chars=[...w];
      return `<span class="sword">${chars.map((ch,ci)=>{ const can=ci<chars.length-1 && /[A-Za-z]/.test(ch) && /[A-Za-z]/.test(chars[ci+1]);
        const on=cuts.indexOf(ci)>=0;
        return can?`<button type="button" id="b${qi}_${wi}_${ci}" class="lt ${on?"cut":""}" aria-pressed="${on}" aria-label="Cut ${esc(w)} after ${esc(w.slice(0,ci+1))}" ${dis} onclick="cut(${s},${qi},${wi},${ci})">${esc(ch)}</button>`
                   :`<span class="lt fixed">${esc(ch)}</span>`; }).join("")}</span>`; }).join("")}</div>`;
  }
  if(q.type==="mc"){
    ctl=`<div class="opts" role="group" aria-labelledby="qh${qi}">${q.opts.map((o,k)=>
      `<button type="button" id="b${qi}_${k}" class="opt ${lk&&k===q.key?"key":""}" aria-pressed="${sel===k}" ${dis} onclick="pick(${s},${qi},${k})">${esc(o[0])}</button>`).join("")}</div>`;
  }
  if(q.type==="letters"){
    const cur=lk?L.map(l=>l.rhyme):(sel||L.map(()=>null)), lets=["A","B","C","D"];
    ctl=L.map((l,k)=>{ const ws=words(strip(l.t)); return `<div class="lr"><span class="end">${k+1}. …${esc(ws.slice(-4).join(" "))}</span>
      <span class="seg" role="group" aria-label="Line ${k+1} rhyme letter">${lets.map(x=>`<button type="button" id="b${qi}_${k}_${x}" aria-pressed="${cur[k]===x}" ${dis} onclick="letter(${s},${qi},${k},'${x}')">${x}</button>`).join("")}</span></div>`; }).join("");
  }
  if(q.type==="count"){
    ctl=`<input class="num" id="n${qi}" type="text" inputmode="numeric" maxlength="2" aria-labelledby="qh${qi}" autocomplete="off" value="${esc(lk?(r.a||""):(sel==null?"":sel))}" ${dis}
      oninput="numType(${s},${qi},this.value)" onkeydown="if(event.key==='Enter')check(${s},${qi})">${!lk&&P.stanzas[s].aid?clapHTML(qi):""}`;
  }
  if(q.type==="nth"||q.type==="beats"||q.type==="internal"){
    const ws=words(lineOf(s,q.line-1)), multi=q.type==="beats";
    const keys = !lk?[] : q.type==="beats"?j.req:[j.key];
    const eith = lk&&q.type==="beats"?j.opt:[];
    ctl=`<div class="ws" role="group" aria-labelledby="qh${qi}">${ws.map((w,k)=>{
      const on=multi?(Array.isArray(sel)&&sel.indexOf(k)>=0):sel===k;
      const cls=keys.indexOf(k)>=0?"key":eith.indexOf(k)>=0?"either":"";
      return `<button type="button" id="b${qi}_${k}" class="w ${cls}" aria-pressed="${lk?false:on}" ${dis} onclick="pick(${s},${qi},${k})">${esc(w)}</button>`; }).join("")}</div>
      ${!lk&&q.type==="nth"&&P.stanzas[s].aid?`<div style="margin-top:6px">${clapHTML(qi)}</div>`:""}`;
  }
  let fb="", cls="";
  if(lk){
    const verdict=r.res==="clean"?"✓ Right first time":r.res==="second"?"Right on the second try":"✗ Shown after two misses";
    cls=r.res==="clean"?"ok":r.res==="second"?"mid":"no";
    const body=r.res==="shown"?`${esc(j.reveal)}${j.revealSplit?"<br>"+j.revealSplit:""}`:`${esc(j.msg)}${j.split?"<br>"+j.split:""}`;
    fb=`<span class="v">${verdict}</span>${body}`;
  } else if(r.fb){ cls="no"; fb=`<span class="v">✗ Not yet. One more try.</span>${esc(r.fb)}`; }
  const same=view.lastWrong[qi]!==undefined && JSON.stringify(sel)===view.lastWrong[qi];
  const btn=lk?"":`<button class="btn btn-primary" id="ck${qi}" ${ready(q,sel)&&!same?"":"disabled"} onclick="check(${s},${qi})">Check</button>`;
  return `<div class="qi ${lk?r.res:""}" id="qc${qi}" tabindex="-1">${head}${ctl}<div class="qrow">${btn}<div class="fb ${cls}" id="fb${qi}" tabindex="-1" role="status">${fb}</div></div></div>`;
}
function clapHTML(qi){ return `<span class="clap"><button type="button" class="btn" onclick="clap(${qi})" aria-label="Clap: add one syllable">Clap</button><b id="cl${qi}" aria-live="polite">${view.claps[qi]||0}</b><button type="button" class="btn btn-ghost" onclick="clap(${qi},1)">Reset</button></span>`; }
function clap(qi, reset){ view.claps[qi]=reset?0:(view.claps[qi]||0)+1; const b=$("cl"+qi); if(b) b.textContent=view.claps[qi]; }
function redraw(s,qi,focusId){
  const el=$("qc"+qi); if(!el) return;
  el.outerHTML=itemHTML(s,qi);
  if(focusId && $(focusId)) $(focusId).focus();
}
function cut(s,qi,wi,ci){
  if(rec(s,qi).res) return;
  const q=qsOf(s)[qi], a=(view.sel[qi]||q.words.map(()=>[])).map(x=>x.slice()), at=a[wi].indexOf(ci);
  if(at>=0) a[wi].splice(at,1); else a[wi].push(ci);
  view.sel[qi]=a; redraw(s,qi,`b${qi}_${wi}_${ci}`);
}
function pick(s,qi,k){
  const q=qsOf(s)[qi]; if(rec(s,qi).res) return;
  if(q.type==="rhymes"){
    const n=P.stanzas[s].lines.length, cur=view.sel[qi]||{ p:new Array(n).fill(null), open:null }, st={ p:cur.p.slice(), open:cur.open };
    if(st.p[k]!=null){ const id=st.p[k]; st.p=st.p.map(x=>x===id?null:x); }
    else if(st.open==null) st.open=k;
    else if(st.open===k) st.open=null;
    else { const id=Math.max(0,...st.p.filter(x=>x!=null))+1; st.p[st.open]=id; st.p[k]=id; st.open=null; }
    view.sel[qi]=st; redraw(s,qi,`b${qi}_${k}`); return;
  }
  if(q.type==="beats"){ const a=(view.sel[qi]||[]).slice(); const at=a.indexOf(k); if(at>=0) a.splice(at,1); else a.push(k); view.sel[qi]=a; }
  else view.sel[qi]=k;
  redraw(s,qi,`b${qi}_${k}`);
}
function letter(s,qi,k,x){
  const n=P.stanzas[s].lines.length, a=(view.sel[qi]||new Array(n).fill(null)).slice(); a[k]=x; view.sel[qi]=a;
  redraw(s,qi,`b${qi}_${k}_${x}`);
}
function numType(s,qi,v){
  view.sel[qi]=v.replace(/\D/g,"");
  const b=$("ck"+qi); if(b) b.disabled=!(ready(qsOf(s)[qi],view.sel[qi]) && JSON.stringify(view.sel[qi])!==view.lastWrong[qi]);
}
function refreshNav(s){
  const w=$("nextwrap"); if(w) w.innerHTML=nextHTML(s);
  const pw=document.querySelector(".deckbar .pips"); if(pw) pw.outerHTML=readPips(s);
}
function ownType(s,qi,v){
  bump((c,r)=>{ r.items[s]=r.items[s]||{}; r.items[s][qi]=Object.assign({}, r.items[s][qi]||{}, { text:v }); });
  refreshNav(s);
}
function check(s,qi){
  const q=qsOf(s)[qi], r=rec(s,qi);
  let sel=view.sel[qi];
  if(r.res || !ready(q,sel)) return;
  if(view.lastWrong[qi]!==undefined && JSON.stringify(sel)===view.lastWrong[qi]) return;
  if(q.type==="count") sel=String(sel).trim();
  const j=judge(s,q,sel);
  bump((c,R)=>{ R.items[s]=R.items[s]||{}; const it=R.items[s][qi]=Object.assign({}, R.items[s][qi]||{});
    it.n=(it.n||0)+1; R.checks=(R.checks||0)+1;
    if(it.n===1){ it.a1=j.ans; it.sv1=sel; } it.a=j.ans; it.sv=sel;
    if(j.ok) it.res=it.n===1?"clean":"second";
    else if(it.n>=2) it.res="shown";
    else it.fb=j.msg;
  });
  if(!j.ok) view.lastWrong[qi]=JSON.stringify(view.sel[qi]);
  redraw(s,qi,null);
  if(rec(s,qi).res) refreshNav(s);
  const f=$("fb"+qi); if(f) f.focus();
}
