/* ====================== KEW REMIX (student) ==============================
   Two options on one screen, both kept: Paterson's poem moved to Kew,
   stanza by stanza with his line beside each of theirs, or their own style
   in free stanzas. Nothing locks. Lines save as they are typed. The first
   rhyme check after a stanza has changed is the one the report keeps. */
const MODES={ kew:"The Boy from Kew", own:"Your own style" };
function kewLines(i){ const b=R().by[i]; return (b&&Array.isArray(b.lines)&&b.lines.length===6)?b.lines:startLines(i); }
function kewAdj(i){ const b=R().by[i]; return (b&&Array.isArray(b.adj)&&b.adj.length===6)?b.adj:[0,0,0,0,0,0]; }
function kewSlot(r,i){ const b=r.by[i]; if(b&&Array.isArray(b.lines)&&b.lines.length===6&&Array.isArray(b.adj)) return b;
  return (r.by[i]={ lines:startLines(i), adj:[0,0,0,0,0,0] }); }
function changedCount(i){ const s=startLines(i); return kewLines(i).filter((l,k)=>l.trim()!==s[k].trim()).length; }
const SCHEMES={ pairs:"Pairs: AABB", alt:"Alternate: ABAB", abcb:"Lines 2 and 4: ABCB" };
function schemeLetters(kind, n){
  const out=[], A="ABCDEFGHIJKLMNOPQRSTUVWXYZ"; let next=0;
  for(let k=0;k<n;k++){
    if(kind==="alt"){ const g=Math.floor(k/4)*2, m=k%4; out.push(A[(g+(m%2))%26]); next=Math.max(next,g+2); }
    else if(kind==="abcb"){ const m=k%4; if(m===3) out.push(out[k-2]); else out.push(A[(next++)%26]); }
    else out.push(A[Math.floor(k/2)%26]);
  }
  return out;
}
function freeOf(r){ return Array.isArray(r.free)?r.free:[]; }
function blankFree(){ return { lines:["","","","","",""], adj:[0,0,0,0,0,0], scheme:"pairs" }; }
function ownAt(){ const f=freeOf(R()); return Math.max(0,Math.min(f.length-1,R().ownAt||0)); }
function remixWritten(){
  const r=R();
  if(r.mode==="own") return freeOf(r).map((f,i)=>({ label:`Stanza ${i+1}`, key:"o"+i, lines:f.lines, letters:schemeLetters(f.scheme,f.lines.length), scheme:f.scheme }))
    .filter(x=>x.lines.some(l=>String(l).trim()));
  return ST.map((s,i)=>({ label:`Stanza ${i+1}`, key:i, lines:kewLines(i), letters:BALLAD.scheme })).filter((x,i)=>changedCount(i)>0);
}
function setMode(m){ bump((c,r)=>{ r.mode=m; if(m==="own" && !freeOf(r).length){ r.free=[blankFree()]; r.ownAt=0; } }); renderRewrite(); }
function renderRewrite(){
  const r=R(), mode=r.mode==="own"?"own":"kew";
  const sw=`<span class="poemsw" role="group" aria-label="Remix" style="margin:0">${Object.keys(MODES).map(m=>
    `<button class="tg btn" aria-pressed="${m===mode}" onclick="setMode('${m}')">${m===mode?"✓ ":""}${esc(MODES[m])}</button>`).join("")}</span>`;
  const offer=PENDING?`<div class="offer" role="region" aria-label="Class stanza 1"><b>Class stanza 1</b>
      <ol>${PENDING.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ol>
      <div class="btnrow" style="margin-top:6px"><button class="btn btn-primary" onclick="useClass()">Use the class stanza 1</button><button class="btn btn-ghost" onclick="dropOffer()">Not now</button></div></div>`:"";
  if(mode==="own") renderOwn(sw, offer); else renderKew(sw, offer);
}
function useClass(){
  if(!PENDING) return;
  const mine=kewLines(0), start=startLines(0);
  const differs=mine.some((l,k)=>l.trim()!==start[k].trim()) && mine.some((l,k)=>l.trim()!==PENDING.lines[k].trim());
  if(differs && !confirm("Replace your stanza 1 with the class stanza 1? Your own stanza 1 will be lost.")) return;
  const p=PENDING;
  bump((c,r)=>{ r.mode="kew"; r.stanza=0; r.by[0]={ lines:p.lines.slice(), adj:[0,0,0,0,0,0] };
    const have=r.bank.map(normalWord); p.bank.forEach(w=>{ if(normalWord(w) && have.indexOf(normalWord(w))<0){ r.bank.push(w); have.push(normalWord(w)); } }); });
  dropOffer();
}
function dropOffer(){ PENDING=null; history.replaceState(null,"","#ironbark"+(OPEN?"&open":"")); view.checked=null; renderRewrite(); }
function renderKew(sw, offer){
  const i=cur(), ls=kewLines(i), pat=original(i);
  const rows=ls.map((t,k)=>{ const L=BALLAD.scheme[k];
    return `<div class="kw"><span class="rl ${L}" aria-hidden="true">${L}</span>
      <span class="pat">${esc(pat[k])}</span>
      <textarea class="rt" id="ln${k}" rows="1" aria-label="Line ${k+1}, rhyme ${L}" oninput="typeLine(${k},this.value)">${esc(t)}</textarea>
      <span class="fix"><button type="button" onclick="nudge(${k},-1)" aria-label="Line ${k+1}: one syllable fewer">−</button><button type="button" onclick="nudge(${k},1)" aria-label="Line ${k+1}: one syllable more">+</button></span>
      <div class="under"><span class="job">${k+1}. ${esc(ST[i].jobs[k])}</span>
        <span class="met" id="end${k}"></span><span class="met" id="syl${k}"></span></div></div>`; }).join("");
  $("body").innerHTML=bar("Write", sw)+`<div class="cols wide"><div class="cardbox">${offer}
      <p class="task">Write your own version of each stanza, as many as you can. Lines with the same letter must rhyme. Press Check rhymes, and say each line aloud.</p>
      <div class="kwhead"><span class="lab" style="margin:0">Stanza</span>${stanzaPips(i,"rewriteAt",j=>changedCount(j)>0)}<span class="dim">${esc(ST[i].title)}</span></div>
      <div class="kwcols" aria-hidden="true"><span></span><span class="lab">Paterson</span><span class="lab">Yours</span></div>${rows}</div>
    <div class="cardbox">
      <button class="btn btn-primary" onclick="checkRhymes()">Check rhymes</button>
      <div id="checks"></div>
      <p class="dim">Syllable counts are estimates. Use − or + to correct one.</p>
      <p class="lab"><label for="bankIn" style="margin:0;font-size:inherit">Rhymes with ${esc(BALLAD.swap.to)}</label></p>
      <form class="bankf" onsubmit="addBank();return false;"><input id="bankIn" autocomplete="off"><button class="btn" type="submit">Add</button></form>
      <div class="chips" id="bank"></div><p class="dim" id="bankMsg" role="status"></p>
      <div class="btnrow"><button class="btn btn-ghost" onclick="restart()">Start this stanza again</button>
        ${i<ST.length-1?`<button class="btn" onclick="rewriteAt(${i+1})">Stanza ${i+2} →</button>`:""}
        <button class="btn btn-primary" onclick="go('purpose')">Purpose and audience →</button></div>
    </div></div>`;
  ls.forEach((_,k)=>{ metrics(k); fit($("ln"+k)); });
  drawBank(); drawChecks();
}
function rewriteAt(i){ bump((c,r)=>{ r.stanza=i; }); view.checked=null; renderRewrite(); }
function fit(el){ if(!el) return; el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
function typeLine(k, v){
  const i=cur();
  bump((c,r)=>{ const b=kewSlot(r,i); b.lines[k]=v; b.adj[k]=0; });
  fit($("ln"+k)); metrics(k);
  if(view.checked){ view.checked=null; drawChecks(); }
}
function nudge(k, d){ const i=cur(); bump((c,r)=>{ kewSlot(r,i).adj[k]+=d; }); metrics(k); }
function metrics(k){
  const i=cur(), t=kewLines(i)[k], base=lineSyllables(original(i)[k]);
  const m=metText(Math.max(0,lineSyllables(t)+kewAdj(i)[k]), base);
  $("end"+k).textContent="ends: "+(endWord(t)||"nothing yet");
  const el=$("syl"+k); el.textContent=m.t; el.className=m.c;
}
function restart(){
  const i=cur();
  if(!confirm(`Put Paterson’s stanza ${i+1} back, with only the move to ${BALLAD.swap.to}? Your six lines for this stanza will be replaced.`)) return;
  bump((c,r)=>{ r.by[i]={ lines:startLines(i), adj:[0,0,0,0,0,0] }; });
  view.checked=null; renderRewrite();
}
function summarise(res){ return { ok:res.filter(r=>r.k==="ok").length, unsure:res.filter(r=>r.k==="unsure").length,
    bad:res.filter(r=>r.k==="bad").length, miss:res.filter(r=>r.k!=="ok").map(r=>`${r.L} ${r.k==="bad"?"not ok":"not sure"} (${r.x||"?"} / ${r.y||"?"})`) }; }
function checkRhymes(){
  const i=cur(), ls=kewLines(i);
  const res=PAIRS.map(([a,b,L])=>{ const x=endWord(ls[a]), y=endWord(ls[b]); return Object.assign({ L:L+" pair", x, y }, rhymeStatus(x,y,a,b,R().bank)); });
  const sum=summarise(res), changed=changedCount(i)>0;
  bump((c,r)=>{ r.last[i]=sum; if(changed && !r.first[i]) r.first[i]=sum; });
  view.checked=res; drawChecks();
}
function drawChecks(){ const box=$("checks"); if(box) box.innerHTML=(view.checked||[]).map(cardHTML).join(""); }
function drawBank(){ const b=$("bank"); if(b) b.innerHTML=bankChips(R().bank,"dropBank"); }
function addBank(){
  const res=bankAdd(R().bank, $("bankIn").value); $("bankMsg").textContent=res.msg;
  if(!res.word) return;
  bump((c,r)=>{ r.bank=r.bank.concat([res.word]); });
  $("bankIn").value=""; drawBank();
  if(view.checked) (R().mode==="own"?checkOwn:checkRhymes)();
}
function dropBank(k){ bump((c,r)=>{ r.bank=r.bank.filter((_,j)=>j!==k); }); drawBank(); if(view.checked) (R().mode==="own"?checkOwn:checkRhymes)(); }

/* ---- your own style: free stanzas; the student sets the rhyme pattern ---- */
function renderOwn(sw, offer){
  const fr=freeOf(R()); if(!fr.length){ setMode("own"); return; }
  const i=ownAt(), f=fr[i], lets=schemeLetters(f.scheme, f.lines.length);
  const pips=`<span class="pips">${fr.map((x,k)=>`<button class="pip ${k===i?"on":""} ${x.lines.some(l=>String(l).trim())?"seen":""}" onclick="ownGo(${k})" aria-label="Your stanza ${k+1}" ${k===i?'aria-current="true"':""}>${k+1}</button>`).join("")}
    <button class="pip" onclick="ownAdd()" aria-label="Add a stanza">+ Stanza</button></span>`;
  const rows=f.lines.map((t,k)=>`<div class="rw"><span class="rl ${lets[k]}" aria-hidden="true">${lets[k]}</span>
      <textarea class="rt" id="ln${k}" rows="1" aria-label="Line ${k+1}, rhyme ${lets[k]}" oninput="ownLine(${k},this.value)">${esc(t)}</textarea>
      <span class="fix"><button type="button" onclick="ownNudge(${k},-1)" aria-label="Line ${k+1}: one syllable fewer">−</button><button type="button" onclick="ownNudge(${k},1)" aria-label="Line ${k+1}: one syllable more">+</button></span>
      <div class="under"><span class="job">${k+1}.</span><span class="met" id="end${k}"></span><span class="met" id="syl${k}"></span></div></div>`).join("");
  $("body").innerHTML=bar("Write", sw)+`<div class="cols wide"><div class="cardbox">${offer}
      <p class="task">Write your own ballad. Choose a rhyme pattern: lines with the same letter must rhyme. Add a stanza when you are ready.</p>
      <div class="kwhead"><span class="lab" style="margin:0">Stanza</span>${pips}</div>
      <div class="ownset"><label class="lab" for="sch" style="margin:0">Rhyme pattern</label>
        <select id="sch" onchange="ownScheme(this.value)">${Object.keys(SCHEMES).map(k=>`<option value="${k}" ${k===f.scheme?"selected":""}>${esc(SCHEMES[k])}</option>`).join("")}</select>
        <span class="lab" style="margin:0">Lines</span><span class="fix"><button type="button" onclick="ownCount(-1)" aria-label="One line fewer">−</button><button type="button" onclick="ownCount(1)" aria-label="One line more">+</button></span><b>${f.lines.length}</b></div>
      ${rows}</div>
    <div class="cardbox">
      <button class="btn btn-primary" onclick="checkOwn()">Check rhymes</button>
      <div id="checks"></div>
      <p class="dim">Syllable counts are estimates. Use − or + to correct one.</p>
      <p class="lab"><label for="bankIn" style="margin:0;font-size:inherit">Rhyme bank</label></p>
      <form class="bankf" onsubmit="addBank();return false;"><input id="bankIn" autocomplete="off"><button class="btn" type="submit">Add</button></form>
      <div class="chips" id="bank"></div><p class="dim" id="bankMsg" role="status"></p>
      <div class="btnrow">${fr.length>1?`<button class="btn btn-ghost" onclick="ownRemove()">Remove this stanza</button>`:""}
        <button class="btn btn-primary" onclick="go('purpose')">Purpose and audience →</button></div>
    </div></div>`;
  f.lines.forEach((_,k)=>{ ownMetrics(k); fit($("ln"+k)); });
  drawBank(); drawChecks();
}
function ownSlot(r){ r.free=freeOf(r); const i=Math.max(0,Math.min(r.free.length-1,r.ownAt||0)); const f=r.free[i];
  f.adj=Array.isArray(f.adj)?f.adj:[]; while(f.adj.length<f.lines.length) f.adj.push(0); return f; }
function ownGo(k){ bump((c,r)=>{ r.ownAt=k; }); view.checked=null; renderRewrite(); }
function ownAdd(){ bump((c,r)=>{ r.free=freeOf(r).concat([blankFree()]); r.ownAt=r.free.length-1; }); view.checked=null; renderRewrite(); }
function ownRemove(){
  const f=freeOf(R())[ownAt()];
  if(f.lines.some(l=>String(l).trim()) && !confirm(`Remove your stanza ${ownAt()+1}? Its lines will be deleted.`)) return;
  bump((c,r)=>{ const i=Math.max(0,Math.min(r.free.length-1,r.ownAt||0)); r.free.splice(i,1); r.ownAt=Math.max(0,i-1); });
  view.checked=null; renderRewrite();
}
function ownScheme(v){ bump((c,r)=>{ ownSlot(r).scheme=SCHEMES[v]?v:"pairs"; }); view.checked=null; renderRewrite(); }
function ownCount(d){
  const f=freeOf(R())[ownAt()], n=f.lines.length+d;
  if(n<2 || n>16) return;
  if(d<0 && String(f.lines[n]).trim() && !confirm(`Remove line ${n+1}? It has words in it.`)) return;
  bump((c,r)=>{ const s=ownSlot(r); if(d>0){ s.lines.push(""); s.adj.push(0); } else { s.lines.pop(); s.adj.pop(); } });
  view.checked=null; renderRewrite();
}
function ownLine(k,v){ bump((c,r)=>{ const s=ownSlot(r); s.lines[k]=v; s.adj[k]=0; }); fit($("ln"+k)); ownMetrics(k); if(view.checked){ view.checked=null; drawChecks(); } }
function ownNudge(k,d){ bump((c,r)=>{ ownSlot(r).adj[k]+=d; }); ownMetrics(k); }
function ownMetrics(k){
  const f=freeOf(R())[ownAt()], t=f.lines[k]||"", m=metText(Math.max(0,lineSyllables(t)+((f.adj||[])[k]||0)), null);
  $("end"+k).textContent="ends: "+(endWord(t)||"nothing yet");
  const el=$("syl"+k); el.textContent=m.t; el.className=m.c;
}
function ownPairs(f){
  const lets=schemeLetters(f.scheme,f.lines.length), out=[];
  [...new Set(lets)].forEach(L=>{ const ix=lets.map((x,j)=>x===L?j:-1).filter(j=>j>=0); for(let j=1;j<ix.length;j++) out.push([ix[0],ix[j],L]); });
  return out;
}
function checkOwn(){
  const i=ownAt(), f=freeOf(R())[i];
  const res=ownPairs(f).map(([a,b,L])=>{ const x=endWord(f.lines[a]), y=endWord(f.lines[b]);
    return Object.assign({ L:`${L}: lines ${a+1} and ${b+1}`, x, y }, rhymeStatus(x,y,a,b,R().bank)); });
  const sum=summarise(res), written=f.lines.some(l=>String(l).trim());
  bump((c,r)=>{ r.last["o"+i]=sum; if(written && !r.first["o"+i]) r.first["o"+i]=sum; });
  view.checked=res; drawChecks();
}

/* ====================== CLASS MODE (#class) ==============================
   The teacher's board for stanza 1, built with the class. No sign-in, and
   nothing here reaches a student's record or report: it lives under
   "class" in the same storage key. The class link carries the six lines and
   the class rhyme bank. */
function classState(){
  const c=S.class&&typeof S.class==="object"?S.class:{};
  return { bank:Array.isArray(c.bank)&&c.bank.length?c.bank:[BALLAD.swap.to],
           lines:Array.isArray(c.lines)&&c.lines.length===6?c.lines:startLines(0),
           adj:Array.isArray(c.adj)&&c.adj.length===6?c.adj:[0,0,0,0,0,0] };
}
function bumpClass(fn){ const c=load(); S=c; const s=classState(); fn(s); c.class=s; write(c); }
function renderClass(){
  const st=classState();
  const rows=st.lines.map((t,k)=>{ const L=BALLAD.scheme[k];
    return `<div class="cl"><span class="rl ${L}" aria-hidden="true">${L}</span>
      <span class="pat">${marked(ST[0].lines[k].t,1)}</span>
      <textarea class="rt" id="ln${k}" rows="1" aria-label="Line ${k+1}, rhyme ${L}" oninput="classLine(${k},this.value)">${esc(t)}</textarea>
      <span class="clm"><span class="fix"><button type="button" onclick="classNudge(${k},-1)" aria-label="Line ${k+1}: one syllable fewer">−</button><button type="button" onclick="classNudge(${k},1)" aria-label="Line ${k+1}: one syllable more">+</button></span>
        <span class="met" id="syl${k}"></span></span></div>`; }).join("");
  $("body").innerHTML=`<div class="slide">
    <div class="slidehead"><h1>The Boy from Kew</h1><span class="tools"><span class="copied" id="fb" role="status"></span>
      <button class="btn" onclick="classLink()">Copy class link</button><button class="btn btn-ghost" onclick="classClear()">Clear the class stanza</button></span></div>
    <input id="linkOut" readonly hidden aria-label="Class link">
    <div class="rows">${rows}</div>
    <div class="foot"><div class="cards" id="checks" style="display:contents"></div>
      <div class="bankbox"><form class="bankf" onsubmit="classBank();return false;"><input id="bankIn" autocomplete="off" aria-label="Add a word that rhymes with ${esc(BALLAD.swap.to)}" placeholder="Rhymes with ${esc(BALLAD.swap.to)}"><button class="btn" type="submit">Add</button></form>
        <div class="chips" id="bank"></div><p class="dim" id="bankMsg" role="status"></p></div></div>
  </div>`;
  st.lines.forEach((_,k)=>{ classMetric(k); fit($("ln"+k)); });
  classCards(); classDrawBank();
}
function classDrawBank(){ $("bank").innerHTML=bankChips(classState().bank,"classDrop"); }
function classMetric(k){
  const st=classState(), m=metText(Math.max(0,lineSyllables(st.lines[k])+st.adj[k]), lineSyllables(original(0)[k]));
  const n=Math.max(0,lineSyllables(st.lines[k])+st.adj[k]), base=lineSyllables(original(0)[k]);
  const el=$("syl"+k); el.textContent=`≈ ${n} syllables (Paterson ${base})`; el.className=m.c;
}
/* The board shows the rhyme cards live, as the teacher types. */
function classCards(){
  const st=classState();
  $("checks").innerHTML=PAIRS.map(([a,b,L])=>{ const x=endWord(st.lines[a]), y=endWord(st.lines[b]);
    return cardHTML(Object.assign({ L:L+" pair", x, y }, rhymeStatus(x,y,a,b,st.bank))); }).join("");
}
function classLine(k,v){ bumpClass(s=>{ s.lines=s.lines.slice(); s.adj=s.adj.slice(); s.lines[k]=v; s.adj[k]=0; }); fit($("ln"+k)); classMetric(k); classCards(); }
function classNudge(k,d){ bumpClass(s=>{ s.adj=s.adj.slice(); s.adj[k]+=d; }); classMetric(k); }
function classBank(){
  const res=bankAdd(classState().bank, $("bankIn").value); $("bankMsg").textContent=res.msg;
  if(!res.word) return;
  bumpClass(s=>{ s.bank=s.bank.concat([res.word]); }); $("bankIn").value=""; classDrawBank(); classCards();
}
function classDrop(k){ bumpClass(s=>{ s.bank=s.bank.filter((_,j)=>j!==k); }); classDrawBank(); classCards(); }
function classClear(){
  if(!confirm(`Clear the class stanza? The six lines go back to Paterson’s, moved to ${BALLAD.swap.to}, and the rhyme bank goes back to ${BALLAD.swap.to}.`)) return;
  bumpNames(c=>{ c.class=null; }); renderClass();
}
function classLink(){
  const st=classState(), payload=st.lines.map(l=>l.trim()).concat([st.bank.slice(1)]);
  const link=location.href.split("#")[0]+"#kew="+encodeURIComponent(JSON.stringify(payload));
  const out=$("linkOut"); out.value=link;
  const done=()=>{ $("fb").textContent="Link copied."; out.hidden=true; };
  const fail=()=>{ $("fb").textContent="Copy is blocked here. Select the link below and copy it."; out.hidden=false; out.select(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, ()=>fallback(link,done,fail));
  else fallback(link,done,fail);
}

/* ====================== PURPOSE AND AUDIENCE ============================= */

      <textarea id="purp" rows="4" oninput="bump((c,r)=>{r.purpose=this.value})">${esc(R().purpose)}</textarea>
      <div class="btnrow"><button class="btn btn-primary" onclick="go('export')">Export →</button></div></div>
    <div class="cardbox"><p class="lab">${esc(MODES[R().mode==="own"?"own":"kew"])}</p>${w.length?w.map(x=>`<p class="lab">${esc(x.label)}</p><ul class="mine">${x.lines.map((t,k)=>
      `<li><span class="rk ${esc(x.letters[k])}">${esc(x.letters[k])}</span><span>${esc(t)}</span></li>`).join("")}</ul>`).join(""):`<p class="dim">No stanza written yet.</p>`}</div></div>`;
}

/* ====================== EXPORT ===========================================
   One tab-separated row and a printable page. Scores and misses are first
   tries only. Writing is reported verbatim. */
function ymd(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const MISS=[["Misses: rhyme",["rhymes","letters"]],["Misses: syllable count",["count","split"]],["Misses: nth syllable",["nth"]],
            ["Misses: beats",["beats"]],["Misses: internal rhyme",["internal"]],["Misses: comprehension",["mc"]]];
function missName(s,q,r){
  const at=`S${s+1}`;
  switch(q.type){
    case "rhymes": return `${at} find the rhymes: paired ${r.a1}`;
    case "split": return `${at} L${q.line} syllables: cut ${r.a1}`;
    case "letters": return `${at} letters: ${r.a1}`;
    case "count": return `${at} L${q.line}: said ${r.a1}`;
    case "nth": return `${at} L${q.line} syllable ${q.n}: chose ${r.a1}`;
    case "beats": return `${at} L${q.line}: marked ${r.a1}`;
    case "internal": return `${at} L${q.line} with ${q.with}: chose ${r.a1}`;
    case "mc": return `${at} ${q.short}: chose "${r.a1}"`;
  }
}
function firstText(f){ return f?`${f.ok} ok · ${f.unsure} not sure · ${f.bad} not ok`+(f.miss.length?` (${f.miss.join("; ")})`:""):"not checked"; }
function reportData(){
  const r=R(), isI=PID==="ironbark", na="n/a";
  const mins=(r.startedAt&&r.lastAt)?String(Math.max(1,Math.round((r.lastAt-r.startedAt)/60000))):"";
  const cols=["Date","First name","Last name","Code","Minutes","Poem"], row=[ymd(),S.fname,S.lname,S.sid,mins,P.title];
  let clean=0, judgedN=0;
  for(let s=1;s<P.stanzas.length;s++){
    const qs=qsOf(s).map((q,qi)=>[q,qi]).filter(([q])=>q.type!=="own");
    const done=qs.filter(([q,qi])=>rec(s,qi).res), c=done.filter(([q,qi])=>rec(s,qi).res==="clean").length;
    clean+=c; judgedN+=qs.length;
    cols.push(`S${s+1} first try`); row.push(done.length?`${c}/${qs.length}`+(done.length<qs.length?" (unfinished)":""):"");
  }
  cols.push("Right first time, all stanzas","Checks"); row.push(`${clean}/${judgedN}`, String(r.checks||0));
  MISS.forEach(([lab,types])=>{
    const list=[]; let any=false;
    for(let s=1;s<P.stanzas.length;s++) qsOf(s).forEach((q,qi)=>{ if(types.indexOf(q.type)<0) return; const x=rec(s,qi); if(!x.res) return; any=true; if(x.res!=="clean") list.push(missName(s,q,x)); });
    cols.push(lab); row.push(list.length?list.join("; "):any?"none":"");
  });
  for(let s=1;s<P.stanzas.length;s++) qsOf(s).forEach((q,qi)=>{ if(q.type!=="own") return; cols.push(`Own words S${s+1}`); row.push((rec(s,qi).text||"").trim()); });
  const p=planOf(), w=isI?remixWritten():[];
  cols.push("Plan: what happens","Plan: who tells it","Plan: who it is for","Remix option","Stanzas written","Remix","Remix rhyme check, first try","Purpose and audience");
  if(isI) row.push(p.happens.trim(), p.narrator.trim(), p.audience.trim(),
    w.length?MODES[r.mode==="own"?"own":"kew"]:"not started", String(w.length),
    w.map(x=>`${x.label}: ${x.lines.map(t=>String(t).trim()).join(" / ")}`).join(" // "),
    w.map(x=>`${x.label}: ${firstText(r.first[x.key])}`).join("; "), r.purpose.trim());
  else row.push(na,na,na,na,na,na,na,na);
  return { cols, row };
}
function renderExport(){
  const r=reportData();
  $("body").innerHTML=bar("Export", `<span>${esc(P.title)}</span>`)+`<div class="cols ana"><div class="cardbox">
      <table class="rpt">${r.cols.map((c,k)=>`<tr><th>${esc(c)}</th><td>${esc(r.row[k])||"&nbsp;"}</td></tr>`).join("")}</table></div>
    <div class="cardbox">
      <div class="btnrow" style="margin-top:0"><button class="btn btn-primary" onclick="window.print()">Print or save as PDF</button>
        <button class="btn" onclick="copyRow()">Copy the row</button><span class="copied" id="fb" role="status"></span></div>
      <p class="dim">The row is one line for the class sheet. Scores and misses are first tries only; the page shows second tries too. Minutes run from the first save to the last, breaks included.</p>
      <p class="dim">The row cannot tell whether you read the poem aloud, whether your own words are right, ${PID==="ironbark"?"whether your remix works as a story or keeps the beat, ":""}or how much help you had.</p>

function copyRow(){
  const tsv=reportData().row.map(v=>String(v).replace(/[\t\n\r]+/g," ")).join("\t");
  const done=()=>{ $("fb").textContent="Copied. Paste it into the class sheet."; };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done, ()=>fallback(tsv,done));
  else fallback(tsv,done);
}
function fallback(t, done, fail){
  const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} a.remove();
  if(ok) done(); else if(fail) fail();
}
function printItem(s,q,qi){
  const r=rec(s,qi), lab=`<b>${TYPE[q.type]}.</b> ${esc(prompt(s,q))}`;
  if(q.type==="own") return `<li>${lab}<br><span class="own">${esc((r.text||"").trim())||"(blank)"}</span></li>`;
  if(!r.res) return `<li>${lab} <i>Not answered.</i></li>`;
  const j=judge(s,q,r.sv);
  const tail=r.res==="clean"?"✓ first try":r.res==="second"?`✗ first try; right on the second: ${esc(r.a)}`:`✗ first try; second: ${esc(r.a)}. Shown: ${esc(j.reveal)}`;
  return `<li>${lab} First try: <b>${esc(r.a1)}</b>. ${tail}</li>`;
}
function buildPrint(){
  const r=R(), isI=PID==="ironbark", rd=reportData(), col=c=>rd.row[rd.cols.indexOf(c)];
  let h=`<h1>Ballads: ${esc(P.title)}</h1><p class="who">${esc(S.fname)} ${esc(S.lname)} · ${esc(S.sid)} · ${ymd()} · ${esc(col("Minutes")||"?")} minute${col("Minutes")==="1"?"":"s"} · right first time: ${esc(col("Right first time, all stanzas"))}</p>
    <p class="key">✓ right on the first try. ✗ wrong on the first try: the second try, or the answer shown after two misses, follows.</p>`;
  P.stanzas.forEach((st,s)=>{
    const text=st.lines.map(l=>`<div class="${l.ind?"ind":""}">${esc(strip(l.t))}</div>`).join("");
    const items=s===0?`<li>Modelled in class: every answer shown.</li>`:qsOf(s).map((q,qi)=>printItem(s,q,qi)).join("");
    h+=`<section><h3>Stanza ${s+1}</h3><div class="pg"><div class="pt">${text}</div><ul>${items}</ul></div></section>`;
  });
  if(isI){
    const p=planOf(), w=remixWritten();
    h+=`<section><h3>Plan</h3><ul><li><b>What happens:</b> <span class="own">${esc(p.happens.trim())||"(blank)"}</span></li><li><b>Who tells it:</b> <span class="own">${esc(p.narrator.trim())||"(blank)"}</span></li><li><b>Who it is for:</b> <span class="own">${esc(p.audience.trim())||"(blank)"}</span></li></ul></section>
      <section class="remixp"><h3>Writing: ${esc(w.length?MODES[r.mode==="own"?"own":"kew"]:"not started")} · ${w.length} stanza${w.length===1?"":"s"} written</h3>
      ${w.map(x=>`<div class="ps"><b>${esc(x.label)}</b>${x.scheme?` · ${esc(SCHEMES[x.scheme])}`:""}<ul class="mine">${x.lines.map((t,k)=>`<li><b>${esc(x.letters[k])}</b>&nbsp; ${esc(t)}</li>`).join("")}</ul>
        <p style="font-size:9pt;margin:2pt 0 0">Rhyme check, first try: ${esc(firstText(r.first[x.key]))}</p></div>`).join("")}</section>
      <section><h3>Purpose and audience</h3><p class="own">${esc(r.purpose.trim())||"(blank)"}</p></section>`;
  }
  $("print").innerHTML=h;
}
window.addEventListener("beforeprint", ()=>{ if(idOk() && view.screen!=="class") buildPrint(); });

function contentErrors(){
  const bad=[];
  if(BALLAD.scheme.length!==6) bad.push("Ironbark: scheme needs six letters.");
  ORDER.forEach(id=>{ const poem=POEMS[id], T=poem.title;
    poem.stanzas.forEach((s,i)=>{
      s.lines.forEach((l,k)=>{
        (l.t.match(/\[\[([^|\]]+)\|/g)||[]).forEach(m=>{ const key=m.slice(2,-1);
          if(!poem.vocab[key]) bad.push(`${T}, stanza ${i+1}, line ${k+1}: no vocab entry “${key}”.`); });
        if(l.syl){ const ws=words(strip(l.t)), tg=l.syl.trim().split(/\s+/).map(parseTok);
          if(ws.length!==tg.length) bad.push(`${T}, stanza ${i+1}, line ${k+1}: ${ws.length} words but ${tg.length} syllable tags.`);
          else ws.forEach((w,j)=>{ if(normalWord(w)!==tg[j].letters) bad.push(`${T}, stanza ${i+1}, line ${k+1}: tag “${tg[j].syls.join(".")}” does not match “${w}”.`); }); }
      });
      if(i===0){ if(!s.model) bad.push(`${T}: stanza 1 needs a model.`); s.lines.forEach((l,k)=>{ if(!l.syl) bad.push(`${T}, stanza 1, line ${k+1}: the model needs syllable tags.`); }); }
      (s.q||[]).forEach((q,qi)=>{
        const where=`${T}, stanza ${i+1}, question ${qi+1}`, l=q.line?s.lines[q.line-1]:null;
        if(q.line && !l) bad.push(`${where}: no line ${q.line}.`);
        if(["count","nth","beats"].indexOf(q.type)>=0 && l && !l.syl) bad.push(`${where}: line ${q.line} has no syllable tags.`);
        if(q.type==="nth" && l && l.syl){ if(/\|/.test(l.syl)) bad.push(`${where}: line ${q.line} has a word that varies.`);
          const I=info(poem,i,q.line-1); if(!(q.n>=1&&q.n<=I.total)) bad.push(`${where}: no syllable ${q.n}.`); }
        if(q.type==="rhymes" && !rhymePairs(i).length) bad.push(`${where}: no lines rhyme.`);
        if(q.type==="split" && l){ const ws=words(strip(l.t)); const I=l.syl?info(poem,i,q.line-1):null;
          q.words.forEach(w=>{ const t=splitWordText(w), j=ws.findIndex(x=>x===t);
            if(j<0) bad.push(`${where}: “${t}” is not in line ${q.line}.`);
            else if(I && (I.toks[j].n!==w.split(".").length || I.toks[j].alt!=null)) bad.push(`${where}: “${t}” has ${I.toks[j].n} syllables in the line’s tags.`); }); }
        if(q.type==="internal" && l){ const ws=words(strip(l.t)).map(normalWord);
          if(ws.filter(w=>w===normalWord(q.key)).length!==1) bad.push(`${where}: “${q.key}” must appear once in line ${q.line}.`);
          if(ws.indexOf(normalWord(q.with))<0) bad.push(`${where}: “${q.with}” is not in line ${q.line}.`); }
        if(q.type==="mc" && !(q.opts && q.opts[q.key])) bad.push(`${where}: the key is not an option.`);
      });
    });
    Object.keys(poem.vocab).forEach(k=>{ if(!poem.vocab[k].m) bad.push(`${T}: vocab “${k}” has no meaning.`); });
  });
  ST.forEach((s,i)=>{ if(s.lines.length!==6) bad.push(`Ironbark stanza ${i+1} needs six lines.`); if(!s.jobs || s.jobs.length!==6) bad.push(`Ironbark stanza ${i+1} needs six jobs.`); });
  if(!SWAPFAM) bad.push(`“${BALLAD.swap.to}” is not in any rhyme family.`);
  return bad;
}

    return;
  }
  route();
})();
