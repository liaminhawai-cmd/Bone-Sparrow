<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballads: Writing Folio</title>
<style>
:root{
  --bg:#f1efe8; --paper:#fbfaf6; --ink:#1f1f1f; --muted:#655f55;
  --line:#d4cfc2; --line-soft:#e6e1d6; --accent:#2c5f7c;
  --correct:#2f6a3e; --okbg:#eef5ee; --wrong:#a83232; --wrongbg:#fbeeee;
  --warn:#8a5a12; --warnbg:#fdf4e3;
  /* Rhyme pairs. Each badge also prints its letter, so colour is never the
     only signal. */
  --ra:#1f5fa8; --rabg:#e3ecf7; --rb:#6b3f7e; --rbbg:#efe5f3; --rc:#2f6a3e; --rcbg:#e5f1e7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);
     display:flex;justify-content:center;padding:12px}
.container{width:100%;max-width:1180px;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;padding:18px 22px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:0 0 4px}
h2{font-family:Georgia,'Times New Roman',serif;font-size:20px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.55}
.topbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:13px}
.topbar .sp{margin-left:auto;display:flex;gap:14px}
.menulink{color:var(--accent);font-weight:600;text-decoration:none;padding:10px 0}
.menulink:hover{text-decoration:underline}

.btn{padding:10px 17px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
     cursor:pointer;background:var(--paper);color:var(--ink);font-family:inherit;transition:all .15s ease;
     text-decoration:none;display:inline-block;min-height:40px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#24506a}
.btn-ghost{background:var(--bg);color:var(--muted)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fields{display:flex;flex-direction:column;gap:12px;max-width:420px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
      font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;line-height:1.45}
.err{color:var(--wrong);font-size:12.5px;min-height:17px;margin-top:3px}

.step{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:#fff;
      border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:0 0 10px;
      font-family:inherit;font-size:15px;color:inherit;cursor:pointer;transition:border-color .15s}
.step:hover{border-color:var(--accent)}
.step .num{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
           display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.step.done .num{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
.step .t{font-weight:700}
.step .d{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.5}
.step .tag{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;
           letter-spacing:.4px;color:var(--muted);white-space:nowrap;padding-top:4px}

.deckbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
         border-radius:10px;padding:4px 14px;margin:0 0 12px;font-size:12.5px;color:var(--muted);min-height:50px}
.deckbar b{color:var(--ink)}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{min-width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:12px;
     font-weight:800;cursor:pointer;font-family:inherit;color:var(--muted);padding:0 6px}
.pip.on{border-color:var(--accent);color:var(--accent);background:#fff;box-shadow:inset 0 0 0 1px var(--accent)}
.pip.seen{color:var(--ink)}

.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.cardbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
/* One view on a school laptop: each column scrolls inside itself rather than
   pushing the page past the bottom of the screen. */
.cols>.cardbox{max-height:calc(100vh - 128px);overflow:auto}
.lab{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:12px 0 4px}
.lab:first-child{margin-top:0}
.dim{color:#7d766a;font-size:12.5px}
.broken{background:var(--wrongbg);border:1px solid var(--wrong);border-radius:9px;padding:12px 15px;font-size:14px;line-height:1.6}

/* ---- read ---- */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.tg{min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:var(--bg);
    font-family:inherit;font-weight:600;font-size:13.5px;line-height:1;color:var(--ink);cursor:pointer}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tg[aria-pressed="true"]::before{content:"\2713  "}
.pl{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:baseline;padding:0 6px;border-radius:6px}
.pl .n{font-size:11px;color:var(--muted);text-align:right}
.pl .tx{font-family:Georgia,serif;font-size:17px;line-height:2.15}
.cols.wide{grid-template-columns:minmax(0,2.5fr) minmax(0,1fr)}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pl .notes{grid-column:2;display:flex;gap:4px;flex-wrap:wrap;margin:-5px 0 5px}
.pl.speech{background:var(--warnbg);box-shadow:inset 3px 0 var(--warn)}
.note{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 6px;white-space:nowrap;background:#fff}
.rk{font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap;border:1px solid}
.rk.A{color:var(--ra);background:var(--rabg);border-color:var(--ra)}
.rk.B{color:var(--rb);background:var(--rbbg);border-color:var(--rb)}
.rk.C{color:var(--rc);background:var(--rcbg);border-color:var(--rc)}
.vocab{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted var(--accent);
       padding:6px 1px 1px;margin:0;cursor:pointer;border-radius:3px 3px 0 0}
.vocab:hover{background:var(--bg)}
.vocab.on{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);border-bottom-style:solid}
.credit{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.gw{font-family:Georgia,serif;font-size:21px;font-weight:700;margin:0 0 6px}
.gm{font-size:15px;line-height:1.55;margin:0}
.parts{display:flex;flex-direction:column;gap:6px;margin:12px 0 0}
.part{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px;line-height:1.45;background:var(--paper)}
.part b{font-size:15px}
.part i{color:var(--muted);font-size:12px;margin:0 4px}
.tr{font-size:18px;margin:12px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--paper)}
.glang{margin:12px 0 0;max-width:260px}

/* ---- rewrite ---- */
.rw{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:3px 8px;align-items:start;margin:0 0 9px}
.rl{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-top:5px;border:1px solid}
.rl.A{color:var(--ra);background:var(--rabg);border-color:var(--ra)}
.rl.B{color:var(--rb);background:var(--rbbg);border-color:var(--rb)}
.rl.C{color:var(--rc);background:var(--rcbg);border-color:var(--rc)}
.rt{font:16px/1.4 Georgia,serif;padding:7px 10px;min-height:40px}
.under{grid-column:2 / 4;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.job{flex:1 1 200px;font-size:12.5px;color:var(--muted)}
.met{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);background:#fff}
.met.good{color:var(--correct);background:var(--okbg);border-color:var(--correct)}
.met.warn{color:var(--warn);background:var(--warnbg);border-color:var(--warn)}
.met.bad{color:var(--wrong);background:var(--wrongbg);border-color:var(--wrong)}
.fix{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fix button{width:40px;height:40px;border:0;background:#fff;font-family:inherit;font-weight:800;font-size:16px;line-height:1;cursor:pointer;color:var(--ink)}
.fix button+button{border-left:1px solid var(--line)}
.rc{border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin:8px 0 0;font-size:13.5px;line-height:1.5}
.rc .v{display:block;font-weight:800}
.rc.ok{background:var(--okbg);border-color:var(--correct)} .rc.ok .v{color:var(--correct)}
.rc.unsure{background:var(--warnbg);border-color:var(--warn)} .rc.unsure .v{color:var(--warn)}
.rc.bad{background:var(--wrongbg);border-color:var(--wrong)} .rc.bad .v{color:var(--wrong)}
.bankf{display:flex;gap:8px;margin:0 0 8px}
.bankf input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;padding:0 0 0 11px;font-weight:700;font-size:14px;background:var(--paper);min-height:40px}
.chip.fixed{padding-right:11px}
.chip button{width:40px;height:38px;border:0;background:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:15px;line-height:1;color:var(--muted);border-radius:99px}
.mine{font-family:Georgia,serif;font-size:15.5px;line-height:1.7;margin:0;padding:0;list-style:none}
.mine li{display:flex;gap:8px;align-items:baseline}
.mine .rk{flex:0 0 auto}

table.rpt{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.rpt th{background:var(--bg);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;width:190px}
.copied{color:var(--correct);font-weight:700;font-size:13.5px}
.rptbox{max-height:calc(100vh - 262px);overflow:auto;margin:0 0 8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media screen and (max-width:860px){ .container{padding:14px} .cols{grid-template-columns:1fr} .cols>.cardbox{max-height:none} .rptbox{max-height:none} }
</style>
</head>
<body>
<div class="container"><div id="body"></div></div>

<script>
/* ============================================================================
   CONTENT. Banjo Paterson, "The Man from Ironbark" (The Bulletin, 1892),
   checked line by line against Project Gutenberg #213, The Man from Snowy
   River and Other Verses. The poem is the source: do not change its words.

   stanzas[n].lines[k]
     t        the line. [[key|words]] makes "words" tappable; key looks up
              vocab below.
     rhyme    A, B or C        end   the rhyme word
     speech   true when the line is spoken by a character
   stanzas[n].jobs   what each line does in the story, shown under the rewrite
   lenses            notes beside stanza 1 only, one per line
   swap              the word moved before the student starts rewriting
   rhymeFamilies     words known to rhyme with each other. The checker says
                     "rhymes" for two words in one family and "does not rhyme"
                     for words in two different families. Anything else is
                     "not sure".
   syllables         counts for words the estimate gets wrong
   vocab             w: the words shown, m: the meaning in plain English,
                     parts: [part, prefix|root|suffix, meaning],
                     tr: zh (Mandarin, simplified), yue (Cantonese,
                     traditional), vi, fa. Parts and tr appear only when the
                     shared profile has EAL support on.
   parts             translations of each part, keyed "part|meaning"
   ========================================================================== */
const BALLAD = {
 title:"The Man from Ironbark", author:"A. B. Paterson", year:1892,
 swap:{ from:"Ironbark", to:"Kew" },
 scheme:["A","A","B","B","C","C"],
 stanzas:[
  { title:"Arrival in Sydney",
    lines:[
     {"t":"It was the man from [[ironbark|Ironbark]] who [[struck|struck the Sydney town]],","rhyme":"A","end":"town","speech":false},
     {"t":"He [[wandered|wandered]] over street and park, he wandered up and down.","rhyme":"A","end":"down","speech":false},
     {"t":"He [[loitered|loitered]] here, he loitered there, till he was like to drop,","rhyme":"B","end":"drop","speech":false},
     {"t":"Until at last in sheer [[despair|despair]] he [[sought|sought]] a barber’s shop.","rhyme":"B","end":"shop","speech":false},
     {"t":"‘’Ere! shave my beard and [[whiskers|whiskers]] off, I’ll be a [[man-of-mark|man of mark]],","rhyme":"C","end":"mark","speech":true},
     {"t":"I’ll go and do the Sydney [[toff|toff]] up home in Ironbark.’","rhyme":"C","end":"Ironbark","speech":true} ],
    jobs:["Introduce the visitor and place.","Show the visitor moving around.","Build the problem.","Move the visitor into the barber shop.","Give the visitor a goal in direct speech.","Finish the set-up and name the home place."] },
  { title:"The barber’s plan",
    lines:[
     {"t":"The barber man was small and [[flash|flash]], as barbers mostly are,","rhyme":"A","end":"are","speech":false},
     {"t":"He wore a [[strike-your-fancy|strike-your-fancy]] sash, he smoked a huge cigar:","rhyme":"A","end":"cigar","speech":false},
     {"t":"He was a [[humorist|humorist]] [[of-note|of note]] and [[keen|keen]] at [[repartee|repartee]],","rhyme":"B","end":"repartee","speech":false},
     {"t":"He [[laid-odds|laid the odds]] and kept a [[tote|‘tote’]], whatever that may be,","rhyme":"B","end":"be","speech":false},
     {"t":"And when he saw our friend arrive, he whispered ‘Here’s a [[lark|lark]]!","rhyme":"C","end":"lark","speech":true},
     {"t":"Just watch me catch him all alive, this man from Ironbark.’","rhyme":"C","end":"Ironbark","speech":true} ],
    jobs:["Introduce the barber and his style.","Add a detail: confident and flashy.","Show off his way with words.","Add a strange, mysterious habit.","He notices the visitor arrive.","State his plan: trick the visitor."] },
  { title:"The joke is signalled",
    lines:[
     {"t":"There were some [[gilded|gilded]] youths that sat along the barber’s wall,","rhyme":"A","end":"wall","speech":false},
     {"t":"Their eyes were [[dull|dull]], their heads were flat, they had no brains at all;","rhyme":"A","end":"all","speech":false},
     {"t":"To them the barber [[passed-wink|passed the wink]], his [[dexter|dexter]] [[eyelid|eyelid]] shut,","rhyme":"B","end":"shut","speech":false},
     {"t":"‘I’ll make this [[bloomin|bloomin’]] [[yokel|yokel]] think his bloomin’ throat is cut.’","rhyme":"B","end":"cut","speech":true},
     {"t":"And as he soaped and rubbed it in he made a rude remark:","rhyme":"C","end":"remark","speech":false},
     {"t":"‘I s’pose the flats is pretty [[green|green]] up there in Ironbark.’","rhyme":"C","end":"Ironbark","speech":true} ],
    jobs:["Introduce the watching young men.","Describe them unkindly.","The barber signals the joke with a wink.","State the plan out loud, to the youths.","Start the shave: the joke begins.","Mock the visitor’s country home."] },
  { title:"The fake cut",
    lines:[
     {"t":"A [[grunt|grunt]] was all reply he got; he shaved the [[bushman|bushman’s]] chin,","rhyme":"A","end":"chin","speech":false},
     {"t":"Then made the water [[boiling|boiling hot]] and dipped the razor in.","rhyme":"A","end":"in","speech":false},
     {"t":"He raised his hand, his [[black-brow|brow grew black]], he paused awhile to [[gloat|gloat]],","rhyme":"B","end":"gloat","speech":false},
     {"t":"Then slashed the red-hot [[razor-back|razor-back]] across his [[victim|victim’s]] throat;","rhyme":"B","end":"throat","speech":false},
     {"t":"Upon the newly shaven skin it made a [[livid|livid]] mark —","rhyme":"C","end":"mark","speech":false},
     {"t":"No doubt it [[took-in|fairly took him in]] — the man from Ironbark.","rhyme":"C","end":"Ironbark","speech":false} ],
    jobs:["Show his reaction: barely any.","Raise the danger: scalding water.","Build suspense before the trick.","The barber fakes the cut.","Describe the mark it leaves.","Confirm the trick has worked."] },
  { title:"He believes the trick",
    lines:[
     {"t":"He [[fetched-yell|fetched a wild]] [[up-country|up-country]] yell might wake the dead to hear,","rhyme":"A","end":"hear","speech":false},
     {"t":"And though his throat, he knew [[full-well|full well]], was cut from ear to ear,","rhyme":"A","end":"ear","speech":false},
     {"t":"He struggled [[gamely|gamely]] to his feet, and faced the [[murderous|murd’rous]] foe:","rhyme":"B","end":"foe","speech":false},
     {"t":"‘You’ve [[done-for|done for me]]! you dog, I’m beat! one hit before I go!","rhyme":"B","end":"go","speech":true},
     {"t":"I only wish I had a knife, you [[blessed|blessed]] murdering [[shark|shark]]!","rhyme":"C","end":"shark","speech":true},
     {"t":"But you’ll remember all your life, the man from Ironbark.’","rhyme":"C","end":"Ironbark","speech":true} ],
    jobs:["He reacts in shock: it’s working.","Show he believes his throat is cut.","He fights on despite believing he’s dying.","His parting words, half beaten.","Wish for a weapon; name the ‘murderer’.","A last threat before the end."] },
  { title:"The fight",
    lines:[
     {"t":"He lifted up his [[hairy-paw|hairy paw]], with one [[tremendous|tremendous]] [[clout|clout]]","rhyme":"A","end":"clout","speech":false},
     {"t":"He landed on the barber’s jaw, and knocked the barber out.","rhyme":"A","end":"out","speech":false},
     {"t":"He [[set-to-work|set to work]] with [[tooth-and-nail|tooth and nail]], he made the place a [[wreck|wreck]];","rhyme":"B","end":"wreck","speech":false},
     {"t":"He grabbed the nearest [[gilded|gilded]] youth, and tried to break his neck.","rhyme":"B","end":"neck","speech":false},
     {"t":"And all the while his throat he held to save his [[vital-spark|vital spark]],","rhyme":"C","end":"spark","speech":false},
     {"t":"And ‘Murder! Bloody Murder!’ yelled the man from Ironbark.","rhyme":"C","end":"Ironbark","speech":true} ],
    jobs:["He throws one huge punch.","Land the punch: the barber falls.","The fight wrecks the shop.","He turns on someone else nearby.","Show he still guards his ‘wound’.","He shouts for help, sure he’s dying."] },
  { title:"The explanation",
    lines:[
     {"t":"A [[peeler|peeler]] man who heard the [[din|din]] came in to see the show;","rhyme":"A","end":"show","speech":false},
     {"t":"He tried to [[run-in|run the bushman in]], but he refused to go.","rhyme":"A","end":"go","speech":false},
     {"t":"And when at last the barber spoke, and said, ‘’Twas all in fun —","rhyme":"B","end":"fun","speech":true},
     {"t":"’Twas just a little [[harmless|harmless]] joke, a [[trifle|trifle]] [[overdone|overdone]].’","rhyme":"B","end":"overdone","speech":true},
     {"t":"‘A joke!’ he cried, ‘[[by-george|By George]], that’s fine; a lively sort of [[lark|lark]];","rhyme":"C","end":"lark","speech":true},
     {"t":"I’d like to catch that [[murdering|murdering]] [[swine|swine]] some night in Ironbark.’","rhyme":"C","end":"Ironbark","speech":true} ],
    jobs:["A police officer arrives.","He won’t be arrested without a fight.","The barber explains: only a joke.","Play the joke down as harmless.","React with disbelief and anger.","Vow revenge if the barber visits home."] },
  { title:"The story returns home",
    lines:[
     {"t":"And now while round the [[shearing-floor|shearing floor]] the [[listening|list’ning]] [[shearers|shearers]] [[gape|gape]],","rhyme":"A","end":"gape","speech":false},
     {"t":"He tells the story [[oer-and-oer|o’er and o’er]], and [[brags|brags]] of his [[escape|escape]].","rhyme":"A","end":"escape","speech":false},
     {"t":"‘Them barber [[chaps|chaps]] what keeps a [[tote|tote]], By George, I’ve had enough,","rhyme":"B","end":"enough","speech":true},
     {"t":"One tried to cut my bloomin’ throat, but thank the Lord it’s [[tough|tough]].’","rhyme":"B","end":"tough","speech":true},
     {"t":"And whether he’s believed or no, there’s one thing to [[remark|remark]],","rhyme":"C","end":"remark","speech":false},
     {"t":"That [[flowing-beards|flowing beards]] are [[all-the-go|all the go]] way up in Ironbark.","rhyme":"C","end":"Ironbark","speech":false} ],
    jobs:["Set the new scene: back home.","He tells the story again and again.","His verdict on city barbers.","Boast that he survived, tough as ever.","The narrator adds a wry comment.","End with a joke about the town."] }
 ],
 lenses:{
  Story:["visitor + place","movement","problem","decision","goal","plan"],
  Rhythm:["about 7 beats","about 7 beats","about 7 beats","about 7 beats","about 7 beats","about 7 beats"],
  Voice:["narrator","narrator","narrator","narrator","direct speech","direct speech"] },
 rhymeFamilies:{
  "own":["town","down","brown","crown","frown","gown"],
  "op":["drop","shop","stop","top","hop","chop"],
  "ark":["mark","Ironbark","bark","dark","lark","park","remark","shark","spark"],
  "ar":["are","cigar","car","far","star"],
  "ee":["repartee","be","see","free","tree"],
  "all":["wall","all","call","fall","tall"],
  "ut":["shut","cut","but","hut"],
  "in":["chin","in","skin","thin","win"],
  "oat":["gloat","throat","boat","coat","float"],
  "ear":["hear","ear","near","fear","clear"],
  "oh":["foe","go","know","show","slow"],
  "out":["clout","out","shout","about"],
  "eck":["wreck","neck","check","deck"],
  "un":["fun","overdone","done","one","sun"],
  "ape":["gape","escape","shape","tape"],
  "uff":["enough","tough","rough","stuff"],
  "oo":["Kew","you","do","too","two","through","threw","shoe","blue","new","true","glue","stew","zoo","flew","grew","crew","view","knew"] },

function esc(t){ const d=document.createElement("div"); d.textContent=t==null?"":t; return d.innerHTML; }

/* ====================== POEM TEXT ======================================== */
function strip(t){ return String(t).replace(/\[\[[^|\]]+\|([^\]]+)\]\]/g,"$1"); }
function original(i){ return ST[i].lines.map(l=>strip(l.t)); }
function startLines(i){ return original(i).map(t=>t.split(BALLAD.swap.from).join(BALLAD.swap.to)); }
function marked(t){
  return esc(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,(m,k,w)=>
    `<button type="button" class="vocab" data-k="${k}" onclick="gloss('${k}')">${w}</button>`);
}

/* ====================== SYLLABLES AND RHYME ==============================
   Syllables are an estimate from spelling: vowel groups, with -ed and -es
   silent unless the stem needs its own syllable (wanted, boxes), a final
   consonant + le counted, and a silent final e dropped. The student can
   correct any line with - and +. */
function normalWord(w){ return String(w||"").toLowerCase().replace(/[^a-z]/g,""); }
function wordSyllables(raw){
  let w=normalWord(raw); if(!w) return 0;
  if(BALLAD.syllables[w]) return BALLAD.syllables[w];
  if(w.length<=3) return 1;
  if(/ed$/.test(w)){ const s=w.slice(0,-2); if(!/[td]$/.test(s)) w=s; }
  else if(/es$/.test(w)){ const s=w.slice(0,-2); if(!/(?:[sxz]|ch|sh)$/.test(s)) w=s; }
  let n=(w.match(/[aeiouy]+/g)||[]).length;
  if(/[^aeiou]le$/.test(w)) n+=1;
  if(/e$/.test(w) && !/[aeiou]e$/.test(w)) n-=1;
  return Math.max(1,n);
}
function words(line){ return String(line||"").match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g)||[]; }
function lineSyllables(line){ return words(line).reduce((t,w)=>t+wordSyllables(w),0); }
function endWord(line){ const w=words(line); return w.length?w[w.length-1]:""; }

const FAMILY={};
Object.keys(BALLAD.rhymeFamilies).forEach(f=>BALLAD.rhymeFamilies[f].forEach(w=>{ FAMILY[normalWord(w)]=f; }));
const SWAPFAM=FAMILY[normalWord(BALLAD.swap.to)];
function inBank(w){ return S.bank.map(normalWord).includes(w); }
function famOf(w){ return inBank(w)?SWAPFAM:FAMILY[w]; }
function spellKey(w){ const c=w.replace(/e$/,""); const m=c.match(/([aeiouy]+[^aeiouy]*)$/); return m?m[1]:c.slice(-2); }
/* Three answers only. "Does not rhyme" is given only when both words are in
   known, different families, so the checker never says no to a rhyme it
   cannot hear. */
function rhymeStatus(x, y, i, j){
  const a=normalWord(x), b=normalWord(y);
  if(!a||!b) return { k:"bad", v:"Not finished", why:`Line ${!a?i+1:j+1} has no last word yet.` };
  if(a===b) return { k:"bad", v:"Does not rhyme", why:`“${x}” ends both lines. A rhyme needs two different words with the same end sound.` };
  const fa=famOf(a), fb=famOf(b);
  if(fa && fb){
    if(fa===fb) return { k:"ok", v:"Rhymes", why:inBank(a)&&inBank(b)
      ? `Both are in the ${BALLAD.swap.to} rhyme bank.` : `Both end in the “-${fa}” sound.` };
    return { k:"bad", v:"Does not rhyme", why:`“${x}” ends in “-${fa}” and “${y}” ends in “-${fb}”. A rhyme needs the same end sound.` };
  }
  if(spellKey(a)===spellKey(b)) return { k:"ok", v:"Rhymes, by the spelling", why:`Both end in “-${spellKey(a)}”. Say them aloud to be sure.` };
  return { k:"unsure", v:"Not sure: say it aloud", why:`The checker can’t hear “${fa?y:x}”. Say “${x}” and “${y}” aloud. If the end sounds match, they rhyme.` };
}

/* ====================== STATE PER STANZA ================================= */
function cur(){ return S.stanza==null?0:S.stanza; }
function lines(i){ const b=S.by[i]; return (b&&Array.isArray(b.lines)&&b.lines.length===6)?b.lines:startLines(i); }
function adj(i){ const b=S.by[i]; return (b&&Array.isArray(b.adj)&&b.adj.length===6)?b.adj:[0,0,0,0,0,0]; }
function slot(c,i){ const b=c.by[i]; if(b&&Array.isArray(b.lines)&&b.lines.length===6&&Array.isArray(b.adj)) return b;
  return (c.by[i]={ lines:startLines(i), adj:[0,0,0,0,0,0] }); }
function changedCount(i){ const s=startLines(i); return lines(i).filter((l,k)=>l.trim()!==s[k].trim()).length; }
function planOf(){ return Object.assign({ happens:"", narrator:"", audience:"" }, S.plan||{}); }

  const seen=Object.keys(S.seen).length, p=planOf();

  const st=cur(), ch=changedCount(st), last=S.last[st];
  const steps=[
    { s:"read", t:"Read", d:`${BALLAD.title}. Eight stanzas.`, tag:seen?`${seen} of ${ST.length} read`:"", done:seen===ST.length },
    { s:"plan", t:"Plan", d:"Your stanza, what happens, who tells it, who it is for.", tag:planN?`${planN} of 4`:"", done:planN===4 },
    { s:"rewrite", t:"Rewrite", d:`Six lines. ${BALLAD.swap.from} is now ${BALLAD.swap.to}.`,
      tag:ch?`Stanza ${st+1} · ${ch} of 6 lines changed`:"", done:ch>0 && last && !last.bad },
    { s:"purpose", t:"Purpose and audience", d:"Who it is for, and what it should do to them.", tag:S.purpose.trim()?"written":"", done:!!S.purpose.trim() }
  ];
  let h=topbar()+`<h1>Ballads</h1><p class="sub">${esc(S.fname)} ${esc(S.lname)} · ${esc(S.sid)}</p>`;

function toggleLens(n){ bump(c=>{ c.lens=c.lens||{}; c.lens[n]=!c.lens[n]; }); renderRead(); }
function renderRead(){
  const i=Math.max(0,Math.min(ST.length-1,S.at||0));
  if(!S.seen[i]) bump(c=>{ c.seen[i]=1; });
  const s=ST[i], L=S.lens||{}, voice=i===0&&L.Voice;
  const tools=`<div class="tools" role="group" aria-label="Show on the poem">
      ${i===0?`<button class="tg" aria-pressed="${!!L.Story}" onclick="toggleLens('Story')">Story</button>`:""}
      <button class="tg" aria-pressed="${!!S.rhymeOn}" onclick="toggleRhyme()">Rhyme letters</button>
      ${i===0?["Rhythm","Voice"].map(n=>`<button class="tg" aria-pressed="${!!L[n]}" onclick="toggleLens('${n}')">${n}</button>`).join(""):""}</div>`;
  const rows=s.lines.map((l,k)=>{
    const notes=[];
    if(i===0 && L.Story) notes.push(`<span class="note">${esc(BALLAD.lenses.Story[k])}</span>`);
    if(S.rhymeOn) notes.push(`<span class="rk ${l.rhyme}">${l.rhyme} · ${esc(l.end)}</span>`);
    if(i===0 && L.Rhythm) notes.push(`<span class="note">${esc(BALLAD.lenses.Rhythm[k])}</span>`);
    if(voice) notes.push(`<span class="note">${esc(BALLAD.lenses.Voice[k])}</span>`);
    return `<div class="pl ${voice&&l.speech?"speech":""}"><span class="n">${k+1}</span><span class="tx">${marked(l.t)}</span>${notes.length?`<span class="notes">${notes.join("")}</span>`:""}</div>`;
  }).join("");
  $("body").innerHTML=bar("Read", stanzaPips(i,"readAt",S.seen)+`<span>${esc(s.title)}</span>`)+
    `<div class="cols wide"><div class="cardbox">${tools}${rows}
      <div class="btnrow">${i<ST.length-1?`<button class="btn" onclick="readAt(${i+1})">Stanza ${i+2} →</button>`:`<button class="btn" onclick="go('plan')">Plan →</button>`}</div>
      <p class="credit">${esc(BALLAD.title)}, ${esc(BALLAD.author)}, ${BALLAD.year}.</p></div>
    <div class="cardbox" id="gloss" aria-live="polite"></div></div>`;
  drawGloss();
}
function gloss(k){
  view.word=k;
  document.querySelectorAll(".vocab").forEach(b=>b.classList.toggle("on", b.dataset.k===k));
  drawGloss();
}
function drawGloss(){
  const box=$("gloss"); if(!box) return;
  const v=view.word && BALLAD.vocab[view.word];
  if(!v){ box.innerHTML=`<p class="dim">Tap an underlined word.</p>`; return; }
  let h=`<p class="gw">${esc(v.w)}</p><p class="gm">${esc(v.m)}</p>`;
  const e=eal();
  if(e){
    const L=LANGS.find(x=>x[0]===e.lang);
    if(v.parts && v.parts.length) h+=`<div class="parts">${v.parts.map(([p,type,m])=>{
      const t=L && BALLAD.parts[p+"|"+m] && BALLAD.parts[p+"|"+m][e.lang];
      return `<span class="part"><b>${esc(p)}</b><i>${esc(type)}</i>${esc(m)}${t?` · <span lang="${L[2]}" dir="auto">${esc(t)}</span>`:""}</span>`; }).join("")}</div>`;
    if(L && v.tr && v.tr[e.lang]) h+=`<p class="tr" lang="${L[2]}" dir="${e.lang==="fa"?"rtl":"auto"}">${esc(v.tr[e.lang])}</p>`;
    if(!e.own) h+=`<select class="glang" aria-label="Translation language" onchange="setGlossLang(this.value)">
      <option value="">No translation</option>${LANGS.map(x=>`<option value="${x[0]}" ${e.lang===x[0]?"selected":""}>${esc(x[1])}</option>`).join("")}</select>`;
  }
  box.innerHTML=h;
}
function setGlossLang(v){ bump(c=>{ c.glossLang=v; }); drawGloss(); }

/* ====================== PLAN ============================================= */
function planStanza(i){ bump(c=>{ c.stanza=i; }); renderPlan(); }
function savePlan(f, v){ bump(c=>{ c.plan=Object.assign({}, c.plan||{}); c.plan[f]=v; }); }
function renderPlan(){
  const p=planOf(), i=S.stanza;
  const box=(f,lab,rows)=>`<label for="p_${f}" class="lab">${lab}</label>
    <textarea id="p_${f}" rows="${rows}" oninput="savePlan('${f}',this.value)">${esc(p[f])}</textarea>`;
  $("body").innerHTML=bar("Plan")+`<div class="cols even"><div class="cardbox">
      <p class="lab">Your stanza</p>${stanzaPips(i,"planStanza")}
      ${box("happens","What happens in your version",4)}
      ${box("narrator","Who tells it",2)}
      ${box("audience","Who it is for",2)}
      <div class="btnrow"><button class="btn btn-primary" onclick="go('rewrite')">Rewrite →</button></div></div>
    <div class="cardbox">${i==null?`<p class="dim">Choose a stanza.</p>`:
      `<p class="lab">Stanza ${i+1} · ${esc(ST[i].title)}</p><ul class="mine">${ST[i].lines.map(l=>
        `<li><span class="rk ${l.rhyme}">${l.rhyme}</span><span>${esc(strip(l.t))}</span></li>`).join("")}</ul>`}</div></div>`;
}

/* ====================== REWRITE ==========================================
   Lines save as they are typed. Checking never changes them. The first
   check after the stanza differs from the starting version is the one the
   report keeps. */
function rewriteAt(i){ bump(c=>{ c.stanza=i; }); renderRewrite(); }
function renderRewrite(){
  if(S.stanza==null) bump(c=>{ c.stanza=0; });
  const i=cur(), ls=lines(i);
  const rows=ls.map((t,k)=>{ const r=BALLAD.scheme[k];
    return `<div class="rw"><span class="rl ${r}" aria-hidden="true">${r}</span>
      <textarea class="rt" id="ln${k}" rows="1" aria-label="Line ${k+1}, rhyme ${r}" oninput="typeLine(${k},this.value)">${esc(t)}</textarea>
      <span class="fix"><button type="button" onclick="nudge(${k},-1)" aria-label="Line ${k+1}: one syllable fewer">−</button><button type="button" onclick="nudge(${k},1)" aria-label="Line ${k+1}: one syllable more">+</button></span>
      <div class="under"><span class="job">${k+1}. ${esc(ST[i].jobs[k])}</span>
        <span class="met" id="end${k}"></span><span class="met" id="syl${k}"></span></div></div>`; }).join("");
  $("body").innerHTML=bar("Rewrite", stanzaPips(i,"rewriteAt")+`<span>${esc(ST[i].title)}</span>`)+
    `<div class="cols wide"><div class="cardbox">${rows}</div>
    <div class="cardbox">
      <button class="btn btn-primary" onclick="checkRhymes()">Check rhymes</button>
      <div id="checks"></div>
      <p class="dim">Syllable counts are estimates. Use − or + to correct one.</p>
      <p class="lab"><label for="bankIn" style="margin:0;font-size:inherit">Rhymes with ${esc(BALLAD.swap.to)}</label></p>
      <form class="bankf" onsubmit="addBank();return false;"><input id="bankIn" autocomplete="off"><button class="btn" type="submit">Add</button></form>
      <div class="chips" id="bank"></div><p class="dim" id="bankMsg" role="status"></p>
      <div class="btnrow"><button class="btn btn-ghost" onclick="restart()">Start this stanza again</button></div>
    </div></div>`;
  ls.forEach((_,k)=>{ metrics(k); fit($("ln"+k)); });
  drawBank(); drawChecks();
}
function fit(el){ if(!el) return; el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
function typeLine(k, v){
  const i=cur();
  bump(c=>{ const b=slot(c,i); b.lines[k]=v; b.adj[k]=0; if(c.stanza==null) c.stanza=i; });
  fit($("ln"+k)); metrics(k);
  if(view.checked){ view.checked=null; drawChecks(); }
}
function nudge(k, d){ const i=cur(); bump(c=>{ slot(c,i).adj[k]+=d; }); metrics(k); }
function metrics(k){
  const i=cur(), t=lines(i)[k], base=lineSyllables(original(i)[k]);
  const n=Math.max(0,lineSyllables(t)+adj(i)[k]), d=n-base, a=Math.abs(d);
  $("end"+k).textContent="ends: "+(endWord(t)||"nothing yet");
  const m=$("syl"+k);
  m.textContent=`≈ ${n} syllables · Paterson ≈ ${base} · `+(d===0?"same":`${a} ${d<0?"short":"long"}`);
  m.className="met "+(a<=1?"good":a===2?"warn":"bad");
}
function restart(){
  const i=cur();
  if(!confirm(`Put Paterson’s stanza ${i+1} back, with only ${BALLAD.swap.from} changed? Your six lines for this stanza will be replaced.`)) return;
  bump(c=>{ c.by[i]={ lines:startLines(i), adj:[0,0,0,0,0,0] }; });
  renderRewrite();
}
function checkRhymes(){
  const i=cur(), ls=lines(i);
  const res=PAIRS.map(([a,b,L])=>{ const x=endWord(ls[a]), y=endWord(ls[b]); return Object.assign({ L, x, y }, rhymeStatus(x,y,a,b)); });
  const sum={ ok:res.filter(r=>r.k==="ok").length, unsure:res.filter(r=>r.k==="unsure").length,
    bad:res.filter(r=>r.k==="bad").length, miss:res.filter(r=>r.k!=="ok").map(r=>`${r.L} ${r.k==="bad"?"not ok":"not sure"} (${r.x||"?"} / ${r.y||"?"})`) };
  const changed=changedCount(i)>0;
  bump(c=>{ c.last[i]=sum; if(changed && !c.first[i]) c.first[i]=sum; });
  view.checked=res; drawChecks();
}
function drawChecks(){
  const box=$("checks"); if(!box) return;
  box.innerHTML=(view.checked||[]).map(r=>`<div class="rc ${r.k}"><span class="v">${r.k==="ok"?"✓":r.k==="bad"?"✗":"?"} ${r.L} pair · ${esc(r.x||"?")} / ${esc(r.y||"?")}: ${esc(r.v)}</span>${esc(r.why)}</div>`).join("");
}
function drawBank(){
  $("bank").innerHTML=S.bank.map((w,k)=>k===0?`<span class="chip fixed">${esc(w)}</span>`:
    `<span class="chip">${esc(w)}<button type="button" onclick="dropBank(${k})" aria-label="Remove ${esc(w)}">×</button></span>`).join("");
}
function addBank(){
  const w=endWord($("bankIn").value), msg=$("bankMsg");
  if(!w){ msg.textContent="Type one word."; return; }
  if(inBank(normalWord(w))){ msg.textContent=`“${w}” is already in the bank.`; return; }
  bump(c=>{ c.bank=c.bank.concat([w]); });
  $("bankIn").value=""; msg.textContent=""; drawBank();
  if(view.checked) checkRhymes();
}
function dropBank(k){ bump(c=>{ c.bank=c.bank.filter((_,j)=>j!==k); }); drawBank(); if(view.checked) checkRhymes(); }

/* ====================== PURPOSE AND AUDIENCE ============================= */
function renderPurpose(){
  const i=cur();
  $("body").innerHTML=bar("Purpose and audience")+`<div class="cols even"><div class="cardbox">
      <label for="purp" class="lab">Who is it for, and what should it do to them?</label>
      <textarea id="purp" rows="4" oninput="bump(c=>{c.purpose=this.value})">${esc(S.purpose)}</textarea>
      <div class="btnrow"><button class="btn btn-primary" onclick="go('report')">Report →</button></div></div>
    <div class="cardbox"><p class="lab">Your stanza ${i+1}</p><ul class="mine">${lines(i).map((t,k)=>
      `<li><span class="rk ${BALLAD.scheme[k]}">${BALLAD.scheme[k]}</span><span>${esc(t)}</span></li>`).join("")}</ul></div></div>`;
}

/* ====================== REPORT ===========================================
   One tab-separated row. The rhyme check is the first check after the
   stanza was changed. Writing is reported verbatim. */
function ymd(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function reportData(){
  const i=cur(), f=S.first[i], p=planOf();
  const mins=(S.startedAt&&S.lastAt)?Math.max(1,Math.round((S.lastAt-S.startedAt)/60000)):"";
  const rhyme=f?`${f.ok} ok · ${f.unsure} not sure · ${f.bad} not ok`+(f.miss.length?` | ${f.miss.join("; ")}`:""):"not checked";
  return { cols:["Date","First name","Last name","Code","Minutes","Stanza","Rhyme check, first try","Rewrite","Plan: what happens","Plan: who tells it","Plan: who it is for","Purpose and audience"],
           row:[ ymd(), S.fname, S.lname, S.sid, String(mins),
                 S.stanza==null?"none":`${i+1} (${ST[i].title})`, rhyme,
                 lines(i).map(t=>t.trim()).join(" / "), p.happens.trim(), p.narrator.trim(), p.audience.trim(), S.purpose.trim() ] };
}
function renderReport(){
  const r=reportData();
  $("body").innerHTML=topbar()+`<h2>Report for your teacher</h2>
    <div class="rptbox"><table class="rpt">${r.cols.map((c,k)=>`<tr><th>${esc(c)}</th><td>${esc(r.row[k])||"&nbsp;"}</td></tr>`).join("")}</table></div>
    <p class="dim">Rhyme check: the first check after the stanza was changed. The checker reads spelling, not sound. This row cannot tell whether the story works, whether the rhythm holds, or whether the voice suits the audience.</p>
    <div class="btnrow"><button class="btn btn-primary" onclick="copyRow()">Copy the row</button>
      <button class="btn btn-ghost" onclick="go('home')">All steps</button><span class="copied" id="fb" role="status"></span></div>`;
}
function copyRow(){
  const tsv=reportData().row.map(v=>String(v).replace(/[\t\n\r]+/g," ")).join("\t");
  const done=()=>{ $("fb").textContent="Copied. Paste it into the class sheet."; };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done, ()=>fallback(tsv,done));
  else fallback(tsv,done);
}
function fallback(t, done){
  const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); done(); }catch(e){} a.remove();
}

/* ---- boot ---- */
function contentErrors(){
  const bad=[];
  if(BALLAD.scheme.length!==6) bad.push("scheme needs six letters.");
  ST.forEach((s,i)=>{
    if(s.lines.length!==6) bad.push(`Stanza ${i+1} needs six lines.`);
    if(!s.jobs || s.jobs.length!==6) bad.push(`Stanza ${i+1} needs six jobs.`);
    s.lines.forEach((l,k)=>(l.t.match(/\[\[([^|\]]+)\|/g)||[]).forEach(m=>{ const key=m.slice(2,-1);
      if(!BALLAD.vocab[key]) bad.push(`Stanza ${i+1}, line ${k+1}: no vocab entry “${key}”.`); }));
  });
  if(!SWAPFAM) bad.push(`“${BALLAD.swap.to}” is not in any rhyme family.`);
  return bad;
}
(function boot(){
  const bad=contentErrors();
  if(bad.length){
    $("body").innerHTML=`<h1>Ballads</h1><div class="broken"><b>This page will not run until its content is fixed.</b>
      <ul>${bad.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;
    return;
  }
  if(!idOk()){ go("id"); return; }
  const m=(location.hash||"").replace("#","");
  go(["read","plan","rewrite","purpose","report"].indexOf(m)>=0 ? m : "home");
})();
</script>
</body>
</html>
