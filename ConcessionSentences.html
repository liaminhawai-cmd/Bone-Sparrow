<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complex sentences for concession — Writing Folio</title>
<style>
:root{
  --bg:#f1efe8; --paper:#fbfaf6; --ink:#1f1f1f; --muted:#655f55;
  --line:#d4cfc2; --line-soft:#e6e1d6; --accent:#2c5f7c;
  --correct:#2f6a3e; --okbg:#eef5ee; --wrong:#a83232; --wrongbg:#fbeeee;
  --warn:#8a5a12; --warnbg:#fdf4e3;
  /* The two halves of a complex sentence keep one colour each, everywhere
     they appear, and the legend sits beside them. */
  --sub-bg:#e6dcf7; --sub-tx:#4a2f7d;
  --main-bg:#cfe0f5; --main-tx:#17406e;
  --mpre:#2c6fa8; --mpre-bg:#e5eef5;
  --mroot:#9a5518; --mroot-bg:#f5e7d8;
  --msuf:#3f7a4a; --msuf-bg:#e6f1e8;
  --mcon:#6c6353; --mcon-bg:#ece7db;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);
     display:flex;justify-content:center;padding:18px 12px 60px}
.container{width:100%;max-width:880px;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:0 0 4px}
h2{font-family:Georgia,'Times New Roman',serif;font-size:20px;margin:0 0 10px}
h3{font-family:Georgia,serif;font-size:16px;margin:18px 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.55}
p.lead{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 14px}
.topbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 16px;font-size:13px}
.topbar .sp{margin-left:auto;display:flex;gap:14px}
.menulink{color:var(--accent);font-weight:600;text-decoration:none}
.menulink:hover{text-decoration:underline}

.btn{padding:10px 17px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
     cursor:pointer;background:var(--paper);color:var(--ink);font-family:inherit;transition:all .15s ease;
     text-decoration:none;display:inline-block}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#24506a}
.btn-ghost{background:var(--bg);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.fields{display:flex;flex-direction:column;gap:12px;max-width:420px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
      font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{line-height:1.6;resize:vertical}
.err{color:var(--wrong);font-size:12.5px;min-height:17px;margin-top:3px}

.step{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:#fff;
      border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:0 0 10px;
      font-family:inherit;font-size:15px;color:inherit;cursor:pointer;transition:border-color .15s}
.step:hover{border-color:var(--accent)}
.step .num{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
           display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.step.done .num{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
.step .t{font-weight:700}
.step .d{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.5}
.step .tag{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;
           letter-spacing:.4px;color:var(--muted);white-space:nowrap;padding-top:4px}

.deckbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
         border-radius:10px;padding:9px 14px;margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.deckbar b{color:var(--ink)}
.meter{flex:1;min-width:120px;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.cardbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 14px}
.prompt{font-size:14px;font-weight:700;margin:0 0 10px}
.stim{font-family:Georgia,serif;font-size:17px;line-height:1.6;background:var(--bg);
      border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 15px;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 14px;
     font-size:14.5px;font-family:inherit;color:inherit;cursor:pointer;line-height:1.5}
.opt:hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--correct)}
.opt.wrong{background:var(--wrongbg);border-color:var(--wrong)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{flex:0 1 auto}
.fb{border-radius:9px;padding:12px 15px;margin:14px 0 0;font-size:13.5px;line-height:1.6;display:none}
.fb.on{display:block}
.fb.ok{background:var(--okbg);border:1px solid var(--correct)}
.fb.bad{background:var(--wrongbg);border:1px solid var(--wrong)}
.fb.warn{background:var(--warnbg);border:1px solid var(--warn)}
.fb ul{margin:7px 0 0;padding-left:20px}
.fb li{margin:3px 0}
.fb .rule{display:block;font-weight:700;margin-bottom:3px}
.notjudged{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px}

/* ---- the two halves ---- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:12px;color:var(--muted)}
.legend span{white-space:nowrap}
.legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:5px}
.sw.subord{background:var(--sub-bg);border:1px solid var(--sub-tx)}
.sw.main{background:var(--main-bg);border:1px solid var(--main-tx)}
.h-sub{background:var(--sub-bg);color:var(--sub-tx)}
.h-main{background:var(--main-bg);color:var(--main-tx)}
.halves{display:flex;flex-direction:column;gap:9px;margin:0 0 6px}
.half{text-align:left;font-family:Georgia,serif;font-size:17px;line-height:1.55;background:#fff;
      border:1px solid var(--line);border-radius:9px;padding:12px 15px;cursor:pointer;color:inherit}
.half:hover{border-color:var(--accent)}
.half:disabled{cursor:default}
.half.right{background:var(--main-bg);border-color:var(--main-tx);color:var(--main-tx)}
.half.wrong{background:var(--sub-bg);border-color:var(--sub-tx);color:var(--sub-tx)}

/* ---- the comma ---- */
.gapline{font-family:Georgia,serif;font-size:18px;line-height:2.4;background:var(--bg);border-radius:8px;
         padding:14px 16px;margin:0 0 12px}
.gap{display:inline-block;width:15px;text-align:center;border-radius:4px;cursor:pointer;color:var(--line)}
.gap::after{content:"\00B7"}
.gap:hover{background:#fff;box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.gap.right{background:var(--main-bg);color:var(--main-tx);font-weight:800}
.gap.right::after{content:","}
.gap.wrong{background:var(--wrongbg);color:var(--wrong);font-weight:800}
.gap.wrong::after{content:"\00D7"}

/* ---- rails ---- */
.railrow{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;flex-wrap:wrap}
.raillab{flex:0 0 96px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
         color:var(--muted);padding-top:11px}
.railsent{font-family:Georgia,serif;font-size:17px;line-height:1.6;background:var(--bg);
          border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 15px;margin:4px 0 0}

table.rpt{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 10px;background:#fff}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.rpt th{background:var(--bg);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.dim{color:#97907f}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}

/* key words, tappable wherever they appear */
.kw{cursor:help;padding:0 1px;border-radius:3px;border-bottom:2px dotted var(--accent)}
.kw:hover,.kw:focus-visible{background:#fff;box-shadow:0 0 0 2px #fff,0 2px 10px rgba(40,30,10,.25);outline:none}
.kwpop{position:fixed;z-index:80;width:min(330px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);
       border-radius:12px;box-shadow:0 12px 34px rgba(40,30,10,.3);padding:13px 15px}
.kwpop .gx{position:absolute;top:5px;right:8px;border:0;background:none;color:var(--muted);font-size:19px;cursor:pointer;line-height:1}
.kwpop .kww{font-family:Georgia,serif;font-size:19px;font-weight:700;margin-bottom:7px}
.kwparts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 8px}
.mchip{display:inline-flex;flex-direction:column;align-items:center;border:1px solid transparent;
       border-radius:8px;padding:3px 9px;line-height:1.25;opacity:0;transform:translateY(10px) scale(.6);
       animation:chipIn .45s cubic-bezier(.2,.85,.3,1.25) forwards}
.mp{background:var(--mpre-bg); color:var(--mpre); border-color:var(--mpre)}
.mr{background:var(--mroot-bg);color:var(--mroot);border-color:var(--mroot)}
.ms{background:var(--msuf-bg); color:var(--msuf); border-color:var(--msuf)}
.mc{background:var(--mcon-bg); color:var(--mcon); border-color:var(--mcon)}
.opt.mp{background:var(--mpre-bg); color:var(--mpre); border-color:var(--mpre)}
.opt.mr{background:var(--mroot-bg);color:var(--mroot);border-color:var(--mroot)}
.opt.ms{background:var(--msuf-bg); color:var(--msuf); border-color:var(--msuf)}
.opt.mc{background:var(--mcon-bg); color:var(--mcon); border-color:var(--mcon)}
.metword{font-family:Georgia,serif;font-size:27px;font-weight:700;line-height:1.2}
.metword .pos{font-family:'Segoe UI',sans-serif;font-size:12.5px;font-weight:400;font-style:italic;color:var(--muted);margin-left:6px}
.metm{font-size:15.5px;line-height:1.6;margin:6px 0 12px}
.metnote{font-size:13px;line-height:1.65;color:var(--muted);background:var(--bg);border-radius:8px;padding:11px 14px;margin:12px 0 0}
.boardrow{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.boardrow:last-of-type{border-bottom:0}
.boardrow .eg{font-family:Georgia,serif;font-size:15.5px;line-height:1.55;color:var(--muted)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:12px}
.mlegend i{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:5px}
.slotline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px}
.mslot{min-width:62px;min-height:38px;border:1px dashed var(--line);border-radius:8px;background:#fff;
       display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px;line-height:1.2}
.mslot b{font-size:14px} .mslot small{font-size:9.5px;opacity:.85}
.mslot.mp{background:var(--mpre-bg); color:var(--mpre); border-color:var(--mpre)}
.mslot.mr{background:var(--mroot-bg);color:var(--mroot);border-color:var(--mroot)}
.mslot.ms{background:var(--msuf-bg); color:var(--msuf); border-color:var(--msuf)}
.mslot.mc{background:var(--mcon-bg); color:var(--mcon); border-color:var(--mcon)}
.mchip b{font-size:13.5px} .mchip small{font-size:10px;opacity:.85}
.mplus{font-weight:800;color:var(--muted)}
.kwm{font-size:13px;line-height:1.55}
@keyframes chipIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .mchip{animation:none;opacity:1;transform:none} }
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media screen and (max-width:860px){ .container{padding:16px} }
</style>
</head>
<body>
<div class="container"><div id="body"></div></div>

<script>
/* ============================================================================
   Extension work for the persuasive folio: the complex sentence that gives
   ground to the other side and then takes it back. Progress is written into
   the contention module's record, under its own prefix, so the teacher gets
   one report for the whole task.
   ========================================================================== */
const KEY = "writingfolio.contention.v1";
const PKEY = "bonesparrow.profile.v1";
let store = localStorage;
function blank(){ return { fname:"", lname:"", sid:"", first:{}, deckDone:false,
  draft:{ text:"", marks:[] }, pron:{}, mod:{}, tries:{}, done:{},
  concession:{ text:"" }, exported:false, startedAt:null }; }
function load(){ try{ const s=JSON.parse(store.getItem(KEY)); return (s&&typeof s==="object")?Object.assign(blank(),s):blank(); }catch(e){ return blank(); } }
let S = load();
/* Read, change, write: another folio page may be open in a second tab. */
function bump(fn){
  const cur=load(); fn(cur);
  try{ store.setItem(KEY, JSON.stringify(cur)); }catch(e){}
  S=cur;
}
function readProfile(){ try{ const p=JSON.parse(store.getItem(PKEY)); return (p&&p.sid)?p:null; }catch(e){ return null; } }
function writeProfile(){
  try{ const p=JSON.parse(store.getItem(PKEY))||{};
    store.setItem(PKEY, JSON.stringify(Object.assign(p,{v:1,fname:S.fname,lname:S.lname,sid:S.sid}))); }catch(e){}
}
(function adopt(){ const p=readProfile(); if(!p) return;
  if(S.fname && S.sid) return;
  bump(c=>{ c.fname=c.fname||p.fname||""; c.lname=c.lname||p.lname||""; c.sid=c.sid||p.sid||""; });
})();

function esc(t){ const d=document.createElement("div"); d.textContent=t==null?"":t; return d.innerHTML; }
function $(id){ return document.getElementById(id); }
function idOk(){ return S.fname && S.lname && S.sid && S.sid.length>=4 && S.sid.length<=8; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function recFirst(id, ok){ if(S.first[id]===undefined) bump(c=>{ if(c.first[id]===undefined) c.first[id]=!!ok; }); }

/* ====================== THE WORDS ======================================== */
const WORDS = [
 { w:"Concession", pos:"noun",
   eg:`<b>Although the survey covered only one school</b>, the numbers are hard to ignore.`,
   note:`Latin <i>concedere</i>, to <b>yield altogether</b>. Same <i>ced/cess</i> in <b>proceed</b>, <b>recede</b>, <b>access</b> and <b>succeed</b>. You concede a point so that the rest of your argument looks fair rather than blind.`,
   m:"Giving ground to the other side before you answer it.",
   parts:[["con-","altogether"],["cess","to go, to yield"],["-ion","the act of"]],
   decoys:[["contra-","against"],["sess","to sit"],["-ure","the result of"]],
   q:"Which sentence concedes a point?",
   opts:["Although the survey covered only one school, the numbers are hard to ignore.",
         "The survey covered only one school, so the numbers are hard to ignore.",
         "The survey covered one school and found the same result twice.",
         "Why would anybody trust a survey of one school?"],
   a:0, ex:"The first half admits the weakness. The second half carries on regardless, and that is the half the reader is left with." },
 { w:"Subordinate", pos:"adjective",
   eg:`<b>While the ban is easy to announce</b>, nobody has explained how it will be policed.`,
   note:`Latin <i>sub</i> (under) + <i>ordo</i> (rank). Same <i>ordin</i> in <b>order</b>, <b>ordinary</b>, <b>coordinate</b> and <b>insubordinate</b>. A subordinate clause has a subject and a verb of its own, and still cannot be left on its own.`,
   m:"Ranked under something else, and unable to stand on its own.",
   parts:[["sub-","under"],["ordin","rank, order"],["-ate","having"]],
   decoys:[["super-","above"],["sens","to feel"],["-ance","the state of"]],
   q:"Which one is a subordinate clause?",
   opts:["although the timetable is already crowded",
         "the timetable is already crowded at lunchtime",
         "an already crowded and inflexible timetable",
         "crowding the timetable even further"],
   a:0, ex:"It has a subject and a verb, and “although” is what stops it standing on its own." },
 { w:"Complex", pos:"adjective",
   eg:`A <b>complex</b> sentence weaves one clause into another.`,
   note:`Latin <i>plectere</i>, to <b>weave</b> or plait. Same <i>plex/plic</i> in <b>duplex</b>, <b>perplex</b>, <b>complicate</b> and <b>plait</b>. Complex is about how the parts are joined, not about how hard the sentence is to read.`,
   m:"Woven together out of a main clause and at least one ranked under it.",
   parts:[["com-","together"],["plex","to weave, to fold"]],
   decoys:[["pre-","before"],["pend","to hang"]],
   q:"Which one is a complex sentence?",
   opts:["While the ban is easy to announce, it will be hard to police.",
         "The ban is easy to announce and almost impossible to police properly.",
         "The ban is easy for a government to announce.",
         "Easy to announce. Almost impossible to police."],
   a:0, ex:"One clause is ranked under the other, and “while” is the word that ranks it. Joining two halves with “and” makes them equals, and chopping them into “Easy to announce.” makes two fragments." }
];
const GRAM_TERMS = {
  Clause      :{ parts:[["claus","to shut, to close"],["-e","(silent)"]],
    m:"A closed-off piece of a sentence with a subject and a verb in it." },
  Conjunction :{ parts:[["con-","together"],["junct","to join"],["-ion","the act of"]],
    m:"A joining word. A subordinating one ranks the clause it starts underneath the other." },
  Main        :{ parts:[["main","chief, strongest"]],
    m:"The clause that could be the whole sentence on its own. Your position goes here." }
};
let TERMS = null;
function terms(){
  if(TERMS) return TERMS;
  TERMS={};
  WORDS.forEach(w=>{ TERMS[w.w]={ parts:w.parts, m:w.m }; });
  Object.keys(GRAM_TERMS).forEach(k=>{ TERMS[k]=GRAM_TERMS[k]; });
  return TERMS;
}
/* A key word is a span, never a button: a button inside the feedback box
   swallows the click that moves the student on. */
function glossify(html){
  const T=terms(), keys=Object.keys(T).sort((a,b)=>b.length-a.length);
  const re=new RegExp("\\b("+keys.join("|")+")(s|es)?\\b","gi");
  const seen={};
  return String(html).split(/(<[^>]*>)/).map(part=>{
    if(part.charAt(0)==="<") return part;
    return part.replace(re,(m)=>{
      const base=keys.find(k=>k.toLowerCase()===m.toLowerCase().replace(/(es|s)$/,"")
                             || k.toLowerCase()===m.toLowerCase());
      if(!base || seen[base]) return m;
      seen[base]=1;
      return `<span class="kw" role="button" tabindex="0" data-w="${base}" onclick="termPop(event)"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();termPop(event);}"
        title="What does this word mean?">${m}</span>`;
    });
  }).join("");
}
function classifyMorph(piece){
  if(/^-.*-$/.test(piece)) return "mc";
  if(/^-/.test(piece)) return "ms";
  if(/-$/.test(piece)) return "mp";
  return "mr";
}
const MORPH_LEGEND = `<div class="mlegend">
  <span style="color:var(--mpre)"><i style="background:var(--mpre)"></i>prefix</span>
  <span style="color:var(--mroot)"><i style="background:var(--mroot)"></i>root</span>
  <span style="color:var(--msuf)"><i style="background:var(--msuf)"></i>suffix</span></div>`;
function termPop(ev){
  ev.stopPropagation(); ev.preventDefault();
  termPopClose();
  const w=ev.currentTarget.dataset.w, t=terms()[w]; if(!t) return;
  const d=document.createElement("div"); d.className="kwpop"; d.id="kwpop";
  d.innerHTML=`<button class="gx" onclick="termPopClose()" aria-label="close">×</button>
    <div class="kww">${esc(w)}</div>
    <div class="kwparts">${t.parts.map((x,i)=>
      `<span class="mchip ${classifyMorph(x[0])}" style="animation-delay:${90+i*150}ms"><b>${esc(x[0])}</b><small>${esc(x[1])}</small></span>`)
      .join(`<span class="mplus">+</span>`)}</div>
    <div class="kwm">${t.m}</div>`;
  document.body.appendChild(d);
  const r=d.getBoundingClientRect();
  d.style.left=Math.min(Math.max(8,ev.clientX-r.width/2), window.innerWidth-r.width-8)+"px";
  d.style.top=(ev.clientY+r.height+16>window.innerHeight ? Math.max(8,ev.clientY-r.height-14) : ev.clientY+14)+"px";
  setTimeout(()=>document.addEventListener("pointerdown", termPopAway),0);
}
function termPopAway(e){
  const pp=$("kwpop");
  if(!pp){ document.removeEventListener("pointerdown", termPopAway); return; }
  if(!pp.contains(e.target)){ pp.remove(); document.removeEventListener("pointerdown", termPopAway); }
}
function termPopClose(){ const pp=$("kwpop"); if(pp) pp.remove(); }

/* ====================== THE CARDS ========================================
   Five things to get right: which half carries the position, which word
   concedes, which form "despite" takes, where the comma goes, and which
   half to give away. The last two cards build one from parts. */
const POOL = [
 { id:"cs.main.1", type:"main", rule:"main",
   halves:["Although phones can distract students in class,","they are the fastest way to reach help in an emergency."], a:1,
   why:"The main clause is the half that could be a sentence on its own, and it is where the writer's position sits." },
 { id:"cs.main.2", type:"main", rule:"main",
   halves:["Video games cost families hundreds of dollars a year,","even though they keep teenagers in contact with their friends."], a:0,
   why:"“Even though” ranks the second half underneath, so the cost is the point being argued." },
 { id:"cs.main.3", type:"main", rule:"main",
   halves:["While the ban is easy to announce,","nobody has explained how it will be policed."], a:1,
   why:"“While” concedes that announcing it is easy. The writer's case is everything after the comma." },
 { id:"cs.main.4", type:"main", rule:"main",
   halves:["Lunchtime should be twenty minutes longer,","although the timetable is already crowded."], a:0,
   why:"The conjunction sits at the front of the second half, so that is the half ranked underneath." },

 { id:"cs.join.1", type:"pick", rule:"join",
   q:"Which word makes this a concession?",
   stim:"___ the survey covered only one school, the result is hard to ignore.",
   opts:["Although","Because","Whenever","Therefore"], a:0,
   why:"“Because” would make the small sample the reason to trust the result, which is the opposite of what the writer means." },
 { id:"cs.join.2", type:"pick", rule:"join",
   q:"Which word makes this a concession?",
   stim:"___ the law passed easily, nobody has explained how it will work.",
   opts:["Though","Since","Therefore","Whenever"], a:0,
   why:"“Since” and “therefore” make the easy passage a reason. The writer is using it as the point to argue past, and “though” is “although” with the front worn off." },
 { id:"cs.join.3", type:"pick", rule:"join",
   q:"Which word makes this a concession?",
   stim:"The platforms promise to check ages, ___ they have never managed it before.",
   opts:["though","because","so","and"], a:0,
   why:"“And” only adds the second half on. “Although” ranks it underneath and turns it into the point the writer is arguing past." },

 { id:"cs.prep.1", type:"pick", rule:"prep",
   q:"Which one is written correctly?",
   opts:["Despite the ban, teenagers still find a way online.",
         "Despite the ban was introduced, teenagers still find a way online.",
         "Despite of the ban, teenagers still find a way online.",
         "Although the ban, teenagers still find a way online."], a:0,
   why:"“Despite” takes a noun. “Although” takes a clause with a subject and a verb. Neither of them takes “of”." },
 { id:"cs.prep.2", type:"pick", rule:"prep",
   q:"Which one is written correctly?",
   opts:["Although the evidence is thin, the article states its case with total confidence.",
         "Despite the evidence is thin, the article states its case with total confidence.",
         "Despite of thin evidence, the article states its case with total confidence.",
         "Although thin evidence, the article states its case with total confidence."], a:0,
   why:"“The evidence is thin” is a clause, so it needs “although”. To keep “despite” you would have to cut it back to a noun: <i>despite the thin evidence</i>." },

 { id:"cs.comma.1", type:"comma", rule:"comma",
   t:"Although the ban is popular the detail has never been explained.", a:4,
   why:"The subordinate clause runs to “popular”. After that the main clause starts, and the comma marks the join." },
 { id:"cs.comma.2", type:"comma", rule:"comma",
   t:"Even though the platforms promised to check ages last year nothing has changed.", a:9,
   why:"Everything up to “year” belongs to “even though”. “Nothing has changed” is the clause that could stand alone." },
 { id:"cs.comma.3", type:"comma", rule:"comma",
   t:"While the figures look dramatic they come from a single school.", a:4,
   why:"“While the figures look dramatic” cannot be a sentence on its own, so the comma goes at the end of it." },

 { id:"cs.order.1", type:"order", rule:"order",
   pos:"Phones should be allowed to stay in schools.",
   opts:["Although phones distract some students, they are the fastest way to reach help.",
         "Although phones are the fastest way to reach help, they distract some students.",
         "Phones distract some students, and they are the fastest way to reach help.",
         "Phones distract some students."], a:0,
   why:"Conceding that phones reach help fastest gives away your own point. Joining the two halves with “and” takes no side at all." },
 { id:"cs.order.2", type:"order", rule:"order",
   pos:"Lunchtime should be twenty minutes longer.",
   opts:["Even though the timetable is crowded, students need time to eat.",
         "Even though students need time to eat, the timetable is crowded.",
         "The timetable is crowded, so students need time to eat.",
         "Students need time to eat and the timetable is crowded."], a:0,
   why:"Whatever you rank underneath is the half you are giving away. Give away the other side's point, never your own." },

 { id:"cs.build.1", type:"build", rule:"build",
   other:"A longer lunch would cut into class time.",
   claim:"Lunchtime should be twenty minutes longer.",
   sub:[["Although a longer lunch would cut into class time",1],
        ["Because a longer lunch would cut into class time",0,"“Because” makes the objection your reason, so you end up arguing their case."],
        ["A longer lunch would cut into class time",0,"With no conjunction in front of it, this is a main clause, and it states the other side's point as your own."]],
   main:[["students would finally have time to finish a meal",1],
         ["the timetable is already crowded",0,"That repeats the objection instead of answering it."],
         ["lunch is too short for anybody",0,"That is the same complaint again. The main clause has to move the argument on."]] },
 { id:"cs.build.2", type:"build", rule:"build",
   other:"Most teenagers already know how to get around a ban.",
   claim:"The age limit is still worth having.",
   sub:[["Even though most teenagers already know how to get around a ban",1],
        ["So most teenagers already know how to get around a ban",0,"“So” turns the objection into your conclusion."],
        ["Most teenagers already know how to get around a ban",0,"Without a conjunction it stands on its own, and your own position never arrives."]],
   main:[["the limit still makes the platforms responsible for checking",1],
         ["the ban will never work",0,"That agrees with the objection and drops your own position."],
         ["most teenagers are good at computers",0,"True or not, it does not answer the objection."]] }
];
const RULE_LABEL = {
  main:"Finding the main clause", join:"Choosing the conjunction",
  prep:"Despite or although",     comma:"Where the comma goes",
  order:"Which half to give away", build:"Building one"
};

/* ====================== ROUTER =========================================== */
let screen="home";
function go(s){
  if(!idOk() && s!=="id") s="id";
  screen=s;
  window.scrollTo({top:0,behavior:"smooth"});
  if(s==="id") renderId();
  else if(s==="home") renderHome();
  else if(s==="words") renderWords();
  else if(s==="deck") startDeck();
  else if(s==="write") renderWrite();
}
function topbar(){
  return `<div class="topbar">
    <span class="sp">
      <a class="menulink" href="WritingFolio.html">&#8962; Folio menu</a>
      <a class="menulink" href="#" onclick="go('home');return false;">All steps</a>
    </span></div>`;
}
function renderId(){
  $("body").innerHTML=`<h1>Complex sentences for concession</h1>
  <p class="sub">Your work saves on this device under your name and student code.</p>
  <div class="fields">
    <span><label for="idf">First name</label><input id="idf" autocomplete="off" value="${esc(S.fname)}"><div class="err" id="ef"></div></span>
    <span><label for="idl">Last name</label><input id="idl" autocomplete="off" value="${esc(S.lname)}"><div class="err" id="el"></div></span>
    <span><label for="ids">Student code</label><input id="ids" maxlength="8" autocomplete="off" value="${esc(S.sid)}"><div class="err" id="es"></div></span>
  </div>
  <div class="btnrow"><button class="btn btn-primary" onclick="idSubmit()">Start →</button></div>`;
  $("ids").addEventListener("keydown", e=>{ if(e.key==="Enter") idSubmit(); });
}
function idSubmit(){
  const f=$("idf").value.trim(), l=$("idl").value.trim(), s=$("ids").value.trim();
  $("ef").textContent = f?"":"We need your first name.";
  $("el").textContent = l?"":"We need your last name.";
  $("es").textContent = (s.length>=4&&s.length<=8)?"":"That doesn't look right: check your student code and try again.";
  if(!f||!l||s.length<4||s.length>8) return;
  bump(c=>{ c.fname=f; c.lname=l; c.sid=s; c.startedAt=c.startedAt||Date.now(); });
  writeProfile();
  go("home");
}

function deckScore(){
  const ks=POOL.map(c=>c.id).filter(id=>S.first[id]!==undefined);
  return { got:ks.filter(k=>S.first[k]).length, total:ks.length };
}
function renderHome(){
  const sc=deckScore(), sent=(S.concession&&S.concession.text||"").trim();
  const steps=[
    { t:"The words", d:"Concession, subordinate, complex.",
      tag:S.first["cswordsdone"]?"done":"", done:!!S.first["cswordsdone"], go:"words" },
    { t:"The cards", d:"A card you get wrong goes back in, with another one like it.",
      tag:S.first["csdeckdone"]?"done":(sc.total?`${sc.got}/${sc.total} first go`:""),
      done:!!S.first["csdeckdone"], go:"deck" },
    { t:"Write one", d:"One concession sentence for your own piece.",
      tag:sent?"written":"", done:!!sent, go:"write" }
  ];
  let h=topbar()+`<h1>Complex sentences for concession</h1>
  <p class="sub">${esc(S.fname)} ${esc(S.lname)} · ${esc(S.sid)}</p>`;
  steps.forEach((st,i)=>{
    h+=`<button class="step ${st.done?"done":""}" onclick="go('${st.go}')">
      <span class="num">${st.done?"✓":i+1}</span>
      <span><span class="t">${esc(st.t)}</span><br><span class="d">${esc(st.d)}</span></span>
      <span class="tag">${esc(st.tag)}</span></button>`;
  });
  $("body").innerHTML=h;
}

/* ====================== STEP 1 · THE WORDS =============================== */
let W = null;
function nword(n){ return ["no","one","two","three","four","five","six","seven","eight"][n]||String(n); }
function renderWords(){
  W = W || { board:true, order:shuffle(WORDS.map((_,k)=>k)), at:0, picked:[], tried:{} };
  if(!W.order) W.order = WORDS.map((_,k)=>k);
  if(W.at===undefined) W.at=0;
  if(W.i===undefined) W.i=W.order[W.at];
  if(!W.phase) W.phase="build";

  if(W.board){
    $("body").innerHTML = topbar()+`<h2>The words</h2>
      <p class="lead">Read all ${nword(WORDS.length)} before you start.</p>
      <div class="cardbox">
        ${WORDS.map(w=>`<div class="boardrow">
          <div class="metword" style="font-size:21px">${esc(w.w)} <span class="pos">${esc(w.pos||"")}</span></div>
          <p class="metm" style="margin:3px 0 6px;font-size:14.5px">${esc(w.m)}</p>
          <div class="eg">${w.eg}</div></div>`).join("")}
        <div class="btnrow"><button class="btn btn-primary nextb" onclick="W.board=false;renderWords()">Start →</button></div>
      </div>`;
    return;
  }

  const item = WORDS[W.i];
  if(W.at>=W.order.length || !item){
    recFirst("cswordsdone", true);
    $("body").innerHTML = topbar()+`<h2>The words</h2>
      <div class="fb ok on">All ${nword(WORDS.length)} words built and used.</div>
      <div class="btnrow"><button class="btn btn-primary" onclick="go('deck')">The cards →</button>
      <button class="btn btn-ghost" onclick="W=null;go('words')">Again</button>
      <button class="btn btn-ghost" onclick="go('home')">All steps</button></div>`;
    return;
  }
  const phaseN = (W.phase==="use") ? 1 : 0;
  let h=topbar()+`<h2>The words</h2>
    <div class="deckbar"><b>${W.at+1} of ${WORDS.length}</b>
      <span class="meter"><i style="width:${Math.round(100*(W.at+phaseN/2)/WORDS.length)}%"></i></span>
      <span>${["build it","use it"][phaseN]}</span></div>`;

  if(W.phase==="build"){
    const tiles = shuffle(item.parts.concat(item.decoys));
    h+=`<div class="cardbox">
      <p class="prompt">Build the word that means this, part by part, in order:</p>
      <div class="stim" style="font-family:'Segoe UI',sans-serif;font-size:15px">${esc(item.m)}</div>
      ${MORPH_LEGEND}
      <div class="stim"><div class="slotline" id="slot">${
        item.parts.map((p,i)=>{
          const got=W.picked[i];
          return got
            ? `<span class="mslot ${classifyMorph(got[0])}" style="border-style:solid"><b>${esc(got[0])}</b><small>${esc(got[1])}</small></span>`
            : `<span class="mslot"></span>`;
        }).join(`<span class="mplus">+</span>`)}</div></div>
      <div class="chips" id="tiles">
        ${tiles.map((t,i)=>`<button class="opt ${classifyMorph(t[0])}" data-i="${i}" onclick="wordTile(${i})">${esc(t[0])} <small style="opacity:.8">${esc(t[1])}</small></button>`).join("")}
      </div>
      <div class="btnrow"><button class="btn btn-ghost" onclick="W.picked=[];renderWords()">Clear</button></div>
      <div class="fb" id="fb"></div></div>`;
    $("body").innerHTML=h;
    window.__tiles = tiles;
    return;
  }
  /* phase: use */
  const opts = W.optOrder || (W.optOrder = shuffle(item.opts.map((t,i)=>({t,i}))));
  h+=`<div class="cardbox">
    <p class="prompt">${esc(item.q)}</p>
    ${item.stim?`<div class="stim">${esc(item.stim)}</div>`:""}
    <div class="opts">${opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="wordAnswer(${o.i},${k})">${esc(o.t)}</button>`).join("")}</div>
    <div class="fb" id="fb"></div></div>`;
  $("body").innerHTML=h;
}
function wordTile(i){
  const item=WORDS[W.i], t=window.__tiles[i];
  W.picked.push(t);
  const want = item.parts, n = W.picked.length;
  if(W.picked[n-1][0] !== want[n-1][0]){
    if(!W.tried["b"+W.i]){ W.tried["b"+W.i]=true; recFirst("csw.build."+item.w, false); }
    W.picked.pop();
    renderWords();
    const fb=$("fb"); fb.className="fb bad on";
    fb.innerHTML=`<span class="rule">Not that part, or not yet.</span>${esc(t[0])} means “${esc(t[1])}”. ${n===1?"Start with the part that comes first in the word.":"The part you need next comes straight after “"+esc(want[n-2][0])+"”."}`;
    return;
  }
  if(W.picked.length===want.length){
    if(!W.tried["b"+W.i]){ W.tried["b"+W.i]=true; recFirst("csw.build."+item.w, true); }
    W.phase="use"; W.optOrder=null; renderWords();
    const fb=$("fb"); fb.className="fb ok on";
    fb.innerHTML=`<b>${esc(item.w)}</b> = `+want.map(p=>
      `<span class="mchip ${classifyMorph(p[0])}" style="animation:none;opacity:1;transform:none"><b>${esc(p[0])}</b><small>${esc(p[1])}</small></span>`)
      .join(`<span class="mplus"> + </span>`)+`<div class="metnote" style="margin-top:10px">${item.note}</div>`;
    return;
  }
  renderWords();
}
function wordAnswer(i,k){
  const item=WORDS[W.i], ok = (i===item.a);
  if(!W.tried["u"+W.i]){ W.tried["u"+W.i]=true; recFirst("csw.use."+item.w, ok); }
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("o"+k).classList.add(ok?"right":"wrong");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML = (ok?"":`<span class="rule">Not that one.</span>`)+glossify(item.ex)+
    `<div class="btnrow"><button class="btn btn-primary nextb" onclick="wordNext()">${ok?"Next →":"Keep going →"}</button></div>`;
}
function wordNext(){
  W.at++; W.i=W.order[W.at]; W.phase="build"; W.picked=[]; W.optOrder=null; renderWords();
}

/* ====================== STEP 2 · THE CARDS ===============================
   A card leaves for good after two right answers in a row. A wrong answer
   resets its streak, puts it back four cards later, and pulls in another
   card testing the same rule. */
const RETIRE_STREAK = 2;
const PENALTY_GAP = 4;
let D = null;
function startDeck(){
  D = { queue: shuffle(POOL.map(c=>({ id:c.id, streak:0 }))), phase:null, pick:{}, tried:{}, clean:true };
  renderCard();
}
function card(id){ return POOL.find(c=>c.id===id); }
function deckDone(){
  recFirst("csdeckdone", true);
  const sc=deckScore();
  $("body").innerHTML=topbar()+`<h2>The cards</h2>
    <div class="fb ok on">Deck clear. First go: <b>${sc.got} of ${sc.total}</b>.</div>
    <div class="btnrow"><button class="btn btn-primary" onclick="go('write')">Write one →</button>
    <button class="btn btn-ghost" onclick="startDeck()">Again</button>
    <button class="btn btn-ghost" onclick="go('home')">All steps</button></div>`;
}
function missCard(entry){
  entry.streak=0;
  D.queue.shift();
  const at=Math.min(PENALTY_GAP, D.queue.length);
  D.queue.splice(at,0,entry);
  const rule=card(entry.id).rule;
  const sib=POOL.find(c=>c.rule===rule && c.id!==entry.id && !D.queue.some(q=>q.id===c.id));
  if(sib) D.queue.splice(Math.min(at+1,D.queue.length),0,{ id:sib.id, streak:0 });
}
function hitCard(entry){
  entry.streak++;
  D.queue.shift();
  if(entry.streak<RETIRE_STREAK) D.queue.splice(Math.min(PENALTY_GAP+1,D.queue.length),0,entry);
}
function deckBar(){
  const retired=POOL.length-new Set(D.queue.map(q=>q.id)).size;
  return `<div class="deckbar"><b>${D.queue.length} in the deck</b>
    <span class="meter"><i style="width:${Math.round(100*retired/POOL.length)}%"></i></span>
    <span>${retired} of ${POOL.length} gone for good</span></div>`;
}
function renderCard(){
  if(!D.queue.length){ deckDone(); return; }
  const c=card(D.queue[0].id);
  D.phase=null; D.pick={}; D.order=null; D.order2=null; D.clean=true;
  let h=topbar()+`<h2>The cards</h2>`+deckBar();
  if(c.type==="main") h+=cardMain(c);
  else if(c.type==="pick") h+=cardPick(c);
  else if(c.type==="comma") h+=cardComma(c);
  else if(c.type==="order") h+=cardOrder(c);
  else h+=cardBuild(c);
  $("body").innerHTML=glossify_safe(h);
}
/* Only the prompt. A key word inside an option button swallows the click the
   card depends on, and inside a textarea it would rewrite what the student
   typed. */
function glossify_safe(h){
  return h.replace(/<p class="prompt">([\s\S]*?)<\/p>/g, (m,inner)=>`<p class="prompt">${glossify(inner)}</p>`);
}
function fbBox(){ return `<div class="fb" id="fb"></div>`; }
function nextBtn(label){ return `<div class="btnrow"><button class="btn btn-primary nextb" id="nextBtn" onclick="renderCard()">${label||"Next card →"}</button></div>`; }
function halfLegend(){
  return `<div class="legend"><span><i class="sw main"></i>main clause</span>
    <span><i class="sw subord"></i>subordinate clause</span></div>`;
}

function cardMain(c){
  return `<div class="cardbox">
    <p class="prompt">Click the main clause: the half that carries the writer's position.</p>
    ${halfLegend()}
    <div class="halves">${c.halves.map((t,i)=>
      `<button class="half" id="h${i}" onclick="ansMain(${i})">${esc(t)}</button>`).join("")}</div>
    ${fbBox()}</div>`;
}
function ansMain(i){
  const c=card(D.queue[0].id), ok=(i===c.a);
  recFirst(c.id, ok);
  document.querySelectorAll(".half").forEach(b=>b.disabled=true);
  $("h"+c.a).classList.add("right");
  if(!ok) $("h"+i).classList.add("wrong");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?"":`<span class="rule">The other half.</span>`)+glossify(c.why)+nextBtn(ok?"Next card →":"Back in the deck →");
  ok ? hitCard(D.queue[0]) : missCard(D.queue[0]);
}

function cardPick(c){
  const opts = D.order || (D.order = shuffle(c.opts.map((t,i)=>({t,i}))));
  return `<div class="cardbox">
    <p class="prompt">${esc(c.q)}</p>
    ${c.stim?`<div class="stim">${esc(c.stim)}</div>`:""}
    <div class="${c.opts.every(o=>o.length<14)?"chips":"opts"}">${opts.map((o,k)=>
      `<button class="opt" id="o${k}" onclick="ansPick(${o.i},${k})">${esc(o.t)}</button>`).join("")}</div>
    ${fbBox()}</div>`;
}
function ansPick(i,k){
  const c=card(D.queue[0].id), ok=(i===c.a);
  recFirst(c.id, ok);
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("o"+k).classList.add(ok?"right":"wrong");
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?"":`<span class="rule">Not that one.</span>`)+glossify(c.why)+
    (c.stim?`<div class="stim" style="margin:9px 0 0">${esc(c.stim.replace("___", c.opts[c.a]))}</div>`:"")+
    nextBtn(ok?"Next card →":"Back in the deck →");
  ok ? hitCard(D.queue[0]) : missCard(D.queue[0]);
}

function cardComma(c){
  const ws=c.t.replace(/\.$/,"").split(/\s+/);
  let line="";
  ws.forEach((w,i)=>{
    line+=esc(w);
    if(i<ws.length-1) line+=`<span class="gap" id="g${i}" title="put the comma here" onclick="ansComma(${i})"></span> `;
  });
  return `<div class="cardbox">
    <p class="prompt">Click where the subordinate clause ends and the comma belongs.</p>
    <div class="gapline">${line}.</div>
    ${fbBox()}</div>`;
}
function ansComma(i){
  const c=card(D.queue[0].id), ok=(i===c.a);
  recFirst(c.id, ok);
  document.querySelectorAll(".gap").forEach(g=>g.onclick=null);
  $("g"+c.a).classList.add("right");
  if(!ok) $("g"+i).classList.add("wrong");
  const ws=c.t.replace(/\.$/,"").split(/\s+/);
  const done=ws.slice(0,c.a+1).join(" ")+", "+ws.slice(c.a+1).join(" ")+".";
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"bad")+" on";
  fb.innerHTML=(ok?"":`<span class="rule">Not there.</span>`)+glossify(c.why)+
    `<div class="stim" style="margin:9px 0 0"><span class="h-sub">${esc(ws.slice(0,c.a+1).join(" "))},</span> <span class="h-main">${esc(ws.slice(c.a+1).join(" "))}.</span></div>`+
    nextBtn(ok?"Next card →":"Back in the deck →");
  ok ? hitCard(D.queue[0]) : missCard(D.queue[0]);
}

function cardOrder(c){
  const opts = D.order || (D.order = shuffle(c.opts.map((t,i)=>({t,i}))));
  return `<div class="cardbox">
    <p class="prompt">Your position: ${esc(c.pos)}</p>
    <p class="prompt" style="font-weight:400;color:var(--muted)">Which sentence argues for it?</p>
    <div class="opts">${opts.map((o,k)=>
      `<button class="opt" id="o${k}" onclick="ansPick(${o.i},${k})">${esc(o.t)}</button>`).join("")}</div>
    ${fbBox()}</div>`;
}

function cardBuild(c){
  D.phase = D.phase || "sub";
  const kind = D.phase;
  const list = D.order2 && D.order2[kind] ? D.order2[kind] : null;
  if(!list){ D.order2 = D.order2 || {}; D.order2[kind] = shuffle(c[kind]); }
  const opts = D.order2[kind];
  let h=`<div class="cardbox">
    <p class="prompt">They say: ${esc(c.other)}</p>
    <p class="prompt" style="font-weight:400;color:var(--muted)">You say: ${esc(c.claim)}</p>
    ${halfLegend()}`;
  if(D.pick.sub){
    h+=`<div class="railrow"><span class="raillab">Give ground</span>
      <span class="half h-sub" style="flex:1;cursor:default">${esc(D.pick.sub)}</span></div>`;
  }
  h+=`<div class="railrow"><span class="raillab">${kind==="sub"?"Give ground":"Take it back"}</span>
    <span style="flex:1;min-width:240px"><div class="opts">${opts.map((o,k)=>
      `<button class="opt" id="o${k}" onclick="ansBuild('${kind}',${k})">${esc(o[0])}</button>`).join("")}</div></span></div>
    ${fbBox()}</div>`;
  return h;
}
function ansBuild(kind, k){
  const c=card(D.queue[0].id), o=D.order2[kind][k], ok=!!o[1];
  if(!ok){
    D.clean=false; recFirst(c.id, false);
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    $("o"+k).classList.add("wrong");
    const fb=$("fb"); fb.className="fb bad on";
    fb.innerHTML=`<span class="rule">Not that one.</span>${glossify(o[2]||"")}
      <div class="btnrow"><button class="btn btn-primary nextb" onclick="againBuild()">Try it again →</button></div>`;
    return;
  }
  D.pick[kind]=o[0];
  if(kind==="sub"){ D.phase="main"; renderCardKeep(); return; }
  recFirst(c.id, D.clean);
  const body=document.getElementById("body");
  body.innerHTML=glossify_safe(topbar()+`<h2>The cards</h2>`+deckBar()+`<div class="cardbox">
    <p class="prompt">They say: ${esc(c.other)}</p>
    ${halfLegend()}
    <div class="railsent"><span class="h-sub">${esc(D.pick.sub)},</span> <span class="h-main">${esc(D.pick.main)}.</span></div>
    <div class="fb ok on">The objection is ranked underneath, and your own point is the clause that can stand on its own.
      ${nextBtn(D.clean?"Next card →":"Back in the deck →")}</div></div>`);
  D.clean ? hitCard(D.queue[0]) : missCard(D.queue[0]);
}
function againBuild(){ D.order2=null; D.pick={}; D.phase="sub"; renderCardKeep(); }
function renderCardKeep(){
  const c=card(D.queue[0].id);
  $("body").innerHTML=glossify_safe(topbar()+`<h2>The cards</h2>`+deckBar()+cardBuild(c));
}

/* ====================== STEP 3 · WRITE ONE ===============================
   Judged on what a machine can actually see. Everything else is named and
   handed back to the teacher. */
const CONJ = ["even though","although","whereas","while","though"];
function tidy(t){
  let s=t.trim().replace(/\s+/g," ");
  if(s) s=s.charAt(0).toUpperCase()+s.slice(1);
  if(s && !/[.!?]$/.test(s)) s+=".";
  return s;
}
function judgeCs(raw){
  const s=tidy(raw), low=" "+s.toLowerCase()+" ";
  const words=s.split(/\s+/).filter(Boolean);
  const found=CONJ.find(c=>low.indexOf(" "+c+" ")>=0);
  const miss=[];
  if(words.length<8) miss.push("It is "+words.length+" words long. A concession sentence needs both halves in it.");
  if(!found){
    miss.push(/despite|in spite of/i.test(s)
      ? "“Despite” takes a noun rather than a clause. This one wants a conjunction: although, even though, though, while or whereas."
      : "There is no concession word in it: although, even though, though, while or whereas.");
  }
  if(found && low.indexOf(" "+found+" ")===0 && s.indexOf(",")<0)
    miss.push("It starts with “"+found+"”, so a comma has to mark where the main clause begins.");
  return { tidy:s, ok:!miss.length, miss:miss, conj:found||null };
}
function renderWrite(){
  const cur=(S.concession&&S.concession.text)||"";
  $("body").innerHTML=topbar()+`<h2>Write one</h2>
  <p class="lead">${glossify("Write one sentence that gives ground to the other side and then answers it. Put your own position in the main clause.")}</p>
  <textarea id="csIn" rows="4" placeholder="Start typing.">${esc(cur)}</textarea>
  <div class="btnrow"><button class="btn btn-primary" onclick="checkCs()">Check it</button>
    <button class="btn btn-ghost" onclick="go('home')">All steps</button></div>
  <div class="fb" id="fb"></div>`;
}
function checkCs(){
  const raw=$("csIn").value||"";
  const j=judgeCs(raw);
  const fb=$("fb");
  if(!j.ok){
    fb.className="fb bad on";
    fb.innerHTML=`<span class="rule">Not yet.</span><ul>${j.miss.map(m=>`<li>${glossify(m)}</li>`).join("")}</ul>`;
    return;
  }
  bump(c=>{ c.concession={ text:j.tidy, at:Date.now() }; });
  $("csIn").value=j.tidy;
  fb.className="fb ok on";
  fb.innerHTML=`<span class="rule">Saved for your report.</span>
    <div class="stim" style="margin:6px 0 0">${esc(j.tidy)}</div>
    <div class="notjudged">Not checked: whether the first half is really the other side's point, and whether the second half answers it. That part is your teacher's call.</div>
    <div class="btnrow"><button class="btn btn-primary nextb" onclick="go('home')">All steps →</button></div>`;
}

/* ---- boot ---- */
(function boot(){
  if(!idOk()){ go("id"); return; }
  const m=(location.hash||"").replace("#","");
  go(["words","deck","write"].includes(m) ? m : "home");
})();
