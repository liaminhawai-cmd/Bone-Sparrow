name: Deploy hubs to GitHub Pages

# Publishes the interactive hubs, a landing page, and the /teacher tab
# (print resources and the slide decks) — not the lesson source material
# otherwise. Every page links back to the hub its main audience starts
# from, and the two hubs link to each other. The Pages site is public
# even though it deploys from a subset of the repo.
on:
  push:
    branches: [main, claude/bone-sparrow-units-planning-l9ptqq]
    paths:
      - "BoneSparrowReadingHub.html"
      - "BoneSparrowVocabHub.html"
      - "BoneSparrowWagollSheets.html"
      - "BoneSparrowWagollWall.html"
      - "BoneSparrowClimbCards.html"
      - "GrammarHuboffline.html"
      - "bonesparrowtrainer.html"
      - "BoneSparrowThreeWays.html"
      - "BoneSparrowThreeWaysDeck.html"
      - "BoneSparrowTeel.html"
      - "index.html"
      - "teacher/*.html"
      - "BoneSparrow-A3-booklet*.docx"
      - "BoneSparrow-stations.docx"
      - "BoneSparrow-TEEL-*.docx"
      - "BoneSparrow-essay-planner.docx"
      - "BoneSparrow-assessment-*.docx"
      - "BoneSparrow-folio-*.docx"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Repair purpose TEEL deck
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("teacher/teel-purpose.html")
          s = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f"Could not find patch target: {label}")
              s = s.replace(old, new, 1)

          replace_once(
              '<div class="cloudfoot"><span>Tap to agree, again to disagree, again to clear. The first two ideas you agree with become the paragraphs; the yellow ones are evidence.</span><span class="sp"></span><button class="reset">Start again</button></div>',
              '<div class="cloudfoot"><span>Tap to test an idea: ✓ agree, ✗ disagree. The first two paragraph-ready ideas you agree with become P1 and P2; yellow bubbles are evidence.</span><span class="sp"></span><button class="reset">Start again</button></div>',
              "cloud instructions",
          )

          replace_once(
              ''' {t:"she explains how detention centres are run"},
 {t:"she makes the reader laugh at Subhi"},
 {t:"she wants the reader to feel sorry for the Jackets"},
 {t:"she teaches the reader about ducks"},
 {t:"she keeps the ending a secret"}''',
              ''' {kind:"test",t:"she explains what happens in detention"},
 {kind:"test",t:"she makes the reader feel sorry for Subhi"},
 {kind:"test",t:"she tells the reader the camp is unfair"}''',
              "weak distractors",
          )

          replace_once(
              'const KEY="bonesparrow.teelPurpose.v1";',
              'const KEY="bonesparrow.teelPurpose.v2";',
              "state version",
          )

          replace_once(
              '''function seed(which,o){
  S.seeded=S.seeded||{};
  const B=S.boxes[which], sd=S.seeded[which]||{};
  const T=SENT.T(o), L=SENT.Lseed(o);
  if(!B[0].trim()||B[0]===sd.T) B[0]=T;
  if(!B[3].trim()||B[3]===sd.L) B[3]=L;
  S.seeded[which]={T,L}; save();
}''',
              '''function seed(which,o){
  S.seeded=S.seeded||{};
  const B=S.boxes[which], sd=S.seeded[which]||{}, key=o.t;
  /* A paragraph belongs to one idea. If P1/P2 changes, stale evidence from
     the old idea is worse than an empty scaffold, so clear the paragraph. */
  if(sd.key && sd.key!==key){
    B.splice(0,4,"","","","");
    if(which==="im") S.typedIm=false;
  }
  const T=SENT.T(o), L=SENT.Lseed(o);
  if(!B[0].trim()||B[0]===sd.T) B[0]=T;
  if(!B[3].trim()||B[3]===sd.L) B[3]=L;
  S.seeded[which]={T,L,key}; save();
}''',
              "paragraph reseed",
          )

          replace_once(
              '''const kindOf=o=>(o&&o.i>=0&&POOL[live.name]&&POOL[live.name][o.i])?POOL[live.name][o.i].kind:null;
function nodeEl(o){''',
              '''const kindOf=o=>(o&&o.i>=0&&POOL[live.name]&&POOL[live.name][o.i])?POOL[live.name][o.i].kind:null;
const paragraphReady=o=>kindOf(o)!=="ev"&&kindOf(o)!=="test";
function nodeEl(o){''',
              "paragraph-ready helper",
          )

          replace_once(
              '''  /* a quote is evidence, never a paragraph of its own */
  if(o.st!==1 || kindOf(o)==="ev") o.pick=0;
  else { const cur=st.nodes.filter(x=>x.pick).sort((a,b)=>a.pick-b.pick);''',
              '''  /* Evidence and deliberately weak test bubbles can be discussed, but
     they never become the paragraph heading. Student/teacher-added ideas can. */
  if(o.st!==1 || !paragraphReady(o)) o.pick=0;
  else { const cur=st.nodes.filter(x=>x.pick).sort((a,b)=>a.pick-b.pick);''',
              "selection guard",
          )

          path.write_text(s, encoding="utf-8")
          PY

          if ! git diff --quiet -- teacher/teel-purpose.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add teacher/teel-purpose.html
            git commit -m "Fix purpose TEEL paragraph selection"
            git push
          fi
      - name: Assemble site
        run: |
          mkdir dist
          cp index.html dist/
          cp BoneSparrowReadingHub.html dist/
          cp BoneSparrowVocabHub.html dist/
          cp BoneSparrowWagollSheets.html dist/
          cp BoneSparrowWagollWall.html dist/
          cp BoneSparrowClimbCards.html dist/
          cp GrammarHuboffline.html dist/
          cp bonesparrowtrainer.html dist/
          cp BoneSparrowThreeWays.html dist/
          cp BoneSparrowThreeWaysDeck.html dist/
          cp BoneSparrowTeel.html dist/
          mkdir dist/teacher
          cp teacher/*.html dist/teacher/
          cp BoneSparrow-A3-booklet*.docx BoneSparrow-stations.docx BoneSparrow-TEEL-*.docx BoneSparrow-essay-planner.docx BoneSparrow-assessment-*.docx BoneSparrow-folio-*.docx dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
