name: Deploy hubs to GitHub Pages

# Publishes ONLY the interactive hubs (plus a landing page) — not the
# lesson resources, PDFs or docs. The Pages site is public even though
# it deploys from a subset of the repo.
on:
  push:
    branches: [main, claude/bone-sparrow-units-planning-l9ptqq]
    paths:
      - "BoneSparrowReadingHub.html"
      - "BoneSparrowVocabHub.html"
      - "BoneSparrowWagollSheets.html"
      - "BoneSparrowWagollWall.html"
      - "GrammarHuboffline.html"
      - "bonesparrowtrainer.html"
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (hubs only)
        run: |
          mkdir dist
          cp index.html dist/
          cp BoneSparrowReadingHub.html dist/
          cp BoneSparrowVocabHub.html dist/
          cp BoneSparrowWagollSheets.html dist/
          cp BoneSparrowWagollWall.html dist/
          cp GrammarHuboffline.html dist/
          cp bonesparrowtrainer.html dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
