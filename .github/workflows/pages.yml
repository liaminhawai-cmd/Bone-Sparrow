name: Deploy hubs to GitHub Pages

# Publishes the interactive hubs, a landing page, and the /teacher tab
# (print resources, unlinked from the student-facing pages) — not the
# lesson source material otherwise. The Pages site is public even though
# it deploys from a subset of the repo.
on:
  push:
    branches: [main, claude/bone-sparrow-units-planning-l9ptqq]
    paths:
      - "BoneSparrowReadingHub.html"
      - "BoneSparrowVocabHub.html"
      - "BoneSparrowWagollSheets.html"
      - "BoneSparrowWagollWall.html"
      - "BoneSparrowClimbCards.html"
      - "GrammarHuboffline.html"
      - "bonesparrowtrainer.html"
      - "BoneSparrowThreeWays.html"
      - "BoneSparrowThreeWaysDeck.html"
      - "index.html"
      - "teacher/index.html"
      - "BoneSparrow-A3-booklet.docx"
      - "BoneSparrow-stations.docx"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir dist
          cp index.html dist/
          cp BoneSparrowReadingHub.html dist/
          cp BoneSparrowVocabHub.html dist/
          cp BoneSparrowWagollSheets.html dist/
          cp BoneSparrowWagollWall.html dist/
          cp BoneSparrowClimbCards.html dist/
          cp GrammarHuboffline.html dist/
          cp bonesparrowtrainer.html dist/
          cp BoneSparrowThreeWays.html dist/
          cp BoneSparrowThreeWaysDeck.html dist/
          mkdir dist/teacher
          cp teacher/index.html dist/teacher/
          cp BoneSparrow-A3-booklet.docx BoneSparrow-stations.docx dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
