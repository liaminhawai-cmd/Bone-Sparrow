name: Deploy hubs to GitHub Pages

# Publishes the interactive hubs, a landing page, and the /teacher tab
# (print resources and the slide decks) — not the lesson source material
# otherwise. Every page links back to the hub its main audience starts
# from, and the two hubs link to each other. The Pages site is public
# even though it deploys from a subset of the repo.
on:
  push:
    branches: [main, claude/bone-sparrow-units-planning-l9ptqq]
    paths:
      - "BoneSparrowReadingHub.html"
      - "BoneSparrowVocabHub.html"
      - "BoneSparrowWagollSheets.html"
      - "BoneSparrowWagollWall.html"
      - "BoneSparrowClimbCards.html"
      - "GrammarHuboffline.html"
      - "bonesparrowtrainer.html"
      - "BoneSparrowThreeWays.html"
      - "BoneSparrowThreeWaysDeck.html"
      - "BoneSparrowTeel.html"
      - "index.html"
      - "teacher/*.html"
      - "BoneSparrow-A3-booklet*.docx"
      - "BoneSparrow-stations.docx"
      - "BoneSparrow-TEEL-*.docx"
      - "BoneSparrow-essay-planner.docx"
      - "BoneSparrow-assessment-*.docx"
      - "BoneSparrow-folio-*.docx"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tidy purpose TEEL deck
        run: |
          python tools/tidy_teel_purpose_once.py
          if ! git diff --quiet -- teacher/teel-purpose.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add teacher/teel-purpose.html
            git commit -m "Tidy purpose TEEL ideas and evidence"
            git push
          fi
      - name: Assemble site
        run: |
          mkdir dist
          cp index.html dist/
          cp BoneSparrowReadingHub.html dist/
          cp BoneSparrowVocabHub.html dist/
          cp BoneSparrowWagollSheets.html dist/
          cp BoneSparrowWagollWall.html dist/
          cp BoneSparrowClimbCards.html dist/
          cp GrammarHuboffline.html dist/
          cp bonesparrowtrainer.html dist/
          cp BoneSparrowThreeWays.html dist/
          cp BoneSparrowThreeWaysDeck.html dist/
          cp BoneSparrowTeel.html dist/
          mkdir dist/teacher
          cp teacher/*.html dist/teacher/
          cp BoneSparrow-A3-booklet*.docx BoneSparrow-stations.docx BoneSparrow-TEEL-*.docx BoneSparrow-essay-planner.docx BoneSparrow-assessment-*.docx BoneSparrow-folio-*.docx dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
