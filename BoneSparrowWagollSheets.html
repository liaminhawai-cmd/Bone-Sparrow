/* ===========================================================================
   THE BONE SPARROW — ANALYTICAL WRITING ANCHOR SHEETS
   One A3 sheet per rung, Foundation to Level 10. Everything the sheets print
   is in the DATA block at the bottom of this file; the renderer under it holds
   no wall text of its own.

   Built to sit beside the Analysis workshop in BoneSparrowReadingHub.html, and
   it uses that workshop's colour language exactly: blue = the idea, purple =
   the language feature, orange = the analytical verb, yellow = embedded
   evidence, green = the effect on the reader. A student who has built the wall
   on screen reads these sheets without being taught a second system.

   Two channels for every signal, because these get photocopied: each criterion
   carries a colour AND an underline pattern, plus a glyph in the key and in
   the explanation band.
   =========================================================================== */
:root{
  --paper:#fbf8f2; --bg:#efe9df; --ink:#1e211f; --muted:#645d54; --line:#d6cbba;
  --deep:#1d3c34; --band:#f4efe5; --gold:#8a6a1c;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  /* the workshop's five, as ink on paper (all above 4.5:1 on the cream) */
  --idea:#0b447c; --idea-soft:#dceafa;
  --feat:#4b2f7a; --feat-soft:#e9e0f7;
  --verb:#8a4b12; --verb-soft:#fbe6d3;
  --ev:#7a5a00;   --ev-soft:#fff2b8;
  --eff:#1f5c33;  --eff-soft:#dff0e2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1b1e1c; --bg:#111312; --ink:#e9e4da; --muted:#a49a8b; --line:#3a4038;
    --deep:#bcd8cd; --band:#232725; --gold:#dfb54e;
    --shadow:0 1px 2px rgba(0,0,0,.45);
    --idea:#8ec2f0; --idea-soft:#122a40;
    --feat:#c2a9e6; --feat-soft:#251a38;
    --verb:#f0a86e; --verb-soft:#3a2313;
    --ev:#e5c74a;   --ev-soft:#39300c;
    --eff:#87ceA0;  --eff-soft:#12301d;
  }
}
/* ---------- PAPER ----------
   The only block to touch when changing paper size. Every size in the file is
   calc()'d against --paper-k, so A3 to A4 is these five values and nothing
   else. A3 is the reference at --paper-k:1. */
:root{
  --sheet-w:297mm; --sheet-h:420mm; --sheet-pad:14mm 13mm 11mm;
  --sheet-bleed:24mm;   /* twice the @page margin, plus 2mm so a sheet exactly the height of the
                           page box cannot round up onto a second one */
  --paper-k:1;
}
@page{size:A3 portrait;margin:11mm}

*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);line-height:1.5;
     font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

.sheet{width:var(--sheet-w);min-height:var(--sheet-h);margin:14px auto;background:var(--paper);
       border:1px solid var(--line);box-shadow:var(--shadow);padding:var(--sheet-pad);
       display:flex;flex-direction:column}

.head{border-bottom:3px solid var(--deep);padding-bottom:calc(6mm * var(--paper-k));margin-bottom:calc(5mm * var(--paper-k))}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:calc(9pt * var(--paper-k));font-weight:800;color:var(--muted)}
.lvline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:calc(2mm * var(--paper-k)) 0 calc(3mm * var(--paper-k))}
h1{font-size:calc(42pt * var(--paper-k));line-height:.98;color:var(--deep);letter-spacing:-.02em}
.badge{background:var(--gold);color:#fff;font-size:calc(10pt * var(--paper-k));font-weight:800;letter-spacing:.1em;
       text-transform:uppercase;padding:3px 11px;border-radius:999px}
.eal{border:1px solid var(--line);color:var(--muted);font-size:calc(9.5pt * var(--paper-k));font-weight:700;
     letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.focus{font-size:calc(13pt * var(--paper-k));color:var(--deep);font-weight:700}
.intro{font-size:calc(11pt * var(--paper-k));line-height:1.4}

.bg{background:var(--band);border:1px solid var(--line);border-left:5px solid var(--gold);
    border-radius:7px;padding:calc(3.5mm * var(--paper-k)) calc(5mm * var(--paper-k));
    margin-bottom:calc(4.5mm * var(--paper-k));font-size:calc(12pt * var(--paper-k));line-height:1.4}
.bg span{display:block;font-weight:800;color:var(--gold);letter-spacing:.05em;
    text-transform:uppercase;font-size:calc(9pt * var(--paper-k));margin-bottom:calc(1.5mm * var(--paper-k))}

.key{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:calc(5mm * var(--paper-k))}
.key .k{flex:1 1 0;min-width:calc(96px * var(--paper-k));border:1px solid var(--line);border-left:5px solid;

.sec{margin-bottom:calc(4mm * var(--paper-k))}

.example{font-family:Georgia,"Times New Roman",serif;font-size:calc(17.5pt * var(--paper-k) * var(--k,1));line-height:1.55}
.proves{display:grid;gap:calc(2.6mm * var(--paper-k))}

.pv .g{flex:none;font-size:.85em;line-height:1.6}

.cont{display:grid;gap:3px}
.cr{display:grid;grid-template-columns:calc(62mm * var(--paper-k)) 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.cr .cn{padding:calc(3mm * var(--paper-k));font-weight:800;font-size:calc(10pt * var(--paper-k));letter-spacing:.03em;
        text-transform:uppercase;line-height:1.25;display:flex;align-items:center;gap:6px}
.cr .cn i{font-style:normal;font-weight:600;text-transform:none;letter-spacing:0;opacity:.75;font-size:.86em}
.cr .cd{padding:calc(3mm * var(--paper-k));font-size:calc(12.5pt * var(--paper-k) * var(--k2,1));line-height:1.4}
.cr.gap .cd{color:var(--muted);font-style:italic}
.cat{margin-top:calc(3mm * var(--paper-k));border:1px solid var(--line);border-left:5px solid var(--deep);
     border-radius:7px;padding:calc(3.4mm * var(--paper-k)) calc(5mm * var(--paper-k));background:var(--band);
     font-size:calc(12pt * var(--paper-k));line-height:1.4}
.cat span{display:block;font-weight:800;color:var(--deep);letter-spacing:.05em;text-transform:uppercase;
     font-size:calc(9pt * var(--paper-k));margin-bottom:calc(1.5mm * var(--paper-k))}
.cat.none{color:var(--muted);font-style:italic}
.cat.none span{font-style:normal}

.foot{margin-top:auto;padding-top:calc(4.5mm * var(--paper-k));border-top:1px solid var(--line);
      font-size:calc(8pt * var(--paper-k));color:var(--muted);line-height:1.45}
.foot b{color:var(--ink)}

/* ---------- two channels: colour AND line pattern ---------- */
.m{font-weight:600;text-decoration-line:underline;text-underline-offset:3px;text-decoration-thickness:1.6px}
.m-idea{color:var(--idea);text-decoration-color:var(--idea);text-decoration-style:solid}
.m-feat{color:var(--feat);text-decoration-color:var(--feat);text-decoration-style:dashed}
.m-verb{color:var(--verb);text-decoration-color:var(--verb);text-decoration-style:dotted}
.m-ev{color:var(--ev);text-decoration-color:var(--ev);text-decoration-style:double}
.m-eff{color:var(--eff);text-decoration-color:var(--eff);text-decoration-style:wavy;text-decoration-thickness:1.2px}

.k-idea{border-left-color:var(--idea)} .k-idea .kh{color:var(--idea)}
.k-feat{border-left-color:var(--feat)} .k-feat .kh{color:var(--feat)}
.k-verb{border-left-color:var(--verb)} .k-verb .kh{color:var(--verb)}
.k-ev{border-left-color:var(--ev)}     .k-ev .kh{color:var(--ev)}
.k-eff{border-left-color:var(--eff)}   .k-eff .kh{color:var(--eff)}
.pv-idea .g,.pv-idea b{color:var(--idea)} .pv-feat .g,.pv-feat b{color:var(--feat)}
.pv-verb .g,.pv-verb b{color:var(--verb)} .pv-ev .g,.pv-ev b{color:var(--ev)}
.pv-eff .g,.pv-eff b{color:var(--eff)}
.cr-idea .cn{background:var(--idea-soft);color:var(--idea)}
.cr-feat .cn{background:var(--feat-soft);color:var(--feat)}
.cr-verb .cn{background:var(--verb-soft);color:var(--verb)}
.cr-ev .cn{background:var(--ev-soft);color:var(--ev)}
.cr-eff .cn{background:var(--eff-soft);color:var(--eff)}

/* The phone rule MUST stay behind `screen and`. A4 portrait is 794px, under
   this breakpoint, so without it the print output silently collapses to one
   column. A3 is 1123px, which is the only reason it would not bite here. */
@media screen and (max-width:860px){
  .sheet{width:auto;min-height:0;padding:16px}
  h1{font-size:30pt}
  .example{font-size:13pt}
  .cr{grid-template-columns:1fr}
}
@media print{
  :root{--paper:#fff;--bg:#fff;--ink:#000;--muted:#4a463d;--line:#c3b8a4;--band:#f5f0e6}
  body{background:#fff}
  .sheet{width:auto;margin:0;padding:0;border:0;box-shadow:none;
         break-after:page;min-height:calc(var(--sheet-h) - var(--sheet-bleed))}
  .sheet:last-of-type{break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* Each sheet is its own page, so a whole section never needs to be kept
     together: `break-inside:avoid` on .sec pushed the continuum block onto a
     second page and turned eight sheets into thirteen. Rows and lines still
     hold together, which is all that was ever wanted. */
  .cr,.pv{break-inside:avoid}
}
</style>
</head>
<body>
<main id="out"></main>

<script>
/* ============================================================================
   DATA — the only place the sheets' text lives.

   THE ANCHOR PASSAGE is the opening of chapter 1, the Night Sea. It is chosen
   deliberately: the Analysis workshop on screen models its wall on chapter 5
   (Beaver), so these sheets rehearse the same five moves on a different
   passage. A student who has done both has climbed the ladder twice, on two
   pieces of writing, rather than memorising one paragraph.

   Extract reproduced from `Lesson Resources/Bone Sparrow extracts for
   grammar.docx`, pp. 1-2, for enrolled students under the school's Statutory
   Text and Artistic Works Licence. Keep extracts short.

   Mark evidence in an example with {key|the phrase}, where key is one of the
   CRITERIA keys. Anything unmarked stays black.
   ============================================================================ */

const WALL = {
  title: "The Bone Sparrow · analytical writing",
  expected: "Level 7",
  question: "How does Fraillon use the Night Sea to show what detention does to Subhi?",
  passage: "Sometimes, at night, the dirt outside turns into a beautiful ocean. As red as the sun and as deep as the sky. I lie on my bed, Queeny's feet pushing against my cheek, and listen to the waves lapping at the tent. Queeny says I'm stupid, saying that kind of stuff. But it's true. She just doesn't see it, is all. Our maá says there are some people in this world who can see all the hidden bits and pieces of the universe blown in on the north wind and scattered about in the shadows. Queeny, she never tries to look in the shadows. She doesn't even squint. Maá sees though. She can hear the ocean outside too.",
  foot: "<b>Text:</b> Zana Fraillon, <i>The Bone Sparrow</i>, Hachette Australia, 2016, extract from pp. 1-2, reproduced for enrolled students under the school's Statutory Text and Artistic Works Licence (Copyright Agency). <b>Continuum:</b> quoted verbatim from the school's Learning Continuum master sheet, English tab, strands named in each row. <b>CAT rubric:</b> the Victorian Curriculum levels the CAT marks against, as used in the Analysis workshop. <b>EAL bands:</b> the EAL analytical writing WAGOLL (C2 Describe, C3 Explain, C4 Analyse, VCE 1 Interpret)."
};

/* The five, in the order they appear in a sentence and in the workshop's key. */
const CRITERIA = [
  { key:"idea", name:"The idea",        glyph:"■", blurb:"what the writing is about, beyond the plot" },
  { key:"feat", name:"Language feature",glyph:"▲", blurb:"the thing the writer actually did" },
  { key:"verb", name:"Analytical verb", glyph:"◆", blurb:"the verb that carries the thinking" },
  { key:"ev",   name:"Embedded evidence",glyph:"●",blurb:"the words of the text, inside your sentence" },
  { key:"eff",  name:"Effect on the reader",glyph:"✦",blurb:"what it does to the person reading" }
];

/* Rungs below the continuum's Level 5, in the Victorian Curriculum's own
   two-year bands. Criteria arrive one at a time on the way up: a sheet that
   names three of the five is the ladder working, not a hole to fill. */
const EARLY_LEVELS = ["Foundation to Level 2", "Levels 3 and 4"];
const LEVELS = ["Level 5","Level 6","Level 7","Level 8","Level 9","Level 10"];

const FOCUS = {
 "Foundation to Level 2":"Say what happens, and point at the words",
 "Levels 3 and 4":"Say what happens, and how it makes you feel",
 "Level 5":"Identify · say what happens",
 "Level 6":"Describe with detail · evidence inside the sentence",
 "Level 7":"Explain the effect · the idea becomes an issue",
 "Level 8":"Analyse the choice · two perspectives at once",
 "Level 9":"Question the representation · what the writing withholds",
 "Level 10":"Interpret · the text against the world that produced it"
};

/* EAL bands from the EAL analytical writing WAGOLL. The lower rungs sit below
   the C-band descriptions, so they are left blank rather than given a band
   the sheet invented. */
const EAL = { "Level 5":"C2 — Describe", "Level 6":"C2/C3 — Describe in detail", "Level 7":"C3 — Explain",
              "Level 8":"C4 — Analyse", "Level 9":"C4+ — Interpret", "Level 10":"VCE 1 — Interpret" };

const BACKGROUND = {
 "Foundation to Level 2":"how to write a sentence about something that happened in a story, and how to copy words from the book to show where they found it.",
 "Levels 3 and 4":"how to write more than one sentence about a story, how to use quotation marks, and how to say what a part of a book made them feel.",
 "Level 5":"the words simile and metaphor, and how to put a quotation in a sentence beside their own writing.",
 "Level 6":"how to join a quotation into their own sentence with a lead-in, and how to write about what the writing does rather than only what happens.",
 "Level 7":"analytical verbs (reveals, conveys, emphasises) and the difference between a feeling and an issue.",
 "Level 8":"how to open a sentence on the writer's choice, and how to hold two views of one thing in a single sentence.",
 "Level 9":"how a point of view shapes what a reader is allowed to know, and how to write about what a text leaves out.",
 "Level 10":"how texts carry the values of the world that produced them, and how to weigh one account of an event against another."
};

const EXAMPLES = {
 "Foundation to Level 2":
`Subhi lives in a camp. At night he thinks {idea|the dirt is the sea}. He says it is {ev|"a beautiful ocean"}. The sea is not really there.`,

 "Levels 3 and 4":
`In this part, Subhi {idea|imagines that the dirt outside the tent turns into an ocean}. He says {ev|"the dirt outside turns into a beautiful ocean"}. This makes me {eff|feel that Subhi is happier at night than in the day}, even though nothing has changed in the camp.`,

 "Level 5":
`This part {verb|shows} {idea|that Subhi uses his imagination in the camp}. Fraillon uses a {feat|metaphor}. Subhi says {ev|"the dirt outside turns into a beautiful ocean"}. It makes the reader {eff|feel sorry for him}.`,

 "Level 6":
`Fraillon {verb|describes} {idea|the way Subhi turns the camp into somewhere he can stand} by using a {feat|metaphor and then a simile}, when he says the dirt {ev|"turns into a beautiful ocean"} that is {ev|"as red as the sun and as deep as the sky"}, which {eff|makes the reader picture the camp at night the way Subhi sees it}.`,

 "Level 7":
`{idea|The issue of what detention does to a child's mind} is {verb|revealed} through {feat|Subhi's night imagery}: the dirt {ev|"turns into a beautiful ocean"} while Queeny {ev|"doesn't even squint"}, which {eff|makes the reader understand that Subhi's way of seeing is how he survives the camp, not a mistake about where he is}.`,

 "Level 8":
`By {feat|writing the Night Sea as plain fact rather than as a daydream}, Fraillon {verb|sets two perspectives on the camp against each other}: {idea|Subhi's seeing and Queeny's refusal to see}. He can {ev|"listen to the waves lapping at the tent"} while she {ev|"says I'm stupid, saying that kind of stuff"}, which {verb|positions} the reader {eff|to take a child's imagined ocean seriously as a description of a place the adults have run out of words for}.`,

 "Level 9":
`Because the novel {feat|never once steps outside Subhi's point of view}, {idea|the Night Sea reaches us as landscape rather than as invention}: the sea is simply there, Maá {ev|"can hear the ocean outside too"}, and no narrator {verb|corrects} either of them, so {eff|the representation leaves the reader to decide whether a child's imagination is an escape from detention or the most accurate account of it available}.`,

 "Level 10":
`{idea|The Night Sea is where the novel argues about whose account of detention gets believed}: Fraillon {verb|grants} {feat|first person, present tense and an unbroken point of view} to a boy the system records as {ev|"DAR-1"}, and lets his ocean hold {ev|"all the hidden bits and pieces of the universe"} that no camp record contains, so that {eff|the reader leaves the passage weighing an official account of a child's life against the child's own, and finding the official one thinner}.`
};

const EXPLANATIONS = {
 "Foundation to Level 2": {
  idea:"Names one thing that happens, in the student's own words. That is the whole job at this rung.",
  ev:"Two or three of the book's own words, inside quotation marks, so a reader can find the place." },
 "Levels 3 and 4": {
  idea:"The idea is now a whole sentence, and it says what Subhi does rather than what the camp looks like.",
  ev:"A full line quoted accurately, still sitting in its own sentence beside the student's writing.",
  eff:"The reader's response is named. It is personal (\"makes me feel\"), which is right at this rung." },
 "Level 5": {
  idea:"A plain idea about the character, one step past retelling the plot.",
  feat:"The feature is named with the correct term. Naming it is the whole of the job at Level 5.",
  verb:"\"Shows\" is a reporting verb. It is honest work here, and it is the first thing to be traded up.",
  ev:"The quotation is accurate but stands in its own sentence, next to the point rather than inside it.",
  eff:"A general feeling. True, and unspecific, which is exactly what Level 5 sounds like." },
 "Level 6": {
  idea:"The idea has grown a purpose: not that Subhi imagines, but what the imagining does for him.",
  feat:"Two features named, and named in the order they appear in the text.",
  verb:"\"Describes\" still reports, but it now governs a whole clause instead of a single noun.",
  ev:"Both quotations are woven in with lead-ins, so the sentence would still read if the marks were removed.",
  eff:"The effect is specific: not sympathy in general, but seeing the camp the way Subhi sees it." },
 "Level 7": {
  idea:"A feeling has become an issue: what detention does to a child's mind, which is arguable.",
  feat:"The feature is now a pattern across the passage, \"night imagery\", rather than one device.",
  verb:"\"Revealed\" is analytical: it claims the writing uncovers something rather than states it.",
  ev:"Two quotations, one for each side of the contrast, each short enough to sit inside the clause.",
  eff:"The purpose says what the reader now understands, not what the reader feels." },
 "Level 8": {
  idea:"The idea holds two perspectives at once, which is what the Level 8 rubric row asks for.",
  feat:"The feature is the choice itself: writing an imagined thing as fact.",
  verb:"Two analytical verbs, \"sets against\" and \"positions\", and the second names what is done to the reader.",
  ev:"Evidence for both perspectives, quoted from opposite sides of the same paragraph.",
  eff:"The effect is what the reader is positioned to accept, which is a claim about the writing's power." },
 "Level 9": {
  idea:"The idea is now the representation itself: how the Night Sea reaches us, not what it is.",
  feat:"The feature is a structural absence, an unbroken point of view, which is harder to see than a metaphor.",
  verb:"\"Corrects\" is used in the negative. The analysis is about what the novel declines to do.",
  ev:"One quotation, chosen because it shows a second character inside Subhi's version of the world.",
  eff:"The purpose questions what the writing withholds, and leaves the judgement open rather than closing it." },
 "Level 10": {
  idea:"The idea reads the passage as an argument the whole novel is making, about whose account is believed.",
  feat:"Three choices named together as one system: person, tense, and point of view.",
  verb:"\"Grants\" carries an argument inside the verb: the narration is treated as something given, and therefore as something that could be withheld.",
  ev:"An ID and an image quoted against each other, so the evidence itself performs the contrast. The ID is drawn from later in the novel: at this rung a response is allowed to range across the whole text, and it still has to be quoted exactly.",
  eff:"The effect is placed outside the book: the reader is left weighing two accounts of one life." }
};

/* Quoted verbatim from the school's Learning Continuum master sheet, English
   tab. Strand names are the sheet's own. Do not paraphrase or tighten these:
   a student is marked against the sheet's sentence, not ours.

   `Use of evidence` is blank at Level 5 on that sheet, and it stays blank
   here. The curriculum has no descriptor there; writing one to fill the grid
   would be inventing curriculum. */
const STRAND = { idea:"Reading and Viewing · Interpreting texts",
                 feat:"Reading and Viewing · Understanding language devices",
                 verb:"Writing · Voice and register",
                 ev:"Writing · Use of evidence",
                 eff:"Reading and Viewing · Evaluating texts" };
const GAP_TEXT = "Not on the school's continuum until Level 6.";

const CONTINUUM = {
 idea:{
  "Level 5":"I can describe the purpose of different text types",
  "Level 6":"I can describe the way authors try to influence their audience",
  "Level 7":"I can explain how the structure and language used in a text helps influence the audience",
  "Level 8":"I can find the author’s point of view in a text and evaluate how credible the text is",
  "Level 9":"I can compare the way people and issues are represented in different texts",
  "Level 10":"I can compare perspectives, representations and evidence used within texts" },
 feat:{
  "Level 5":"I can describe the meaning of different similes and metaphors",
  "Level 6":"I can explain how rhymes can add to descriptions in writing",
  "Level 7":"I can explain the meaning of non-literal language in narrative and poetic texts",
  "Level 8":"I can explain the effect of descriptions, different sentence types and figurative language",
  "Level 9":"I can analyse the way writing techniques work together to convey ideas and feelings",
  "Level 10":"I can explain how different texts use language devices to explore similar ideas." },
 verb:{
  "Level 5":"I can write using the correct relevant tense",
  "Level 6":"I can use different types of verbs in my writing (existing, doing, thinking, feeling)",
  "Level 7":"I can change my choice of words to be appropriate for spoken and written texts",
  "Level 8":"I can change my word choice to alter the tone of written and spoken texts",
  "Level 9":"I can write using a formal register",
  "Level 10":"I can use detailed nominal groups and analytic verbs in non-fiction writing" },
 ev:{
  "Level 6":"I can include quotes in an explanation with teacher guidance",
  "Level 7":"I can explain the relevance of a quote",
  "Level 8":"I can embed quotes into sentences",
  "Level 9":"I can correctly embed quotes within an explanation sentence",
  "Level 10":"I can correctly embed multiple quotes into an explanation" },
 eff:{
  "Level 5":"I can use metalanguage to discuss the effect of texts on the reader",
  "Level 6":"I can describe how repetition, emphasis and metaphor can influence the way a reader feels",
  "Level 7":"I can use examples from the text to discuss how language helps to create character",
  "Level 8":"I can explain how different types of evidence can add authority to a text",
  "Level 9":"I can explain how a text explores issues that relate to our own lives",
  "Level 10":"I can analyse how specific texts express certain values and beliefs" }
};

/* The CAT rubric's own wording, the same five rows the Analysis workshop uses.
   It runs 5 to 9 and no further in either direction, which the sheets say
   rather than filling in. */
const CAT = {
 "Level 5":"I can identify parts of the story that relate to key ideas",
 "Level 6":"I can describe characters and events that relate to key ideas",
 "Level 7":"I can describe the ideas and issues that are illustrated through characters and events",
 "Level 8":"I can explain the way different perspectives on ideas are represented through characters and events",
 "Level 9":"I can analyse the way different people and perspectives are represented in the story"
};
const CAT_BELOW = "The CAT rubric starts at Level 5. This rung is a way in to it, not a row on it.";
const CAT_ABOVE = "Above the CAT rubric's top row. Level 9 is the highest level the CAT marks.";

/* ============================================================================
   RENDERER — knows nothing about the novel.
   ============================================================================ */
const esc  = s => String(s).replace(/&(?!amp;|lt;|gt;|#\d+;|[a-z]+;)/g,"&amp;");
const mark = s => esc(s).replace(/\{(\w+)\|([^}]*)\}/g,(_,k,t)=>`<span class="m m-${k}">${t}</span>`);

const LADDER = EARLY_LEVELS.concat(LEVELS);
const onContinuum = lv => CRITERIA.some(c => CONTINUUM[c.key] && CONTINUUM[c.key][lv]);
const used = lv => CRITERIA.filter(c => EXPLANATIONS[lv][c.key]);

/* Each rung carries a different amount of prose, so the type scale is set from
   the character count of the two runs it stretches: the worked example and the
   background panel. A rung with no continuum section has a whole block of page
   to spend, so it gets a larger target.

   The FLOOR is what protects the sheets that carry the most: these are wall
   charts, and an example under about 15pt on A3 stops being readable from a
   desk. The CEILING is what protects the Foundation sheet, whose example is a
   third the length of Level 10's.

   A measured autofit pass was tried here and removed. Type size changes where
   a line wraps, so each step moved the sheet by a whole line and the loop
   overshot: the Level 7 example came out at 12pt on A3 with a hand's width of
   white above the footer. The formula plus a floor high enough to keep the
   example readable is the better trade, and the page count is the test. */
const plain = lv => EXAMPLES[lv].replace(/\{(\w+)\|([^}]*)\}/g,"$2") + " " + BACKGROUND[lv];
const clamp = (lo,v,hi) => Math.min(hi, Math.max(lo, v));
function scale(lv){
  const target = onContinuum(lv) ? 430 : 900;
  const k  = clamp(0.90, Math.sqrt(target / plain(lv).length), 2.8);
  return kStyle(k);
}
const kStyle = k => `--k:${k.toFixed(3)};--k2:${clamp(0.94, Math.pow(k,0.45), 1.35).toFixed(3)}`;

/* The rungs below the continuum have a whole block of page that the continuum
   section spends on the others, and there is only so much a Foundation example
   can be scaled up before it stops looking like writing. Rather than pad, they
   print what the NEXT rung adds, generated from that rung's own explanations
   so it cannot drift from the sheet it describes. */
function nextUp(lv){
  const i = LADDER.indexOf(lv);
  if(onContinuum(lv) || i < 0 || i+1 >= LADDER.length) return null;
  const next = LADDER[i+1], have = used(lv).map(c=>c.key);
  const added = used(next).filter(c => !have.includes(c.key));
  return added.length ? {lv:next, added} : null;
}

document.getElementById("out").innerHTML = LADDER.map(lv=>{
  const on = used(lv).map(c=>c.key);
  const catLine = CAT[lv] ? `<div class="cat"><span>Marked against, on the CAT rubric</span>“${esc(CAT[lv])}”</div>`
    : `<div class="cat none"><span>Marked against, on the CAT rubric</span>${esc(onContinuum(lv) ? CAT_ABOVE : CAT_BELOW)}</div>`;
  return `<section class="sheet" style="${scale(lv)}">
    <header class="head">
      <div class="kicker">${esc(WALL.title)}</div>
      <div class="lvline"><h1>${esc(lv)}</h1>
        ${lv===WALL.expected?'<span class="badge">Expected at Year 7</span>':''}
        ${EAL[lv]?`<span class="eal">EAL ${esc(EAL[lv])}</span>`:''}</div>
      <p class="focus">${esc(FOCUS[lv])}</p>
      <p class="intro"><b>The question:</b> ${esc(WALL.question)}<br>
        <b>The passage:</b> ${esc(WALL.passage)}</p>
    </header>

    <div class="bg"><span>${/^(Foundation|Levels)/.test(lv)?`Students at ${esc(lv)} already know`:`A ${esc(lv)} student already knows`}</span>${esc(BACKGROUND[lv])}</div>

    <div class="key">${CRITERIA.map(c=>
      `<div class="k k-${c.key}${on.includes(c.key)?"":" off"}"><div class="kh"><span>${c.glyph}</span><span>${esc(c.name)}</span></div><div class="kd">${esc(c.blurb)}</div></div>`).join("")}</div>

    <section class="sec">
      <h2>Worked example</h2>
      <p class="example">${mark(EXAMPLES[lv])}</p>
    </section>

    <section class="sec">
      <h2>What each marked phrase does</h2>
      <div class="proves">${used(lv).map(c=>
        `<div class="pv pv-${c.key}"><span class="g">${c.glyph}</span><span><b>${esc(c.name)}:</b> ${esc(EXPLANATIONS[lv][c.key])}</span></div>`).join("")}</div>
    </section>

    ${nextUp(lv) ? `<section class="sec">
      <h2>What arrives at the next rung</h2>
      <p class="intro" style="margin-bottom:calc(3mm * var(--paper-k))"><b>${esc(nextUp(lv).lv)}:</b> ${esc(FOCUS[nextUp(lv).lv])}</p>
      <div class="proves">${nextUp(lv).added.map(c=>
        `<div class="pv pv-${c.key}"><span class="g">${c.glyph}</span><span><b>${esc(c.name)}</b> joins the sentence: ${esc(c.blurb)}.</span></div>`).join("")}</div>
    </section>` : ""}

    ${onContinuum(lv) ? `<section class="sec">
      <h2>Learning continuum at ${esc(lv)}</h2>
      <div class="cont">${CRITERIA.map(c=>{
        const d = CONTINUUM[c.key][lv];
        return `<div class="cr cr-${c.key}${d?"":" gap"}">
          <div class="cn"><span>${c.glyph}</span><span>${esc(c.name)}<br><i>${esc(STRAND[c.key])}</i></span></div>
          <div class="cd">${d?`“${esc(d)}”`:esc(GAP_TEXT)}</div></div>`;}).join("")}</div>
      ${catLine}
    </section>` : `<section class="sec"><h2>Where this sits</h2>${catLine}</section>`}

    <p class="foot">${WALL.foot}</p>
  </section>`;
}).join("");

</script>
</body>
</html>
