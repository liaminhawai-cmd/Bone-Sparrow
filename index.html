<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 7 English</title>
<style>
/* The landing page for the whole Year 7 English site. Every strand has its
   own front door, and every front door links back here. To add a module, add
   one line to the right list in STRANDS below. */
:root{
  --bg:#f1efe8; --paper:#fbfaf6; --ink:#1f1f1f; --muted:#655f55;
  --line:#d4cfc2; --edward:#5b3f78; --bone:#a83232; --folio:#2c5f7c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);
     display:flex;justify-content:center;padding:8px 12px}
.container{width:100%;max-width:1180px;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;padding:14px 24px 6px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:26px;margin:0 0 6px}
.strands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.strand h2{font-family:Georgia,'Times New Roman',serif;font-size:19px;margin:0 0 7px;padding:0 0 7px;
           border-bottom:3px solid var(--c)}
.strand h2 a{color:var(--c);text-decoration:none}
.strand h2 a:hover{text-decoration:underline}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);
       border-left:4px solid var(--c);border-radius:9px;padding:9px 12px;margin:0 0 5px;transition:border-color .15s}
a.card:hover{border-color:var(--c)}
a.card .t{font-weight:700;font-size:15px;line-height:1.35}
a.card .t .arrow{color:var(--c)}
a.card .d{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
a.card.ext{background:var(--bg)}
.teacher{margin:3px 0 0;padding:4px 0 0;border-top:1px solid var(--line);font-size:13px;display:flex;gap:18px;flex-wrap:wrap}
.teacher a{color:var(--muted);font-weight:600;text-decoration:none;padding:8px 0}
.teacher a:hover{text-decoration:underline;color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media screen and (max-width:860px){ .strands{grid-template-columns:1fr} .container{padding:16px} }
</style>
</head>
<body>
<div class="container">
  <h1>Year 7 English</h1>
  <div class="strands" id="strands"></div>
  <div class="teacher">
    <a href="teacher/">Teacher hub</a>
    <a href="SentenceFluencyDeck.html">Sentence fluency deck</a>
  </div>
</div>

<script>
/* ============================================================================
   STRANDS. "door" is the strand's own front door (sign-in, tasks, report).
   Each item is [file, title, one line, "ext" for an extension].
   ========================================================================== */
const STRANDS = [
  { name:"Edward Scissorhands", c:"--edward", door:null, items:[
    ["EdwardParagraphs.html","Analysing paragraphs",""],
    ["EdwardSoundLighting.html","Sound and lighting","Name the shot, then fix the mistakes in three scenes."],
    ["EdwardSentenceBuilder.html","Sentence builder","Edward arrives at Peg’s house."] ]},
  { name:"The Bone Sparrow", c:"--bone", door:"BoneSparrow.html", items:[
    ["BoneSparrow.html","Start here","Sign in, your chapter, your tasks and your report."],
    ["BoneSparrowVocabHub.html","Vocab Hub","Words, chapter by chapter."],
    ["BoneSparrowReadingHub.html","Reading and Evidence Hub","Quickreads, evidence, the analysis workshop."],
    ["bonesparrowtrainer.html","Pre-reading trainer","The 17 unit words and sentence types."],
    ["BoneSparrowThreeWays.html","Three ways into a sentence","From the evidence, the idea or the effect."],
    ["GrammarHuboffline.html","Grammar Hub","Sentence structure."] ]},
  { name:"Writing Folio", c:"--folio", door:"WritingFolio.html", items:[
    ["WritingFolio.html","Start here","Sign in and the folio menu."],
    ["PronounsModals.html","Pronoun choice and modal verbs","Three words, then back to your draft."],
    ["ContentionClaims.html","Contention and claims","The deck, then your draft, then the PDF."],
    ["WritingFolioVocabHub.html#set-04","Persuasive writing words","Build each word from its parts, then use it."],
    ["SentenceFluency.html","Sentence fluency","Find the clauses, then join and split."],
    ["MicroFiction.html","Micro-fiction","Cut and swap a story until it hints."],
    ["ConcessionSentences.html","Complex sentences for concession","Extension.","ext"],
    ["WritingFolioVocabHub.html","Writing Folio vocab, all sets","","ext"] ]}
];
function esc(t){ const d=document.createElement("div"); d.textContent=t==null?"":t; return d.innerHTML; }
document.getElementById("strands").innerHTML = STRANDS.map(s=>{
  const head = s.door ? `<a href="${s.door}">${esc(s.name)}</a>` : esc(s.name);
  return `<section class="strand" style="--c:var(${s.c})"><h2>${head}</h2>`+
    s.items.map(it=>`<a class="card ${it[3]||""}" href="${it[0]}"><div class="t">${esc(it[1])}<span class="arrow"> →</span></div>${it[2]?`<div class="d">${esc(it[2])}</div>`:""}</a>`).join("")+
    `</section>`;
}).join("");
</script>
</body>
</html>
